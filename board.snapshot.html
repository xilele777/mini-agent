ted/feature/2026-09-11-explicit-turn-exits.md","sourcePath":"implemented/feature/2026-09-11-explicit-turn-exits.md","slug":"2026-09-11-explicit-turn-exits","lifecycle":"implemented","cls":"feature","date":"2026-09-11","title":"把任务完成、暂停和执行中提问表达为显式出口","status":"implemented","rawBody":"# Agent Note: 把任务完成、暂停和执行中提问表达为显式出口\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n无工具调用的文本可能是阶段说明、最终答复或等待用户。无条件继续会在拒绝后反复催促，直接停止又可能让多步任务停在列计划；todo 是否为空也不能说明当前请求是否完成。\n\n## Decision\n\nfinish_task 表示当前请求完成，pause_task 表示未完成但需要暂停；二者通过通用 endsTurn 结束本轮。ask_user 在当前轮等待用户回答，并把回答作为工具结果返回。\n\n纯文本回复之后的 CONTINUE_NUDGE 提供执行、完成、询问和暂停四种去向。当前请求决定任务范围，历史待办仅保存计划；“只记录一条待办”在记录后即可完成，暂停或被拒绝的旧任务需要明确恢复。\n\n控制工具沿用[注册表](../architecture/2026-08-31-tool-registry-boundary.md)与[共享输入](../architecture/2026-09-02-shared-terminal-input.md)。退出前仍按[历史恢复规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)补齐同批未执行调用。\n\n## Alternatives considered\n\n- 纯文本后直接返回：节省继续请求，但无法区分阶段说明与实际完成。\n- 清空 todo 才结束：规则直观，但会把“只记录”当作未完成，并可能触发旧任务。\n- 一律用 finish_task 停止：工具更少，但必要操作被拒绝时，会把暂停错误表述为完成。\n\n## Consequences\n\n出口语义清楚，代价是可能增加模型请求，模型仍可能选错；十次请求上限由[循环预算](2026-09-05-loop-guard-and-request-budget.md)兜底。\n\n[todo](../architecture/2026-09-06-todo-json-persistence.md) 没有任务归属或持久化暂停字段，pause_task 原因只保留在对话中。因此当前语义约束不等于程序层面的任务隔离。\n\n## Verification\n\n日期依据：[cd3fa0c](https://github.com/xilele777/mini-agent/commit/cd3fa0c) 于 2026-09-11 落地。当前依据：[control.ts](../../../../src/tools/control.ts)、[turn.ts](../../../../src/turn.ts) 和 [turn.test.ts](../../../../src/turn.test.ts)。[学习进度](../../../learning/progress.md) 保留只记录待办、询问中拒绝、批准框拒绝及 nudge 后完成的具体记录；主轮测试另覆盖结束工具后同批调用的配对，其范围仍不能推广到所有模型行为。\n","sections":[{"heading":"Problem","body":"无工具调用的文本可能是阶段说明、最终答复或等待用户。无条件继续会在拒绝后反复催促，直接停止又可能让多步任务停在列计划；todo 是否为空也不能说明当前请求是否完成。","anchor":"section-0"},{"heading":"Decision","body":"finish_task 表示当前请求完成，pause_task 表示未完成但需要暂停；二者通过通用 endsTurn 结束本轮。ask_user 在当前轮等待用户回答，并把回答作为工具结果返回。\n\n纯文本回复之后的 CONTINUE_NUDGE 提供执行、完成、询问和暂停四种去向。当前请求决定任务范围，历史待办仅保存计划；“只记录一条待办”在记录后即可完成，暂停或被拒绝的旧任务需要明确恢复。\n\n控制工具沿用[注册表](../architecture/2026-08-31-tool-registry-boundary.md)与[共享输入](../architecture/2026-09-02-shared-terminal-input.md)。退出前仍按[历史恢复规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)补齐同批未执行调用。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 纯文本后直接返回：节省继续请求，但无法区分阶段说明与实际完成。\n- 清空 todo 才结束：规则直观，但会把“只记录”当作未完成，并可能触发旧任务。\n- 一律用 finish_task 停止：工具更少，但必要操作被拒绝时，会把暂停错误表述为完成。","anchor":"section-2"},{"heading":"Consequences","body":"出口语义清楚，代价是可能增加模型请求，模型仍可能选错；十次请求上限由[循环预算](2026-09-05-loop-guard-and-request-budget.md)兜底。\n\n[todo](../architecture/2026-09-06-todo-json-persistence.md) 没有任务归属或持久化暂停字段，pause_task 原因只保留在对话中。因此当前语义约束不等于程序层面的任务隔离。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[cd3fa0c](https://github.com/xilele777/mini-agent/commit/cd3fa0c) 于 2026-09-11 落地。当前依据：[control.ts](../../../../src/tools/control.ts)、[turn.ts](../../../../src/turn.ts) 和 [turn.test.ts](../../../../src/turn.test.ts)。[学习进度](../../../learning/progress.md) 保留只记录待办、询问中拒绝、批准框拒绝及 nudge 后完成的具体记录；主轮测试另覆盖结束工具后同批调用的配对，其范围仍不能推广到所有模型行为。","anchor":"section-4"}],"problem":"无工具调用的文本可能是阶段说明、最终答复或等待用户。无条件继续会在拒绝后反复催促，直接停止又可能让多步任务停在列计划；todo 是否为空也不能说明当前请求是否完成。","decision":"finish_task 表示当前请求完成，pause_task 表示未完成但需要暂停；二者通过通用 endsTurn 结束本轮。ask_user 在当前轮等待用户回答，并把回答作为工具结果返回。\n\n纯文本回复之后的 CONTINUE_NUDGE 提供执行、完成、询问和暂停四种去向。当前请求决定任务范围，历史待办仅保存计划；“只记录一条待办”在记录后即可完成，暂停或被拒绝的旧任务需要明确恢复。\n\n控制工具沿用[注册表](../architecture/2026-08-31-tool-registry-boundary.md)与[共享输入](../architecture/2026-09-02-shared-terminal-input.md)。退出前仍按[历史恢复规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)补齐同批未执行调用。","alternatives":"- 纯文本后直接返回：节省继续请求，但无法区分阶段说明与实际完成。\n- 清空 todo 才结束：规则直观，但会把“只记录”当作未完成，并可能触发旧任务。\n- 一律用 finish_task 停止：工具更少，但必要操作被拒绝时，会把暂停错误表述为完成。","consequences":"出口语义清楚，代价是可能增加模型请求，模型仍可能选错；十次请求上限由[循环预算](2026-09-05-loop-guard-and-request-budget.md)兜底。\n\n[todo](../architecture/2026-09-06-todo-json-persistence.md) 没有任务归属或持久化暂停字段，pause_task 原因只保留在对话中。因此当前语义约束不等于程序层面的任务隔离。","outLinks":["implemented/architecture/2026-08-31-tool-registry-boundary.md","implemented/architecture/2026-09-02-shared-terminal-input.md","implemented/architecture/2026-09-06-todo-json-persistence.md","implemented/bug-fix/2026-09-06-tool-result-history-recovery.md","implemented/feature/2026-09-05-loop-guard-and-request-budget.md"]},{"id":"implemented/process/2026-09-11-complete-board-sections.md","sourcePath":"implemented/process/2026-09-11-complete-board-sections.md","slug":"2026-09-11-complete-board-sections","lifecycle":"implemented","cls":"process","date":"2026-09-11","title":"看板完整读取笔记章节，并展示验证依据","status":"implemented","rawBody":"# Agent Note: 看板完整读取笔记章节，并展示验证依据\n\nStatus: implemented\n\n整理日期：2026-09-11。更新日期：2026-09-12。文件名日期的依据见 Verification。\n\n## Problem\n\n看板的章节提取表达式启用多行模式，又以行尾作为章节结束条件，导致一节只保留第一行。多段决定和第二条以后的备选会在界面消失，即使 Markdown 文件本身完整。\n\n## Decision\n\n笔记仍采用标准的 Problem、Decision、Alternatives considered 和 Consequences 结构，并允许多段内容。项目解析器按二级标题识别完整章节，保留到下一个标题或文本结束；代码块内的标题不切断正文。\n\n本地目录读取和离线打包共用同一解析器，原始 rawBody 保留。阅读页展示 Verification 及其他自由章节，摘要视图继续使用主要问题、决定和备选字段。原版 Skill 不改写；独立页面的布局与同步由[阅读工作台](2026-09-12-readable-board-and-stable-sync.md)约定说明。\n\n笔记之间使用有理由的相对链接，使看板可以计算引用并展示关联；历史补录依据可核实记录归位日期，不为填满状态栏虚构被否决的提案。这沿用[工具与项目配置分开维护](2026-09-11-learning-workflow-and-notes.md)的约定。\n\n## Alternatives considered\n\n- 只增加笔记数量：能补齐主题，但解析器仍会丢掉每节后续内容。\n- 把每节全部压成一行：可以迎合当前解析，但破坏 Markdown 的可读性，备选项也难以独立展示。\n- 直接修改上游模板和构建脚本：立即有效，但会给升级引入本地分叉；独立项目解析器可以显式记录并校验兼容范围。\n\n## Consequences\n\n本地连接和离线看板都能读取完整章节，代价是项目需要维护解析器与笔记格式的兼容性。读取到缺少标题或状态的文件时应报错，不将未完成保存的内容当成有效记录。\n\n看板统计引用关系，不证明某个决定更正确；已有方案的备选会进入方案取舍视图，无需伪造 rejected 笔记。原来的生成后正则补丁由共用解析器接替，避免同时维护两套修正。\n\n## Verification\n\n日期依据：2026-09-11 对五篇原笔记复现，源文件每篇有二至三条备选，原看板均只提取一条。当前实现见 [model.mjs](../../../../scripts/notes-board/model.mjs)。\n\n2026-09-11 的初版适配通过两种生成命令与笔记校验，十九篇笔记的七十六个展示字段一致，保留五十七条备选及四十二条关联；离线浏览器详情核对通过。这是当时版本的证据。\n\n2026-09-12 共用解析器的回归覆盖多段正文、全部备选、CRLF、无末尾换行以及代码块中的二级标题。运行入口为 `npm run test:board`，页面验收范围见工作台笔记。\n","sections":[{"heading":"Problem","body":"看板的章节提取表达式启用多行模式，又以行尾作为章节结束条件，导致一节只保留第一行。多段决定和第二条以后的备选会在界面消失，即使 Markdown 文件本身完整。","anchor":"section-0"},{"heading":"Decision","body":"笔记仍采用标准的 Problem、Decision、Alternatives considered 和 Consequences 结构，并允许多段内容。项目解析器按二级标题识别完整章节，保留到下一个标题或文本结束；代码块内的标题不切断正文。\n\n本地目录读取和离线打包共用同一解析器，原始 rawBody 保留。阅读页展示 Verification 及其他自由章节，摘要视图继续使用主要问题、决定和备选字段。原版 Skill 不改写；独立页面的布局与同步由[阅读工作台](2026-09-12-readable-board-and-stable-sync.md)约定说明。\n\n笔记之间使用有理由的相对链接，使看板可以计算引用并展示关联；历史补录依据可核实记录归位日期，不为填满状态栏虚构被否决的提案。这沿用[工具与项目配置分开维护](2026-09-11-learning-workflow-and-notes.md)的约定。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 只增加笔记数量：能补齐主题，但解析器仍会丢掉每节后续内容。\n- 把每节全部压成一行：可以迎合当前解析，但破坏 Markdown 的可读性，备选项也难以独立展示。\n- 直接修改上游模板和构建脚本：立即有效，但会给升级引入本地分叉；独立项目解析器可以显式记录并校验兼容范围。","anchor":"section-2"},{"heading":"Consequences","body":"本地连接和离线看板都能读取完整章节，代价是项目需要维护解析器与笔记格式的兼容性。读取到缺少标题或状态的文件时应报错，不将未完成保存的内容当成有效记录。\n\n看板统计引用关系，不证明某个决定更正确；已有方案的备选会进入方案取舍视图，无需伪造 rejected 笔记。原来的生成后正则补丁由共用解析器接替，避免同时维护两套修正。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：2026-09-11 对五篇原笔记复现，源文件每篇有二至三条备选，原看板均只提取一条。当前实现见 [model.mjs](../../../../scripts/notes-board/model.mjs)。\n\n2026-09-11 的初版适配通过两种生成命令与笔记校验，十九篇笔记的七十六个展示字段一致，保留五十七条备选及四十二条关联；离线浏览器详情核对通过。这是当时版本的证据。\n\n2026-09-12 共用解析器的回归覆盖多段正文、全部备选、CRLF、无末尾换行以及代码块中的二级标题。运行入口为 `npm run test:board`，页面验收范围见工作台笔记。","anchor":"section-4"}],"problem":"看板的章节提取表达式启用多行模式，又以行尾作为章节结束条件，导致一节只保留第一行。多段决定和第二条以后的备选会在界面消失，即使 Markdown 文件本身完整。","decision":"笔记仍采用标准的 Problem、Decision、Alternatives considered 和 Consequences 结构，并允许多段内容。项目解析器按二级标题识别完整章节，保留到下一个标题或文本结束；代码块内的标题不切断正文。\n\n本地目录读取和离线打包共用同一解析器，原始 rawBody 保留。阅读页展示 Verification 及其他自由章节，摘要视图继续使用主要问题、决定和备选字段。原版 Skill 不改写；独立页面的布局与同步由[阅读工作台](2026-09-12-readable-board-and-stable-sync.md)约定说明。\n\n笔记之间使用有理由的相对链接，使看板可以计算引用并展示关联；历史补录依据可核实记录归位日期，不为填满状态栏虚构被否决的提案。这沿用[工具与项目配置分开维护](2026-09-11-learning-workflow-and-notes.md)的约定。","alternatives":"- 只增加笔记数量：能补齐主题，但解析器仍会丢掉每节后续内容。\n- 把每节全部压成一行：可以迎合当前解析，但破坏 Markdown 的可读性，备选项也难以独立展示。\n- 直接修改上游模板和构建脚本：立即有效，但会给升级引入本地分叉；独立项目解析器可以显式记录并校验兼容范围。","consequences":"本地连接和离线看板都能读取完整章节，代价是项目需要维护解析器与笔记格式的兼容性。读取到缺少标题或状态的文件时应报错，不将未完成保存的内容当成有效记录。\n\n看板统计引用关系，不证明某个决定更正确；已有方案的备选会进入方案取舍视图，无需伪造 rejected 笔记。原来的生成后正则补丁由共用解析器接替，避免同时维护两套修正。","outLinks":["implemented/process/2026-09-11-learning-workflow-and-notes.md","implemented/process/2026-09-12-readable-board-and-stable-sync.md"]},{"id":"implemented/process/2026-09-11-learning-workflow-and-notes.md","sourcePath":"implemented/process/2026-09-11-learning-workflow-and-notes.md","slug":"2026-09-11-learning-workflow-and-notes","lifecycle":"implemented","cls":"process","date":"2026-09-11","title":"独立维护教练方法、项目学习资料与工程决策","status":"implemented","rawBody":"# Agent Note: 独立维护教练方法、项目学习资料与工程决策\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n学习项目同时需要工程理由、教学分工和理解证据。若把背景与阶段记录塞进第三方笔记工具，升级工具和迁移新项目都会携带无关事实；全部保存在本地交接中又难随仓库交接。\n\n## Decision\n\n项目入口组合原版决策笔记 Skill 与独立 learning-coach。前者负责工程决定的记录，后者负责讲解、练习、review 和学习交接；项目学习配置保存编辑分工，简短进度保存代码状态、验证结果和理解证据。\n\n学习者默认维护核心源码，AI 在授权范围内维护管理文件；卡住时可以给完整参考、逐块讲解并留小改造。用户明确代改的要求可覆盖默认分工，已有授权不重复确认。\n\n这一分工服务于[手写 CLI 的学习目标](../architecture/2026-08-30-local-cli-and-sdk.md)，采用[验证范围约定](../testing/2026-09-05-verification-scope.md)区分实现通过与理解掌握。教学不新增工程笔记的状态或分类。\n\n## Alternatives considered\n\n- 只使用既有 HANDOFF：信息集中且已有内容，但过程、约定和决策混合，docs 目录又不随当前 Git 保存。\n- 直接修改第三方 Skill：入口少，但升级需合并个性化补丁，新项目会继承旧背景。\n- 把全部教学方法放在 AGENTS.md：加载直接，但入口变长，通用方法无法独立复用。\n\n## Consequences\n\n通用方法、上游工具和项目资料可分别迁移，代价是需要沿入口读取相关文件并保持职责清楚。源码补录笔记采用可检索路径与笔记到源码的链接，不为了管理文档直接改动学习者的 src。\n\n工程笔记描述理由与代价，进度文件记录练习与证据；“待观察”不表示已经或尚未掌握。上游工具缺陷通过项目适配处理，不把教学逻辑混入其目录。\n\n## Verification\n\n日期依据：2026-09-11 建立的项目管理文件。当前依据：[AGENTS.md](../../../../AGENTS.md)、[教练 Skill](../../../skills/learning-coach/SKILL.md)、[学习配置](../../../learning/project.md)、[学习进度](../../../learning/progress.md)。本决定不属于早期已实现的 Agent 运行时能力，不能倒填为早期功能。\n","sections":[{"heading":"Problem","body":"学习项目同时需要工程理由、教学分工和理解证据。若把背景与阶段记录塞进第三方笔记工具，升级工具和迁移新项目都会携带无关事实；全部保存在本地交接中又难随仓库交接。","anchor":"section-0"},{"heading":"Decision","body":"项目入口组合原版决策笔记 Skill 与独立 learning-coach。前者负责工程决定的记录，后者负责讲解、练习、review 和学习交接；项目学习配置保存编辑分工，简短进度保存代码状态、验证结果和理解证据。\n\n学习者默认维护核心源码，AI 在授权范围内维护管理文件；卡住时可以给完整参考、逐块讲解并留小改造。用户明确代改的要求可覆盖默认分工，已有授权不重复确认。\n\n这一分工服务于[手写 CLI 的学习目标](../architecture/2026-08-30-local-cli-and-sdk.md)，采用[验证范围约定](../testing/2026-09-05-verification-scope.md)区分实现通过与理解掌握。教学不新增工程笔记的状态或分类。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 只使用既有 HANDOFF：信息集中且已有内容，但过程、约定和决策混合，docs 目录又不随当前 Git 保存。\n- 直接修改第三方 Skill：入口少，但升级需合并个性化补丁，新项目会继承旧背景。\n- 把全部教学方法放在 AGENTS.md：加载直接，但入口变长，通用方法无法独立复用。","anchor":"section-2"},{"heading":"Consequences","body":"通用方法、上游工具和项目资料可分别迁移，代价是需要沿入口读取相关文件并保持职责清楚。源码补录笔记采用可检索路径与笔记到源码的链接，不为了管理文档直接改动学习者的 src。\n\n工程笔记描述理由与代价，进度文件记录练习与证据；“待观察”不表示已经或尚未掌握。上游工具缺陷通过项目适配处理，不把教学逻辑混入其目录。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：2026-09-11 建立的项目管理文件。当前依据：[AGENTS.md](../../../../AGENTS.md)、[教练 Skill](../../../skills/learning-coach/SKILL.md)、[学习配置](../../../learning/project.md)、[学习进度](../../../learning/progress.md)。本决定不属于早期已实现的 Agent 运行时能力，不能倒填为早期功能。","anchor":"section-4"}],"problem":"学习项目同时需要工程理由、教学分工和理解证据。若把背景与阶段记录塞进第三方笔记工具，升级工具和迁移新项目都会携带无关事实；全部保存在本地交接中又难随仓库交接。","decision":"项目入口组合原版决策笔记 Skill 与独立 learning-coach。前者负责工程决定的记录，后者负责讲解、练习、review 和学习交接；项目学习配置保存编辑分工，简短进度保存代码状态、验证结果和理解证据。\n\n学习者默认维护核心源码，AI 在授权范围内维护管理文件；卡住时可以给完整参考、逐块讲解并留小改造。用户明确代改的要求可覆盖默认分工，已有授权不重复确认。\n\n这一分工服务于[手写 CLI 的学习目标](../architecture/2026-08-30-local-cli-and-sdk.md)，采用[验证范围约定](../testing/2026-09-05-verification-scope.md)区分实现通过与理解掌握。教学不新增工程笔记的状态或分类。","alternatives":"- 只使用既有 HANDOFF：信息集中且已有内容，但过程、约定和决策混合，docs 目录又不随当前 Git 保存。\n- 直接修改第三方 Skill：入口少，但升级需合并个性化补丁，新项目会继承旧背景。\n- 把全部教学方法放在 AGENTS.md：加载直接，但入口变长，通用方法无法独立复用。","consequences":"通用方法、上游工具和项目资料可分别迁移，代价是需要沿入口读取相关文件并保持职责清楚。源码补录笔记采用可检索路径与笔记到源码的链接，不为了管理文档直接改动学习者的 src。\n\n工程笔记描述理由与代价，进度文件记录练习与证据；“待观察”不表示已经或尚未掌握。上游工具缺陷通过项目适配处理，不把教学逻辑混入其目录。","outLinks":["implemented/architecture/2026-08-30-local-cli-and-sdk.md","implemented/testing/2026-09-05-verification-scope.md"]},{"id":"implemented/architecture/2026-09-10-todo-state-ownership.md","sourcePath":"implemented/architecture/2026-09-10-todo-state-ownership.md","slug":"2026-09-10-todo-state-ownership","lifecycle":"implemented","cls":"architecture","date":"2026-09-10","title":"todo 状态由模块持有，启动恢复通过注册表完成","status":"implemented","rawBody":"# Agent Note: todo 状态由模块持有，启动恢复通过注册表完成\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n有状态工具需要明确谁持有当前状态、何时读取磁盘，以及写入失败后模型能看到什么。若主循环直接管理 todo，工具细节会破坏统一接口；每次读盘又会改变状态权威和 IO 行为。\n\n## Decision\n\ntodo.ts 持有私有的模块级 state。启动时 main 等待 initTools，注册表再调用 loadTodoFromDisk；主循环不直接 import todo。list_todos 读取内存，增删先计算 next，磁盘写入成功后才发布 state = next。\n\n这保证写入抛错时内存仍保留旧状态；它不保证磁盘完整，也不保证崩溃时两个状态始终一致。底层格式与恢复策略归[JSON 持久化决定](2026-09-06-todo-json-persistence.md)，入口职责归[工具注册表](2026-08-31-tool-registry-boundary.md)。\n\n## Alternatives considered\n\n- 每次操作重新读盘：可以及时看见外部手工改动，是早期持久化版本的做法，但会增加重复 IO，并使运行状态更受外部写入影响。\n- 让 agent.ts 保存并传递 todo 状态：数据流显式，但主循环需要知道具体工具业务，新增状态工具继续扩大耦合。\n- 先更新内存再写盘：代码容易安排，但写入失败后内存会表现为已经成功，返回结果与持久化状态分离。\n\n## Consequences\n\n状态归属和启动顺序清晰，代价是运行中手工修改 JSON 不会刷新内存，需重启加载。两个进程各持一份快照，后写者可能覆盖先写者。\n\n多进程或外部编辑成为需求时，需要重新选择同步、锁或存储机制；不能把单进程的发布顺序推广为原子提交。\n\n## Verification\n\n日期依据：[6c93279](https://github.com/xilele777/mini-agent/commit/6c93279) 于 2026-09-10 引入常驻缓存和启动钩子。当前依据：[todo.ts](../../../../src/tools/todo.ts)、[tools/index.ts](../../../../src/tools/index.ts)。该历史提交关于“任意崩溃点一致”的表述超出实现保证，本笔记以当前代码为准。已有手动记录覆盖外部改盘后本进程不刷新、重启生效。\n","sections":[{"heading":"Problem","body":"有状态工具需要明确谁持有当前状态、何时读取磁盘，以及写入失败后模型能看到什么。若主循环直接管理 todo，工具细节会破坏统一接口；每次读盘又会改变状态权威和 IO 行为。","anchor":"section-0"},{"heading":"Decision","body":"todo.ts 持有私有的模块级 state。启动时 main 等待 initTools，注册表再调用 loadTodoFromDisk；主循环不直接 import todo。list_todos 读取内存，增删先计算 next，磁盘写入成功后才发布 state = next。\n\n这保证写入抛错时内存仍保留旧状态；它不保证磁盘完整，也不保证崩溃时两个状态始终一致。底层格式与恢复策略归[JSON 持久化决定](2026-09-06-todo-json-persistence.md)，入口职责归[工具注册表](2026-08-31-tool-registry-boundary.md)。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 每次操作重新读盘：可以及时看见外部手工改动，是早期持久化版本的做法，但会增加重复 IO，并使运行状态更受外部写入影响。\n- 让 agent.ts 保存并传递 todo 状态：数据流显式，但主循环需要知道具体工具业务，新增状态工具继续扩大耦合。\n- 先更新内存再写盘：代码容易安排，但写入失败后内存会表现为已经成功，返回结果与持久化状态分离。","anchor":"section-2"},{"heading":"Consequences","body":"状态归属和启动顺序清晰，代价是运行中手工修改 JSON 不会刷新内存，需重启加载。两个进程各持一份快照，后写者可能覆盖先写者。\n\n多进程或外部编辑成为需求时，需要重新选择同步、锁或存储机制；不能把单进程的发布顺序推广为原子提交。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[6c93279](https://github.com/xilele777/mini-agent/commit/6c93279) 于 2026-09-10 引入常驻缓存和启动钩子。当前依据：[todo.ts](../../../../src/tools/todo.ts)、[tools/index.ts](../../../../src/tools/index.ts)。该历史提交关于“任意崩溃点一致”的表述超出实现保证，本笔记以当前代码为准。已有手动记录覆盖外部改盘后本进程不刷新、重启生效。","anchor":"section-4"}],"problem":"有状态工具需要明确谁持有当前状态、何时读取磁盘，以及写入失败后模型能看到什么。若主循环直接管理 todo，工具细节会破坏统一接口；每次读盘又会改变状态权威和 IO 行为。","decision":"todo.ts 持有私有的模块级 state。启动时 main 等待 initTools，注册表再调用 loadTodoFromDisk；主循环不直接 import todo。list_todos 读取内存，增删先计算 next，磁盘写入成功后才发布 state = next。\n\n这保证写入抛错时内存仍保留旧状态；它不保证磁盘完整，也不保证崩溃时两个状态始终一致。底层格式与恢复策略归[JSON 持久化决定](2026-09-06-todo-json-persistence.md)，入口职责归[工具注册表](2026-08-31-tool-registry-boundary.md)。","alternatives":"- 每次操作重新读盘：可以及时看见外部手工改动，是早期持久化版本的做法，但会增加重复 IO，并使运行状态更受外部写入影响。\n- 让 agent.ts 保存并传递 todo 状态：数据流显式，但主循环需要知道具体工具业务，新增状态工具继续扩大耦合。\n- 先更新内存再写盘：代码容易安排，但写入失败后内存会表现为已经成功，返回结果与持久化状态分离。","consequences":"状态归属和启动顺序清晰，代价是运行中手工修改 JSON 不会刷新内存，需重启加载。两个进程各持一份快照，后写者可能覆盖先写者。\n\n多进程或外部编辑成为需求时，需要重新选择同步、锁或存储机制；不能把单进程的发布顺序推广为原子提交。","outLinks":["implemented/architecture/2026-08-31-tool-registry-boundary.md","implemented/architecture/2026-09-06-todo-json-persistence.md"]},{"id":"implemented/architecture/2026-09-06-todo-json-persistence.md","sourcePath":"implemented/architecture/2026-09-06-todo-json-persistence.md","slug":"2026-09-06-todo-json-persistence","lifecycle":"implemented","cls":"architecture","date":"2026-09-06","title":"todo 以项目内 JSON 保存计划，不保存完整会话","status":"implemented","rawBody":"# Agent Note: todo 以项目内 JSON 保存计划，不保存完整会话\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n仅靠对话历史表达多步计划，会受到历史裁剪和重启影响。工具需要一份可以明确列出、添加和移除的状态，但本阶段不需要数据库服务或完整任务调度系统。\n\n## Decision\n\ntodo 在项目根目录的 .mini-agent-todo.json 保存 tasks 与 nextId；条目只有 id 和 title。新增分配编号，完成后移除，list_todos 返回当前清单。文件路径固定并被 Git 忽略，属于 Agent 自身的项目草稿状态。\n\n读入 JSON 后使用 Zod 检查结构；文件缺失、读取错误、解析失败或结构不符按当前策略回退空清单。写入采用整份覆盖。当前运行中的权威状态与发布顺序由[常驻内存约定](2026-09-10-todo-state-ownership.md)说明。\n\n固定路径状态写入沿用[批准范围的判断](../feature/2026-09-02-action-approval-scope.md)，不要求每次增删待办都人工确认。\n\n## Alternatives considered\n\n- 继续只用消息历史：无需新存储，但旧轮裁剪或进程退出后无法恢复可靠的清单。\n- 只使用进程内列表：实现简单，适合初期状态练习，但重启会丢失计划。\n- 引入 SQLite 或外部数据库：查询、事务或并发能力更强，但当前只有小型项目草稿列表，引入额外存储机制的成本尚无对应需求。\n\n## Consequences\n\n待办可跨轮和跨进程重启恢复，代价是没有完成历史、任务归属、暂停状态或并发协调。暂停工作不等于删除计划，执行范围仍由当前用户请求决定。\n\n整份 writeFile 不是原子替换；损坏时回空清单也不是数据修复。不可读文件与格式错误未完整区分，后续写入可能覆盖原文件，恢复策略需要另行设计。\n\n## Verification\n\n日期依据：[d66e2d8](https://github.com/xilele777/mini-agent/commit/d66e2d8) 于 2026-09-06 引入 JSON 持久化。当前依据：[todo.ts](../../../../src/tools/todo.ts)、[.gitignore](../../../../.gitignore)。已有手动记录包括重启恢复、跨轮移除和删除文件后的空清单；没有崩溃恢复或并发写正确性的测试证据。\n","sections":[{"heading":"Problem","body":"仅靠对话历史表达多步计划，会受到历史裁剪和重启影响。工具需要一份可以明确列出、添加和移除的状态，但本阶段不需要数据库服务或完整任务调度系统。","anchor":"section-0"},{"heading":"Decision","body":"todo 在项目根目录的 .mini-agent-todo.json 保存 tasks 与 nextId；条目只有 id 和 title。新增分配编号，完成后移除，list_todos 返回当前清单。文件路径固定并被 Git 忽略，属于 Agent 自身的项目草稿状态。\n\n读入 JSON 后使用 Zod 检查结构；文件缺失、读取错误、解析失败或结构不符按当前策略回退空清单。写入采用整份覆盖。当前运行中的权威状态与发布顺序由[常驻内存约定](2026-09-10-todo-state-ownership.md)说明。\n\n固定路径状态写入沿用[批准范围的判断](../feature/2026-09-02-action-approval-scope.md)，不要求每次增删待办都人工确认。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 继续只用消息历史：无需新存储，但旧轮裁剪或进程退出后无法恢复可靠的清单。\n- 只使用进程内列表：实现简单，适合初期状态练习，但重启会丢失计划。\n- 引入 SQLite 或外部数据库：查询、事务或并发能力更强，但当前只有小型项目草稿列表，引入额外存储机制的成本尚无对应需求。","anchor":"section-2"},{"heading":"Consequences","body":"待办可跨轮和跨进程重启恢复，代价是没有完成历史、任务归属、暂停状态或并发协调。暂停工作不等于删除计划，执行范围仍由当前用户请求决定。\n\n整份 writeFile 不是原子替换；损坏时回空清单也不是数据修复。不可读文件与格式错误未完整区分，后续写入可能覆盖原文件，恢复策略需要另行设计。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[d66e2d8](https://github.com/xilele777/mini-agent/commit/d66e2d8) 于 2026-09-06 引入 JSON 持久化。当前依据：[todo.ts](../../../../src/tools/todo.ts)、[.gitignore](../../../../.gitignore)。已有手动记录包括重启恢复、跨轮移除和删除文件后的空清单；没有崩溃恢复或并发写正确性的测试证据。","anchor":"section-4"}],"problem":"仅靠对话历史表达多步计划，会受到历史裁剪和重启影响。工具需要一份可以明确列出、添加和移除的状态，但本阶段不需要数据库服务或完整任务调度系统。","decision":"todo 在项目根目录的 .mini-agent-todo.json 保存 tasks 与 nextId；条目只有 id 和 title。新增分配编号，完成后移除，list_todos 返回当前清单。文件路径固定并被 Git 忽略，属于 Agent 自身的项目草稿状态。\n\n读入 JSON 后使用 Zod 检查结构；文件缺失、读取错误、解析失败或结构不符按当前策略回退空清单。写入采用整份覆盖。当前运行中的权威状态与发布顺序由[常驻内存约定](2026-09-10-todo-state-ownership.md)说明。\n\n固定路径状态写入沿用[批准范围的判断](../feature/2026-09-02-action-approval-scope.md)，不要求每次增删待办都人工确认。","alternatives":"- 继续只用消息历史：无需新存储，但旧轮裁剪或进程退出后无法恢复可靠的清单。\n- 只使用进程内列表：实现简单，适合初期状态练习，但重启会丢失计划。\n- 引入 SQLite 或外部数据库：查询、事务或并发能力更强，但当前只有小型项目草稿列表，引入额外存储机制的成本尚无对应需求。","consequences":"待办可跨轮和跨进程重启恢复，代价是没有完成历史、任务归属、暂停状态或并发协调。暂停工作不等于删除计划，执行范围仍由当前用户请求决定。\n\n整份 writeFile 不是原子替换；损坏时回空清单也不是数据修复。不可读文件与格式错误未完整区分，后续写入可能覆盖原文件，恢复策略需要另行设计。","outLinks":["implemented/architecture/2026-09-10-todo-state-ownership.md","implemented/feature/2026-09-02-action-approval-scope.md"]},{"id":"implemented/bug-fix/2026-09-06-shared-read-guards.md","sourcePath":"implemented/bug-fix/2026-09-06-shared-read-guards.md","slug":"2026-09-06-shared-read-guards","lifecycle":"implemented","cls":"bug-fix","date":"2026-09-06","title":"读取与搜索共用敏感名单，并检查真实路径","status":"implemented","rawBody":"# Agent Note: 读取与搜索共用敏感名单，并检查真实路径\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n读取和搜索都会把本地文件内容送入模型上下文。若只有 read_file 检查敏感路径，搜索可以成为另一条读取通道；只检查表面路径也无法识别指向项目外的链接。\n\n## Decision\n\nguard.ts 提供共同的项目范围判断与敏感名单，覆盖环境文件、Git 内部对象、依赖目录、会话内部状态及部分私钥路径。单文件读取在词法路径校验后，对 realpath 再检查项目范围与敏感项；解析失败拒绝，不回退词法路径。\n\n搜索入口允许项目根目录，目录和文件均复用真实路径及敏感项检查，遍历时跳过敏感目录与递归遇到的符号链接条目；读取和搜索另有文件大小限制。免批准读取必须在工具代码里守边界，[动作批准](../feature/2026-09-02-action-approval-scope.md)不代替这条约束。阶段 13 的[新建与编辑](../feature/2026-09-21-safe-incremental-editing.md)进一步拒绝写入路径的任何链接组件，并检查新建目标最近的已有父目录。\n\n这些检查服务于[文件检索流程](../feature/2026-09-05-bounded-file-retrieval.md)，不约束用户批准后的任意 shell 行为。\n\n## Alternatives considered\n\n- 仅在提示词中禁止读取敏感内容：规则可见，但无法约束程序实际执行。\n- 每个工具维护自己的封锁名单：实现就近，但规则容易分叉，新增读取通道可能漏项。\n- 只用字符串前缀判断项目范围：容易实现，但同名前缀目录和符号链接会使表面路径与实际目标不同。\n\n## Consequences\n\n常见直接越界和敏感路径可在读取前拒绝，代价是文件系统检查增加了 IO，并可能拒绝合理的特殊路径。\n\n检查与 IO 之间仍非原子操作，无法抵御恶意并发路径替换；共享名单不等于识别任意名称的秘密。写入采用比读取更保守的链接规则，可能拒绝用户合理的项目内链接，需要用户选择真实路径。\n\n## Verification\n\n日期依据：[ad92001](https://github.com/xilele777/mini-agent/commit/ad92001) 于 2026-09-06 加固读取与搜索。当前依据：[guard.ts](../../../../src/guard.ts)、[grep.ts](../../../../src/tools/grep.ts)、[fs.ts](../../../../src/tools/fs.ts)。[guard.test.ts](../../../../src/guard.test.ts) 的链接夹具位于 ROOT 外，可能在词法检查就被拒绝；其通过不能证明项目内链接逃逸分支已被独立覆盖。\n\n2026-09-21 的 [edit.test.ts](../../../../src/tools/edit.test.ts)增加真实项目内 junction 指向敏感目录的读取／搜索入口／写入拒绝、项目根搜索放行与解析失败拒绝；Windows 本机实际执行通过，补足上述旧夹具的部分范围。\n","sections":[{"heading":"Problem","body":"读取和搜索都会把本地文件内容送入模型上下文。若只有 read_file 检查敏感路径，搜索可以成为另一条读取通道；只检查表面路径也无法识别指向项目外的链接。","anchor":"section-0"},{"heading":"Decision","body":"guard.ts 提供共同的项目范围判断与敏感名单，覆盖环境文件、Git 内部对象、依赖目录、会话内部状态及部分私钥路径。单文件读取在词法路径校验后，对 realpath 再检查项目范围与敏感项；解析失败拒绝，不回退词法路径。\n\n搜索入口允许项目根目录，目录和文件均复用真实路径及敏感项检查，遍历时跳过敏感目录与递归遇到的符号链接条目；读取和搜索另有文件大小限制。免批准读取必须在工具代码里守边界，[动作批准](../feature/2026-09-02-action-approval-scope.md)不代替这条约束。阶段 13 的[新建与编辑](../feature/2026-09-21-safe-incremental-editing.md)进一步拒绝写入路径的任何链接组件，并检查新建目标最近的已有父目录。\n\n这些检查服务于[文件检索流程](../feature/2026-09-05-bounded-file-retrieval.md)，不约束用户批准后的任意 shell 行为。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 仅在提示词中禁止读取敏感内容：规则可见，但无法约束程序实际执行。\n- 每个工具维护自己的封锁名单：实现就近，但规则容易分叉，新增读取通道可能漏项。\n- 只用字符串前缀判断项目范围：容易实现，但同名前缀目录和符号链接会使表面路径与实际目标不同。","anchor":"section-2"},{"heading":"Consequences","body":"常见直接越界和敏感路径可在读取前拒绝，代价是文件系统检查增加了 IO，并可能拒绝合理的特殊路径。\n\n检查与 IO 之间仍非原子操作，无法抵御恶意并发路径替换；共享名单不等于识别任意名称的秘密。写入采用比读取更保守的链接规则，可能拒绝用户合理的项目内链接，需要用户选择真实路径。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[ad92001](https://github.com/xilele777/mini-agent/commit/ad92001) 于 2026-09-06 加固读取与搜索。当前依据：[guard.ts](../../../../src/guard.ts)、[grep.ts](../../../../src/tools/grep.ts)、[fs.ts](../../../../src/tools/fs.ts)。[guard.test.ts](../../../../src/guard.test.ts) 的链接夹具位于 ROOT 外，可能在词法检查就被拒绝；其通过不能证明项目内链接逃逸分支已被独立覆盖。\n\n2026-09-21 的 [edit.test.ts](../../../../src/tools/edit.test.ts)增加真实项目内 junction 指向敏感目录的读取／搜索入口／写入拒绝、项目根搜索放行与解析失败拒绝；Windows 本机实际执行通过，补足上述旧夹具的部分范围。","anchor":"section-4"}],"problem":"读取和搜索都会把本地文件内容送入模型上下文。若只有 read_file 检查敏感路径，搜索可以成为另一条读取通道；只检查表面路径也无法识别指向项目外的链接。","decision":"guard.ts 提供共同的项目范围判断与敏感名单，覆盖环境文件、Git 内部对象、依赖目录、会话内部状态及部分私钥路径。单文件读取在词法路径校验后，对 realpath 再检查项目范围与敏感项；解析失败拒绝，不回退词法路径。\n\n搜索入口允许项目根目录，目录和文件均复用真实路径及敏感项检查，遍历时跳过敏感目录与递归遇到的符号链接条目；读取和搜索另有文件大小限制。免批准读取必须在工具代码里守边界，[动作批准](../feature/2026-09-02-action-approval-scope.md)不代替这条约束。阶段 13 的[新建与编辑](../feature/2026-09-21-safe-incremental-editing.md)进一步拒绝写入路径的任何链接组件，并检查新建目标最近的已有父目录。\n\n这些检查服务于[文件检索流程](../feature/2026-09-05-bounded-file-retrieval.md)，不约束用户批准后的任意 shell 行为。","alternatives":"- 仅在提示词中禁止读取敏感内容：规则可见，但无法约束程序实际执行。\n- 每个工具维护自己的封锁名单：实现就近，但规则容易分叉，新增读取通道可能漏项。\n- 只用字符串前缀判断项目范围：容易实现，但同名前缀目录和符号链接会使表面路径与实际目标不同。","consequences":"常见直接越界和敏感路径可在读取前拒绝，代价是文件系统检查增加了 IO，并可能拒绝合理的特殊路径。\n\n检查与 IO 之间仍非原子操作，无法抵御恶意并发路径替换；共享名单不等于识别任意名称的秘密。写入采用比读取更保守的链接规则，可能拒绝用户合理的项目内链接，需要用户选择真实路径。","outLinks":["implemented/feature/2026-09-02-action-approval-scope.md","implemented/feature/2026-09-05-bounded-file-retrieval.md","implemented/feature/2026-09-21-safe-incremental-editing.md"]},{"id":"implemented/bug-fix/2026-09-06-shell-interruption-reporting.md","sourcePath":"implemented/bug-fix/2026-09-06-shell-interruption-reporting.md","slug":"2026-09-06-shell-interruption-reporting","lifecycle":"implemented","cls":"bug-fix","date":"2026-09-06","title":"区分命令失败、输出超限和中断后的部分副作用","status":"implemented","rawBody":"# Agent Note: 区分命令失败、输出超限和中断后的部分副作用\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\nshell 可能在返回非零状态、超时或输出超限之前已经修改文件。若把缓冲超限当作普通退出码或正常完成，模型可能错误判断结果并继续执行依赖步骤。\n\n## Decision\n\nrun_bash 使用批准后的完整命令，工作目录固定为项目 ROOT，shell 和超时由启动配置注入（默认 30 秒）。spawn 通过 POSIX shell 的 -c 执行，stdin 关闭，stdout/stderr 各自最多缓冲 1 MiB，展示每个流的前 4000 字符。\n\n普通退出返回数字退出码和两路输出，包括非零状态。超时、取消、缓冲超限及信号中断抛出带已捕获输出和清理状态的错误，主轮记录 uncertain、补齐同批后续调用为 not_executed 并停止。取消错误名为 AbortError，轮结果为 cancelled；其余中断为 failed。开始前已取消不启动子进程。\n\nPOSIX 使用独立进程组并发送 SIGKILL；Windows Git Bash 使用 taskkill /PID /T /F，等待清理命令返回后再结算结果，清理失败尝试直接子进程终止。等待子进程关闭另有五秒退路，不无限挂起。清理消息只说明实际操作与返回状态，不宣称已经确认任意脱离进程树的后代退出。\n\nCLI 的 AbortController 经每轮[运行控制器](../architecture/2026-09-22-runtime-resilience.md)传入批准和工具，SIGINT/readline Ctrl+C 触发生命周期信号，取消后保存结果并关闭会话。模型适配器、摘要请求包装、只读委派和 ask_user 共用本轮信号；总时限中断同样触发命令清理，但轮结果分类为 budget_exhausted，原始命令清理报告仍保留。\n\n危险正则仅用于批准预览的提醒，不解析或过滤 shell；这是[具体动作批准](../feature/2026-09-02-action-approval-scope.md)的辅助，而非命令白名单。结果之后还会经过[公共上下文截断](../architecture/2026-09-05-bounded-conversation-context.md)。\n\n## Alternatives considered\n\n- 继续使用 exec timeout 并只终止直接 shell：接线简单，但不能覆盖仍在运行的子孙进程；spawn 配合系统进程树／进程组终止更容易验证。\n- 无限缓冲输出：最易保留全部信息，但大输出会扩大进程内存与模型上下文。\n- 按命令名称做白名单：规则直观，但重定向、管道、解释器和脚本能组合出其他效果，当前范围不实现完整 shell 解析。\n\n## Consequences\n\n模型能区分多类结果并看到部分输出，代价是输出可能不完整、进程终止也不保证撤销副作用或终止所有后代进程。\n\n支持范围是 Windows Git Bash 与 POSIX sh/bash；不支持后台 daemon、脱离父子关系／进程组的进程或任意 shell 方言。Windows 强制终止不能提供应用级优雅收尾；清理不撤销已发生的文件或网络副作用。普通命令退出也不证明它启动的独立后台服务已经退出。\n\n## Verification\n\n日期依据：[ad92001](https://github.com/xilele777/mini-agent/commit/ad92001) 于 2026-09-06 单独处理缓冲错误；基础 shell 工具来自 2026-09-02。当前依据：[bash.ts](../../../../src/tools/bash.ts)。已有记录包含 pwd、文件不存在和拒绝执行；没有缓冲超限、超时或完整进程树清理的自动化运行证据。\n\n上述末句描述阶段 13 之前的范围。2026-09-21 的 [command.test.ts](../../../../src/command.test.ts)在本机实际 Git Bash 验证 stdout/stderr、非零退出、超限、启动失败、预取消、超时／取消清理 Node 父子进程，并核对心跳停止及 PID 退出；主轮取消记录 uncertain 且不执行后续工具。Linux 分支和远程 CI 尚未在本轮运行，不能从 Windows 结果推断通过。\n","sections":[{"heading":"Problem","body":"shell 可能在返回非零状态、超时或输出超限之前 roblem":"shell 可能在返回非零状态、超时或输出超限之前已经修改文件。若把缓冲超限当作普通退出码或正常完成，模型可能错误判断结果并继续执行依赖步骤。","decision":"run_bash 使用批准后的完整命令，工作目录固定为项目 ROOT，shell 和超时由启动配置注入（默认 30 秒）。spawn 通过 POSIX shell 的 -c 执行，stdin 关闭，stdout/stderr 各自最多缓冲 1 MiB，展示每个流的前 4000 字符。\n\n普通退出返回数字退出码和两路输出，包括非零状态。超时、取消、缓冲超限及信号中断抛出带已捕获输出和清理状态的错误，主轮记录 uncertain、补齐同批后续调用为 not_executed 并停止。取消错误名为 AbortError，轮结果为 cancelled；其余中断为 failed。开始前已取消不启动子进程。\n\nPOSIX 使用独立进程组并发送 SIGKILL；Windows Git Bash 使用 taskkill /PID /T /F，等待清理命令返回后再结算结果，清理失败尝试直接子进程终止。等待子进程关闭另有五秒退路，不无限挂起。清理消息只说明实际操作与返回状态，不宣称已经确认任意脱离进程树的后代退出。\n\nCLI 的 AbortController 经每轮[运行控制器](../architecture/2026-09-22-runtime-resilience.md)传入批准和工具，SIGINT/readline Ctrl+C 触发生命周期信号，取消后保存结果并关闭会话。模型适配器、摘要请求包装、只读委派和 ask_user 共用本轮信号；总时限中断同样触发命令清理，但轮结果分类为 budget_exhausted，原始命令清理报告仍保留。\n\n危险正则仅用于批准预览的提醒，不解析或过滤 shell；这是[具体动作批准](../feature/2026-09-02-action-approval-scope.md)的辅助，而非命令白名单。结果之后还会经过[公共上下文截断](../architecture/2026-09-05-bounded-conversation-context.md)。","alternatives":"- 继续使用 exec timeout 并只终止直接 shell：接线简单，但不能覆盖仍在运行的子孙进程；spawn 配合系统进程树／进程组终止更容易验证。\n- 无限缓冲输出：最易保留全部信息，但大输出会扩大进程内存与模型上下文。\n- 按命令名称做白名单：规则直观，但重定向、管道、解释器和脚本能组合出其他效果，当前范围不实现完整 shell 解析。","consequences":"模型能区分多类结果并看到部分输出，代价是输出可能不完整、进程终止也不保证撤销副作用或终止所有后代进程。\n\n支持范围是 Windows Git Bash 与 POSIX sh/bash；不支持后台 daemon、脱离父子关系／进程组的进程或任意 shell 方言。Windows 强制终止不能提供应用级优雅收尾；清理不撤销已发生的文件或网络副作用。普通命令退出也不证明它启动的独立后台服务已经退出。","outLinks":["implemented/architecture/2026-09-05-bounded-conversation-context.md","implemented/architecture/2026-09-22-runtime-resilience.md","implemented/feature/2026-09-02-action-approval-scope.md"]},{"id":"implemented/bug-fix/2026-09-06-tool-result-history-recovery.md","sourcePath":"implemented/bug-fix/2026-09-06-tool-result-history-recovery.md","slug":"2026-09-06-tool-result-history-recovery","lifecycle":"implemented","cls":"bug-fix","date":"2026-09-06","title":"提前结束补齐工具结果，异常保留已确认与不确定动作","status":"implemented","rawBody":"# Agent Note: 提前结束补齐工具结果，异常保留已确认与不确定动作\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\nassistant 一次可能提出多个工具调用。中途拒绝、守卫终止或结束工具返回时，若遗留未配对 ID，下一次请求会复用不完整历史；请求异常还可能留下半轮消息。\n\n## Decision\n\n正常停止路径为已收到的每个调用保留对应 tool 结果：拒绝操作返回拒绝说明，不支持的调用类型返回错误；循环守卫或 endsTurn 终止本轮时，同批剩余调用补“未执行”结果并保持不执行。\n\n阶段 11 已接入的主轮检查点替代早期整轮回退：普通模型异常保留已有结果；工具执行中抛错或取消时记结果不确定，同批尚未开始的调用补未执行。runTurn 返回明确失败或取消结果。保存检查点失败直接上抛，入口退出，不再删除本轮历史或继续动作。对应类型与测试见 [turn.ts](../../../../src/turn.ts)、[turn-lifecycle.test.ts](../../../../src/turn-lifecycle.test.ts)。\n\n这一规则落实[原生调用协议](../architecture/2026-08-31-native-function-calling.md)，同时约束[循环守卫](../feature/2026-09-05-loop-guard-and-request-budget.md)和[动作拒绝](../feature/2026-09-02-action-approval-scope.md)的停止路径。\n\n## Alternatives considered\n\n- 遇到拒绝或结束信号直接 return：控制流短，但当前响应中其余调用可能没有结果。\n- 提前结束仍把剩余调用执行完：消息容易配齐，但会在工作已暂停或结束后继续产生副作用。\n- 异常时仅弹出最后一条消息：保留信息更多，但无法确定半轮中有多少调用未配对，容易留下结构错误。\n\n## Consequences\n\n正常结束与可记录的异常路径保持工具配对并保留本轮证据；保存失败时拒绝继续，磁盘恢复由已接入的[会话入口](../architecture/2026-09-21-atomic-session-storage.md)补充有标签的未执行或不确定结果。代价是保存次数增加，并需要向用户解释结果不确定的动作。\n\n消息回退不是事务回滚：已写入的文件、执行过的命令和 todo 变更都不会撤销。模型重新收到任务时，需要检查外部状态，不能假定本轮从未发生。\n\n## Verification\n\n日期依据：[ad92001](https://github.com/xilele777/mini-agent/commit/ad92001) 于 2026-09-06 补齐循环终止路径；[cd3fa0c](https://github.com/xilele777/mini-agent/commit/cd3fa0c) 包含显式出口路径。当前依据：[turn.ts](../../../../src/turn.ts)、[turn.test.ts](../../../../src/turn.test.ts) 和 [agent.ts](../../../../src/agent.ts)。主轮测试已覆盖 `finish_task` 后同批剩余调用补“未执行”结果，以及循环守卫中止时补齐当前及剩余调用。\n","sections":[{"heading":"Problem","body":"assistant 一次可能提出多个工具调用。中途拒绝、守卫终止或结束工具返回时，若遗留未配对 ID，下一次请求会复用不完整历史；请求异常还可能留下半轮消息。","anchor":"section-0"},{"heading":"Decision","body":"正常停止路径为已收到的每个调用保留对应 tool 结果：拒绝操作返回拒绝说明，不支持的调用类型返回错误；循环守卫或 endsTurn 终止本轮时，同批剩余调用补“未执行”结果并保持不执行。\n\n阶段 11 已接入的主轮检查点替代早期整轮回退：普通模型异常保留已有结果；工具执行中抛错或取消时记结果不确定，同批尚未开始的调用补未执行。runTurn 返回明确失败或取消结果。保存检查点失败直接上抛，入口退出，不再删除本轮历史或继续动作。对应类型与测试见 [turn.ts](../../../../src/turn.ts)、[turn-lifecycle.test.ts](../../../../src/turn-lifecycle.test.ts)。\n\n这一规则落实[原生调用协议](../architecture/2026-08-31-native-function-calling.md)，同时约束[循环守卫](../feature/2026-09-05-loop-guard-and-request-budget.md)和[动作拒绝](../feature/2026-09-02-action-approval-scope.md)的停止路径。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 遇到拒绝或结束信号直接 return：控制流短，但当前响应中其余调用可能没有结果。\n- 提前结束仍把剩余调用执行完：消息容易配齐，但会在工作已暂停或结束后继续产生副作用。\n- 异常时仅弹出最后一条消息：保留信息更多，但无法确定半轮中有多少调用未配对，容易留下结构错误。","anchor":"section-2"},{"heading":"Consequences","body":"正常结束与可记录的异常路径保持工具配对并保留本轮证据；保存失败时拒绝继续，磁盘恢复由已接入的[会话入口](../architecture/2026-09-21-atomic-session-storage.md)补充有标签的未执行或不确定结果。代价是保存次数增加，并需要向用户解释结果不确定的动作。\n\n消息回退不是事务回滚：已写入的文件、执行过的命令和 todo 变更都不会撤销。模型重新收到任务时，需要检查外部状态，不能假定本轮从未发生。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[ad92001](https://github.com/xilele777/mini-agent/commit/ad92001) 于 2026-09-06 补齐循环终止路径；[cd3fa0c](https://github.com/xilele777/mini-agent/commit/cd3fa0c) 包含显式出口路径。当前依据：[turn.ts](../../../../src/turn.ts)、[turn.test.ts](../../../../src/turn.test.ts) 和 [agent.ts](../../../../src/agent.ts)。主轮测试已覆盖 `finish_task` 后同批剩余调用补“未执行”结果，以及循环守卫中止时补齐当前及剩余调用。","anchor":"section-4"}],"problem":"assistant 一次可能提出多个工具调用。中途拒绝、守卫终止或结束工具返回时，若遗留未配对 ID，下一次请求会复用不完整历史；请求异常还可能留下半轮消息。","decision":"正常停止路径为已收到的每个调用保留对应 tool 结果：拒绝操作返回拒绝说明，不支持的调用类型返回错误；循环守卫或 endsTurn 终止本轮时，同批剩余调用补“未执行”结果并保持不执行。\n\n阶段 11 已接入的主轮检查点替代早期整轮回退：普通模型异常保留已有结果；工具执行中抛错或取消时记结果不确定，同批尚未开始的调用补未执行。runTurn 返回明确失败或取消结果。保存检查点失败直接上抛，入口退出，不再删除本轮历史或继续动作。对应类型与测试见 [turn.ts](../../../../src/turn.ts)、[turn-lifecycle.test.ts](../../../../src/turn-lifecycle.test.ts)。\n\n这一规则落实[原生调用协议](../architecture/2026-08-31-native-function-calling.md)，同时约束[循环守卫](../feature/2026-09-05-loop-guard-and-request-budget.md)和[动作拒绝](../feature/2026-09-02-action-approval-scope.md)的停止路径。","alternatives":"- 遇到拒绝或结束信号直接 return：控制流短，但当前响应中其余调用可能没有结果。\n- 提前结束仍把剩余调用执行完：消息容易配齐，但会在工作已暂停或结束后继续产生副作用。\n- 异常时仅弹出最后一条消息：保留信息更多，但无法确定半轮中有多少调用未配对，容易留下结构错误。","consequences":"正常结束与可记录的异常路径保持工具配对并保留本轮证据；保存失败时拒绝继续，磁盘恢复由已接入的[会话入口](../architecture/2026-09-21-atomic-session-storage.md)补充有标签的未执行或不确定结果。代价是保存次数增加，并需要向用户解释结果不确定的动作。\n\n消息回退不是事务回滚：已写入的文件、执行过的命令和 todo 变更都不会撤销。模型重新收到任务时，需要检查外部状态，不能假定本轮从未发生。","outLinks":["implemented/architecture/2026-08-31-native-function-calling.md","implemented/architecture/2026-09-21-atomic-session-storage.md","implemented/feature/2026-09-02-action-approval-scope.md","implemented/feature/2026-09-05-loop-guard-and-request-budget.md"]},{"id":"implemented/architecture/2026-09-05-bounded-conversation-context.md","sourcePath":"implemented/architecture/2026-09-05-bounded-conversation-context.md","slug":"2026-09-05-bounded-conversation-context","lifecycle":"implemented","cls":"architecture","date":"2026-09-05","title":"用结果截断与整轮裁剪控制发送给模型的历史","status":"implemented","rawBody":"# Agent Note: 用结果截断与整轮裁剪控制发送给模型的历史\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n工具输出和跨轮消息会持续积累。如果每次都发送全部内容，成本与上下文压力不断增加；随意切掉若干消息又可能丢失当前目标或拆开调用与结果。\n\n## Decision\n\n工具结果超过 4000 字符时，公共上下文层保留开头 3000 和结尾 1000 字符，并明确指出中间省略。当前主循环每次发送前从完整原始历史构造请求视图，按预算删除完整旧轮，保护首轮前缀及当前轮；视图裁剪不删除持久化历史。固定六轮的 trimHistory 保留为已有工具函数及其测试，正式主轮不再调用。\n\n真实轮次由[startsTurn 标记](2026-09-11-user-turn-boundaries.md)确定，不能靠消息数量或角色猜测。单次返回不完整时，模型应使用[定位和分页工具](../feature/2026-09-05-bounded-file-retrieval.md)继续取证。\n\n每次模型响应有 usage 时打印 prompt、completion 和 total，供观察请求规模；工具调用结构遵循[原生协议](2026-08-31-native-function-calling.md)。\n\n2026-09-21 新增 [context-budget.ts](../../../../src/context-budget.ts) 并接入请求链路。`buildContext(history, tools, budget)` 复制请求视图、去除本地标记并截断工具结果，将窗口扣除输出预留和安全余量后作为输入预算；从最早旧轮开始整轮移除，保护首轮前缀与当前轮。无 startsTurn 时整份历史受保护，删完旧轮仍超限时返回无 messages 的失败分支。函数依赖调用方提供配对完整的历史，不负责修复异常配对。\n\n计数对文本 messages 与工具 schema 的 JSON 使用 UTF-8 字节数粗估，并增加包装余量；内容块数组明确拒绝。该方法不绑定兼容模型的 tokenizer，输出字段明确命名为 estimatedInputTokens，不宣称服务端 token 硬保证。后续请求接线和摘要范围见[阶段 12 路线](../../proposed/architecture/2026-09-20-practical-mini-agent-v1.md)。\n\n### Request wiring\n\n[runtime.ts](../../../../src/runtime.ts) 将统一配置作为必填 contextBudget 注入主／子循环；两者每次请求均检查当次历史及工具集合，携带 maxOutputTokens。主轮超限经 finish/checkpoint 保存 budget_exhausted，保留已完成动作及结果；子任务超限返回明确的未完成原因，主轮据此决定下一步。\n\n子 Agent 仅有一个真实任务轮，最终总结提示属于该轮，不能通过删除任务开头腾空间。最终请求先撤下工具再估算，仍超限则不额外请求；子历史保留原始工具返回，仅发送视图与日志截断，避免重复截断。子历史仍不持久化。\n\n[llm.ts](../../../../src/llm.ts) 将输出上限写入所选请求参数，且限制其不得超过配置的输出预留。默认 max_completion_tokens，兼容服务可显式选择 max_tokens，不自动撤掉限制或重发。适配器将 context_length_exceeded/context_window_exceeded 转换为固定 ContextBudgetError；主轮据此结束为预算耗尽，子轮返回明确原因，其余异常继续沿用失败路径。具体配置与默认值归[统一配置](2026-09-21-validated-runtime-config.md)。\n\n## Alternatives considered\n\n- 完整保留全部消息：信息最充分，但无法控制长会话的上下文增长。\n- 按固定条数切消息：实现简单，但可能保留孤立的 tool 结果或截掉用户目标。\n- 立即引入模型摘要和长期记忆：能保留更多跨轮信息，但会增加额外请求、摘要失真与维护逻辑，当前先使用可检查的固定策略。\n- 固定字符数除以四估算：简单且估值更小，但中文、代码与兼容模型的分词差异会降低余量可靠性；当前文本模块采用更保守的字节粗估，接受过早裁剪的代价。\n- 模型专用 tokenizer：能提高窗口利用率，但需要匹配实际模型及服务端包装；当前兼容服务尚不固定，保留为有 usage 对照后的适配方向，未进行计数方案的对比实验。\n- 主／子循环各自使用隐式默认预算：修改测试入口更少，但漏传配置难以被发现；采用必填依赖，由 runtime 统一注入。\n- 只在真实用户输入时检查：调用次数少，但工具观察及内部提示会在同轮继续增长；每次模型请求前检查，接受重新估算的开销。\n- 单一输出参数或不支持时自动撤掉限制：配置少或更容易请求成功，但不同兼容服务的协议差异可能使输出预留失效；选择显式参数配置并保持限制。\n\n## Consequences\n\n上下文策略集中在一处，代价是省略内容和早期轮次不可由模型凭记忆恢复。附加截断说明会让结果略超过 4000 字符，估算使用附带说明的实际请求视图。\n\nshell 工具自身还有输出截断，公共层看到的结果可能已丢失一部分内容。usage 日志是观察值，不能单凭单次回落证明所有任务的费用已封顶。\n\n预算模块保持原始历史与嵌套工具调用隔离，代价是复制与逐轮重新序列化的开销，以及保守粗估可能丢弃本可容纳的旧轮。生产主／子请求已检查预算且实际请求体携带生成上限，但估算与兼容服务的严格执行不能当作已获精确硬保证。摘要与失败回退已接入；全轮统一 token／时间／委派／重试账目由[运行控制器](2026-09-22-runtime-resilience.md)实施。\n\n### Persistent compaction\n\n[compaction.ts](../../../../src/compaction.ts) 在会话请求需要裁剪旧轮时，每个真实用户轮最多尝试一次摘要；只选择一次请求能容纳的连续完整旧轮，摘要源包含此前摘要、原始消息及轮／动作状态。摘要输入不截断，无法容纳一个完整旧轮时直接沿用裁剪。摘要无工具，生成空间不超过主轮输出预留且最多 1024 token；主轮与摘要共用请求次数，发摘要前至少剩两次，保留一次正常请求。\n\n[context-summary.ts](../../../../src/context-summary.ts) 定义 through 排他性消息上界、原文 SHA-256 指纹和非空且不超过 6000 UTF-8 字节的正文。覆盖边界须是下一真实轮的起点，来源指纹必须匹配；摘要作为有来源标签的 user 材料置于固定前缀后，不设置 startsTurn，也不提升为 system 指令。后续只拼入 through 之后的原文；追加摘要时合并前次摘要，保持连续覆盖。指纹用于发现来源不一致，不证明模型摘要语义准确。\n\n候选摘要必须正常结束、无拒绝或工具调用、确实缩短视图且新的请求预算可满足，才通过会话原子更新保存；保存前再次核对来源及原摘要未改变。保存成功后才发送新视图。生成、格式校验或保存失败保留原摘要与全部历史，回退到此前已确认可发送的裁剪视图，同轮不重试。旧摘要本身放不进更小的新窗口时，仅本次退回原始历史裁剪；原始当前轮也超限则零请求停止。AbortError 继续向外传播，不因回退继续执行。\n\n[session-runner.ts](../../../../src/session-runner.ts) 每个用户轮创建独立压缩器，并将恢复后的不确定动作提醒放在预算计算前；原先在 createStream 包装中追加提醒会漏计开销，现已消除。主循环保留完整历史做检查点，只有派生视图受裁剪与摘要影响。新快照 v3 及 v2 无损读取归[会话存储](2026-09-21-atomic-session-storage.md)。\n\n取舍：直接覆盖原文更省磁盘但失去核查依据；一次循环摘要所有旧轮能覆盖更多历史，却增加请求消耗与失败链路。当前保留原文并只做一次有界摘要，接受剩余旧轮仍可能被裁掉。摘要保存错误若一律致命会阻止本可继续的任务；这里仅对派生摘要允许回退，动作检查点保存失败仍立即停止。主／摘要局部合计次数和全轮共享预算同时生效，取消及 RunBudgetError 不能被摘要回退吞掉。\n\n## Verification\n\n日期依据：[7b29af1](https://github.com/xilele777/mini-agent/commit/7b29af1) 于 2026-09-05 引入上下文管理。当前依据：[context.ts](../../../../src/context.ts)、[context.test.ts](../../../../src/context.test.ts)、[agent.ts](../../../../src/agent.ts)、[turn.ts](../../../../src/turn.ts) 和 [turn.test.ts](../../../../src/turn.test.ts)。测试覆盖头尾截断、整轮保留和内部继续提示不增加真实用户轮，仍无法证明任意输入均不超服务端上下文限额。\n\n2026-09-21，学习者提供类型检查与全量 111 项测试通过记录，其中 [context-budget.test.ts](../../../../src/context-budget.test.ts) 新增八项边界测试；AI 核对源码及测试入口与已验证参考一致，本轮未重跑源码检查或模型请求。候选参考此前在隔离目录通过类型检查及八项测试。上述证据覆盖独立预算模块，不覆盖生产请求接线、服务端精确计数或摘要。\n\n同日请求接线完成：学习者提供类型检查、全量 120 项测试通过记录，新增 [context-wiring.test.ts](../../../../src/context-wiring.test.ts) 九项集成用例，覆盖配置、主／子请求超限、工具结果后再次检查、最终总结预算、裁剪后重开仍有原始历史、runtime 注入、SDK 请求体和服务端超限不重试。AI 静态核对正式接线与此前隔离验证的参考一致，本次未重复运行源码检查。\n\n学习者真实运行“计算 17 × 23，然后结束任务”，两次主请求前的估算分别为 8851 和 9160，实际 prompt usage 为 1832 和 1863，两次 droppedTurns 均为 0；calculate 返回 391，finish_task 后轮状态 completed。这是普通主轮每次规划的证据，不是长历史裁剪或服务端生成上限强制执行的证据；不把这两组数据的比值用于通用计数校准。\n\n随后用户明确授权 AI 直接实现摘要。本次类型检查通过，全量 140 项回归通过；新增 [compaction.test.ts](../../../../src/compaction.test.ts) 二十项测试覆盖先保存后使用、增量摘要、恢复去重、网络／空正文／拒绝／截断／工具调用／超长／未缩短／保存失败回退、单轮只尝试一次、请求额度、当前轮超限、旧轮源过长、取消、较小窗口、指纹与边界、v2 迁移、不确定提醒预算以及动作状态与来源变化。测试使用临时目录和模拟流，模型语义质量不由这些断言保证。\n\n真实摘要验收由 AI 本次执行：使用配置模型 gpt-6-astra、8000 窗口／1024 输出／512 余量，以及六个人工构造旧轮的临时会话，仅提供 finish_task，无文件或命令工具。两次用户轮共四次真实请求：摘要两次、正常回答两次。首次摘要覆盖 [1,5)，381 字节，摘要 usage=909/98（prompt/completion），主请求估算 5279/6464、droppedTurns=1；关闭并重新打开后增量摘要覆盖 [5,7)，450 字节，usage=775/109，主请求估算 5957/6464、droppedTurns=0。两次正常回答均保留 ORBIT-27 及只读／禁止写入限制，均调用 finish_task 完成。该用例证明受控长历史的真实摘要、保存／重开与增量合并，不是任意内容语义保真、跨进程重开或服务端严格生成上限的证明；临时脚本与会话已清理。\n","sections":[{"heading":"Problem","body":"工具输出和跨轮消息会持续积累。如果每次都发送全部内容，成本与上下文压力不断增加；随意切掉若干消息又可能丢失当前目标或拆开调用与结果。","anchor":"section-0"},{"heading":"Decision","body":"工具结果超过 4000 字符时，公共上下文层保留开头 3000 和结尾 1000 字符，并明确指出中间省略。当前主循环每次发送前从完整原始历史构造请求视图，按预算删除完整旧轮，保护首轮前缀及当前轮；视图裁剪不删除持久化历史。固定六轮的 trimHistory 保留为已有工具函数及其测试，正式主轮不再调用。\n\n真实轮次由[startsTurn 标记](2026-09-11-user-turn-boundaries.md)确定，不能靠消息数量或角色猜测。单次返回不完整时，模型应使用[定位和分页工具](../feature/2026-09-05-bounded-file-retrieval.md)继续取证。\n\n每次模型响应有 usage 时打印 prompt、completion 和 total，供观察请求规模；工具调用结构遵循[原生协议](2026-08-31-native-function-calling.md)。\n\n2026-09-21 新增 [context-budget.ts](../../../../src/context-budget.ts) 并接入请求链路。`buildContext(history, tools, budget)` 复制请求视图、去除本地标记并截断工具结果，将窗口扣除输出预留和安全余量后作为输入预算；从最早旧轮开始整轮移除，保护首轮前缀与当前轮。无 startsTurn 时整份历史受保护，删完旧轮仍超限时返回无 messages 的失败分支。函数依赖调用方提供配对完整的历史，不负责修复异常配对。\n\n计数对文本 messages 与工具 schema 的 JSON 使用 UTF-8 字节数粗估，并增加包装余量；内容块数组明确拒绝。该方法不绑定兼容模型的 tokenizer，输出字段明确命名为 estimatedInputTokens，不宣称服务端 token 硬保证。后续请求接线和摘要范围见[阶段 12 路线](../../proposed/architecture/2026-09-20-practical-mini-agent-v1.md)。\n\n### Request wiring\n\n[runtime.ts](../../../../src/runtime.ts) 将统一配置作为必填 contextBudget 注入主／子循环；两者每次请求均检查当次历史及工具集合，携带 maxOutputTokens。主轮超限经 finish/checkpoint 保存 budget_exhausted，保留已完成动作及结果；子任务超限返回明确的未完成原因，主轮据此决定下一步。\n\n子 Agent 仅有一个真实任务轮，最终总结提示属于该轮，不能通过删除任务开头腾空间。最终请求先撤下工具再估算，仍超限则不额外请求；子历史保留原始工具返回，仅发送视图与日志截断，避免重复截断。子历史仍不持久化。\n\n[llm.ts](../../../../src/llm.ts) 将输出上限写入所选请求参数，且限制其不得超过配置的输出预留。默认 max_completion_tokens，兼容服务可显式选择 max_tokens，不自动撤掉限制或重发。适配器将 context_length_exceeded/context_window_exceeded 转换为固定 ContextBudgetError；主轮据此结束为预算耗尽，子轮返回明确原因，其余异常继续沿用失败路径。具体配置与默认值归[统一配置](2026-09-21-validated-runtime-config.md)。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 完整保留全部消息：信息最充分，但无法控制长会话的上下文增长。\n- 按固定条数切消息：实现简单，但可能保留孤立的 tool 结果或截掉用户目标。\n- 立即引入模型摘要和长期记忆：能保留更多跨轮信息，但会增加额外请求、摘要失真与维护逻辑，当前先使用可检查的固定策略。\n- 固定字符数除以四估 t.ts](../../../../src/context.ts)、[context.test.ts](../../../../src/context.test.ts)、[agent.ts](../../../../src/agent.ts)、[turn.ts](../../../../src/turn.ts) 和 [turn.test.ts](../../../../src/turn.test.ts)。测试覆盖头尾截断、整轮保留和内部继续提示不增加真实用户轮，仍无法证明任意输入均不超服务端上下文限额。\n\n2026-09-21，学习者提供类型检查与全量 111 项测试通过记录，其中 [context-budget.test.ts](../../../../src/context-budget.test.ts) 新增八项边界测试；AI 核对源码及测试入口与已验证参考一致，本轮未重跑源码检查或模型请求。候选参考此前在隔离目录通过类型检查及八项测试。上述证据覆盖独立预算模块，不覆盖生产请求接线、服务端精确计数或摘要。\n\n同日请求接线完成：学习者提供类型检查、全量 120 项测试通过记录，新增 [context-wiring.test.ts](../../../../src/context-wiring.test.ts) 九项集成用例，覆盖配置、主／子请求超限、工具结果后再次检查、最终总结预算、裁剪后重开仍有原始历史、runtime 注入、SDK 请求体和服务端超限不重试。AI 静态核对正式接线与此前隔离验证的参考一致，本次未重复运行源码检查。\n\n学习者真实运行“计算 17 × 23，然后结束任务”，两次主请求前的估算分别为 8851 和 9160，实际 prompt usage 为 1832 和 1863，两次 droppedTurns 均为 0；calculate 返回 391，finish_task 后轮状态 completed。这是普通主轮每次规划的证据，不是长历史裁剪或服务端生成上限强制执行的证据；不把这两组数据的比值用于通用计数校准。\n\n随后用户明确授权 AI 直接实现摘要。本次类型检查通过，全量 140 项回归通过；新增 [compaction.test.ts](../../../../src/compaction.test.ts) 二十项测试覆盖先保存后使用、增量摘要、恢复去重、网络／空正文／拒绝／截断／工具调用／超长／未缩短／保存失败回退、单轮只尝试一次、请求额度、当前轮超限、旧轮源过长、取消、较小窗口、指纹与边界、v2 迁移、不确定提醒预算以及动作状态与来源变化。测试使用临时目录和模拟流，模型语义质量不由这些断言保证。\n\n真实摘要验收由 AI 本次执行：使用配置模型 gpt-6-astra、8000 窗口／1024 输出／512 余量，以及六个人工构造旧轮的临时会话，仅提供 finish_task，无文件或命令工具。两次用户轮共四次真实请求：摘要两次、正常回答两次。首次摘要覆盖 [1,5)，381 字节，摘要 usage=909/98（prompt/completion），主请求估算 5279/6464、droppedTurns=1；关闭并重新打开后增量摘要覆盖 [5,7)，450 字节，usage=775/109，主请求估算 5957/6464、droppedTurns=0。两次正常回答均保留 ORBIT-27 及只读／禁止写入限制，均调用 finish_task 完成。该用例证明受控长历史的真实摘要、保存／重开与增量合并，不是任意内容语义保真、跨进程重开或服务端严格生成上限的证明；临时脚本与会话已清理。","anchor":"section-4"}],"problem":"工具输出和跨轮消息会持续积累。如果每次都发送全部内容，成本与上下文压力不断增加；随意切掉若干消息又可能丢失当前目标或拆开调用与结果。","decision":"工具结果超过 4000 字符时，公共上下文层保留开头 3000 和结尾 1000 字符，并明确指出中间省略。当前主循环每次发送前从完整原始历史构造请求视图，按预算删除完整旧轮，保护首轮前缀及当前轮；视图裁剪不删除持久化历史。固定六轮的 trimHistory 保留为已有工具函数及其测试，正式主轮不再调用。\n\n真实轮次由[startsTurn 标记](2026-09-11-user-turn-boundaries.md)确定，不能靠消息数量或角色猜测。单次返回不完整时，模型应使用[定位和分页工具](../feature/2026-09-05-bounded-file-retrieval.md)继续取证。\n\n每次模型响应有 usage 时打印 prompt、completion 和 total，供观察请求规模；工具调用结构遵循[原生协议](2026-08-31-native-function-calling.md)。\n\n2026-09-21 新增 [context-budget.ts](../../../../src/context-budget.ts) 并接入请求链路。`buildContext(history, tools, budget)` 复制请求视图、去除本地标记并截断工具结果，将窗口扣除输出预留和安全余量后作为输入预算；从最早旧轮开始整轮移除，保护首轮前缀与当前轮。无 startsTurn 时整份历史受保护，删完旧轮仍超限时返回无 messages 的失败分支。函数依赖调用方提供配对完整的历史，不负责修复异常配对。\n\n计数对文本 messages 与工具 schema 的 JSON 使用 UTF-8 字节数粗估，并增加包装余量；内容块数组明确拒绝。该方法不绑定兼容模型的 tokenizer，输出字段明确命名为 estimatedInputTokens，不宣称服务端 token 硬保证。后续请求接线和摘要范围见[阶段 12 路线](../../proposed/architecture/2026-09-20-practical-mini-agent-v1.md)。\n\n### Request wiring\n\n[runtime.ts](../../../../src/runtime.ts) 将统一配置作为必填 contextBudget 注入主／子循环；两者每次请求均检查当次历史及工具集合，携带 maxOutputTokens。主轮超限经 finish/checkpoint 保存 budget_exhausted，保留已完成动作及结果；子任务超限返回明确的未完成原因，主轮据此决定下一步。\n\n子 Agent 仅有一个真实任务轮，最终总结提示属于该轮，不能通过删除任务开头腾空间。最终请求先撤下工具再估算，仍超限则不额外请求；子历史保留原始工具返回，仅发送视图与日志截断，避免重复截断。子历史仍不持久化。\n\n[llm.ts](../../../../src/llm.ts) 将输出上限写入所选请求参数，且限制其不得超过配置的输出预留。默认 max_completion_tokens，兼容服务可显式选择 max_tokens，不自动撤掉限制或重发。适配器将 context_length_exceeded/context_window_exceeded 转换为固定 ContextBudgetError；主轮据此结束为预算耗尽，子轮返回明确原因，其余异常继续沿用失败路径。具体配置与默认值归[统一配置](2026-09-21-validated-runtime-config.md)。","alternatives":"- 完整保留全部消息：信息最充分，但无法控制长会话的上下文增长。\n- 按固定条数切消息：实现简单，但可能保留孤立的 tool 结果或截掉用户目标。\n- 立即引入模型摘要和长期记忆：能保留更多跨轮信息，但会增加额外请求、摘要失真与维护逻辑，当前先使用可检查的固定策略。\n- 固定字符数除以四估算：简单且估值更小，但中文、代码与兼容模型的分词差异会降低余量可靠性；当前文本模块采用更保守的字节粗估，接受过早裁剪的代价。\n- 模型专用 tokenizer：能提高窗口利用率，但需要匹配实际模型及服务端包装；当前兼容服务尚不固定，保留为有 usage 对照后的适配方向，未进行计数方案的对比实验。\n- 主／子循环各自使用隐式默认预算：修改测试入口更少，但漏传配置难以被发现；采用必填依赖，由 runtime 统一注入。\n- 只在真实用户输入时检查：调用次数少，但工具观察及内部提示会在同轮继续增长；每次模型请求前检查，接受重新估算的开销。\n- 单一输出参数或不支持时自动撤掉限制：配置少或更容易请求成功，但不同兼容服务的协议差异可能使输出预留失效；选择显式参数配置并保持限制。","consequences":"上下文策略集中在一处，代价是省略内容和早期轮次不可由模型凭记忆恢复。附加截断说明会让结果略超过 4000 字符，估算使用附带说明的实际请求视图。\n\nshell 工具自身还有输出截断，公共层看到的结果可能已丢失一部分内容。usage 日志是观察值，不能单凭单次回落证明所有任务的费用已封顶。\n\n预算模块保持原始历史与嵌套工具调用隔离，代价是复制与逐轮重新序列化的开销，以及保守粗估可能丢弃本可容纳的旧轮。生产主／子请求已检查预算且实际请求体携带生成上限，但估算与兼容服务的严格执行不能当作已获精确硬保证。摘要与失败回退已接入；全轮统一 token／时间／委派／重试账目由[运行控制器](2026-09-22-runtime-resilience.md)实施。\n\n### Persistent compaction\n\n[compaction.ts](../../../../src/compaction.ts) 在会话请求需要裁剪旧轮时，每个真实用户轮最多尝试一次摘要；只选择一次请求能容纳的连续完整旧轮，摘要源包含此前摘要、原始消息及轮／动作状态。摘要输入不截断，无法容纳一个完整旧轮时直接沿用裁剪。摘要无工具，生成空间不超过主轮输出预留且最多 1024 token；主轮与摘要共用请求次数，发摘要前至少剩两次，保留一次正常请求。\n\n[context-summary.ts](../../../../src/context-summary.ts) 定义 through 排他性消息上界、原文 SHA-256 指纹和非空且不超过 6000 UTF-8 字节的正文。覆盖边界须是下一真实轮的起点，来源指纹必须匹配；摘要作为有来源标签的 user 材料置于固定前缀后，不设置 startsTurn，也不提升为 system 指令。后续只拼入 through 之后的原文；追加摘要时合并前次摘要，保持连续覆盖。指纹用于发现来源不一致，不证明模型摘要语义准确。\n\n候选摘要必须正常结束、无拒绝或工具调用、确实缩短视图且新的请求预算可满足，才通过会话原子更新保存；保存前再次核对来源及原摘要未改变。保存成功后才发送新视图。生成、格式校验或保存失败保留原摘要与全部历史，回退到此前已确认可发送的裁剪视图，同轮不重试。旧摘要本身放不进更小的新窗口时，仅本次退回原始历史裁剪；原始当前轮也超限则零请求停止。AbortError 继续向外传播，不因回退继续执行。\n\n[session-runner.ts](../../../../src/session-runner.ts) 每个用户轮创建独立压缩器，并将恢复后的不确定动作提醒放在预算计算前；原先在 createStream 包装中追加提醒会漏计开销，现已消除。主循环保留完整历史做检查点，只有派生视图受裁剪与摘要影响。新快照 v3 及 v2 无损读取归[会话存储](2026-09-21-atomic-session-storage.md)。\n\n取舍：直接覆盖原文更省磁盘但失去核查依据；一次循环摘要所有旧轮能覆盖更多历史，却增加请求消耗与失败链路。当前保留原文并只做一次有界摘要，接受剩余旧轮仍可能被裁掉。摘要保存错误若一律致命会阻止本可继续的任务；这里仅对派生摘要允许回退，动作检查点保存失败仍立即停止。主／摘要局部合计次数和全轮共享预算同时生效，取消及 RunBudgetError 不能被摘要回退吞掉。","outLinks":["implemented/architecture/2026-08-31-native-function-calling.md","implemented/architecture/2026-09-11-user-turn-boundaries.md","implemented/architecture/2026-09-21-atomic-session-storage.md","implemented/architecture/2026-09-21-validated-runtime-config.md","implemented/architecture/2026-09-22-runtime-resilience.md","implemented/feature/2026-09-05-bounded-file-retrieval.md","proposed/architecture/2026-09-20-practical-mini-agent-v1.md"]},{"id":"implemented/feature/2026-09-05-bounded-file-retrieval.md","sourcePath":"implemented/feature/2026-09-05-bounded-file-retrieval.md","slug":"2026-09-05-bounded-file-retrieval","lifecycle":"implemented","cls":"feature","date":"2026-09-05","title":"先搜索定位，再分页读取文件","status":"implemented","rawBody":"# Agent Note: 先搜索定位，再分页读取文件\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n连续整文件读取会把大量无关文本带入上下文。文件变长后，模型既难以定位目标，也可能把截断后的片段误当成完整文件去改写。\n\n## Decision\n\nsearch_files 返回路径、行号和有限的命中行；read_file 接受从 1 开始的 offset/limit，并说明总行数、读取范围和是否到达末尾。工具说明引导先定位再精读，修改已有文件前读取原内容。\n\nread_file 默认最多返回 500 行，单次 limit 不超过 2000；底层仍整文件读取，默认大小上限为 5 MiB。搜索跳过大于 2 MiB 的文件、限制结果数，并将单条命中截至 160 字符。\n\nread_file 返回整文件 SHA-256，保留原始换行，拒绝二进制及无法无损解码的 UTF-8。write_file 只创建新文件，已有文件的修改归[安全增量编辑](2026-09-21-safe-incremental-editing.md)，该决定取代早期完整覆盖策略。工具接入遵循[注册表](../architecture/2026-08-31-tool-registry-boundary.md)，读取权限见[共享路径检查](../bug-fix/2026-09-06-shared-read-guards.md)。\n\n## Alternatives considered\n\n- 继续整文件返回：小文件时最直接，但定位和传输成本随文件长度增长。\n- 只靠搜索片段修改文件：消耗少，但单行命中缺少周围约束，不能替代修改前读取。\n- 只靠搜索片段构造通用 patch：调用紧凑，但缺少整文件版本证据；阶段 13 保留先读取再编辑的流程，把冲突协议放在独立编辑模块。\n\n## Consequences\n\n模型可以围绕行号补读；代价是分页不等于流式 IO，工具结果仍可能被[上下文截断](../architecture/2026-09-05-bounded-conversation-context.md)再次压缩。\n\n当前搜索不检测二进制内容，也不提供完整 glob 语法；阶段 13 已允许默认起点“.”并统一目录别名的真实敏感路径检查。\n\n## Verification\n\n日期依据：[1834e56](https://github.com/xilele777/mini-agent/commit/1834e56) 和 [fa29ece](https://github.com/xilele777/mini-agent/commit/fa29ece) 于 2026-09-05 引入分页与搜索，大小限制后续加入。当前依据：[fs.ts](../../../../src/tools/fs.ts)、[grep.ts](../../../../src/tools/grep.ts)。现有 fs 测试仅检查部分拒绝输入，不覆盖所有分页或搜索行为。\n","sections":[{"heading":"Problem","body":"连续整文件读取会把大量无关文本带入上下文。文件变长后，模型既难以定位目标，也可能把截断后的片段误当成完整文件去改写。","anchor":"section-0"},{"heading":"Decision","body":"search_files 返回路径、行号和有限的命中行；read_file 接受从 1 开始的 offset/limit，并说明总行数、读取范围和是否到达末尾。工具说明引导先定位再精读，修改已有文件前读取原内容。\n\nread_file 默认最多返回 500 行，单次 limit 不超过 2000；底层仍整文件读取，默认大小上限为 5 MiB。搜索跳过大于 2 MiB 的文件、限制结果数，并将单条命中截至 160 字符。\n\nread_file 返回整文件 SHA-256，保留原始换行，拒绝二进制及无法无损解码的 UTF-8。write_file 只创建新文件，已有文件的修改归[安全增量编辑](2026-09-21-safe-incremental-editing.md)，该决定取代早期完整覆盖策略。工具接入遵循[注册表](../architecture/2026-08-31-tool-registry-boundary.md)，读取权限见[共享路径检查](../bug-fix/2026-09-06-shared-read-guards.md)。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 继续整文件返回：小文件时最直接，但定位和传输成本随文件长度增长。\n- oop-guard-and-request-budget.md","slug":"2026-09-05-loop-guard-and-request-budget","lifecycle":"implemented","cls":"feature","date":"2026-09-05","title":"用请求上限和连续重复检测限制失控循环","status":"implemented","rawBody":"# Agent Note: 用请求上限和连续重复检测限制失控循环\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n模型可能重复发起没有新信息的调用，或在纯文本说明与内部继续提示之间反复切换。只依靠模型自己判断何时结束，无法为一次用户输入限定工作量。\n\n## Decision\n\n每次真实用户输入的主轮与摘要默认最多发起十次逻辑模型请求，内部继续提示后的请求也计入。主／子／摘要的实际传输及重试另外共享[全轮运行预算](../architecture/2026-09-22-runtime-resilience.md)，局部次数不能绕过总额。另记录本轮函数调用请求，连续三次工具名和原始参数字符串完全相同时，拦截当前调用并回填守卫说明；累计触发两次后结束本轮。\n\n记录的是请求，不只已成功执行的动作，因此参数错误、拒绝和守卫拦截的请求也会参与检测。守卫早于参数准备和批准执行；它不能替代[明确的完成与暂停出口](2026-09-11-explicit-turn-exits.md)。\n\n## Alternatives considered\n\n- 只设固定请求上限：能够最终停止，但同样动作可能在停止前重复执行很多次。\n- 只检测重复调用：能识别局部循环，但参数变化或纯文本复读仍可能无限继续。\n- 按语义相似度判重：可以捕捉更多重复，但也可能误伤合法探索，并需要定义额外的不确定阈值；当前采用可解释的逐字比较。\n\n## Consequences\n\n失控循环有明确的本轮停止条件，代价是阈值固定，合法重试也可能被拦。改变 JSON 空白、键顺序或穿插其他工具会绕开连续相同判据，不能称为完整循环证明。\n\n结束前仍需遵守[工具结果配对与历史恢复](../bug-fix/2026-09-06-tool-result-history-recovery.md)；提示模型换思路不能覆盖用户此前的拒绝。\n\n## Verification\n\n日期依据：[7b29af1](https://github.com/xilele777/mini-agent/commit/7b29af1) 于 2026-09-05 引入守卫，后续调整终止配对及请求出口。当前依据：[context.ts](../../../../src/context.ts)、[turn.ts](../../../../src/turn.ts) 和 [turn.test.ts](../../../../src/turn.test.ts)。五条判重测试覆盖阈值与参数变化；主轮测试覆盖累计两次命中、中断剩余调用及纯文本耗尽请求预算。\n","sections":[{"heading":"Problem","body":"模型可能重复发起没有新信息的调用，或在纯文本说明与内部继续提示之间反复切换。只依靠模型自己判断何时结束，无法为一次用户输入限定工作量。","anchor":"section-0"},{"heading":"Decision","body":"每次真实用户输入的主轮与摘要默认最多发起十次逻辑模型请求，内部继续提示后的请求也计入。主／子／摘要的实际传输及重试另外共享[全轮运行预算](../architecture/2026-09-22-runtime-resilience.md)，局部次数不能绕过总额。另记录本轮函数调用请求，连续三次工具名和原始参数字符串完全相同时，拦截当前调用并回填守卫说明；累计触发两次后结束本轮。\n\n记录的是请求，不只已成功执行的动作，因此参数错误、拒绝和守卫拦截的请求也会参与检测。守卫早于参数准备和批准执行；它不能替代[明确的完成与暂停出口](2026-09-11-explicit-turn-exits.md)。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 只设固定请求上限：能够最终停止，但同样动作可能在停止前重复执行很多次。\n- 只检测重复调用：能识别局部循环，但参数变化或纯文本复读仍可能无限继续。\n- 按语 n类型检查不能证明工具协议、文件边界和模型选择正确；真实模型用例又有成本和变化。学习项目需要能快速复查的确定性验证，并明确哪些结论只能由实际交互支持。\n\n## Decision\n\n项目使用 node:test、assert 和现有 tsx 执行确定性回归。纯函数、模拟流、临时文件与受控子进程分别验证协议、状态和副作用边界；当前文件集合以 package.json 的 npm test 为准，逐阶段证据汇总在 [内部评测记录](../../../learning/evaluation.md)。\n\n真实终端批准、todo 跨进程恢复、模型如何选择完成与暂停，通过具体手动用例记录。测试报告说明覆盖面，不把“全绿”扩写成全系统正确，也不以代码通过推断学习者已经掌握。\n\n优先保护[上下文边界](../architecture/2026-09-05-bounded-conversation-context.md)、[读取检查](../bug-fix/2026-09-06-shared-read-guards.md)和[真实用户轮](../architecture/2026-09-11-user-turn-boundaries.md)等可重复观察的行为。\n\n## Alternatives considered\n\n- 只靠手动运行：接近真实使用，但对每次小改动重做全部步骤成本较高，边界回归难以保持一致。\n- 只运行类型检查：反馈快，但类型正确的代码仍可错误裁剪历史、过早执行或拒绝错误路径。\n- 立即引入大型测试框架和全部端到端模拟：功能丰富，但当前已有依赖可验证关键纯逻辑；复杂设施应由具体测试需求驱动。\n\n## Consequences\n\n回归可在本地重复，代价是维护模拟流、临时项目和进程故障夹具。后续阶段已补会话并发、动作恢复、shell 中断与主循环同批结束配对等用例；当前真实模型、人工交互及平台限制按评测汇总单独列出。\n\n现有链接测试的夹具位于项目外，不能独立证明项目内 realpath 逃逸分支。请求中明确指示模型暂停的手动用例，也不能证明任意自然表述都有效。\n\n## Verification\n\n日期依据：[7b29af1](https://github.com/xilele777/mini-agent/commit/7b29af1) 于 2026-09-05 引入纯函数测试，后续提交扩展至二十一条。当前依据：[context.test.ts](../../../../src/context.test.ts)、[guard.test.ts](../../../../src/guard.test.ts)、[fs.test.ts](../../../../src/tools/fs.test.ts)。最近实际运行结果与学习证据见[进度](../../../learning/progress.md)。\n","sections":[{"heading":"Problem","body":"类型检查不能证明工具协议、文件边界和模型选择正确；真实模型用例又有成本和变化。学习项目需要能快速复查的确定性验证，并明确哪些结论只能由实际交互支持。","anchor":"section-0"},{"heading":"Decision","body":"项目使用 node:test、assert 和现有 tsx 执行确定性回归。纯函数、模拟流、临时文件与受控子进程分别验证协议、状态和副作用边界；当前文件集合以 package.json 的 npm test 为准，逐阶段证据汇总在 [内部评测记录](../../../learning/evaluation.md)。\n\n真实终端批准、todo 跨进程恢复、模型如何选择完成与暂停，通过具体手动用例记录。测试报告说明覆盖面，不把“全绿”扩写成全系统正确，也不以代码通过推断学习者已经掌握。\n\n优先保护[上下文边界](../architecture/2026-09-05-bounded-conversation-context.md)、[读取检查](../bug-fix/2026-09-06-shared-read-guards.md)和[真实用户轮](../architecture/2026-09-11-user-turn-boundaries.md)等可重复观察的行为。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 只靠手动运行：接近真实使用，但对每次小改动重做全部步骤成本较高，边界回归难以保持一致。\n- 只运行类型检查：反馈快，但类型正确的代码仍可错误裁剪历史、过早执行或拒绝错误路径。\n- 立即引入大型测试框架和全部端到端模拟：功能丰富，但当前已有依赖可验证关键纯逻辑；复杂设施应由具体测试需求驱动。","anchor":"section-2"},{"heading":"Consequences","body":"回归可在本地重复，代价是维护模拟流、临时项目和进程故障夹具。后续阶段已补会话并发、动作恢复、shell 中断与主循环同批结束配对等用例；当前真实模型、人工交互及平台限制按评测汇总单独列出。\n\n现有链接测试的夹具位于项目外，不能独立证明项目内 realpath 逃逸分支。请求中明确指示模型暂停的手动用例，也不能证明任意自然表述都有效。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[7b29af1](https://github.com/xilele777/mini-agent/commit/7b29af1) 于 2026-09-05 引入纯函数测试，后续提交扩展至二十一条。当前依据：[context.test.ts](../../../../src/context.test.ts)、[guard.test.ts](../../../../src/guard.test.ts)、[fs.test.ts](../../../../src/tools/fs.test.ts)。最近实际运行结果与学习证据见[进度](../../../learning/progress.md)。","anchor":"section-4"}],"problem":"类型检查不能证明工具协议、文件边界和模型选择正确；真实模型用例又有成本和变化。学习项目需要能快速复查的确定性验证，并明确哪些结论只能由实际交互支持。","decision":"项目使用 node:test、assert 和现有 tsx 执行确定性回归。纯函数、模拟流、临时文件与受控子进程分别验证协议、状态和副作用边界；当前文件集合以 package.json 的 npm test 为准，逐阶段证据汇总在 [内部评测记录](../../../learning/evaluation.md)。\n\n真实终端批准、todo 跨进程恢复、模型如何选择完成与暂停，通过具体手动用例记录。测试报告说明覆盖面，不把“全绿”扩写成全系统正确，也不以代码通过推断学习者已经掌握。\n\n优先保护[上下文边界](../architecture/2026-09-05-bounded-conversation-context.md)、[读取检查](../bug-fix/2026-09-06-shared-read-guards.md)和[真实用户轮](../architecture/2026-09-11-user-turn-boundaries.md)等可重复观察的行为。","alternatives":"- 只靠手动运行：接近真实使用，但对每次小改动重做全部步骤成本较高，边界回归难以保持一致。\n- 只运行类型检查：反馈快，但类型正确的代码仍可错误裁剪历史、过早执行或拒绝错误路径。\n- 立即引入大型测试框架和全部端到端模拟：功能丰富，但当前已有依赖可验证关键纯逻辑；复杂设施应由具体测试需求驱动。","consequences":"回归可在本地重复，代价是维护模拟流、临时项目和进程故障夹具。后续阶段已补会话并发、动作恢复、shell 中断与主循环同批结束配对等用例；当前真实模型、人工交互及平台限制按评测汇总单独列出。\n\n现有链接测试的夹具位于项目外，不能独立证明项目内 realpath 逃逸分支。请求中明确指示模型暂停的手动用例，也不能证明任意自然表述都有效。","outLinks":["implemented/architecture/2026-09-05-bounded-conversation-context.md","implemented/architecture/2026-09-11-user-turn-boundaries.md","implemented/bug-fix/2026-09-06-shared-read-guards.md"]},{"id":"implemented/architecture/2026-09-02-shared-terminal-input.md","sourcePath":"implemented/architecture/2026-09-02-shared-terminal-input.md","slug":"2026-09-02-shared-terminal-input","lifecycle":"implemented","cls":"architecture","date":"2026-09-02","title":"REPL、批准和提问共享一个终端输入实例","status":"implemented","rawBody":"# Agent Note: REPL、批准和提问共享一个终端输入实例\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\nREPL、操作批准和执行中提问都读取同一个 stdin。若每个模块各建一个 readline，输入可能被不同实例竞争消费，退出时也难以确定由谁释放资源。\n\n## Decision\n\nui.ts 懒初始化唯一的 readline 实例，并通过 ask 与 closeUI 暴露输入和关闭能力。导入模块本身不打开输入流；main 在 finally 统一关闭。\n\n输入流关闭时，ask 用 InputClosedError 拒绝等待，而不是留下未解决的 Promise 让进程直接退出。CLI 在 REPL 输入处捕获并正常收尾，确保会话锁释放；批准或工具提问处 EOF 沿用工具错误语义，不当作用户同意。[交付契约](../process/2026-09-22-cli-delivery.md)定义正常退出与取消的进程码。\n\nCtrl+C 经 CLI 生命周期信号中止当前等待并转为取消退出；轮内批准和 ask_user 接收本轮共享信号，包含[总时限](2026-09-22-runtime-resilience.md)。主轮保留已确认动作与结果不确定记录，不回退删除历史。批准框和 ask_user 都复用这个输入入口；[动作批准](../feature/2026-09-02-action-approval-scope.md)与[显式出口](../feature/2026-09-11-explicit-turn-exits.md)使用各自的控制语义。\n\n## Alternatives considered\n\n- 每个模块各建 readline：模块看似独立，但多个实例会共同监听同一输入流。\n- 把所有询问代码放在主循环：资源归属集中，但会把批准细节和提问工具的业务耦合到循环。\n- 只在正常 exit 路径 close：实现最少，但异常或 Ctrl+C 路径可能保留输入资源。\n\n## Consequences\n\n输入资源由统一模块管理，状态控制仍属于调用方。代价是当前交互按顺序等待，不能把共享 readline 当成多请求并发输入机制。\n\n关闭 UI 只释放终端资源，不撤销此前的工具副作用。需要并发交互或多个会话时必须重新设计输入归属。\n\n## Verification\n\n日期依据：[f8e6831](https://github.com/xilele777/mini-agent/commit/f8e6831) 于 2026-09-02 引入 ui.ts 和批准流程；ask_user 后续复用。当前依据：[ui.ts](../../../../src/ui.ts)、[agent.ts](../../../../src/agent.ts)、[turn.ts](../../../../src/turn.ts)、[approval.ts](../../../../src/approval.ts) 和 [control.ts](../../../../src/tools/control.ts)。已有交接包含 exit、quit 和 Ctrl+C 的手动记录；自动化测试不覆盖终端竞争。\n\n阶段 15 的 [cli.test.ts](../../../../src/cli.test.ts)实际启动子进程，等待 REPL 后关闭 stdin，再打开同一个会话验证锁已释放。阶段 14 的 run-control 测试覆盖 readline 等待取消；原生 Ctrl+C 交互仍保留人工验收。\n","sections":[{"heading":"Problem","body":"REPL、操作批准和执行中提问都读取同一个 stdin。若每个模块各建一个 readline，输入可能被不同实例竞争消费，退出时也难以确定由谁释放资源。","anchor":"section-0"},{"heading":"Decision","body":"ui.ts 懒初始化唯一的 readline 实例，并通过 ask 与 closeUI 暴露输入和关闭能力。导入模块本身不打开输入流；main 在 finally 统一关闭。\n\n输入流关闭时，ask 用 InputClosedError 拒绝等 -explicit-turn-exits.md)使用各自的控制语义。","alternatives":"- 每个模块各建 readline：模块看似独立，但多个实例会共同监听同一输入流。\n- 把所有询问代码放在主循环：资源归属集中，但会把批准细节和提问工具的业务耦合到循环。\n- 只在正常 exit 路径 close：实现最少，但异常或 Ctrl+C 路径可能保留输入资源。","consequences":"输入资源由统一模块管理，状态控制仍属于调用方。代价是当前交互按顺序等待，不能把共享 readline 当成多请求并发输入机制。\n\n关闭 UI 只释放终端资源，不撤销此前的工具副作用。需要并发交互或多个会话时必须重新设计输入归属。","outLinks":["implemented/architecture/2026-09-22-runtime-resilience.md","implemented/feature/2026-09-02-action-approval-scope.md","implemented/feature/2026-09-11-explicit-turn-exits.md","implemented/process/2026-09-22-cli-delivery.md"]},{"id":"implemented/feature/2026-09-02-action-approval-scope.md","sourcePath":"implemented/feature/2026-09-02-action-approval-scope.md","slug":"2026-09-02-action-approval-scope","lifecycle":"implemented","cls":"feature","date":"2026-09-02","title":"批准按具体动作记忆，权限范围限于当前进程","status":"implemented","rawBody":"# Agent Note: 批准按具体动作记忆，权限范围限于当前进程\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n允许某工具的一次操作，不足以允许它未来的任意参数。任意路径写入和 shell 可以影响用户文件，过宽或长期缓存会扩大一次有限批准的范围。\n\n## Decision\n\n批准缓存键由工具名、分隔符和校验后完整参数的 JSON 字符串组成。y 只允许本次，n 拒绝本次，a 在当前进程内记住相同键，重启后失效。\n\n阶段 13 的文件工具采用[候选批准](2026-09-21-safe-incremental-editing.md)：异步准备后绑定绝对路径、基准指纹和候选指纹，逐次 y/n 批准，禁用 a 缓存。shell 继续使用上述具体参数缓存。批准等待接收本轮 AbortSignal，取消后不执行；预览中的终端控制码转为可见转义。\n\n主循环依据 Tool.needsApproval 进入批准流程，先经[注册表](../architecture/2026-08-31-tool-registry-boundary.md)准备参数，再通过[共享终端](../architecture/2026-09-02-shared-terminal-input.md)取得决定，最后执行。拒绝也要回填调用结果，并告知模型不重试、不换工具绕过。\n\n批准看操作范围，不单看是否写盘：任意文件和 shell 需批准，路径固定且只维护自身草稿的 todo 不要求每次询问。\n\n## Alternatives considered\n\n- 按工具名记住允许：交互少，但允许 pwd 会连带覆盖其他 shell 命令。\n- 完全不缓存：权限语义直接，但重复相同动作会增加人工操作；当前采用有限的会话内复用。\n- 将批准写入磁盘：重启后方便，但项目环境和任务意图可能变化，旧批准不能证明新情境下仍合适。\n\n## Consequences\n\n用户可检查具体动作，代价是不同 JSON 属性顺序仍可能触发重复确认。即使参数相同，外部文件变化也可能改变操作结果，缓存不是效果保证。\n\nshell 显示完整命令；文件工具显示完整增删行，不再只预览前 20 行。拒绝后的停止要求仍不是程序强制的跨轮黑名单。\n\n## Verification\n\n日期依据：[f8e6831](https://github.com/xilele777/mini-agent/commit/f8e6831) 于 2026-09-02 引入批准。当前依据：[approval.ts](../../../../src/approval.ts)、[fs.ts](../../../../src/tools/fs.ts)、[bash.ts](../../../../src/tools/bash.ts)。验证需覆盖相同动作缓存、参数变化、重启与拒绝回填；现有自动化测试不替代这些交互用例。\n","sections":[{"heading":"Problem","body":"允许某工具的一次操作，不足以允许它未来的任意参数。任意路径写入和 shell 可以影响用户文件，过宽或长期缓存会扩大一次有限批准的范围。","anchor":"section-0"},{"heading":"Decision","body":"批准缓存键由工具名、分隔符和校验后完整参数的 JSON 字符串组成。y 只允许本次，n 拒绝本次，a 在当前进程内记住相同键，重启后失效。\n\n阶段 13 的文件工具采用[候选批准](2026-09-21-safe-incremental-editing.md)：异步准备后绑定绝对路径、基准指纹和候选指纹，逐次 y/n 批准，禁用 a 缓存。shell 继续使用上述具体参数缓存。批准等待接收本轮 AbortSignal，取消后不执行；预览中的终端控制码转为可见转义。\n\n主循环依据 Tool.needsApproval 进入批准流程，先经[注册表](../architecture/2026-08-31-tool-registry-boundary.md)准备参数，再通过[共享终端](../architecture/2026-09-02-shared-terminal-input.md)取得决定，最后执行。拒绝也要回填调用结果，并告知模型不重试、不换工具绕过。\n\n批准看操作范围，不单看是否写盘：任意文件和 shell 需批准，路径固定且只维护自身草稿的 todo 不要求每次询问。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 按工具名记住允许：交互少，但允许 pwd 会连带覆盖其他 shell 命令。\n- 完全不缓存：权限语义直接，但重复相同动作会增加人工操作；当前采用有限的会话内复用。\n- 将批准写入磁盘：重启后方便，但项目环境和任务意图可能变化，旧批准不能证明新情境下仍合适。","anchor":"section-2"},{"heading":"Consequences","body":"用户可检查具体动作，代价是不同 JSON 属性顺序仍可能触发重复确认。即使参数相同，外部文件变化也可能改变操作结果，缓存不是效果保证。\n\nshell 显示完整命令；文件工具显示完整增删行，不再只预览前 20 行。拒绝后的停止要求仍不是程序强制的跨轮黑名单。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[f8e6831](https://github.com/xilele777/mini-agent/commit/f8e6831) 于 2026-09-02 引入批准。当前依据：[approval.ts](../../../../src/approval.ts)、[fs.ts](../../../../src/tools/fs.ts)、[bash.ts](../../../../src/tools/bash.ts)。验证需覆盖相同动作缓存、参数变化、重启与拒绝回填；现有自动化测试不替代这些交互用例。","anchor":"section-4"}],"problem":"允许某工具的一次操作，不足以允许它未来的任意参数。任意路径写入和 shell 可以影响用户文件，过宽或长期缓存会扩大一次有限批准的范围。","decision":"批准缓存键由工具名、分隔符和校验后完整参数的 JSON 字符串组成。y 只允许本次，n 拒绝本次，a 在当前进程内记住相同键，重启后失效。\n\n阶段 13 的文件工具采用[候选批准](2026-09-21-safe-incremental-editing.md)：异步准备后绑定绝对路径、基准指纹和候选指纹，逐次 y/n 批准，禁用 a 缓存。shell 继续使用上述具体参数缓存。批准等待接收本轮 AbortSignal，取消后不执行；预览中的终端控制码转为可见转义。\n\n主循环依据 Tool.needsApproval 进入批准流程，先经[注册表](../architecture/2026-08-31-tool-registry-boundary.md)准备参数，再通过[共享终端](../architecture/2026-09-02-shared-terminal-input.md)取得决定，最后执行。拒绝也要回填调用结果，并告知模型不重试、不换工具绕过。\n\n批准看操作范围，不单看是否写盘：任意文件和 shell 需批准，路径固定且只维护自身草稿的 todo 不要求每次询问。","alternatives":"- 按工具名记住允许：交互少，但允许 pwd 会连带覆盖其他 shell 命令。\n- 完全不缓存：权限语义直接，但重复相同动作会增加人工操作；当前采用有限的会话内复用。\n- 将批准写入磁盘：重启后方便，但项目环境和任务意图可能变化，旧批准不能证明新情境下仍合适。","consequences":"用户可检查具体动作，代价是不同 JSON 属性顺序仍可能触发重复确认。即使参数相同，外部文件变化也可能改变操作结果，缓存不是效果保证。\n\nshell 显示完整命令；文件工具显示完整增删行，不再只预览前 20 行。拒绝后的停止要求仍不是程序强制的跨轮黑名单。","outLinks":["implemented/architecture/2026-08-31-tool-registry-boundary.md","implemented/architecture/2026-09-02-shared-terminal-input.md","implemented/feature/2026-09-21-safe-incremental-editing.md"]},{"id":"implemented/architecture/2026-08-31-native-function-calling.md","sourcePath":"implemented/architecture/2026-08-31-native-function-calling.md","slug":"2026-08-31-native-function-calling","lifecycle":"implemented","cls":"architecture","date":"2026-08-31","title":"用原生 Function Calling 承载动作协议","status":"implemented","rawBody":"# Agent Note: 用原生 Function Calling 承载动作协议\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n模型的自然语言回复可能夹带解释、改变格式或同时提出多个动作。把 Action 和参数藏在普通文本中，会让业务执行依赖文本正则是否恰好匹配。\n\n## Decision\n\n当前循环从响应的 tool_calls 读取函数名、参数字符串和调用 ID，并通过 tools 提供参数说明。assistant 响应先加入历史，每个调用随后获得带匹配 tool_call_id 的 tool 结果，再进入下一次请求。\n\n服务端返回结构不替代本地校验：参数仍需 JSON.parse 和 Zod 校验，未知工具也必须反馈错误。[工具注册表](2026-08-31-tool-registry-boundary.md)维护具体定义；调用失败或提前停止的配对要求由[历史恢复规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)落实。\n\n## Alternatives considered\n\n- 继续解析 Thought/Action 文本：能直观看到手写协议的工作过程，适合作为初始练习，但格式漂移会影响实际工具调用。\n- 相信原生参数无需校验：减少本地代码，但兼容服务、模型输出和工具业务约束仍可能不一致，非法参数不能直接进入执行。\n- 只把执行结果作为普通 assistant 文本追加：消息结构简单，但失去调用 ID 对应关系，不能满足当前工具调用协议。\n\n## Consequences\n\n动作协议与普通讲解分开，程序可以处理同一响应中的多个调用。代价是必须维护完整消息配对，并处理不支持的调用类型。\n\n当前工具调用按 for 循环逐个执行。同一响应提出多个动作，不等于程序已实现并行执行或事务。\n\n## Verification\n\n日期依据：[8f4f148](https://github.com/xilele777/mini-agent/commit/8f4f148) 于 2026-08-31 接入 tool_calls。当前实现见 [turn.ts](../../../../src/turn.ts)、[stream.ts](../../../../src/stream.ts) 与 [tools/index.ts](../../../../src/tools/index.ts)。2026-09-20 的普通计算与委派请求继续使用原生 tool_calls 完成真实模型验收。\n","sections":[{"heading":"Problem","body":"模型的自然语言回复可能夹带解释、改变格式或同时提出多个动作。把 Action 和参数藏在普通文本中，会让业务执行依赖文本正则是否恰好匹配。","anchor":"section-0"},{"heading":"Decision","body":"当前循环从响应的 tool_calls 读取函数名、参数字符串和调用 ID，并通过 tools 提供参数说明。assistant 响应先加入历史，每个调用随后获得带匹配 tool_call_id 的 tool 结果，再进入下一次请求。\n\n服务端返回结构不替代本地校验：参数仍需 JSON.parse 和 Zod 校验，未知工具也必须反馈错误。[工具注册表](2026-08-31-tool-registry-boundary.md)维护具体定义；调用失败或提前停止的配对要求由[历史恢复规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)落实。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 继续解析 Thought/Action 文本：能直观看到手写协议的工作过程，适合作为初始练习，但格式漂移会影响实际工具调用。\n- 相信原生参数无需校验：减少本地代码，但兼容服务、模型输出和工具业务约束仍可能不一致，非法参数不能直接进入执行。\n- 只把执行结果作为普通 assistant 文本追加：消息结构简单，但失去调用 ID 对应关系，不能满足当前工具调用协议。","anchor":"section-2"},{"heading":"Consequences","body":"动作协议与普通讲解分开，程序可以处理同一响应中的多个调用。代价是必须维护完整消息配对，并处理不支持的调用类型。\n\n当前工具调用按 for 循环逐个执行。同一响应提出多个动作，不等于程序已实现并行执行或事务。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[8f4f148](https://github.com/xilele777/mini-agent/commit/8f4f148) 于 2026-08-31 接入 tool_calls。当前实现见 [turn.ts](../../../../src/turn.ts)、[stream.ts](../../../../src/stream.ts) 与 [tools/index.ts](../../../../src/tools/index.ts)。2026-09-20 的普通计算与委派请求继续使用原生 tool_calls 完成真实模型验收。","anchor":"section-4"}],"problem":"模型的自然语言回复可能夹带解释、改变格式或同时提出多个动作。把 Action 和参数藏在普通文本中，会让业务执行依赖文本正则是否恰好匹配。","decision":"当前循环从响应的 tool_calls 读取函数名、参数字符串和调用 ID，并通过 tools 提供参数说明。assistant 响应先加入历史，每个调用随后获得带匹配 tool_call_id 的 tool 结果，再进入下一次请求。\n\n服务端返回结构不替代本地校验：参数仍需 JSON.parse 和 Zod 校验，未知工具也必须反馈错误。[工具注册表](2026-08-31-tool-registry-boundary.md)维护具体定义；调用失败或提前停止的配对要求由[历史恢复规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)落实。","alternatives":"- 继续解析 Thought/Action 文本：能直观看到手写协议的工作过程，适合作为初始练习，但格式漂移会影响实际工具调用。\n- 相信原生参数无需校验：减少本地代码，但兼容服务、模型输出和工具业务约束仍可能不一致，非法参数不能直接进入执行。\n- 只把执行结果作为普通 assistant 文本追加：消息结构简单，但失去调用 ID 对应关系，不能满足当前工具调用协议。","consequences":"动作协议与普通讲解分开，程序可以处理同一响应中的多个调用。代价是必须维护完整消息配对，并处理不支持的调用类型。\n\n当前工具调用按 for 循环逐个执行。同一响应提出多个动作，不等于程序已实现并行执行或事务。","outLinks":["implemented/architecture/2026-08-31-tool-registry-boundary.md","implemented/bug-fix/2026-09-06-tool-result-history-recovery.md"]},{"id":"implemented/architecture/2026-08-31-tool-registry-boundary.md","sourcePath":"implemented/architecture/2026-08-31-tool-registry-boundary.md","slug":"2026-08-31-tool-registry-boundary","lifecycle":"implemented","cls":"architecture","date":"2026-08-31","title":"统一工具注册表，让主循环只处理公共流程","status":"implemented","rawBody":"# Agent Note: 统一工具注册表，让主循环只处理公共流程\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n工具增多时，若主循环分别识别计算、文件、shell 和 todo，参数说明、批准和初始化逻辑会散布在各处分支中，新增工具容易改坏共同流程。\n\n## Decision\n\n主循环仅通过注册表取得工具 schema 和准备调用，再统一执行和记录结果，不导入具体工具。Tool 统一描述 name、description、schema、execute，以及可选的 needsApproval、preview、endsTurn、prepare 和 cacheApproval。execute 接收可选 ExecutionContext，传递共同 AbortSignal。\n\n`createToolRegistry(tools)` 从明确的 `Tool[]` 创建独立能力集合，并在建立时拒绝重复名称。同一个实例既生成模型可见的 function schema，也用 `prepareCall()` 完成查表、JSON 解析和 safeParse；未加入该实例的工具即使存在于程序中，也不能通过准备阶段。主轮直接执行以保留异常的不确定结果语义；只读子 Agent 继续通过公共 `executeCall()` 将普通错误回填为文本。\n\n阶段 13 的可选 Tool.prepare 在 schema 验证之后、批准之前异步生成 PreparedAction，包含 preview、approvalKey 和捕获候选的 execute 闭包；主轮无需识别具体文件工具。文件工具未准备时的直接 execute 拒绝操作，避免旧入口绕开候选协议。具体约束见[安全增量编辑](../feature/2026-09-21-safe-incremental-editing.md)。\n\n`tools/index.ts` 提供 `createMainRegistry()`，由 `runtime.ts` 传入带配置的读取、shell 与委派工具后创建主集合；主循环通过 options 接收注册表，不再依赖全局 `MAIN_REGISTRY` 或包装函数。可实例化注册表也为[同步只读子 Agent](../feature/2026-09-19-isolated-readonly-subagent.md)提供能力隔离基础，使不同 Agent 共用准备逻辑而不共享全部工具。配置归属见[启动接线](../../implemented/architecture/2026-09-21-validated-runtime-config.md)。\n\n这套结构建立在[原生调用协议](2026-08-31-native-function-calling.md)之上。initTools 汇集有状态工具的启动入口，但具体状态仍归工具模块所有。\n\n## Alternatives considered\n\n- 主循环直接 import 并分支调用：少量工具时直观，但每增加工具都会影响公共控制流程。\n- 仅维护名称到函数的 Map：映射更小，但 schema、批准预览和结束信号还需要其他分散约定。\n- 分别手写 JSON Schema 与校验代码：两边都能自由调整，但参数约束容易漂移；当前已有 Zod 4，可以复用其 toJSONSchema。\n\n## Consequences\n\n新增普通工具集中在工具模块和相应能力集合。主 Agent 与其他调用方可以复用准备逻辑而不共享全部工具；代价是每个能力集合都要显式维护成员，新增工具不会自动出现在所有 Agent 中。\n\n工具定义的类型检查不等于任意工具配对都具有静态证明；注册表保留通用 Tool 类型，运行时 schema 仍是执行边界。返回类型限定为 function 工具，但 `executeCall` 的错误转换也不涵盖全部启动或主循环异常。\n\n## Verification\n\n日期依据：[1c9e090](https://github.com/xilele777/mini-agent/commit/1c9e090) 于 2026-08-31 抽取接口与注册表；批准拆分和 initTools 属于后续维护。当前依据：[types.ts](../../../../src/tools/types.ts)、[registry.ts](../../../../src/tools/registry.ts)、[index.ts](../../../../src/tools/index.ts)、[registry.test.ts](../../../../src/tools/registry.test.ts) 和 [turn.ts](../../../../src/turn.ts)。2026-09-20 的当前工作区运行 `npm run typecheck` 通过，`npm test` 五十二条通过；其中四条注册表测试覆盖显式 schema、参数准备、未授权工具拒绝及重复名称。完整批准链路仍按既有人工交互证据理解。\n","sections":[{"heading":"Problem","body":"工具增多时，若主循环分别识别计算、文件、shell 和 todo，参数说明、批准和初始化逻辑会散布在各处分支中，新增工具容易改坏共同流程。","anchor":"section-0"},{"heading":"Decision","body":"主循环仅通过注册表取得工具 schema 和准备调用，再统一执行和记录结果，不导入具体工具。Tool 统一描述 name、description、schema、execute，以及可选的 needsApproval、preview、endsTurn、prepare 和 cacheApproval。execute 接收可选 ExecutionContext，传递共同 AbortSignal。\n\n`createToolRegistry(tools)` 从明确的 `Tool[]` 创建独立能力集合，并在建立时拒绝重复名称。同一个实例既生成模型可见的 function schema，也用 `prepareCall()` 完成查表、JSON 解析和 safeParse；未加入该实例的工具即使存在于程序中，也不能通过准备阶段。主轮直接执行以保留异常的不确定结果语义；只读子 Agent 继续通过公共 `executeCall()` 将普通错误回填为文本。\n\n阶段 13 的可选 Tool.prepare 在 schema 验证之后、批准之前异步生成 PreparedAction，包含 preview、approvalKey 和捕获候选的 execute 闭包；主轮无需识别具体文件工具。文件工具未准备时的直接 execute 拒绝操作，避免旧入口绕开候选协议。具体约束见[安全增量编辑](../feature/2026-09-21-safe-incremental-editing.md)。\n\n`tools/index.ts` 提供 `createMainRegistry()`，由 `runtime.ts` 传入带配置的读取、shell 与委派工具后创建主集合；主循环通过 options 接收注册表，不再依赖全局 `MAIN_REGISTRY` 或包装函数。可实例化注册表也为[同步只读子 Agent](../feature/2026-09-19-isolated-readonly-subagent.md)提供能力隔离基础，使不同 Agent 共用准备逻辑而不共享全部工具。配置归属见[启动接线](../../implemented/architecture/2026-09-21-validated-runtime-config.md)。\n\n这套结构建立在[原生调用协议](2026-08-31-native-function-calling.md)之上。initTools 汇集有状态工具的启动入口，但具体状态仍归工具模块所有。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 主循环直接 import 并分支调用：少量工具时直观，但每增加工具都会影响公共控制流程。\n- 仅维护名称到函数的 Map：映射更小，但 schema、批准预览和结束信号还需要其他分散约定。\n- 分别手写 JSON Schema 与校验代码：两边都能自由调整，但参数约束容易漂移；当前已有 Zod 4，可以复用其 toJSONSchema。","anchor":"section-2"},{"heading":"Consequences","body":"新增普通工具集中在工具模块和相应能力集合。主 Agent 与其他调用方可以复用准备逻辑而不共享全部工具；代价是每个能力集合都要显式维护成员，新增工具不会自动出现在所有 Agent 中。\n\n工具定义的类型检查不等于任意工具配对都具有静态证明；注册表保留通用 Tool 类型，运行时 schema 仍是执行边界。返回类型限定为 function 工具，但 `executeCall` 的错误转换也不涵盖全部启动或主循环异常。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[1c9e090](https://github.com/xilele777/mini-agent/commit/1c9e090) 于 2026-08-31 抽取接口与注册表；批准拆分和 initTools 属于后续维护。当前依据：[types.ts](../../../../src/tools/types.ts)、[registry.ts](../../../../src/tools/registry.ts)、[index.ts](../../../../src/tools/index.ts)、[registry.test.ts](../../../../src/tools/registry.test.ts) 和 [turn.ts](../../../../src/turn.ts)。2026-09-20 的当前工作区运行 `npm run typecheck` 通过，`npm test` 五十二条通过；其中四条注册表测试覆盖显式 schema、参数准备、未授权工具拒绝及重复名称。完整批准链路仍按既有人工交互证据理解。","anchor":"section-4"}],"problem":"工具增多时，若主循环分别识别计算、文件、shell 和 todo，参数说明、批准和初始化逻辑会散布在各处分支中，新增工具容易改坏共同流程。","decision":"主循环仅通过注册表取得工具 schema 和准备调用，再统一执行和记录结果，不导入具体工具。Tool 统一描述 name、description、schema、execute，以及可选的 needsApproval、preview、endsTurn、prepare 和 cacheApproval。execute 接收可选 ExecutionContext，传递共同 AbortSignal。\n\n`createToolRegistry(tools)` 从明确的 `Tool[]` 创建独立能力集合，并在建立时拒绝重复名称。同一个实例既生成模型可见的 function schema，也用 `prepareCall()` 完成查表、JSON 解析和 safeParse；未加入该实例的工具即使存在于程序中，也不能通过准备阶段。主轮直接执行以保留异常的不确定结果语义；只读子 Agent 继续通过公共 `executeCall()` 将普通错误回填为文本。\n\n阶段 13 的可选 Tool.prepare 在 schema 验证之后、批准之前异步生成 PreparedAction，包含 preview、approvalKey 和捕获候选的 execute 闭包；主轮无需识别具体文件工具。文件工具未准备时的直接 execute 拒绝操作，避免旧入口绕开候选协议。具体约束见[安全增量编辑](../feature/2026-09-21-safe-incremental-editing.md)。\n\n`tools/index.ts` 提供 `createMainRegistry()`，由 `runtime.ts` 传入带配置的读取、shell 与委派工具后创建主集合；主循环通过 options 接收注册表，不再依赖全局 `MAIN_REGISTRY` 或包装函数。可实例化注册表也为[同步只读子 Agent](../feature/2026-09-19-isolated-readonly-subagent.md)提供能力隔离基础，使不同 Agent 共用准备逻辑而不共享全部工具。配置归属见[启动接线](../../implemented/architecture/2026-09-21-validated-runtime-config.md)。\n\n这套结构建立在[原生调用协议](2026-08-31-native-function-calling.md)之上。initTools 汇集有状态工具的启动入口，但具体状态仍归工具模块所有。","alternatives":"- 主循环直接 import 并分支调用：少量工具时直观，但每增加工具都会影响公共控制流程。\n- 仅维护名称到函数的 Map：映射更小，但 schema、批准预览和结束信号还需要其他分散约定。\n- 分别手写 JSON Schema 与校验代码：两边都能自由调整，但参数约束容易漂移；当前已有 Zod 4，可以复用其 toJSONSchema。","consequences":"新增普通工具集中在工具模块和相应能力集合。主 Agent 与其他调用方可以复用准备逻辑而不共享全部工具；代价是每个能力集合都要显式维护成员，新增工具不会自动出现在所有 Agent 中。\n\n工具定义的类型检查不等于任意工具配对都具有静态证明；注册表保留通用 Tool 类型，运行时 schema 仍是执行边界。返回类型限定为 function 工具，但 `executeCall` 的错误转换也不涵盖全部启动或主循环异常。","outLinks":["implemented/architecture/2026-08-31-native-function-calling.md","implemented/architecture/2026-09-21-validated-runtime-config.md","implemented/feature/2026-09-19-isolated-readonly-subagent.md","implemented/feature/2026-09-21-safe-incremental-editing.md"]},{"id":"implemented/simplification/2026-08-31-remove-handwritten-react-parser.md","sourcePath":"implemented/simplification/2026-08-31-remove-handwritten-react-parser.md","slug":"2026-08-31-remove-handwritten-react-parser","lifecycle":"implemented","cls":"simplification","date":"2026-08-31","title":"删除手写 ReAct 解析器，实验保留在 Git 历史","status":"implemented","rawBody":"# Agent Note: 删除手写 ReAct 解析器，实验保留在 Git 历史\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n手写 Action 解析器完成了初始教学目标后，当前入口使用另一套调用协议。继续保留无人引用的协议文件，会让接手者误以为仍需维护两套有效机制。\n\n## Decision\n\n当前源码只保留正在使用的原生工具调用路径。阶段 1 的 protocol.ts、parse 和 ParseResult 从工作树删除，早期实验可以通过 Git 取回。\n\n工具使用说明放在各工具 description 中；system prompt 承担工作目录、批准语义和本轮目标等跨工具要求。这个取舍依赖[原生 Function Calling](../architecture/2026-08-31-native-function-calling.md)和[注册表](../architecture/2026-08-31-tool-registry-boundary.md)已经成为当前执行路径。\n\n## Alternatives considered\n\n- 原样保留旧文件作参考：离线阅读方便，但无人调用的实现容易被误当成当前约束。\n- 同时维护文本协议与原生协议：能兼容没有工具调用能力的模型，但会增加测试和行为分歧，当前没有这一支持目标。\n- 在 system prompt 中重复所有工具纪律：集中可见，但会形成两份需同步的说明；跨工具约束仍有必要保留。\n\n## Consequences\n\n运行时协议与当前代码保持一致，代价是阅读阶段 1 需要访问 Git 历史。此次删除不能推广成“所有演示文件都应删除”：index.ts 仍是可独立运行的 API 演示。\n\n若未来确实需要文本协议兼容，应作为新能力说明支持范围和验证方式，不直接恢复旧解析器。\n\n## Verification\n\n日期依据：[2b048d0](https://github.com/xilele777/mini-agent/commit/2b048d0) 于 2026-08-31 删除 protocol.ts；原实验见 [eeee5c5](https://github.com/xilele777/mini-agent/commit/eeee5c5)。提交记录中的单次输出一致只证明该实验，不代表所有提示词删减都保持模型行为不变。\n","sections":[{"heading":"Problem","body":"手写 Action 解析器完成了初始教学目标后，当前入口使用另一套调用协议。继续保留无人引用的协议文件，会让接手者误以为仍需维护两套有效机制。","anchor":"section-0"},{"heading":"Decision","body":"当前源码只保留正在使用的原生工具调用路径。阶段 1 的 protocol.ts、parse 和 ParseResult 从工作树删除，早期实验可以通过 Git 取回。\n\n工具使用说明放在各工具 description 中；system prompt 承担工作目录、批准语义和本轮目标等跨工具要求。这个取舍依赖[原生 Function Calling](../architecture/2026-08-31-native-function-calling.md)和[注册表](../architecture/2026-08-31-tool-registry-boundary.md)已经成为当前执行路径。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 原样保留旧文件作参考：离线阅读方便，但无人调用的实现容易被误当成当前约束。\n- 同时维护文本协议与原生协议：能兼容没有工具调用能力的模型，但会增加测试和行为分歧，当前没有这一支持目标。\n- 在 system prompt 中重复所有工具纪律：集中可见，但会形成两份需同步的说明；跨工具约束仍有必要保留。","anchor":"section-2"},{"heading":"Consequences","body":"运行时协议与当前代码保持一致，代价是阅读阶段 1 需要访问 Git 历史。此次删除不能推广成“所有演示文件都应删除”：index.ts 仍是可独立运行的 API 演示。\n\n若未来确实需要文本协议兼容，应作为新能力说明支持范围和验证方式，不直接恢复旧解析器。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[2b048d0](https://github.com/xilele777/mini-agent/commit/2b048d0) 于 2026-08-31 删除 protocol.ts；原实验见 [eeee5c5](https://github.com/xilele777/mini-agent/commit/eeee5c5)。提交记录中的单次输出一致只证明该实验，不代表所有提示词删减都保持模型行为不变。","anchor":"section-4"}],"problem":"手写 Action 解析器完成了初始教学目标后，当前入口使用另一套调用协议。继续保留无人引用的协议文件，会让接手者误以为仍需维护两套有效机制。","decision":"当前源码只保留正在使用的原生工具调用路径。阶段 1 的 protocol.ts、parse 和 ParseResult 从工作树删除，早期实验可以通过 Git 取回。\n\n工具使用说明放在各工具 description 中；system prompt 承担工作目录、批准语义和本轮目标等跨工具要求。这个取舍依赖[原生 Function Calling](../architecture/2026-08-31-native-function-calling.md)和[注册表](../architecture/2026-08-31-tool-registry-boundary.md)已经成为当前执行路径。","alternatives":"- 原样保留旧文件作参考：离线阅读方便，但无人调用的实现容易被误当成当前约束。\n- 同时维护文本协议与原生协议：能兼容没有工具调用能力的模型，但会增加测试和行为分歧，当前没有这一支持目标。\n- 在 system prompt 中重复所有工具纪律：集中可见，但会形成两份需同步的说明；跨工具约束仍有必要保留。","consequences":"运行时协议与当前代码保持一致，代价是阅读阶段 1 需要访问 Git 历史。此次删除不能推广成“所有演示文件都应删除”：index.ts 仍是可独立运行的 API 演示。\n\n若未来确实需要文本协议兼容，应作为新能力说明支持范围和验证方式，不直接恢复旧解析器。","outLinks":["implemented/architecture/2026-08-31-native-function-calling.md","implemented/architecture/2026-08-31-tool-registry-boundary.md"]},{"id":"implemented/architecture/2026-08-30-local-cli-and-sdk.md","sourcePath":"implemented/architecture/2026-08-30-local-cli-and-sdk.md","slug":"2026-08-30-local-cli-and-sdk","lifecycle":"implemented","cls":"architecture","date":"2026-08-30","title":"用本地 CLI 与直接模型调用学习 Agent 内核","status":"implemented","rawBody":"# Agent Note: 用本地 CLI 与直接模型调用学习 Agent 内核\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n学习目标是亲自理解“发送上下文、接收动作、执行工具、回填结果”的过程。若入口同时承担网页、服务部署和框架配置，排错时很难区分模型协议、程序逻辑与周边设施的问题。\n\n## Decision\n\n项目使用 TypeScript、OpenAI-compatible 客户端和本地终端，直接实现 Agent 主循环。模型负责提出调用，本地程序负责校验与执行；运行入口是 agent.ts，index.ts 保留为独立 API 演示。\n\nCLI 从环境加载配置，经 config.ts 校验，由 runtime.ts 组装模型流与工具集合；llm.ts 只消费显式配置。当前边界见[配置与启动诊断](../../implemented/architecture/2026-09-21-validated-runtime-config.md)。主循环通过独立组装器接收[流式模型响应](../feature/2026-09-13-streamed-model-response.md)，工具仍只在完整调用通过校验和必要批准后执行；[同步只读子 Agent](../feature/2026-09-19-isolated-readonly-subagent.md)通过普通工具结果回到同一主循环。功能逐阶段进入，具体协作方法由[独立教练工作流](../process/2026-09-11-learning-workflow-and-notes.md)管理。\n\n## Alternatives considered\n\n- 直接采用 Agent 框架：能复用编排和集成能力，但会隐藏本项目要学习的消息、工具和循环机制；有明确复用需求后再评估。\n- 先做网页应用：能提供更丰富的交互，但会增加前后端和部署问题，本阶段终端已能承载输入、批准与结果。\n- 停留在单次 API 演示：验证连接最简单，但不能观察工具结果如何驱动后续动作，因此保留演示并以 CLI 承载后续练习。\n\n## Consequences\n\n当前依赖规模小，主循环与协议细节可直接阅读；代价是错误处理、上下文管理和终端生命周期都需要自行实现。生产入口的模型名和 shell 由环境配置提供，兼容服务的协议能力仍需 doctor 验证，不能把“兼容接口”理解成所有服务无需适配。index.ts 仍是保留旧配置方式的独立教学演示。\n\n后续能力是否加入，以学习目标和可验证的问题为依据；目录中没有对应实现的方向不标为已完成。\n\n## Verification\n\n日期依据：[3db813f](https://github.com/xilele777/mini-agent/commit/3db813f) 于 2026-08-30 建立最小客户端，CLI 与工具链由后续提交演进。当前依据：[package.json](../../../../package.json)、[llm.ts](../../../../src/llm.ts)、[agent.ts](../../../../src/agent.ts) 和 [turn.ts](../../../../src/turn.ts)。历史学习设计只提供背景，技术版本以当前文件为准。\n","sections":[{"heading":"Problem","body":"学习目标是亲自理解“发送上下文、接收动作、执行工具、回填结果”的过程。若入口同时承担网页、服务部署和框架配置，排错时很难区分模型协议、程序逻辑与周边设施的问题。","anchor":"section-0"},{"heading":"Decision","body":"项目使用 TypeScript、OpenAI-compatible 客户端和本地终端，直接实现 Agent 主循环。模型负责提出调用，本地程序负责校验与执行；运行入口是 agent.ts，index.ts 保留为独立 API 演示。\n\nCLI 从环境加载配置，经 config.ts 校验，由 runtime.ts 组装模型流与工具集合；llm.ts 只消费显式配置。当前边界见[配置与启动诊断](../../implemented/architecture/2026-09-21-validated-runtime-config.md)。主循环通过独立组装器接收[流式模型响应](../feature/2026-09-13-streamed-model-response.md)，工具仍只在完整调用通过校验和必要批准后执行；[同步只读子 Agent](../feature/2026-09-19-isolated-readonly-subagent.md)通过普通工具结果回到同一主循环。功能逐阶段进入，具体协作方法由[独立教练工作流](../process/2026-09-11-learning-workflow-and-notes.md)管理。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 直接采用 Agent 框架：能复用编排和集成能力，但会隐藏本项目要学习的消息、工具和循环机制；有明确复用需求后再评估。\n- 先做网页应用：能提供更丰富的交互，但会增加前后端和部署问题，本阶段终端已能承载输入、批准与结果。\n- 停留在单次 API 演示：验证连接最简单，但不能观察工具结果如何驱动后续动作，因此保留演示并以 CLI 承载后续练习。","anchor":"section-2"},{"heading":"Consequences","body":"当前依赖规模小，主循环与协议细节可直接阅读；代价是错误处理、上下文管理和终端生命周期都需要自行实现。生产入口的模型名和 shell 由环境配置提供，兼容服务的协议能力仍需 doctor 验证，不能把“兼容接口”理解成所有服务无需适配。index.ts 仍是保留旧配置方式的独立教学演示。\n\n后续能力是否加入，以学习目标和可验证的问题为依据；目录中没有对应实现的方向不标为已完成。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[3db813f](https://github.com/xilele777/mini-agent/commit/3db813f) 于 2026-08-30 建立最小客户端，CLI 与工具链由后续提交演进。当前依据：[package.json](../../../../package.json)、[llm.ts](../../../../src/llm.ts)、[agent.ts](../../../../src/agent.ts) 和 [turn.ts](../../../../src/turn.ts)。历史学习设计只提供背景，技术版本以当前文件为准。","anchor":"section-4"}],"problem":"学习目标是亲自理解“发送上下文、接收动作、执行工具、回填结果”的过程。若入口同时承担网页、服务部署和框架配置，排错时很难区分模型协议、程序逻辑与周边设施的问题。","decision":"项目使用 TypeScript、OpenAI-compatib
