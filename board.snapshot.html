<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="查看项目运行流程、当前开发重点与设计依据。">
  <title>mini-agent · 项目地图</title>
  <style>:root {
  --canvas: #f7f8f6;
  --paper: #ffffff;
  --text: #222b3a;
  --muted: #596577;
  --quiet: #687386;
  --line: #e0e4eb;
  --accent: #26745f;
  --accent-soft: #eaf4ef;
  --hover: #f2f7f4;
  --architecture: #557cba;
  --feature: #42856b;
  --bug-fix: #b87448;
  --simplification: #97803d;
  --process: #8770ab;
  --testing: #4e8794;
  --radius: 12px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.65;
  color: var(--text);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); }
button, input, select { font: inherit; color: inherit; }
button, a, input, select { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; opacity: .45; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { font-weight: 650; }
button, input, select { border-radius: 6px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid #7295e8;
  outline-offset: 3px;
}
[hidden] { display: none !important; }
.icon {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: middle;
  flex-shrink: 0;
}
.icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: fixed;
  left: 20px;
  top: -80px;
  background: var(--accent);
  color: white;
  padding: 10px 18px;
  z-index: 100;
}
.skip-link:focus { top: 12px; }

.brand-mark {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.brand-mark .icon { width: 23px; height: 23px; }
.status-dot { height: 7px; width: 7px; flex-shrink: 0; border-radius: 50%; background: #909cad; }
.status-dot.live { background: #328263; }
.status-dot.error { background: #bd8139; }
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 13px;
  border: 1px solid #ced6e3;
  background: white;
  min-height: 39px;
  font-size: 14px;
  font-weight: 500;
}
.button:hover { background: var(--hover); border-color: #97aed7; }
.button-primary { background: var(--accent); border-color: var(--accent); color: white; padding: 11px 20px; }
.button-primary:hover { background: #205f4e; border-color: #205f4e; }
.icon-button { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.icon-button:hover { background: var(--hover); }
.text-button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 0; color: var(--accent); font-size: 14px; white-space: nowrap; }
.text-button:hover { text-decoration: underline; text-underline-offset: 4px; }

/* One shared horizontal navigation for every view. */
.workspace { height: 100dvh; display: flex; flex-direction: column; min-width: 0; }
.topbar { min-height: 70px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 max(28px, calc((100vw - 1500px) / 2)); border-bottom: 1px solid var(--line); background: var(--paper); }
.topbar-brand { display: flex; align-items: center; gap: 10px; font-size: 17px; white-space: nowrap; min-width: 0; }
.topbar-brand strong { overflow: hidden; text-overflow: ellipsis; }
.topbar-brand .brand-mark { width: 33px; height: 33px; border-radius: 9px; }
.topbar-brand .brand-mark .icon { width: 22px; height: 22px; }
.workspace-tabs { display: flex; align-items: stretch; align-self: stretch; gap: 26px; margin-right: auto; }
.workspace-tabs a { display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--muted); font-size: 14px; white-space: nowrap; min-height: 44px; }
.workspace-tabs a:hover { color: var(--accent); }
.workspace-tabs a.active { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.search-box { display: flex; align-items: center; gap: 9px; min-width: 150px; flex: 0 1 245px; margin-left: auto; border: 1px solid var(--line); border-radius: 7px; background: #fafbf9; padding: 8px 11px; color: var(--quiet); }
.search-box:focus-within { border-color: #6ba58b; box-shadow: 0 0 0 3px #eaf4ef; }
.search-box input { min-width: 0; width: 100%; outline: none; border: 0; background: transparent; font-size: 14px; padding: 0; }
.search-box input::placeholder { color: var(--quiet); }
.search-box kbd { font-family: inherit; font-size: 12px; border: 1px solid #dce2ec; border-radius: 3px; width: 20px; line-height: 22px; text-align: center; background: white; }
.connection-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.connection-status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--quiet); white-space: nowrap; }
#connect-button { font-size: 13px; min-height: 36px; }
.main-scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; scrollbar-gutter: stable; outline: none; overscroll-behavior: contain; }
.page-content { max-width: 1500px; margin: auto; padding: 27px 28px 32px; }
#page-title:focus, #map-detail-title:focus, #reader-title:focus { outline: none; }

/* Overview: decisions grouped by the actual parts of the project. */
.overview-summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 20px; padding: 0 0 13px; border-bottom: 1px solid var(--line); }
.overview-summary > p { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
.overview-summary > p strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.overview-summary > p > span { color: #a3adbd; margin: 0 7px; }
.overview-statuses { display: flex; gap: 8px; flex-wrap: wrap; }
.overview-controls { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
.excerpt-toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--accent); background: var(--paper); border: 1px solid #d5dfee; padding: 6px 10px; }
.excerpt-toggle .icon { width: 15px; height: 15px; }
.excerpt-toggle:hover { background: var(--accent-soft); }
.status-filter-button { display: flex; align-items: center; gap: 7px; font-size: 13px; padding: 3px 5px; color: var(--muted); }
.status-filter-button:hover { background: #e8edf6; }
.module-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
.module-grid.show-excerpts { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.module-card { display: flex; flex-direction: column; min-width: 0; background: var(--paper); border: 1px solid #dbe1eb; border-radius: var(--radius); overflow: hidden; box-shadow: 0 2px 3px #29354b03; }
.module-card-heading { display: flex; gap: 10px; align-items: flex-start; padding: 20px 18px 17px; border-bottom: 1px solid var(--line); background: #fcfdff; }
.module-number { display: grid; place-items: center; flex-shrink: 0; width: 34px; height: 34px; margin-top: 1px; background: #edf2fc; color: var(--accent); border: 1px solid #e0e8f8; border-radius: 8px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.module-card-heading > div { flex: 1; min-width: 0; }
.module-card-heading h2 { font-size: 18px; line-height: 1.5; }
.module-card-heading h2 button { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; font-weight: inherit; padding: 0; }
.module-card-heading h2 button:hover { color: var(--accent); }
.module-card-heading h2 .icon { width: 17px; height: 17px; color: var(--quiet); margin-left: 12px; }
.module-decisions { flex: 1; }
.module-decision { display: block; width: 100%; text-align: left; padding: 13px 18px; border-bottom: 1px solid #e9edf3; border-radius: 0; }
.module-decision:last-child { border-bottom: 0; }
.module-decision:hover { background: var(--hover); }
.module-decision:hover h3 { color: var(--accent); }
.module-decision-title { display: flex; align-items: flex-start; gap: 8px; justify-content: space-between; }
.module-decision-title h3 { font-size: 14px; font-weight: 500; line-height: 1.7; }
.module-decision-title .status-badge { margin-top: 1px; }
.module-decision > p { display: none; color: var(--muted); font-size: 14px; line-height: 1.8; margin-top: 7px; overflow-wrap: anywhere; }
.show-excerpts .module-decision { padding: 17px 22px; }
.show-excerpts .module-decision > p { display: block; }
.show-excerpts .module-decision-title h3 { font-size: 15px; font-weight: 600; }
.module-links { padding: 11px 18px 14px; border-top: 1px solid var(--line); background: #fcfdff; font-size: 12px; }
.module-links > span { display: flex; align-items: center; gap: 5px; color: var(--quiet); margin-bottom: 7px; }
.module-links .icon { width: 13px; height: 13px; }
.module-links > div { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 9px; }
.module-links button { padding: 2px 7px; background: #f0f3f9; color: #4f6489; font-size: 12px; }
.module-links button:hover { background: var(--accent-soft); color: var(--accent); }

/* Note metadata, full collections and filters. */
.row-meta { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--quiet); margin-bottom: 9px; flex-wrap: wrap; }
.class-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.category-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--category); flex-shrink: 0; }
.group-tag { color: #586c91; }
.status-badge { font-size: 11px; font-weight: 500; border-radius: 4px; padding: 2px 6px; line-height: 1.65; background: #edf5f0; color: #367154; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
.status-badge::before { content: ""; width: 4px; height: 4px; background: currentColor; border-radius: 50%; }
.status-badge.proposed { background: #fbf2dc; color: #886513; }
.status-badge.rejected { background: #faeeeb; color: #9c5044; }
.status-badge.archived { background: #eef0f3; color: #5f6978; }
.collection-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 0 17px; margin-bottom: 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.collection-options { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.filter-controls { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
select { background: white; border: 1px solid #d8dfeb; color: var(--muted); padding: 8px 26px 8px 11px; font-size: 13px; cursor: pointer; max-width: 100%; min-height: 38px; }
.sort-control select { background: transparent; border-color: transparent; }
.results-summary { color: var(--muted); font-size: 12px; white-space: nowrap; }
.decision-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.decision-row { display: flex; flex-direction: column; gap: 18px; min-width: 0; text-align: left; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.decision-row:hover { background: var(--hover); border-color: #9dbcaa; }
.decision-row:hover h2 { color: var(--accent); }
.decision-row h2 { font-size: 17px; line-height: 1.65; font-weight: 600; margin-bottom: 9px; }
.decision-row p { font-size: 14px; color: var(--muted); line-height: 1.8; margin-bottom: 16px; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.decision-row .row-meta { margin: 0; gap: 6px 9px; }
.decision-side { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: auto; padding-top: 12px; border-top: 1px solid #edf0ed; font-size: 12px; color: var(--quiet); }
.decision-side .icon { width: 16px; height: 16px; }
.month-filters { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }
.month-filters button { border: 1px solid var(--line); padding: 5px 12px; font-size: 13px; color: var(--muted); background: var(--paper); }
.month-filters button.active { background: var(--accent-soft); border-color: #c4d3f3; color: var(--accent); }
.timeline-group { display: grid; grid-template-columns: 100px minmax(0,1fr); gap: 24px; margin-top: 26px; }
.timeline-label { font-size: 15px; font-weight: 600; padding-top: 16px; }
.timeline-label small { display: block; font-size: 12px; color: var(--quiet); font-weight: 400; margin-top: 5px; }
.timeline-items { padding-left: 24px; border-left: 1px solid #cfd9eb; }
.timeline-card { display: block; width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 21px 24px; text-align: left; margin: 0 0 16px; position: relative; }
.timeline-card::before { content: ""; position: absolute; left: -29px; top: 25px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--canvas); background: #7898d3; }
.timeline-card:hover { border-color: #a9bde1; }
.timeline-card h3 { font-size: 17px; font-weight: 600; line-height: 1.6; }
.timeline-card p { color: var(--muted); font-size: 14px; margin-top: 8px; line-height: 1.8; overflow-wrap: anywhere; }
.alternatives-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 22px; align-items: start; }
.alternative-group { border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); padding: 24px; min-width: 0; }
.alternative-group .alternative-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 0; font-size: 17px; line-height: 1.7; font-weight: 600; margin: 9px 0 19px; }
.alternative-heading .icon { margin-top: 5px; width: 16px; height: 16px; }
.alternative-heading:hover { color: var(--accent); }
.alternative-option { border-top: 1px solid #e8edf4; padding: 16px 0; overflow-wrap: anywhere; }
.alternative-option:last-child { padding-bottom: 0; }
.alternative-option h3 { font-size: 14px; line-height: 1.8; font-weight: 600; display: flex; gap: 8px; }
.option-number { color: var(--quiet); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; flex-shrink: 0; }
.alternative-option p { color: var(--muted); font-size: 14px; line-height: 1.9; margin-top: 6px; padding-left: 24px; }
.alternative-option a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* A centered, modal reading surface with its own scroll position. */
.reader-dialog { width: min(960px, calc(100vw - 64px)); height: min(940px, calc(100dvh - 72px)); max-width: none; max-height: none; padding: 0; border: 1px solid #dce3dc; border-radius: 16px; background: var(--paper); color: var(--text); box-shadow: 0 24px 90px #172a2440; overflow: hidden; }
.reader-dialog[open] { display: flex; flex-direction: column; }
.reader-dialog::backdrop { background: #23352d66; backdrop-filter: blur(3px); }
.reader-toolbar { display: flex; align-items: center; gap: 16px; flex-shrink: 0; min-height: 56px; padding: 8px 20px; border-bottom: 1px solid var(--line); background: #fbfcfa; }
#reader-close { margin-left: auto; width: 38px; height: 38px; }
.reader-scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; overscroll-behavior: contain; padding: 32px 48px 44px; outline: none; }
.reader-content { min-width: 0; }
.reader-header { border-bottom: 1px solid var(--line); padding-bottom: 25px; margin-bottom: 30px; }
.reader-header .row-meta { margin-bottom: 14px; font-size: 13px; }
.reader-header h1 { font-size: 29px; line-height: 1.5; letter-spacing: -.4px; margin: 0; font-weight: 650; text-wrap: pretty; overflow-wrap: anywhere; }
.reader-source { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); margin-top: 15px; line-height: 1.8; }
.reader-source .icon { width: 15px; height: 15px; }
.reader-source:hover { text-decoration: underline; text-underline-offset: 4px; }
.reader-preamble { margin-top: 14px; font-size: 13px; color: var(--muted); line-height: 1.8; overflow-wrap: anywhere; }
.reader-quick-nav { display: flex; flex-wrap: wrap; gap: 6px 18px; border-bottom: 1px solid var(--line); padding-bottom: 17px; margin: -8px 0 27px; }
.reader-quick-nav a { color: var(--accent); font-size: 13px; padding: 3px 0; }
.reader-quick-nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
.reader-section { margin: 0 0 34px; scroll-margin-top: 25px; }
.reader-section > h2 { font-size: 20px; line-height: 1.6; margin-bottom: 15px; font-weight: 650; }
.markdown { font-size: 16px; line-height: 1.95; color: #334155; overflow-wrap: anywhere; }
.markdown p { margin-bottom: 16px; }
.markdown p:last-child { margin-bottom: 0; }
.markdown a { color: var(--accent); text-decoration: underline; text-decoration-color: #a7bce6; text-underline-offset: 3px; }
.markdown a:hover { text-decoration-color: var(--accent); }
.markdown code { font-family: "Cascadia Code", Consolas, monospace; font-size: .89em; background: #edf0f6; color: #3c5176; border: 1px solid #dfe5ef; padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
.markdown pre { overflow-x: auto; padding: 17px 19px; border: 1px solid var(--line); border-radius: 8px; background: #f0f3f8; line-height: 1.75; margin: 16px 0; }
.markdown pre code { border: 0; padding: 0; background: none; overflow-wrap: normal; }
.markdown ul, .markdown ol { padding-left: 24px; margin: 12px 0 18px; }
.markdown li { padding-left: 3px; margin: 11px 0; }
.markdown li::marker { color: #6781ad; }
.markdown h3, .markdown h4 { font-size: 17px; margin: 25px 0 12px; color: var(--text); }
.markdown blockquote { margin: 16px 0; padding: 11px 17px; border-left: 3px solid #a7bbdf; background: #edf2fb; color: var(--muted); }
.markdown .table-wrap { overflow: auto; margin: 16px 0; }
.markdown table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.markdown th, .markdown td { padding: 9px 12px; border: 1px solid var(--line); text-align: left; }
.markdown th { background: #eef2f9; font-weight: 600; }
.reader-related { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; margin-top: 28px; }
.reader-related:empty { display: none; }
.related-group { border-top: 1px solid var(--line); padding-top: 18px; min-width: 0; }
.related-group h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.related-group h2 > span { font-size: 12px; color: var(--quiet); font-weight: 400; }
.related-link { display: block; text-align: left; width: 100%; font-size: 14px; line-height: 1.75; padding: 8px; margin: 0 0 4px -8px; overflow-wrap: anywhere; }
.related-link small { display: block; font-size: 12px; color: var(--quiet); margin-top: 3px; }
.related-link:hover { background: var(--accent-soft); color: var(--accent); }
.reader-tools { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; }
.related-empty { font-size: 13px; color: var(--quiet); }

/* Empty and connection states. */
.empty-state { text-align: center; padding: 64px 24px; background: var(--paper); border: 1px dashed #cad5e8; border-radius: var(--radius); }
.empty-state > .icon { width: 30px; height: 30px; color: #8299bc; margin-bottom: 15px; }
.empty-state h2, .empty-state h1 { font-size: 20px; font-weight: 600; }
.empty-state p { font-size: 15px; color: var(--muted); margin: 12px 0 22px; }
.onboarding { max-width: 750px; margin: 36px auto 70px; text-align: center; padding: 46px 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.onboarding-art { width: 145px; margin: 0 auto 20px; }
.onboarding h2 { font-size: 24px; letter-spacing: -.4px; font-weight: 600; }
.onboarding p { font-size: 15px; color: var(--muted); line-height: 1.9; margin: 17px auto 25px; }
.text-link { color: var(--accent); font-size: 14px; }
.text-link:hover { text-decoration: underline; }
.snapshot-link { display: block; margin-top: 19px; }
.notice { font-size: 14px; line-height: 1.8; padding: 12px 16px; background: #fff8e9; border: 1px solid #e9d9b0; border-radius: 8px; margin-bottom: 22px; color: #806129; overflow-wrap: anywhere; }
.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #293a59; color: white; border-radius: 8px; padding: 11px 19px; font-size: 14px; box-shadow: 0 6px 25px #17274b20; z-index: 60; max-width: calc(100vw - 30px); text-align: center; }

/* A full-width flow canvas; node details are inserted below the selected row. */
.project-brief { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; align-items: center; gap: 20px; background: #edf3ed; border: 1px solid #dce7dc; border-radius: 10px; padding: 14px 18px; margin-bottom: 22px; }
.brief-item { min-width: 0; }
.brief-next { border-left: 1px solid #d4e1d2; padding-left: 20px; }
.current-marker { display: flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 12px; font-weight: 600; color: #37604b; }
.current-marker .icon { width: 16px; height: 16px; }
.current-description { font-size: 13px; color: #344b3d; margin-top: 5px; }
.source-button { font-size: 12px; white-space: nowrap; gap: 6px; }
.source-button .icon { width: 14px; height: 14px; }
.source-missing { color: #936326; font-size: 13px; }
.map-surface { min-width: 0; background: white; border: 1px solid #dce3dc; border-radius: 14px; overflow: hidden; scroll-margin-top: 20px; }
.map-heading { padding: 18px 24px; }

window.__INLINE_DATA__ = [{"id":"implemented/process/2026-09-12-readable-board-and-stable-sync.md","sourcePath":"implemented/process/2026-09-12-readable-board-and-stable-sync.md","slug":"2026-09-12-readable-board-and-stable-sync","lifecycle":"implemented","cls":"process","date":"2026-09-12","title":"用独立的项目地图连接运行流程、开发进度与决策依据","status":"implemented","rawBody":"# Agent Note: 用独立的项目地图连接运行流程、开发进度与决策依据\n\nStatus: implemented\n\n首次整理：2026-09-12；当前展示与同步行为核对：2026-09-13。\n\n## Problem\n\n原看板信息密度高，卡片与装饰占据阅读空间，用户希望改为浅色、留白充足的文档工作台。目录热更新时，同一天的笔记又会反复变换顺序，打断查找与阅读。\n\n导航已经提示当前位置，正文仍重复项目或模块标题、导语、节点职责和页脚说明。这些介绍占据首屏，分散了对流程、实际做法和决策正文的注意力。\n\n资料页沿用左侧目录、右侧详情的 Wiki 布局，地图又有常驻的侧边说明。切换入口时导航方式改变，流程空间被固定面板挤占；用户希望直接在流程中展开内容，阅读后回到原来的位置。\n\n按日期、类别或模块排列笔记，仍需要读者自行拼出项目如何工作。当前笔记全是 implemented，这些状态不能说明下一步安排或学习掌握程度。用户需要先看懂任务在各部分之间怎样流转，并直接找到当前实现、待验证项和下一步；只有需要追溯时才阅读全文。\n\n旧实现将文件系统遍历顺序直接传入只按日期排序的数组，并在每次检查后无条件重画所有视图。同日期、同引用数没有确定的次级顺序；focus 与定时检查也没有统一的并发入口。\n\n## Decision\n\n项目看板首页展示可点击的运行流程。主循环、返回路径、辅助状态与控制分支按[项目展示配置](../../../board.json)固定布局；节点展示当前行为、限制，并链接决策依据与源码入口。图中关系根据实际源码和设计决定整理，不从笔记互相引用的数量推断运行时依赖。Mini Agent 的提问分支回填回答后继续当前轮，完成和暂停分支结束本轮、等待新指令。\n\n所有视图共用顶部横向导航，模块通过资料页筛选器选择，移除常驻侧目录和面包屑；页面级 h1 仅保留给辅助技术与键盘焦点。图内和分区使用一个短标题，阅读层只显示一次笔记原题。模板移除介绍段落、操作导语、重复资料入口与页脚统计；配置移除项目独立标题、项目／地图／模块的 description 和节点 purpose 字段。实际行为、限制、笔记全文及有明确用途的筛选计数继续显示。\n\n流程画布占据完整内容宽度，默认收起节点说明。点击节点后只展开一处详情，再次点击或关闭即收起。桌面详情放在节点所属行下方；窄屏主流程与分支详情紧接所选节点，辅助节点共用行下方的展开区。详情展示实现、限制、源码，以及所选决策的取舍和验证节选；备选方案按需展开，切换依据和阅读全文使用同一处入口。内容高度变化时重算窄屏回路线。\n\n顶部的当前实现和下一步候选，以及下方的待验证项，按配置中的章节名读取[现有进度](../../../learning/progress.md)。可选的学习区域读取实践记录、理解证据与练习入口，可在页面折叠或通过配置关闭。教学方法仍由[独立教练约定](2026-09-11-learning-workflow-and-notes.md)管理，不扩展笔记的 class 或 lifecycle，也不从 implemented 状态推断学习者已经掌握。\n\n完整决策、演进记录和方案取舍保留独立入口。资料页使用卡片集合与筛选器，笔记和进度原文在居中的原生 dialog 中打开，正文独立滚动，关联笔记放在正文下方。关闭按钮、Esc、点击背景或浏览器后退关闭阅读层，恢复原视图、筛选、节点、滚动位置和焦点。首次阅读增加一个浏览器历史项，关联资料在此项中替换，层内“返回上一份资料”恢复前一份正文及其位置。阅读状态与两处滚动位置写入历史项，以支持刷新和前进；页面滚动时延迟保存，离开前补存，避免仅在 pagehide 保存而错过 Chromium 的重载历史。\n\n配置中的 groups 组织资料筛选与无地图时的模块集合，笔记去重分配，新增、改名或未配置的记录进入标准类别。缺少展示配置时回到按类别浏览全部笔记，不隐藏记录。\n\n页面模板、浏览器逻辑、资料适配器和生成脚本由项目独立维护，原版 Skill 保持原样。项目名、流程节点、源码路径和学习资料章节留在可选配置中。节点的简短行为解释用于浏览，详细理由仍以决策笔记为依据；阶段和理解证据只在进度文件中维护。两种输出共用解析器，沿用[完整章节读取](2026-09-11-complete-board-sections.md)。\n\n连接项目根目录或 .agents 时，一次检查读取笔记、board.json 和配置明确引用的 Markdown 资料；相同来源只读一次。仅连接 notes 时只显示该目录的笔记，不继承原项目的地图和学习状态。未连接的 board.html 显示生成时的项目概览，完整决策需要连接目录；离线快照同时内嵌笔记。连接操作与状态集中在顶部，显示未连接、离线快照、自动同步或同步失败；手动检查仅在连接后出现，目录名与检查时间放在状态提示中。\n\n检查请求串行执行，重叠触发合并为后续一次检查。内容指纹包含笔记路径与正文、展示配置及资料正文，不依赖文件大小、时间或遍历顺序；同日期和同引用数使用规范路径确定顺序。未变化时不提交数据或替换 DOM；变化时保留节点展开、依据选择、备选和学习区域偏好、当前阅读资料、焦点及两处滚动位置。切换目录使旧读取失效。读取失败或配置尚未写完整时保留最后成功数据；明确删除的配置回退到笔记浏览，缺失的资料或章节显示提示，当前笔记删除后仍在阅读层显示可关闭的缺失状态。\n\n## Alternatives considered\n\n- 只覆盖原页面的 CSS：改动集中，能快速改变配色，但阅读结构、详情缺失和刷新状态仍受原模板控制；独立页面更符合这次重新设计的范围。\n- 继续把模块笔记清单作为首页：便于查找和完整阅读，但运行关系与当前开发重点仍依赖读者自行归纳；清单作为资料入口保留。\n- 自动把笔记引用绘制成架构图：不需要额外维护关系，但引用只能证明相关背景，无法证明调用顺序、状态供给或控制权返回位置；当前使用有源码依据的明确流程配置。\n- 只补一个排序条件：可以稳定同日期的先后关系，但每次扫描仍会替换 DOM，无法保留焦点，也没有处理重叠读取与失败快照。\n- 引入前端框架和开发服务器：组件与更新机制成熟，但看板目前规模小，主要需要直接打开 HTML 和本地目录读取；项目采用无新增依赖的模板生成与原生浏览器逻辑。\n- 将 Mini Agent 的流程、阶段和教学方法写进渲染器或上游 Skill：配置更少，但其他项目必须修改通用工具。独立展示配置与资料来源允许替换项目内容或关闭学习区域，代价是维护节点摘要及其依据链接。\n- 将介绍折叠或增加精简模式：仍可按需展开完整导览，但要继续维护重复说明和额外偏好；已有导航足以定位，当前直接删去这层内容与配置字段。\n- 保留可折叠的左侧模块目录：适合连续查阅文档，但仍以目录层级组织页面，地图与资料的导航方式也不统一；模块筛选与顶部入口足以覆盖当前查找需求。\n- 将节点说明改成右侧抽屉：可以减少常驻内容，但宽屏仍要在流程和侧栏间来回看，窄屏抽屉还会遮住节点；当前就地展开，代价是下方内容随之移动。\n- 全文跳转到独立详情页：地址与整页阅读直观，但离开流程后需要重新建立当前位置；居中阅读层保留背景，代价是显式维护阅读历史、焦点和滚动恢复。\n\n## Consequences\n\n读者可以先沿流程理解项目，再定位当前实现、缺口和详细依据。展示层与学习区域可独立迁移，未改变内容的同步保持页面稳定。代价是项目负责展示逻辑、有限的 Markdown 渲染、资料适配和同步回归；上游看板的界面更新不会自动进入本项目。\n\n精简后的首屏直接呈现进度和流程，模块页直接进入筛选与清单。首次阅读依靠节点标签和实际内容，没有独立的导览介绍；后续只有观察到具体入口无法理解时，才在该入口补充必要提示。\n\n画布只保留一个展开节点，适合沿流程查看，不提供多个节点详情并排比较。全文阅读时背景暂不可操作，跨资料返回由阅读层管理；资料关联仍完整保留。布局不新增依赖，但需要维护原生 dialog、响应式详情位置与浏览器历史之间的状态边界。\n\n流程关系与简短行为解释需要随实现维护，资料章节改名时需要同步配置；校验能发现无效关系与缺失路径，不能证明描述符合源码。当前布局支持二至六步主流程、辅助节点、一个可选回路和控制分支，更复杂的关系需要扩展布局。模板或脚本修改后重新生成并刷新；连接完整项目后的配置、笔记和进度变更无需重新生成页面。\n\n自动同步是可见页面每三秒检查，并在返回页面时检查，并非操作系统文件监听。每次检查读取笔记和引用资料，当前小型项目可接受；规模扩大后再依据实际开销考虑缓存。保存过程中短暂解析失败会保留旧内容，下一次检查恢复。\n\n本地目录连接依赖 Chrome 或 Edge 的文件访问 API 与浏览器授权。目录句柄、筛选、节点与学习区域偏好按页面路径和项目名保存；旧版保存的 notes 句柄仍能浏览笔记，需要重新选择项目根目录才能读取同级配置与学习资料。源码相对链接仍以生成页面所在项目为基准。\n\n## Verification\n\n2026-09-12 在旧页面中反转相同笔记的输入顺序，观察到同日列表顺序改变及 DOM 被替换。当前实现依据：[数据与同步模块](../../../../scripts/notes-board/model.mjs)、[项目资料适配器](../../../../scripts/notes-board/project.mjs)、[页面逻辑](../../../../scripts/notes-board/app.js)、[生成入口](../../../../scripts/build-notes-board.mjs)。\n\n2026-09-13 的 `npm run test:board` 二十六条回归通过，包含原有排序、解析与同步用例，以及地图关系完整性、实际依据路径、资料范围、配置和进度单独变更、缺失来源与无配置回退。`npm run typecheck`、浏览器脚本与生成器语法检查、两种生成命令通过。\n\n浏览器使用隔离 OPFS 目录进行实际文件读写，并通过目录适配入口反复改变遍历顺序。重复检查保留节点、焦点、正文和详情滚动位置，以及依据与学习区域展开状态；等长进度编辑只更新对应区域，配置变更保留选中节点；读取失败后保留内容并恢复。轮询检测新增未分组笔记；关闭学习区域、删除资料、移除配置和只连接 notes 均按约定回退。真实浏览器句柄在重载后恢复连接、节点选择和学习偏好。此测试不代替用户在 Windows 原生目录选择框中的授权。\n\n文案精简后，浏览器逐篇核对二十篇笔记的一百个完整章节，并核对全部备选入口。九个地图节点、决策与进度原文跳转、返回原环节、模块筛选、搜索与清除、时间线月份筛选和键盘焦点通过。1536、1280、1024、800、700、390 和 360px 下的地图、资料、时间线、取舍与模块页均无横向溢出；窄屏导航、详情返回和学习区域开关通过，未出现页面脚本错误。\n\n合并连接控件后，使用独立浏览器上下文与隔离 OPFS 目录验证：未连接状态、单次按钮触发、手动检查、不变内容保留节点和展开状态、配置解析失败后的状态与恢复、真实句柄重载，以及只连接 notes 的二十篇笔记回退均通过。这些检查不代替 Windows 原生目录选择框的人工授权。\n\n2026-09-13 完成全宽布局后，浏览器的一百零一项检查通过：九个节点的桌面与窄屏展开、切换依据、再次点击及 Esc 收起；二十篇笔记的一百个完整章节；搜索、月份筛选、关联资料返回、直接链接与缺失笔记；关闭后恢复原位置和焦点、阅读中重载、浏览器前进与后退。1536、1280、1024、800、700、390 和 360px 下的四个主视图均保留顶部导航且无横向溢出。实际复现并修正了重载丢失阅读位置、展开备选后窄屏回路线长度未更新的问题。\n\n相同版本在隔离 OPFS 目录中的十七项同步检查通过：不变轮询保留 DOM，修改地图或正在阅读的笔记保留阅读层与选择；半写入配置保留上次内容并在恢复后清除提示；关闭后恢复展开区、依据和学习偏好；真实句柄重载后继续阅读；当前笔记删除、进度原文更新、配置移除及只连接 notes 均能正常回退。两组浏览器检查没有页面脚本错误。这些结果属于看板验证，不增加 Agent 运行或学习理解证据。\n","sections":[{"heading":"Problem","body":"原看板信息密度高，卡片与装饰占据阅读空间，用户希望改为浅色、留白充足的文档工作台。目录热更新时，同一天的笔记又会反复变换顺序，打断查找与阅读。\n\n导航已经提示当前位置，正文仍重复项目或模块标题、导语、节点职责和页脚说明。这些介绍占据首屏，分散了对流程、实际做法和决策正文的注意力。\n\n资料页沿用左侧目录、右侧详情的 Wiki 布局，地图又有常驻的侧边说明。切换入口时导航方式改变，流程空间被固定面板挤占；用户希望直接在流程中展开内容，阅读后回到原来的位置。\n\n按日期、类别或模块排列笔记，仍需要读者自行拼出项目如何工作。当前笔记全是 implemented，这些状态不能说明下一步安排或学习掌握程度。用户需要先看懂任务在各部分之间怎样流转，并直接找到当前实现、待验证项和下一步；只有需要追溯时才阅读全文。\n\n旧实现将文件系统遍历顺序直接传入只按日期排序的数组，并在每次检查后无条件重画所有视图。同日期、同引用数没有确定的次级顺序；focus 与定时检查也没有统一的并发入口。","anchor":"section-0"},{"heading":"Decision","body":"项目看板首页展示可点击的运行流程。主循环、返回路径、辅助状态与控制分支按[项目展示配置](../../../board.json)固定布局；节点展示当前行为、限制，并链接决策依据与源码入口。图中关系根据实际源码和设计决定整理，不从笔记互相引用的数量推断运行时依赖。Mini Agent 的提问分支回填回答后继续当前轮，完成和暂停分支结束本轮、等待新指令。\n\n所有视图共用顶部横向导航，模块通过资料页筛选器选择，移除常驻侧目录和面包屑；页面级 h1 仅保留给辅助技术与键盘焦点。图内和分区使用一个短标题，阅读层只显示一次笔记原题。模板移除介绍段落、操作导语、重复资料入口与页脚统计；配置移除项目独立标题、项目／地图／模块的 description 和节点 purpose 字段。实际行为、限制、笔记全文及有明确用途的筛选计数继续显示。\n\n流程画布占据完整内容宽度，默认收起节点说明。点击节点后只展开一处详情，再次点击或关闭即收起。桌面详情放在节点所属行下方；窄屏主流程与分支详情紧接所选节点，辅助节点共用行下方的展开区。详情展示实现、限制、源码，以及所选决策的取舍和验证节选；备选方案按需展开，切换依据和阅读全文使用同一处入口。内容高度变化时重算窄屏回路线。\n\n顶部的当前实现和下一步候选，以及下方的待验证项，按配置中的章节名读取[现有进度](../../../learning/progress.md)。可选的学习区域读取实践记录、理解证据与练习入口，可在页面折叠或通过配置关闭。教学方法仍由[独立教练约定](2026-09-11-learning-workflow-and-notes.md)管理，不扩展笔记的 class 或 lifecycle，也不从 implemented 状态推断学习者已经掌握。\n\n完整决策、演进记录和方案取舍保留独立入口。资料页使用卡片集合与筛选器，笔记和进度原文在居中的原生 dialog 中打开，正文独立滚动，关联笔记放在正文下方。关闭按钮、Esc、点击背景或浏览器后退关闭阅读层，恢复原视图、筛选、节点、滚动位置和焦点。首次阅读增加一个浏览器历史项，关联资料在此项中替换，层内“返回上一份资料”恢复前一份正文及其位置。阅读状态与两处滚动位置写入历史项，以支持刷新和前进；页面滚动时延迟保存，离开前补存，避免仅在 pagehide 保存而错过 Chromium 的重载历史。\n\n配置中的 groups 组织资料筛选与无地图时的模块集合，笔记去重分配，新增、改名或未配置的记录进入标准类别。缺少展示配置时回到按类别浏览全部笔记，不隐藏记录。\n\n页面模板、浏览器逻辑、资料适配器和生成脚本由项目独立维护，原版 Skill 保持原样。项目名、流程节点、源码路径和学习资料章节留在可选配置中。节点的简短行为解释用于浏览，详细理由仍以决策笔记为依据；阶段和理解证据只在进度文件中维护。两种输出共用解析器，沿用[完整章节读取](2026-09-11-complete-board-sections.md)。\n\n连接项目根目录或 .agents 时，一次检查读取笔记、board.json 和配置明确引用的 Markdown 资料；相同来源只读一次。仅连接 notes 时只显示该目录的笔记，不继承原项目的地图和学习状态。未连接的 board.html 显示生成时的项目概览，完整决策需要连接目录；离线快照同时内嵌笔记。连接操作与状态集中在顶部，显示未连接、离线快照、自动同步或同步失败；手动检查仅在连接后出现，目录名与检查时间放在状态提示中。\n\n检查请求串行执行，重叠触发合并为后续一次检查。内容指纹包含笔记路径与正文、展示配置及资料正文，不依赖文件大小、时间或遍历顺序；同日期和同引用数使用规范路径确定顺序。未变化时不提交数据或替换 DOM；变化时保留节点展开、依据选择、备选和学习区域偏好、当前阅读资料、焦点及两处滚动位置。切换目录使旧读取失效。读取失败或配置尚未写完整时保留最后成功数据；明确删除的配置回退到笔记浏览，缺失的资料或章节显示提示，当前笔记删除后仍在阅读层显示可关闭的缺失状态。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 只覆盖原页面的 CSS：改动集中，能快速改变配色，但阅读结构、详情缺失和刷新状态仍受原模板控制；独立页面更符合这次重新设计的范围。\n- 继续把模块笔记清单作为首页：便于查找和完整阅读，但运行关系与当前开发重点仍依赖读者自行归纳；清单作为资料入口保留。\n- 自动把笔记引用绘制成架构图：不需要额外维护关系，但引用只能证明相关背景，无法证明调用顺序、状态供给或控制权返回位置；当前使用有源码依据的明确流程配置。\n- 只补一个排序条件：可以稳定同日期的先后关系，但每次扫描仍会替换 DOM，无法保留焦点，也没有处理重叠读取与失败快照。\n- 引入前端框架和开发服务器：组件与更新机制成熟，但看板目前规模小，主要需要直接打开 HTML 和本地目录读取；项目采用无新增依赖的模板生成与原生浏览器逻辑。\n- 将 Mini Agent 的流程、阶段和教学方法写进渲染器或上游 Skill：配置更少，但其他项目必须修改通用工具。独立展示配置与资料来源允许替换项目内容或关闭学习区域，代价是维护节点摘要及其依据链接。\n- 将介绍折叠或增加精简模式：仍可按需展开完整导览，但要继续维护重复说明和额外偏好；已有导航足以定位，当前直接删去这层内容与配置字段。\n- 保留可折叠的左侧模块目录：适合连续查阅文档，但仍以目录层级组织页面，地图与资料的导航方式也不统一；模块筛选与顶部入口足以覆盖当前查找需求。\n- 将节点说明改成右侧抽屉：可以减少常驻内容，但宽屏仍要在流程和侧栏间来回看，窄屏抽屉还会遮住节点；当前就地展开，代价是下方内容随之移动。\n- 全文跳转到独立详情页：地址与整页阅读直观，但离开流程后需要重新建立当前位置；居中阅读层保留背景，代价是显式维护阅读历史、焦点和滚动恢复。","anchor":"section-2"},{"heading":"Consequences","body":"读者可以先沿流程理解项目，再定位当前实现、缺口和详细依据。展示层与学习区域可独立迁移，未改变内容的同步保持页面稳定。代价是项目负责展示逻辑、有限的 Markdown 渲染、资料适配和同步回归；上游看板的界面更新不会自动进入本项目。\n\n精简后的首屏直接呈现进度和流程，模块页直接进入筛选与清单。首次阅读依靠节点标签和实际内容，没有独立的导览介绍；后续只有观察到具体入口无法理解时，才在该入口补充必要提示。\n\n画布只保留一个展开节点，适合沿流程查看，不提供多个节点详情并排比较。全文阅读时背景暂不可操作，跨资料返回由阅读层管理；资料关联仍完整保留。布局不新增依赖，但需要维护原生 dialog、响应式详情位置与浏览器历史之间的状态边界。\n\n流程关系与简短行为解释需要随实现维护，资料章节改名时需要同步配置；校验能发现无效关系与缺失路径，不能证明描述符合源码。当前布局支持二至六步主流程、辅助节点、一个可选回路和控制分支，更复杂的关系需要扩展布局。模板或脚本修改后重新生成并刷新；连接完整项目后的配置、笔记和进度变更无需重新生成页面。\n\n自动同步是可见页面每三秒检查，并在返回页面时检查，并非操作系统文件监听。每次检查读取笔记和引用资料，当前小型项目可接受；规模扩大后再依据实际开销考虑缓存。保存过程中短暂解析失败会保留旧内容，下一次检查恢复。\n\n本地目录连接依赖 Chrome 或 Edge 的文件访问 API 与浏览器授权。目录句柄、筛选、节点与学习区域偏好按页面路径和项目名保存；旧版保存的 notes 句柄仍能浏览笔记，需要重新选择项目根目录才能读取同级配置与学习资料。源码相对链接仍以生成页面所在项目为基准。","anchor":"section-3"},{"heading":"Verification","body":"2026-09-12 在旧页面中反转相同笔记的输入顺序，观察到同日列表顺序改变及 DOM 被替换。当前实现依据：[数据与同步模块](../../../../scripts/notes-board/model.mjs)、[项目资料适配器](../../../../scripts/notes-board/project.mjs)、[页面逻辑](../../../../scripts/notes-board/app.js)、[生成入口](../../../../scripts/build-notes-board.mjs)。\n\n2026-09-13 的 `npm run test:board` 二十六条回归通过，包含原有排序、解析与同步用例，以及地图关系完整性、实际依据路径、资料范围、配置和进度单独变更、缺失来源与无配置回退。`npm run typecheck`、浏览器脚本与生成器语法检查、两种生成命令通过。\n\n浏览器使用隔离 OPFS 目录进行实际文件读写，并通过目录适配入口反复改变遍历顺序。重复检查保留节点、焦点、正文和详情滚动位置，以及依据与学习区域展开状态；等长进度编辑只更新对应区域，配置变更保留选中节点；读取失败后保留内容并恢复。轮询检测新增未分组笔记；关闭学习区域、删除资料、移除配置和只连接 notes 均按约定回退。真实浏览器句柄在重载后恢复连接、节点选择和学习偏好。此测试不代替用户在 Windows 原生目录选择框中的授权。\n\n文案精简后，浏览器逐篇核对二十篇笔记的一百个完整章节，并核对全部备选入口。九个地图节点、决策与进度原文跳转、返回原环节、模块筛选、搜索与清除、时间线月份筛选和键盘焦点通过。1536、1280、1024、800、700、390 和 360px 下的地图、资料、时间线、取舍与模块页均无横向溢出；窄屏导航、详情返回和学习区域开关通过，未出现页面脚本错误。\n\n合并连接控件后，使用独立浏览器上下文与隔离 OPFS 目录验证：未连接状态、单次按钮触发、手动检查、不变内容保留节点和展开状态、配置解析失败后的状态与恢复、真实句柄重载，以及只连接 notes 的二十篇笔记回退均通过。这些检查不代替 Windows 原生目录选择框的人工授权。\n\n2026-09-13 完成全宽布局后，浏览器的一百零一项检查通过：九个节点的桌面与窄屏展开、切换依据、再次点击及 Esc 收起；二十篇笔记的一百个完整章节；搜索、月份筛选、关联资料返回、直接链接与缺失笔记；关闭后恢复原位置和焦点、阅读中重载、浏览器前进与后退。1536、1280、1024、800、700、390 和 360px 下的四个主视图均保留顶部导航且无横向溢出。实际复现并修正了重载丢失阅读位置、展开备选后窄屏回路线长度未更新的问题。\n\n相同版本在隔离 OPFS 目录中的十七项同步检查通过：不变轮询保留 DOM，修改地图或正在阅读的笔记保留阅读层与选择；半写入配置保留上次内容并在恢复后清除提示；关闭后恢复展开区、依据和学习偏好；真实句柄重载后继续阅读；当前笔记删除、进度原文更新、配置移除及只连接 notes 均能正常回退。两组浏览器检查没有页面脚本错误。这些结果属于看板验证，不增加 Agent 运行或学习理解证据。","anchor":"section-4"}],"problem":"原看板信息密度高，卡片与装饰占据阅读空间，用户希望改为浅色、留白充足的文档工作台。目录热更新时，同一天的笔记又会反复变换顺序，打断查找与阅读。\n\n导航已经提示当前位置，正文仍重复项目或模块标题、导语、节点职责和页脚说明。这些介绍占据首屏，分散了对流程、实际做法和决策正文的注意力。\n\n资料页沿用左侧目录、右侧详情的 Wiki 布局，地图又有常驻的侧边说明。切换入口时导航方式改变，流程空间被固定面板挤占；用户希望直接在流程中展开内容，阅读后回到原来的位置。\n\n按日期、类别或模块排列笔记，仍需要读者自行拼出项目如何工作。当前笔记全是 implemented，这些状态不能说明下一步安排或学习掌握程度。用户需要先看懂任务在各部分之间怎样流转，并直接找到当前实现、待验证项和下一步；只有需要追溯时才阅读全文。\n\n旧实现将文件系统遍历顺序直接传入只按日期排序的数组，并在每次检查后无条件重画所有视图。同日期、同引用数没有确定的次级顺序；focus 与定时检查也没有统一的并发入口。","decision":"项目看板首页展示可点击的运行流程。主循环、返回路径、辅助状态与控制分支按[项目展示配置](../../../board.json)固定布局；节点展示当前行为、限制，并链接决策依据与源码入口。图中关系根据实际源码和设计决定整理，不从笔记互相引用的数量推断运行时依赖。Mini Agent 的提问分支回填回答后继续当前轮，完成和暂停分支结束本轮、等待新指令。\n\n所有视图共用顶部横向导航，模块通过资料页筛选器选择，移除常驻侧目录和面包屑；页面级 h1 仅保留给辅助技术与键盘焦点。图内和分区使用一个短标题，阅读层只显示一次笔记原题。模板移除介绍段落、操作导语、重复资料入口与页脚统计；配置移除项目独立标题、项目／地图／模块的 description 和节点 purpose 字段。实际行为、限制、笔记全文及有明确用途的筛选计数继续显示。\n\n流程画布占据完整内容宽度，默认收起节点说明。点击节点后只展开一处详情，再次点击或关闭即收起。桌面详情放在节点所属行下方；窄屏主流程与分支详情紧接所选节点，辅助节点共用行下方的展开区。详情展示实现、限制、源码，以及所选决策的取舍和验证节选；备选方案按需展开，切换依据和阅读全文使用同一处入口。内容高度变化时重算窄屏回路线。\n\n顶部的当前实现和下一步候选，以及下方的待验证项，按配置中的章节名读取[现有进度](../../../learning/progress.md)。可选的学习区域读取实践记录、理解证据与练习入口，可在页面折叠或通过配置关闭。教学方法仍由[独立教练约定](2026-09-11-learning-workflow-and-notes.md)管理，不扩展笔记的 class 或 lifecycle，也不从 implemented 状态推断学习者已经掌握。\n\n完整决策、演进记录和方案取舍保留独立入口。资料页使用卡片集合与筛选器，笔记和进度原文在居中的原生 dialog 中打开，正文独立滚动，关联笔记放在正文下方。关闭按钮、Esc、点击背景或浏览器后退关闭阅读层，恢复原视图、筛选、节点、滚动位置和焦点。首次阅读增加一个浏览器历史项，关联资料在此项中替换，层内“返回上一份资料”恢复前一份正文及其位置。阅读状态与两处滚动位置写入历史项，以支持刷新和前进；页面滚动时延迟保存，离开前补存，避免仅在 pagehide 保存而错过 Chromium 的重载历史。\n\n配置中的 groups 组织资料筛选与无地图时的模块集合，笔记去重分配，新增、改名或未配置的记录进入标准类别。缺少展示配置时回到按类别浏览全部笔记，不隐藏记录。\n\n页面模板、浏览器逻辑、资料适配器和生成脚本由项目独立维护，原版 Skill 保持原样。项目名、流程节点、源码路径和学习资料章节留在可选配置中。节点的简短行为解释用于浏览，详细理由仍以决策笔记为依据；阶段和理解证据只在进度文件中维护。两种输出共用解析器，沿用[完整章节读取](2026-09-11-complete-board-sections.md)。\n\n连接项目根目录或 .agents 时，一次检查读取笔记、board.json 和配置明确引用的 Markdown 资料；相同来源只读一次。仅连接 notes 时只显示该目录的笔记，不继承原项目的地图和学习状态。未连接的 board.html 显示生成时的项目概览，完整决策需要连接目录；离线快照同时内嵌笔记。连接操作与状态集中在顶部，显示未连接、离线快照、自动同步或同步失败；手动检查仅在连接后出现，目录名与检查时间放在状态提示中。\n\n检查请求串行执行，重叠触发合并为后续一次检查。内容指纹包含笔记路径与正文、展示配置及资料正文，不依赖文件大小、时间或遍历顺序；同日期和同引用数使用规范路径确定顺序。未变化时不提交数据或替换 DOM；变化时保留节点展开、依据选择、备选和学习区域偏好、当前阅读资料、焦点及两处滚动位置。切换目录使旧读取失效。读取失败或配置尚未写完整时保留最后成功数据；明确删除的配置回退到笔记浏览，缺失的资料或章节显示提示，当前笔记删除后仍在阅读层显示可关闭的缺失状态。","alternatives":"- 只覆盖原页面的 CSS：改动集中，能快速改变配色，但阅读结构、详情缺失和刷新状态仍受原模板控制；独立页面更符合这次重新设计的范围。\n- 继续把模块笔记清单作为首页：便于查找和完整阅读，但运行关系与当前开发重点仍依赖读者自行归纳；清单作为资料入口保留。\n- 自动把笔记引用绘制成架构图：不需要额外维护关系，但引用只能证明相关背景，无法证明调用顺序、状态供给或控制权返回位置；当前使用有源码依据的明确流程配置。\n- 只补一个排序条件：可以稳定同日期的先后关系，但每次扫描仍会替换 DOM，无法保留焦点，也没有处理重叠读取与失败快照。\n- 引入前端框架和开发服务器：组件与更新机制成熟，但看板目前规模小，主要需要直接打开 HTML 和本地目录读取；项目采用无新增依赖的模板生成与原生浏览器逻辑。\n- 将 Mini Agent 的流程、阶段和教学方法写进渲染器或上游 Skill：配置更少，但其他项目必须修改通用工具。独立展示配置与资料来源允许替换项目内容或关闭学习区域，代价是维护节点摘要及其依据链接。\n- 将介绍折叠或增加精简模式：仍可按需展开完整导览，但要继续维护重复说明和额外偏好；已有导航足以定位，当前直接删去这层内容与配置字段。\n- 保留可折叠的左侧模块目录：适合连续查阅文档，但仍以目录层级组织页面，地图与资料的导航方式也不统一；模块筛选与顶部入口足以覆盖当前查找需求。\n- 将节点说明改成右侧抽屉：可以减少常驻内容，但宽屏仍要在流程和侧栏间来回看，窄屏抽屉还会遮住节点；当前就地展开，代价是下方内容随之移动。\n- 全文跳转到独立详情页：地址与整页阅读直观，但离开流程后需要重新建立当前位置；居中阅读层保留背景，代价是显式维护阅读历史、焦点和滚动恢复。","consequences":"读者可以先沿流程理解项目，再定位当前实现、缺口和详细依据。展示层与学习区域可独立迁移，未改变内容的同步保持页面稳定。代价是项目负责展示逻辑、有限的 Markdown 渲染、资料适配和同步回归；上游看板的界面更新不会自动进入本项目。\n\n精简后的首屏直接呈现进度和流程，模块页直接进入筛选与清单。首次阅读依靠节点标签和实际内容，没有独立的导览介绍；后续只有观察到具体入口无法理解时，才在该入口补充必要提示。\n\n画布只保留一个展开节点，适合沿流程查看，不提供多个节点详情并排比较。全文阅读时背景暂不可操作，跨资料返回由阅读层管理；资料关联仍完整保留。布局不新增依赖，但需要维护原生 dialog、响应式详情位置与浏览器历史之间的状态边界。\n\n流程关系与简短行为解释需要随实现维护，资料章节改名时需要同步配置；校验能发现无效关系与缺失路径，不能证明描述符合源码。当前布局支持二至六步主流程、辅助节点、一个可选回路和控制分支，更复杂的关系需要扩展布局。模板或脚本修改后重新生成并刷新；连接完整项目后的配置、笔记和进度变更无需重新生成页面。\n\n自动同步是可见页面每三秒检查，并在返回页面时检查，并非操作系统文件监听。每次检查读取笔记和引用资料，当前小型项目可接受；规模扩大后再依据实际开销考虑缓存。保存过程中短暂解析失败会保留旧内容，下一次检查恢复。\n\n本地目录连接依赖 Chrome 或 Edge 的文件访问 API 与浏览器授权。目录句柄、筛选、节点与学习区域偏好按页面路径和项目名保存；旧版保存的 notes 句柄仍能浏览笔记，需要重新选择项目根目录才能读取同级配置与学习资料。源码相对链接仍以生成页面所在项目为基准。","outLinks":["implemented/process/2026-09-11-complete-board-sections.md","implemented/process/2026-09-11-learning-workflow-and-notes.md"]},{"id":"implemented/architecture/2026-09-11-user-turn-boundaries.md","sourcePath":"implemented/architecture/2026-09-11-user-turn-boundaries.md","slug":"2026-09-11-user-turn-boundaries","lifecycle":"implemented","cls":"architecture","date":"2026-09-11","title":"用 startsTurn 区分真实用户轮与内部继续提示","status":"implemented","rawBody":"# Agent Note: 用 startsTurn 区分真实用户轮与内部继续提示\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n继续提示与真实用户输入都使用 user 角色。按角色计轮时，一次请求里的多条内部提示会被算作多轮，可能把原始目标和约束提前裁掉。\n\n## Decision\n\n本地 HistoryMessage 使用 startsTurn 标记真实轮的开始，只有 REPL 新输入设置它。内部提示、assistant 回复和 tool 结果不产生新轮；ask_user 的回答仍属于发起询问的当前轮。\n\ntrimHistory 按标记选择完整轮次。发送请求时，toModelMessages 产生去除本地标记的数组，但不修改本地历史，避免下一次裁剪丢失边界。\n\n本决定细化[整轮上下文裁剪](2026-09-05-bounded-conversation-context.md)。轮边界与[调用结果配对](../bug-fix/2026-09-06-tool-result-history-recovery.md)是相关但不同的约束：误计轮首先会丢目标，不应直接宣称必然导致协议 400。\n\n## Alternatives considered\n\n- 继续按 user 角色计数：无需新字段，但无法区分外部目标和程序内部提示。\n- 只增加保留轮数：能延后问题，但轮次仍算错，长一点的内部循环还会触发。\n- 把内部提示换成另一种角色：可能改变模型对提示的解释，且仍把本地会话边界绑定到 API 角色；本地标记能直接表达目的。\n\n## Consequences\n\n真实轮数不依赖协议角色，代价是所有新输入入口必须维护标记，旧的无标记历史不会自动修复。标记仅服务本地管理，不随请求传给模型。\n\n这一改动解决轮次识别，不提供 token 硬上限、跨进程会话恢复或全部异常历史修复。\n\n## Verification\n\n日期依据：[cd3fa0c](https://github.com/xilele777/mini-agent/commit/cd3fa0c) 于 2026-09-11 接入并验证。当前依据：[context.ts](../../../../src/context.ts)、[agent.ts](../../../../src/agent.ts)。[context.test.ts](../../../../src/context.test.ts) 的三个相关用例覆盖内部提示不增加轮数、保留六个完整轮、API 消息去标记且保留原数组。\n","sections":[{"heading":"Problem","body":"继续提示与真实用户输入都使用 user 角色。按角色计轮时，一次请求里的多条内部提示会被算作多轮，可能把原始目标和约束提前裁掉。","anchor":"section-0"},{"heading":"Decision","body":"本地 HistoryMessage 使用 startsTurn 标记真实轮的开始，只有 REPL 新输入设置它。内部提示、assistant 回复和 tool 结果不产生新轮；ask_user 的回答仍属于发起询问的当前轮。\n\ntrimHistory 按标记选择完整轮次。发送请求时，toModelMessages 产生去除本地标记的数组，但不修改本地历史，避免下一次裁剪丢失边界。\n\n本决定细化[整轮上下文裁剪](2026-09-05-bounded-conversation-context.md)。轮边界与[调用结果配对](../bug-fix/2026-09-06-tool-result-history-recovery.md)是相关但不同的约束：误计轮首先会丢目标，不应直接宣称必然导致协议 400。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 继续按 user 角色计数：无需新字段，但无法区分外部目标和程序内部提示。\n- 只增加保留轮数：能延后问题，但轮次仍算错，长一点的内部循环还会触发。\n- 把内部提示换成另一种角色：可能改变模型对提示的解释，且仍把本地会话边界绑定到 API 角色；本地标记能直接表达目的。","anchor":"section-2"},{"heading":"Consequences","body":"真实轮数不依赖协议角色，代价是所有新输入入口必须维护标记，旧的无标记历史不会自动修复。标记仅服务本地管理，不随请求传给模型。\n\n这一改动解决轮次识别，不提供 token 硬上限、跨进程会话恢复或全部异常历史修复。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[cd3fa0c](https://github.com/xilele777/mini-agent/commit/cd3fa0c) 于 2026-09-11 接入并验证。当前依据：[context.ts](../../../../src/context.ts)、[agent.ts](../../../../src/agent.ts)。[context.test.ts](../../../../src/context.test.ts) 的三个相关用例覆盖内部提示不增加轮数、保留六个完整轮、API 消息去标记且保留原数组。","anchor":"section-4"}],"problem":"继续提示与真实用户输入都使用 user 角色。按角色计轮时，一次请求里的多条内部提示会被算作多轮，可能把原始目标和约束提前裁掉。","decision":"本地 HistoryMessage 使用 startsTurn 标记真实轮的开始，只有 REPL 新输入设置它。内部提示、assistant 回复和 tool 结果不产生新轮；ask_user 的回答仍属于发起询问的当前轮。\n\ntrimHistory 按标记选择完整轮次。发送请求时，toModelMessages 产生去除本地标记的数组，但不修改本地历史，避免下一次裁剪丢失边界。\n\n本决定细化[整轮上下文裁剪](2026-09-05-bounded-conversation-context.md)。轮边界与[调用结果配对](../bug-fix/2026-09-06-tool-result-history-recovery.md)是相关但不同的约束：误计轮首先会丢目标，不应直接宣称必然导致协议 400。","alternatives":"- 继续按 user 角色计数：无需新字段，但无法区分外部目标和程序内部提示。\n- 只增加保留轮数：能延后问题，但轮次仍算错，长一点的内部循环还会触发。\n- 把内 说明、最终答复或等待用户。无条件继续会在拒绝后反复催促，直接停止又可能让多步任务停在列计划；todo 是否为空也不能说明当前请求是否完成。","anchor":"section-0"},{"heading":"Decision","body":"finish_task 表示当前请求完成，pause_task 表示未完成但需要暂停；二者通过通用 endsTurn 结束本轮。ask_user 在当前轮等待用户回答，并把回答作为工具结果返回。\n\n纯文本回复之后的 CONTINUE_NUDGE 提供执行、完成、询问和暂停四种去向。当前请求决定任务范围，历史待办仅保存计划；“只记录一条待办”在记录后即可完成，暂停或被拒绝的旧任务需要明确恢复。\n\n控制工具沿用[注册表](../architecture/2026-08-31-tool-registry-boundary.md)与[共享输入](../architecture/2026-09-02-shared-terminal-input.md)。退出前仍按[历史恢复规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)补齐同批未执行调用。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 纯文本后直接返回：节省继续请求，但无法区分阶段说明与实际完成。\n- 清空 todo 才结束：规则直观，但会把“只记录”当作未完成，并可能触发旧任务。\n- 一律用 finish_task 停止：工具更少，但必要操作被拒绝时，会把暂停错误表述为完成。","anchor":"section-2"},{"heading":"Consequences","body":"出口语义清楚，代价是可能增加模型请求，模型仍可能选错；十次请求上限由[循环预算](2026-09-05-loop-guard-and-request-budget.md)兜底。\n\n[todo](../architecture/2026-09-06-todo-json-persistence.md) 没有任务归属或持久化暂停字段，pause_task 原因只保留在对话中。因此当前语义约束不等于程序层面的任务隔离。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[cd3fa0c](https://github.com/xilele777/mini-agent/commit/cd3fa0c) 于 2026-09-11 落地。当前依据：[control.ts](../../../../src/tools/control.ts)、[agent.ts](../../../../src/agent.ts)。[学习进度](../../../learning/progress.md) 保留只记录待办、询问中拒绝、批准框拒绝及 nudge 后完成的具体记录；其覆盖范围不能推广到所有模型行为。","anchor":"section-4"}],"problem":"无工具调用的文本可能是阶段说明、最终答复或等待用户。无条件继续会在拒绝后反复催促，直接停止又可能让多步任务停在列计划；todo 是否为空也不能说明当前请求是否完成。","decision":"finish_task 表示当前请求完成，pause_task 表示未完成但需要暂停；二者通过通用 endsTurn 结束本轮。ask_user 在当前轮等待用户回答，并把回答作为工具结果返回。\n\n纯文本回复之后的 CONTINUE_NUDGE 提供执行、完成、询问和暂停四种去向。当前请求决定任务范围，历史待办仅保存计划；“只记录一条待办”在记录后即可完成，暂停或被拒绝的旧任务需要明确恢复。\n\n控制工具沿用[注册表](../architecture/2026-08-31-tool-registry-boundary.md)与[共享输入](../architecture/2026-09-02-shared-terminal-input.md)。退出前仍按[历史恢复规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)补齐同批未执行调用。","alternatives":"- 纯文本后直接返回：节省继续请求，但无法区分阶段说明与实际完成。\n- 清空 todo 才结束：规则直观，但会把“只记录”当作未完成，并可能触发旧任务。\n- 一律用 finish_task 停止：工具更少，但必要操作被拒绝时，会把暂停错误表述为完成。","consequences":"出口语义清楚，代价是可能增加模型请求，模型仍可能选错；十次请求上限由[循环预算](2026-09-05-loop-guard-and-request-budget.md)兜底。\n\n[todo](../architecture/2026-09-06-todo-json-persistence.md) 没有任务归属或持久化暂停字段，pause_task 原因只保留在对话中。因此当前语义约束不等于程序层面的任务隔离。","outLinks":["implemented/architecture/2026-08-31-tool-registry-boundary.md","implemented/architecture/2026-09-02-shared-terminal-input.md","implemented/architecture/2026-09-06-todo-json-persistence.md","implemented/bug-fix/2026-09-06-tool-result-history-recovery.md","implemented/feature/2026-09-05-loop-guard-and-request-budget.md"]},{"id":"implemented/process/2026-09-11-complete-board-sections.md","sourcePath":"implemented/process/2026-09-11-complete-board-sections.md","slug":"2026-09-11-complete-board-sections","lifecycle":"implemented","cls":"process","date":"2026-09-11","title":"看板完整读取笔记章节，并展示验证依据","status":"implemented","rawBody":"# Agent Note: 看板完整读取笔记章节，并展示验证依据\n\nStatus: implemented\n\n整理日期：2026-09-11。更新日期：2026-09-12。文件名日期的依据见 Verification。\n\n## Problem\n\n看板的章节提取表达式启用多行模式，又以行尾作为章节结束条件，导致一节只保留第一行。多段决定和第二条以后的备选会在界面消失，即使 Markdown 文件本身完整。\n\n## Decision\n\n笔记仍采用标准的 Problem、Decision、Alternatives considered 和 Consequences 结构，并允许多段内容。项目解析器按二级标题识别完整章节，保留到下一个标题或文本结束；代码块内的标题不切断正文。\n\n本地目录读取和离线打包共用同一解析器，原始 rawBody 保留。阅读页展示 Verification 及其他自由章节，摘要视图继续使用主要问题、决定和备选字段。原版 Skill 不改写；独立页面的布局与同步由[阅读工作台](2026-09-12-readable-board-and-stable-sync.md)约定说明。\n\n笔记之间使用有理由的相对链接，使看板可以计算引用并展示关联；历史补录依据可核实记录归位日期，不为填满状态栏虚构被否决的提案。这沿用[工具与项目配置分开维护](2026-09-11-learning-workflow-and-notes.md)的约定。\n\n## Alternatives considered\n\n- 只增加笔记数量：能补齐主题，但解析器仍会丢掉每节后续内容。\n- 把每节全部压成一行：可以迎合当前解析，但破坏 Markdown 的可读性，备选项也难以独立展示。\n- 直接修改上游模板和构建脚本：立即有效，但会给升级引入本地分叉；独立项目解析器可以显式记录并校验兼容范围。\n\n## Consequences\n\n本地连接和离线看板都能读取完整章节，代价是项目需要维护解析器与笔记格式的兼容性。读取到缺少标题或状态的文件时应报错，不将未完成保存的内容当成有效记录。\n\n看板统计引用关系，不证明某个决定更正确；已有方案的备选会进入方案取舍视图，无需伪造 rejected 笔记。原来的生成后正则补丁由共用解析器接替，避免同时维护两套修正。\n\n## Verification\n\n日期依据：2026-09-11 对五篇原笔记复现，源文件每篇有二至三条备选，原看板均只提取一条。当前实现见 [model.mjs](../../../../scripts/notes-board/model.mjs)。\n\n2026-09-11 的初版适配通过两种生成命令与笔记校验，十九篇笔记的七十六个展示字段一致，保留五十七条备选及四十二条关联；离线浏览器详情核对通过。这是当时版本的证据。\n\n2026-09-12 共用解析器的回归覆盖多段正文、全部备选、CRLF、无末尾换行以及代码块中的二级标题。运行入口为 `npm run test:board`，页面验收范围见工作台笔记。\n","sections":[{"heading":"Problem","body":"看板的章节提取表达式启用多行模式，又以行尾作为章节结束条件，导致一节只保留第一行。多段决定和第二条以后的备选会在界面消失，即使 Markdown 文件本身完整。","anchor":"section-0"},{"heading":"Decision","body":"笔记仍采用标准的 Problem、Decision、Alternatives considered 和 Consequences 结构，并允许多段内容。项目解析器按二级标题识别完整章节，保留到下一个标题或文本结束；代码块内的标题不切断正文。\n\n本地目录读取和离线打包共用同一解析器，原始 rawBody 保留。阅读页展示 Verification 及其他自由章节，摘要视图继续使用主要问题、决定和备选字段。原版 Skill 不改写；独立页面的布局与同步由[阅读工作台](2026-09-12-readable-board-and-stable-sync.md)约定说明。\n\n笔记之间使用有理由的相对链接，使看板可以计算引用并展示关联；历史补录依据可核实记录归位日期，不为填满状态栏虚构被否决的提案。这沿用[工具与项目配置分开维护](2026-09-11-learning-workflow-and-notes.md)的约定。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 只增加笔记数量：能补齐主题，但解析器仍会丢掉每节后续内容。\n- 把每节全部压成一行：可以迎合当前解析，但破坏 Markdown 的可读性，备选项也难以独立展示。\n- 直接修改上游模板和构建脚本：立即有效，但会给升级引入本地分叉；独立项目解析器可以显式记录并校验兼容范围。","anchor":"section-2"},{"heading":"Consequences","body":"本地连接和离线看板都能读取完整章节，代价是项目需要维护解析器与笔记格式的兼容性。读取到缺少标题或状态的文件时应报错，不将未完成保存的内容当成有效记录。\n\n看板统计引用关系，不证明某个决定更正确；已有方案的备选会进入方案取舍视图，无需伪造 rejected 笔记。原来的生成后正则补丁由共用解析器接替，避免同时维护两套修正。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：2026-09-11 对五篇原笔记复现，源文件每篇有二至三条备选，原看板均只提取一条。当前实现见 [model.mjs](../../../../scripts/notes-board/model.mjs)。\n\n2026-09-11 的初版适配通过两种生成命令与笔记校验，十九篇笔记的七十六个展示字段一致，保留五十七条备选及四十二条关联；离线浏览器详情核对通过。这是当时版本的证据。\n\n2026-09-12 共用解析器的回归覆盖多段正文、全部备选、CRLF、无末尾换行以及代码块中的二级标题。运行入口为 `npm run test:board`，页面验收范围见工作台笔记。","anchor":"section-4"}],"problem":"看板的章节提取表达式启用多行模式，又以行尾作为章节结束条件，导致一节只保留第一行。多段决定和第二条以后的备选会在界面消失，即使 Markdown 文件本身完整。","decision":"笔记仍采用标准的 Problem、Decision、Alternatives considered 和 Consequences 结构，并允许多段内容。项目解析器按二级标题识别完整章节，保留到下一个标题或文本结束；代码块内的标题不切断正文。\n\n本地目录读取和离线打包共用同一解析器，原始 rawBody 保留。阅读页展示 Verification 及其他自由章节，摘要视图继续使用主要问题、决定和备选字段。原版 Skill 不改写；独立页面的布局与同步由[阅读工作台](2026-09-12-readable-board-and-stable-sync.md)约定说明。\n\n笔记之间
