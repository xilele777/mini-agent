ask`；子 Agent 使用搜索和分段读取检查 `src/turn.ts`，在最终总结请求返回 `runTurn()` 的职责，主模型移除临时 todo、总结并调用 `finish_task`。两条路径均收到 usage，证明动态默认模型入口、工具结果回填和显式出口仍可工作。","anchor":"section-4"}],"problem":"`runTurn()`、工具准备与执行、模型请求和终端输出原本都在 `agent.ts` 中。导入该文件会直接启动 REPL，模型流又来自真实 API，因此同批结束工具补结果、循环守卫累计中止、纯文本请求预算和多个工具调用配对只能依赖人工或真实模型观察。\n\n这些分支承担消息协议完整性和本轮退出条件。只测试 `detectRepeatedCall()`、`collectResponse()` 等局部函数不能证明主循环把它们正确组合；继续依赖真实模型又会受到模型选择、网络和中转服务差异影响。","decision":"[turn.ts](../../../../src/turn.ts) 持有 `SYSTEM_PROMPT`、`runTurn()`、工具处理和本轮控制常量；[agent.ts](../../../../src/agent.ts) 负责启动初始化、终端用户输入、跨轮历史裁剪、结果展示和 UI 释放。阶段 11 接入后，`runTurn(messages, options)` 直接维护传入历史并返回结构化结果，入口不再回滚本轮消息。\n\n`RunTurnOptions` 接收模型入口、工具集合与请求次数，并允许替换输出：\n\n- `createStream`：由启动工厂注入真实模型流，测试注入模拟流；导入 `turn.ts` 不要求 API 环境变量，也不会启动 REPL。\n- `registry`：由启动工厂组装的主能力集合，模型 schema 与准备调用使用同一实例。\n- `maxIterations`：入口传入已校验配置，默认配置仍为十，测试可以使用更小预算稳定构造耗尽分支。\n- `write` 与 `log`：生产默认写终端，测试使用无输出或收集函数检查控制信息。\n\n工具 schema 与准备使用注入的注册表。阶段 11 增加 approve 与等待完成的 checkpoint 窄注入；主轮直接调用已准备工具的 execute，避免吞掉未知执行异常。工具抛错后停止，检查点失败向外传播，原始工具结果保留，模型视图单独截断。未建立通用执行框架；十项故障测试见 [turn-lifecycle.test.ts](../../../../src/turn-lifecycle.test.ts)。配置组装见[阶段 10 接线](../../implemented/architecture/2026-09-21-validated-runtime-config.md)。\n\n[turn.test.ts](../../../../src/turn.test.ts) 固化四类组合边界：`finish_task` 后同批剩余调用补“未执行”结果；连续相同调用累计两次命中守卫后补齐当前及剩余调用；持续纯文本达到请求上限且内部提示不产生真实用户轮；同一响应中的多个普通工具结果按各自 ID 回填并进入下一次请求。","alternatives":"- 继续只做真实模型端到端验收：最贴近运行环境，但模型输出不稳定、速度慢且依赖 API，难以稳定构造罕见退出分支。\n- 直接从 `agent.ts` 导出 `runTurn()`：改动较小，但导入模块仍会执行 `main()`，同时静态加载 API 与终端依赖；增加入口判断后，职责依旧混在同一文件。\n- 在测试中复制一份简化循环：无需改生产结构，但只能证明复制品，最容易在后续修改时与真实主循环漂移。\n- 为模型、注册表、批准、控制台和所有工具建立完整接口层：隔离最彻底，但会把学习项目推向通用框架；只注入配置组装与确定性回归实际需要的模型、注册表、次数和输出，批准及工具执行仍复用现有函数。","consequences":"主轮组合逻辑可以在不启动 REPL、不读取 API 配置和不请求真实模型的情况下稳定回放，结束工具、循环守卫、请求预算和多工具配对成为常驻回归。CLI 入口缩小后，本轮编排与跨轮历史、异常回滚的职责边界也更清楚。\n\n代价是 `runTurn()` 新增了少量依赖注入接口，测试仍执行真实的无副作用工具实现；若工具注册表或控制工具产生全局状态，测试需要继续选择隔离良好的用例。批准流程仍依赖终端人工输入，模拟流测试不能代替兼容服务协议、模型选择和交互批准的真实验收。","outLinks":["implemented/architecture/2026-09-21-validated-runtime-config.md"]},{"id":"proposed/architecture/2026-09-20-practical-mini-agent-v1.md","sourcePath":"proposed/architecture/2026-09-20-practical-mini-agent-v1.md","slug":"2026-09-20-practical-mini-agent-v1","lifecycle":"proposed","cls":"architecture","date":"2026-09-20","title":"以小而完整的本地 CLI 为完善版 v1 目标","status":"proposed","rawBody":"# Agent Note: 以小而完整的本地 CLI 为完善版 v1 目标\n\nStatus: proposed\n\n## Problem\n\nmini-agent 已具备原生工具调用、流式协议组装、权限确认、上下文裁剪、显式出口、todo、同步只读子 Agent 和确定性主轮测试，足以说明 Agent 的核心运行机制。但它仍缺少会话恢复、统一配置诊断、真实上下文预算、安全增量编辑、端到端取消、结构化运行轨迹和可交付 CLI 等产品基本面。\n\n如果继续按“想到什么功能就加什么”的方式推进，项目容易在并行 Agent、RAG、插件系统和更多工具之间膨胀，反而掩盖已经形成的清晰内核。若停在当前状态，它又更像完成度较高的教学样例，还不足以长期作为个人编码助手使用，也不能完整展示一名 Agent 实习生对可靠性、安全、状态和评测的工程理解。\n\n## Proposal\n\n完善版 v1 的目标是：实现一个微型、功能完整、小而美、能够落地、细节精致但不庞大不冗余，并且可以作为 Agent 实习作品、在常见失败条件下仍然抗打的本地 CLI Agent。\n\n“功能完整”指核心工作链闭合，而不是功能数量最大化：用户可以安装与诊断配置，开始或恢复会话，让 Agent 读取、搜索、安全编辑和执行命令，观察明确的批准与运行轨迹，在长上下文、网络失败、命令超时或进程退出后得到可解释的结果，并通过自动测试和少量真实模型场景验证关键行为。\n\n### Product boundary\n\nv1 保持以下边界：\n\n- 单用户、单进程、单项目根目录的本地 CLI，不建立服务端、Web UI 或多租户体系。\n- 继续直接使用 OpenAI-compatible SDK、原生 Function Calling、Zod 和显式工具注册表，不引入 LangChain、LlamaIndex 或通用工作流框架。\n- 主 Agent 保持单轮顺序执行；现有同步只读子 Agent 足以展示上下文隔离和能力收窄，v1 不增加并行、递归委派或分布式调度。\n- 状态使用可检查的本地文件和原子替换，不引入数据库；配置、会话、轨迹和 todo 各有明确所有者，不共享隐式全局状态。\n- 新抽象必须服务于一个已经存在的失败边界、去除真实重复或建立可测试接口；不为未来插件、供应商或部署形态预建框架。\n- 自动测试负责确定性协议和状态边界，真实模型评测只覆盖少量关键工作流，不把模型措辞当作稳定快照。\n\n### Roadmap\n\n按依赖顺序完成六个阶段，每个阶段都有可单独检查的交付物；恢复、取消和预算遵循下文的共同约定，不把阶段理解为互不相关的模块：\n\n1. **阶段 10：统一配置与启动诊断** — 集中解析模型、base URL、shell、超时和预算；提供不泄露密钥的 doctor。阶段结束前确定取消信号、运行结果和预算归属的最小约定，定义贯穿后续阶段的任务夹具，并将现有确定性检查接入基础 CI；不提前建设完整运行框架。\n2. **阶段 11：会话持久化与恢复** — 保存带格式版本、项目绑定、完整历史、轮边界和会话 todo 的原子快照，支持新建、列出和恢复。保留已执行动作及中断状态，结果不确定时先核查；恢复不自动重放工具。损坏或不兼容文件隔离处理，不静默覆盖。\n3. **阶段 12：上下文预算与压缩** — 先实现每次请求前的预算检查、完整旧轮裁剪与超限停止，再增加可持久化摘要。原始历史与发送给模型的上下文分离；覆盖当前轮过长、工具定义开销、输出预留和摘要失败，不只处理历史轮数。\n4. **阶段 13：安全增量编辑与命令执行** — 增加精确旧文本、文件指纹、原子替换和 diff 预览，批准后执行前重新检查冲突；收紧旧写入入口并统一文件工具的项目边界。接入共同取消信号，在支持的 shell 环境验证命令超时、取消和子进程树清理。\n5. **阶段 14：运行韧性与可观测性** — 验证取消贯穿输入、批准、主／子 Agent、摘要、模型请求和工具；整合有限传输重试、全轮次数／时间／token 预算，以及从类型化事件生成的终端输出和脱敏 JSONL 轨迹。沿用前面阶段的生命周期约定，不在此时重新定义状态归属。\n6. **阶段 15：评测与交付收尾** — 汇总各阶段已经积累的模拟流、故障注入和真实模型证据，完成新环境安装、CLI 参数、帮助、退出码、README、跨平台 shell 配置与可执行入口验收；形成可克隆、可诊断、可运行、可恢复的 v1。\n\n每个阶段开始时再为其中的非平凡机制建立或更新所属决策笔记；本路线固定目标、顺序和跨模块行为保证，具体接口、文件布局和算法留给所属阶段。测试随模块进入常驻回归，阶段 15 不承担补建全部测试的工作。\n\n### Session recovery and state ownership\n\n原子替换只保护单份状态文件，不会把文件修改、shell 命令和会话保存变成一个事务。当前[异常恢复规则](../../implemented/bug-fix/2026-09-06-tool-result-history-recovery.md)会回退本轮消息而保留外部副作用；阶段 11 必须调整这一规则，不能直接把回退后的“干净历史”当成完整恢复依据。\n\n- 会话绑定规范化的项目根目录并保存格式版本；从其他目录打开时明确报告不匹配，不把历史中的相对路径自动解释到新项目。未知版本和损坏内容不得作为空会话覆盖。v1 不支持同一会话的多个写入者，发现已被占用时拒绝再次写入。\n- 原始历史是恢复与核查的依据；供模型使用的裁剪历史和摘要是派生视图，不能覆盖原始历史。摘要应标明覆盖范围，恢复时不能重复拼入已经被摘要覆盖的旧消息。\n- todo 随会话保存，新建会话不继承其他会话的任务。旧项目级 `.mini-agent-todo.json` 保留并提示存在，不默默复制进每个新会话。批准缓存保持进程内有效，切换会话时清空，不写入快照；配置和密钥不随对话恢复。\n- 在有副作用的工具执行前，先可靠保存调用身份、参数和待执行记录；保存失败就不执行。工具返回后保存已确认结果，再继续后续动作。执行中崩溃，或执行后结果尚未可靠保存，恢复时均按“结果不确定”处理，不能猜测为成功或未执行。\n- 恢复先展示中断位置、已确认动作和待核查动作，等待用户继续；不能自动重放未完成调用。继续前核查可观察的外部状态，无法核查的结果如实保留不确定性。协议缺失项可以补为明确的未执行／结果不确定说明，但不得伪造成功结果。\n\n恢复记录只需表达调用与结果的最小事实，不要求提前实现完整 JSONL 轨迹或事件溯源系统。v1 不承诺任意外部命令恰好执行一次，也不承诺自动撤销副作用。\n\n### Stage 11 storage candidate\n\n2026-09-21，阶段 11 的存储、会话格式、动作状态与恢复调度均已由学习者接入，已落地的协议与验证证据归[原子快照存储与会话状态](../../implemented/architecture/2026-09-21-atomic-session-storage.md)。以下基础格式与检查点候选保留分步设计背景，当前实现以版本 2 接线为准；阶段 12–15 尚未完成，本路线整体保持 proposed。\n\n- 仅 `ENOENT` 表示没有快照；非法 JSON、未知版本、结构不符及其他读取错误必须阻止打开，保留原文件。会话层必须先取锁、再读取校验，读取失败不得继续保存；底层写函数不独自承担会话打开策略。\n- 保存先校验并序列化，再在目标同目录以 `wx` 创建唯一临时文件，写入、`sync`、关闭后 `rename` 替换目标。不先删除旧快照；失败时清理本次临时文件。该协议面向本地文件系统的进程中断边界，没有目录同步与断电故障验证，不承诺断电后最新快照必然存在。\n- 会话整个打开期间持有以 `wx` 排他创建的 `session.lock`，记录 PID 与创建时间，正常退出时释放。保存必须顺序等待；锁约束遵循该协议的会话进程，不阻止外部程序直接改文件。崩溃后遗留锁保守拒绝，不按 PID 或时间自动抢占；后续恢复入口需给出确认旧进程退出后的清理指引。\n- 存储和数据层不执行工具、不迁移旧 todo；REPL 通过独立会话运行入口接线，列表错误隔离、项目身份校验及用户恢复提示均已有验证。\n\n存储模块先在临时目录通过类型检查与八项测试，随后学习者接入常驻源码与测试。学习者与 AI 当时分别验证类型检查和七十七项全量回归通过；主程序已在后续会话接线中使用该模块。\n\n### Stage 11 session ownership candidate\n\nsession-schema.ts 与 session.ts 已由学习者接入，每个会话在规范化项目根目录的 `.mini-agent/sessions/\u003cUUID>/` 保存 snapshot.json 与独占锁。目录 ID 与快照 ID、快照项目根必须匹配，打开只读取数据，不请求模型、不执行工具。新建时不合并已有目录；打开不存在的会话不创建空目录。已落地事实归存储笔记的 Session ownership。\n\n会话句柄持有内存状态与锁，读取 snapshot 返回深副本；update 在独立草稿上修改，经身份与 schema 检查后保存，成功后才发布内存状态。更新允许等待回调完成，但回调只用于修改草稿，不作为执行外部副作用的事务。busy 标记拒绝重叠更新或保存中关闭；close 后不能继续更新。\n\n早期版本 1 只验证文本与 function calling 消息形状、startsTurn 和 todo 编号；正式 CLI 已升级为版本 2，补充轮结果、动作归属与工具结果配对。版本 1 缺少动作证据，拒绝加载并保留原文件，不静默解释成可继续执行的新状态。\n\n列表读取已提交快照，不获取写锁，逐条隔离错误并保留原文件；某条损坏或项目不匹配不会阻断其他条目。选择逻辑隔离而不自动移动坏文件，保留排查位置并减少列出动作的副作用。旧 todo 保留、不自动迁移；当前 todo 工具使用会话句柄，批准缓存启动时清空。\n\n参考先在临时目录通过项目配置的类型检查、与 HistoryMessage 的赋值兼容检查及九项确定性测试；学习者随后接入。学习者与 AI 分别验证类型检查和八十六项全量回归通过，尚不包含 CLI、模型或工具崩溃恢复。\n\n### Stage 11 turn checkpoint candidate\n\n主轮检查点已由学习者接入并报告验收通过：runTurn 返回 completed、paused、cancelled、failed 或 budget_exhausted，控制工具的 endsTurn 携带 completed／paused，而不从终端措辞猜结果。完成只表示调用完成出口，不代表外部验收成功。会话持久化回调已由 runSessionTurn 接入。\n\n主轮通过可选 checkpoint 回调等待消息更新、动作边界及轮结束保存。回调收到消息与事件深副本；工具以本轮消息数组中的 messageIndex 与调用 ID 联合定位，后续会话入口另加 turnId。assistant 的整批调用先随消息保存，参数校验和批准后等待 started 检查点，再进入 execute；started 表达已进入可能执行的窗口，崩溃后不能据此断定实际执行过。\n\n所有工具统一记录。正常返回记 returned，它只证明取得返回文本，不保证任务成功；校验失败、批准拒绝、循环守卫与同批剩余调用记 not_executed；工具抛错或执行中取消记 uncertain 并停止本轮。普通模型或批准错误保留已有消息、给未执行调用补结果，返回失败或取消。主轮直接调用已准备好的 tool.execute，避免公共 executeCall 吞掉未知执行异常；只读子 Agent 的旧路径暂不改造。\n\ncheckpoint 任意异常包装成 CheckpointError 并立即上抛；不继续工具，不在保存失败后再次尝试写“正常收尾”。agent.ts 删除本轮 checkpoint 回滚，消费结构化结果，保存失败时退出。工具结果原文与跨轮完整历史保留在会话中，仅在模型请求视图中裁剪和截断。\n\n备选是只在轮末保存、使用不等待的通知回调或继续将所有工具异常当普通文本：前者缺失轮中动作窗口，第二种不能阻止保存失败后的动作，第三种可能继续执行而掩盖副作用。选择同步等待检查点及保守停止，代价是额外保存、深复制，以及暂时无法区分某些工具抛错前是否真正改变外部状态。callback 在 runTurn 中仍为可选接口，正式 CLI 经 runSessionTurn 注入持久化；它不是完整事件轨迹框架。\n\nAI 在隔离源码副本中验证类型检查及九十六项回归通过，其中十项新测试覆盖保存前后失败、真实临时文件写入后抛错、批准／参数拒绝、模拟取消、后续模型失败、原始结果与模型视图区分、回调隔离与状态分类。副本随后清理。模拟 AbortError 不等于全链路取消；没有进程强杀、真实模型或完整恢复不重放的运行证据。\n\n### Runtime lifecycle and budgets\n\n2026-09-22，阶段 14 的统一运行控制器、有限传输重试、共享预算和脱敏事件已实现，当前协议及验证归[运行韧性](../../implemented/architecture/2026-09-22-runtime-resilience.md)。阶段 15 的 CLI、编译安装和证据汇总已接入，归[交付契约](../../implemented/process/2026-09-22-cli-delivery.md)与[评测汇总](../../../learning/evaluation.md)。下文阶段 10–13 的候选和运行记录保留当时证据；阶段 14–15 人工验收和远程 CI 未完成，路线整体保持 proposed，不把实现完成写成所有环境验收通过。\n\n阶段 11 已接入版本 2 快照，turns 保存 turnId、起始消息位置、轮结果和动作状态；参数保留在原始 assistant 调用中，通过消息位置与调用 ID 关联，不重复保存。schema 校验工具结果配对、动作归属、未结束动作所属轮及结果一致性。普通文本历史允许独立保存，受管理 CLI 请求另有明确轮记录。\n\n接线候选在检查点中同步更新消息与动作，保持 todo 的最新会话状态，避免使用旧副本覆盖工具刚提交的 todo。恢复只把 pending 补为未执行、started 补为不确定，并把中断轮标为 failed；生成的 tool 消息明确标识恢复记录。恢复不请求模型、不执行工具，等待新的用户输入。不确定动作的核查约束作为派生模型提示保留，避免旧轮裁剪后丢掉核查要求。模型请求只裁剪视图，原始会话历史持续保留。\n\nCLI 每次启动选定一个新会话或 --resume 会话；--sessions 可离线列出。批准缓存启动时清空且不持久化；旧项目 todo 保留并提示，不迁移。会话 todo 改为注入句柄的工具工厂，写盘错误包装为 CheckpointError 使主轮立即停止。受控文件工具阻止直接访问 .mini-agent 内部状态；经用户批准的 shell 仍不是沙箱。遗留锁不自动抢占，需确认原进程退出后人工清理。\n\n选择恢复时补有标签的协议结果，保留原始调用和已确认结果，代价是历史同时包含真实观察与显式合成的恢复说明；不采用自动重放或丢弃半轮。版本 1 没有动作证据，拒绝自动迁移，保留旧文件并由用户新建版本 2 会话。学习者已按对话中的逐文件代码接入，落地事实归会话存储笔记，整体路线保留 proposed。\n\n隔离副本先通过类型检查、四十三项相关回归以及最终七项新增集成测试。学习者随后提供实际工作区类型检查与全量 103 项通过记录，以及真实模型添加待办、正常退出、列表、恢复 6 条消息与 1 项待办、等待新输入后列出原待办并完成的记录。受控子进程测试证明写入后 process.exit 遗留锁，确认退出并清锁后不重放；这不等于断电、强杀或全链路取消验收。\n\n阶段 10 确定约定，后续阶段按实际需要接入：每个真实用户轮由入口创建取消控制器，主 Agent、子 Agent、摘要请求、批准等待及工具接收同一取消信号。取消后不再安排新动作，收尾记录已完成与不确定的结果；取消和超时都不表示已撤销副作用。\n\n运行结果区分完成、暂停、取消、失败和预算耗尽，供 CLI、会话保存和轨迹共同使用，不能只靠终端文本猜测，也不能把所有工具异常都转成可继续执行的普通字符串。具体类型由实现阶段确定；取消必须能传播到调度边界。\n\n单次上下文窗口与整轮累计消耗分别配置和检查。整轮预算覆盖主请求、委派、摘要与重试；子 Agent 仍可有更小的局部上限，但不得绕过总上限。摘要和子 Agent 最终总结也必须先取得预算，不能耗尽后再额外请求。usage 缺失时标注未知或估算，不记为零；时间与请求次数仍提供确定的停止边界。\n\n重试由一个明确的层负责，配置时核对 SDK 自带重试，避免与外层重试叠加。只重试尚未产生可见输出和本次工具执行的可重试传输失败，不重跑整轮；协议错误、权限拒绝和结果不确定的工具执行不得自动重试。\n\n阶段 10 先固定以下语义，后续按所属阶段接入，不提前增加尚无消费者的运行时类型：\n\n| 共同约定 | 具体语义与所有者 | 接入阶段 |\n| --- | --- | --- |\n| 用户轮身份 | 入口为每次真实用户输入创建 turnId；委派、摘要、重试保留所属 turnId，子任务另有自己的标识 | 11 起 |\n| 完成结果 | completed、paused、cancelled、failed、budget_exhausted 分开保存；循环守卫中止属于 failed 并记录原因；只有完成出口属于 completed，不等同于外部验收通过 | 11 起 |\n| 取消归属 | 入口持有本轮 AbortController，子流程只接收信号；取消中止当前等待并阻止后续动作；等待下一条用户输入属于 CLI 生命周期，不伪造用户轮 | 13–14 |\n| 请求与时间 | 当前 10／6 为主／子循环局部上限；总预算由同一用户轮持有，请求发送前预留次数，每次真实传输尝试计数，包括失败和重试 | 12 起，14 汇总 |\n| 总时限 | 按单调时钟从用户提交起计时，包含批准等待；批准返回后仍需检查取消与剩余时间，已过期的动作不能开始执行 | 13–14 |\n| token 账目 | 每次发送前检查输入估算与输出预留，响应后结算实际 usage；缺失 usage 保留估算／未知标记，不宣称精确费用硬上限；摘要和委派共享总额 | 12 起，14 汇总 |\n| 收尾与恢复 | 确认完成的动作保留结果，未开始的动作标记未执行，执行结果未确认的动作标记不确定；记录失败后不再继续发起副作用 | 11 起 |\n\n配置与 doctor 的当前实现仅有局部请求次数和单请求超时，上述跨轮记录与全轮信号不是已实现能力。固定任务与 CI 的落地边界见[夹具与 CI 决定](../../implemented/testing/2026-09-21-repeatable-fixture-and-ci.md)。\n\n### Context budget and compaction\n\n在主 Agent、子 Agent 和摘要的每次模型请求前计算输入预算，包含 system、工具定义、历史、当前输入和消息协议开销，并预留输出空间。已知模型使用适配的计数方法；未知兼容模型采用明确标注的保守估算和余量，不把估算称为服务端 token 硬保证。上下文超限响应有明确处理，不能无变化地无限重试。\n\n阶段 12 先实现确定性裁剪：只移除完整旧用户轮，保护工具调用与结果配对，不把内部提示当成用户新轮。若裁掉旧轮后，当前轮、单次输入或工具定义仍超限，则停止并提示缩小任务；不发送已知超限的请求，也不强行切断当前工具配对。v1 无需为了处理所有超长任务实现任意位置的轮内压缩。\n\n之后增加旧轮摘要，保留当前目标、用户约束、已确认动作、拒绝与待核查事项；摘要作为有来源的上下文材料，不提升为新的系统权限。摘要请求本身也受窗口和整轮预算限制。生成、校验或保存失败时保持原状态；仅在裁剪后的上下文仍满足约束时继续，否则明确停止，不循环发起摘要。原始历史持续保留，压缩只改变模型请求视图。\n\n2026-09-21，`buildContext(history, tools, budget)` 及主／子请求链路已由学习者接入。独立预算模块先通过全量 111 项测试，接线后类型检查及全量 120 项通过，并有真实计算得到 391 后完成的记录。随后用户授权 AI 直接完成持久化摘要及失败回退，类型检查、全量 140 项测试和一次受控真实模型摘要／重开／增量摘要用例通过。阶段 12 本地实现与验收完成；实现事实与证据范围归[结果截断与整轮裁剪](../../implemented/architecture/2026-09-05-bounded-conversation-context.md)，配置归[统一配置](../../implemented/architecture/2026-09-21-validated-runtime-config.md)。阶段 13–15 未完成，整体路线保持 proposed。\n\n已接入模块覆盖文本 CLI 的保守估算；模型专用 tokenizer 留作有实际 usage 对照后的适配，粗估不能当作服务端硬保证。窗口、输出预留、安全余量已接入统一配置，输出预留已映射到请求体的生成上限。\n\n摘要已沿用每次请求前检查与明确停止语义，覆盖范围与原文指纹进入 v3 快照，保存成功后发布；主请求与摘要共享主轮次数且摘要前预留一次正常请求。委派仍用局部次数，阶段 14 再统一全轮的主／子／摘要／重试账目、token 与时间总额，不把本阶段主／摘要合计次数描述为完整总预算。\n\n[OpenAI 官方接口](https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create) 的既有核对说明 max_completion_tokens 包含可见输出及推理 token，max_tokens 已弃用且不兼容 o-series；选择后者的兼容服务须以其实际协议为准。真实短任务能成功不等于服务端严格执行配置上限，后续验证保留这一边界。\n\n请求接线候选与学习者正式源码各有 120 项验证记录；摘要接入后 AI 在工作区重新验证 140 项测试。真实摘要用例共四次模型请求，两次摘要及两次完成，保留项目代号和拒绝写入约束，重开后增量压缩通过。全轮统一累计账目仍属于阶段 14。\n\n### Edit approval and filesystem boundary\n\n阶段 13 已按用户授权由 AI 直接实现，当前协议、真实备选及边界归[安全增量编辑](../../implemented/feature/2026-09-21-safe-incremental-editing.md)与[命令中断清理](../../implemented/bug-fix/2026-09-06-shell-interruption-reporting.md)。常驻测试覆盖受控批准、冲突拒写和固定任务经实际 Git Bash 验收，以及 Windows 子孙进程超时／取消退出。真实模型正常修复、拒绝、冲突拒写与命令取消已有学习者终端记录；AI 核实对应文件及相关快照。剩余人工超时和取消后恢复由学习者简短确认完成，未附新日志；Linux 和远程 CI 本轮未运行。阶段 14–15 仍未完成，本路线保持 proposed。\n\n增量编辑要求旧文本精确且唯一匹配，并针对读取到的文件版本生成候选内容与可读 diff。批准绑定项目内目标、基准指纹和候选修改；执行前再次核对路径与文件指纹。批准等待期间文件发生变化时拒绝写入，重新读取、生成 diff 并重新批准，不把旧批准应用到新版本。冲突拒绝不能退化为整文件覆盖。\n\nv1 将 `write_file` 限定为创建新文件，已有文件通过增量编辑修改；创建时仍需批准，并拒绝覆盖批准后出现的同名文件。新建与编辑共同检查项目边界、敏感路径及链接目标；新建文件还需检查已有父目录的真实路径。原子替换保证单文件写入完整，不意味着多个文件修改构成事务，也不能替代冲突检查。\n\n项目路径约束针对受控文件工具。批准后的 shell 仍可访问操作系统允许的范围，预览需显示实际工作目录、shell 和完整命令，不宣称获得沙箱隔离。子进程清理以明确支持的系统／shell 组合验收；不能确认后代进程已结束时如实报告，不能仅凭发送了终止信号就宣称清理成功。\n\n### End-to-end task and incremental evaluation\n\n阶段 10 定义一个可重置的小型 TypeScript 示例仓库：包含一个可复现缺陷、能揭示该缺陷的测试和应保持不变的无关文件。先记录当前能力与失败点，后续阶段沿用同一任务，避免每次只挑新功能容易成功的演示。\n\n主任务链为：定位缺陷 → 阅读证据 → 展示 diff 并取得批准 → 修改 → 执行测试 → 按实际结果总结。以预期文件变化、目标测试、原有回归及无关文件未改作为成功依据；调用 `finish_task` 或声称成功不构成验收证据。\n\n| 场景 | 可检查的结果 | 主要引入阶段 |\n| --- | --- | --- |\n| 配置与基线 | 缺配置、错误 API 路径和不可用 shell 可诊断；现有确定性检查进入 CI | 10 |\n| 中断恢复 | 工具开始前、执行中、执行后保存前注入故障；恢复不自动重放、不把未知结果当成功，损坏快照不覆盖上一份可用状态 | 11 |\n| 长上下文 | 旧轮压缩、当前轮单独超限、摘要失败均有明确结果；每次请求视图合法，原始历史仍可查 | 12 |\n| 编辑与拒绝 | 主任务产生预期 diff；拒绝后目标动作不执行；重复匹配和批准后文件变化均不写入 | 13 |\n| 取消与超时 | 输入／批准等待、模型流、委派和运行中命令可以取消；取消后不启动后续工具，支持环境下验证后代进程清理 | 13–14 |\n| 重试与总预算 | 传输重试不重放此前动作；主请求、委派、摘要、重试统一计数；预算耗尽明确停止 | 14 |\n| 干净环境交付 | Windows 主环境完成安装、doctor、主任务和恢复；Linux 完成配置与非交互检查 | 15 |\n\n故障窗口和状态边界优先用确定性模拟、临时目录和受控子进程验证；不依赖真实模型恰好在某个时刻失败。真实模型逐阶段补普通任务、拒绝、恢复、长上下文与只读委派的使用证据，并记录模型／配置、任务结果、错误修改、请求数、token、耗时和人工干预。重复次数在评测前确定，保留失败记录，不把挑选出的成功运行当成成功率。\n\nv1 交付要求上述确定性验收全部通过、主任务及列出的真实工作流均有可核对的通过记录；成本和耗时先给出测量值，不预设缺乏基线的性能承诺。这些场景是有限能力证据，不代表任意仓库与任务都能成功。\n\n### Explicit non-goals for v1\n\n- 完整操作系统或容器沙箱；v1 明确展示批准与边界，但不宣称能安全执行任意不可信命令。\n- GUI、IDE 插件、远程服务、多用户或跨设备同步。\n- 并行／递归多 Agent、结构化任务图、工作流引擎和分布式队列。\n- 向量数据库、RAG、长期知识库、模型路由和自动供应商切换。\n- MCP／插件市场或允许第三方代码任意扩展工具的运行时平台。\n\n这些方向只有在 v1 的真实使用证据表明现有边界成为瓶颈时才重新评估。\n\n## Alternatives considered\n\n- 停在当前教学内核：代码最少，核心原理也已经完整，但对话不能恢复、配置和失败诊断较弱，无法达到“能够落地并长期使用”的目标。\n- 追求 Claude Code 的功能广度：并行 Agent、IDE、远程服务、插件、RAG 和完整沙箱会更强，但需要完全不同的产品与安全工程规模，不符合微型和实习作品的边界。\n- 尽早迁移到 Agent 框架：会快速获得持久化、回调和工具封装，但关键控制流与失败语义被框架隐藏，削弱该项目展示底层理解和工程判断的价值。\n- 先建设通用插件或工作流平台：未来扩展成本可能降低，但当前只有一个主 Agent 和一个只读子 Agent，抽象对象不足；会先产生配置、生命周期和兼容负担，再等待可能不会出现的需求。\n- 只在完整用户轮结束后保存快照：写盘少、历史天然易于配对，但轮中已有副作用而结果未保存时无法给出可靠恢复说明；v1 增加副作用前后的最小记录，接受额外写盘和不确定状态处理。\n- 先建完整事件溯源与通用执行框架：可统一恢复和轨迹，但会提前冻结所有模块接口；v1 先约定取消、结果和预算归属，恢复用最小动作记录，完整轨迹在阶段 14 整合。\n- 直接覆盖 JSON 或先删旧文件再重命名：步骤少，但会在部分写入或替换失败时失去旧快照；候选存储层接受同目录临时文件和额外同步操作的成本。\n- 自动按 PID 或锁龄抢占遗留锁：恢复方便，但 PID 复用、进程存活检查权限及长任务都可能造成误判；候选方案先保守拒绝，接受崩溃后需要核查与人工清理的操作成本。\n- 暴露可变内存对象或更新前发布内存：调用方代码短，但容易绕过写盘或在保存失败后让模型看到未提交状态；会话句柄选择深副本、草稿和保存成功后发布，接受复制完整历史的开销。\n- 自动移动损坏会话到隔离目录：正常目录更整洁，但只列出会话也会改文件位置，失败时还需处理移动与锁；当前候选按条目报告错误并保留原地，后续有明确整理需求再增加显式操作。\n- 首先实现模型摘要以保留更多上下文：长对话信息利用更灵活，但同时引入请求成本、摘要失真和失败恢复；先建立确定性预算边界，再加入摘要，便于分别验证。\n- 保留可覆盖任意已有文件的 `write_file`：调用简单，也适合整份生成，但会成为绕过精确编辑与冲突检查的入口；v1 用它创建文件，已有文件统一走受控编辑，接受复杂重写需要拆分修改的代价。\n\n## Acceptance criteria\n\n- 新机器在安装依赖后，可以通过单一 doctor 命令定位缺少的配置、错误的兼容 API 地址或不可用 shell，且任何输出不包含密钥。\n- 用户可以新建、退出并恢复绑定项目的会话；todo 随会话隔离，批准不跨恢复继承。保存失败或部分写入不破坏上一份可用快照，未知版本和损坏内容不静默覆盖，第二个写入者不能覆盖同一会话。\n- 副作用发生后的失败不能仅以丢弃本轮消息处理；已确认动作与结果不确定动作可区分，恢复不自动重放工具，残缺工具调用不会进入下一次模型请求。中断故障窗口按上表验收。\n- 每次主／子 Agent 和摘要请求均检查完整输入与输出预留；旧轮裁剪、单轮超限和摘要失败有确定行为。摘要不破坏调用配对或真实轮边界，原始历史保持可核查。\n- 受控文件工具限制在项目边界内；增量编辑具有唯一匹配、指纹检查、原子替换和可读 diff，批准后出现冲突不写入，旧写入入口不能绕过保护。命令可批准、超时、取消，并如实报告副作用和清理结果。\n- 完成、暂停、取消、失败和预算耗尽可区分；取消贯穿交互等待、主／子 Agent、摘要、模型请求和工具。传输重试有限且不叠加隐式重试，不重放已经执行的动作。\n- 每轮可以查看脱敏的请求数、工具调用、耗时和 token 汇总，缺失 usage 不伪装为零；委派、摘要和重试计入整轮预算。确定性回归与真实模型评测随阶段累积，主任务成功由文件和测试证明。\n- CLI 帮助、配置说明、工具列表和项目结构与当前实现一致；Windows 为主要验收环境，Linux 至少具备可配置 shell 和非交互自动检查。\n- v1 完成时仍保持单进程本地 CLI、直接 SDK、显式注册表和同步只读子 Agent；没有为了“完整”引入非目标中的平台能力。\n\n## Risks\n\n会话和轨迹可能包含源码、命令输出和模型回复，必须默认保存在本地、明确路径并提供清理方式；日志脱敏不能被描述成绝对不会泄密。\n\n摘要压缩会引入信息损失和额外模型请求，必须保留原始持久化历史或可恢复快照，并用测试保护轮边界。重试若与流式输出或副作用混合，可能导致重复动作，因此只允许在明确尚未产生可见结果和副作用的传输阶段发生。\n\n副作用前后写盘增加 IO 与失败处理；完整历史持续增长，需明确保留和清理方式，不能把单次 prompt 有界等同于磁盘占用有界。原子替换的进程中断保障不自动等于断电持久性保证，具体写盘协议及支持范围由阶段 11 说明和验证。\n\n文件指纹和路径复查用于检测通常的外部修改，无法单独构成抵御恶意并发文件系统变更的完整隔离。Windows／Git Bash 的后代进程清理与其他系统存在差异，必须在声明支持的环境实测，不能仅用 mock 推断。恢复时遇到不可核查副作用需要人工判断，这是保持实现规模可控的代价。\n\n“小而美”容易在阶段推进中被新想法侵蚀。每项新增能力都要回答它关闭了哪个 v1 验收缺口；不能回答时留在非目标列表，而不是顺手加入主线。\n","sections":[{"heading":"Problem","body":"mini-agent 已具备原生工具调用、流式协议组装、权限确认、上下文裁剪、显式出口、todo、同步只读子 Agent 和确定性主轮测试，足以说明 Agent 的核心运行机制。但它仍缺少会话恢复、统一配置诊断、真实上下文预算、安全增量编辑、端到端取消、结构化运行轨迹和可交付 CLI 等产品基本面。\n\n如果继续按“想到什么功能就加什么”的方式推进，项目容易在并行 Agent、RAG、插件系统和更多工具之间膨胀，反而掩盖已经形成的清晰内核。若停在当前状态，它又更像完成度较高的教学样例，还不足以长期作为个人编码助手使用，也不能完整展示一名 Agent 实习生对可靠性、安全、状态和评测的工程理解。","anchor":"section-0"},{"heading":"Proposal","body":"完善版 v1 的目标是：实现一个微型、功能完整、小而美、能够落地、细节精致但不庞大不冗余，并且可以作为 Agent 实习作品、在常见失败条件下仍然抗打的本地 CLI Agent。\n\n“功能完整”指核心工作链闭合，而不是功能数量最大化：用户可以安装与诊断配置，开始或恢复会话，让 Agent 读取、搜索、安全编辑和执行命令，观察明确的批准与运行轨迹，在长上下文、网络失败、命令超时或进程退出后得到可解释的结果，并通过自动测试和少量真实模型场景验证关键行为。\n\n### Product boundary\n\nv1 保持以下边界：\n\n- 单用户、单进程、单项目根目录的本地 CLI，不建立服务端、Web UI 或多租户体系。\n- 继续直接使用 OpenAI-compatible SDK、原生 Function Calling、Zod 和显式工具注册表，不引入 LangChain、LlamaIndex 或通用工作流框架。\n- 主 Agent 保持单轮顺序执行；现有同步只读子 Agent 足以展示上下文隔离和能力收窄，v1 不增加并行、递归委派或分布式调度。\n- 状态使用可检查的本地文件和原子替换，不引入数据库；配置、会话、轨迹和 todo 各有明确所有者，不共享隐式全局状态。\n- 新抽象必须服务于一个已经存在的失败边界、去除真实重复或建立可测试接口；不为未来插件、供应商或部署形态预建框架。\n- 自动测试负责确定性协议和状态边界，真实模型评测只覆盖少量关键工作流，不把模型措辞当作稳定快照。\n\n### Roadmap\n\n按依赖顺序完成六个阶段，每个阶段都有可单独检查的交付物；恢复、取消和预算遵循下文的共同约定，不把阶段理解为互不相关的模块：\n\n1. **阶段 10：统一配置与启动诊断** — 集中解析模型、base URL、shell、超时和预算；提供不泄露密钥的 doctor。阶段结束前确定取消信号、运行结果和预算归属的最小约定，定义贯穿后续阶段的任务夹具，并将现有确定性检查接入基础 CI；不提前建设完整运行框架。\n2. **阶段 11：会话持久化与恢复** — 保存带格式版本、项目绑定、完整历史、轮边界和会话 todo 的原子快照，支持新建、列出和恢复。保留已执行动作及中断状态，结果不确定时先核查；恢复不自动重放工具。损坏或不兼容文件隔离处理，不静默覆盖。\n3. **阶段 12：上下文预算与压缩** — 先实现每次请求前的预算检查、完整旧轮裁剪与超限停止，再增加可持久化摘要。原始历史与发送给模型的上下文分离；覆盖当前轮过长、工具定义开销、输出预留和摘要失败，不只处理历史轮数。\n4. **阶段 13：安全增量编辑与命令执行** — 增加精确旧文本、文件指纹、原子替换和 diff 预览，批准后执行前重新检查冲突；收紧旧写入入口并统一文件工具的项目边界。接入共同取消信号，在支持的 shell 环境验证命令超时、取消和子进程树清理。\n5. **阶段 14：运行韧性与可观测性** — 验证取消贯穿输入、批准、主／子 Agent、摘要、模型请求和工具；整合有限传输重试、全轮次数／时间／token 预算，以及从类型化事件生成的终端输出和脱敏 JSONL 轨迹。沿用前面阶段的生命周期约定，不在此时重新定义状态归属。\n6. **阶段 15：评测与交付收尾** — 汇总各阶段已经积累的模拟流、故障注入和真实模型证据，完成新环境安装、CLI 参数、帮助、退出码、README、跨平台 shell 配置与可执行入口验收；形成可克隆、可诊断、可运行、可恢复的 v1。\n\n每个阶段开始时再为其中的非平凡机制建立或更新所属决策笔记；本路线固定目标、顺序和跨模块行为保证，具体接口、文件布局和算法留给所属阶段。测试随模块进入常驻回归，阶段 15 不承担补建全部测试的工作。\n\n### Session recovery and state ownership\n\n原子替换只保护单份状态文件，不会把文件修改、shell 命令和会话保存变成一个事务。当前[异常恢复规则](../../implemented/bug-fix/2026-09-06-tool-result-history-recovery.md)会回退本轮消息而保留外部副作用；阶段 11 必须调整这一规则，不能直接把回退后的“干净历史”当成完整恢复依据。\n\n- 会话绑定规范化的项目根目录并保存格式版本；从其他目录打开时明确报告不匹配，不把历史中的相对路径自动解释到新项目。未知版本和损坏内容不得作为空会话覆盖。v1 不支持同一会话的多个写入者，发现已被占用时拒绝再次写入。\n- 原始历史是恢复与核查的依据；供模型使用的裁剪历史和摘要是派生视图，不能覆盖原始历史。摘要应标明覆盖范围，恢复时不能重复拼入已经被摘要覆盖的旧消息。\n- todo 随会话保存，新建会话不继承其他会话的任务。旧项目级 `.mini-agent-todo.json` 保留并提示存在，不默默复制进每个新会话。批准缓存保持进程内有效，切换会话时清空，不写入快照；配置和密钥不随对话恢复。\n- 在有副作用的工具执行前，先可靠保存调用身份、参数和待执行记录；保存失败就不执行。工具返回后保存已确认结果，再继续后续动作。执行中崩溃，或执行后结果尚未可靠保存，恢复时均按“结果不确定”处理，不能猜测为成功或未执行。\n- 恢复先展示中断位置、已确认动作和待核查动作，等待用户继续；不能自动重放未完成调用。继续前核查可观察的外部状态，无法核查的结果如实保留不确定性。协议缺失项可以补为明确的未执行／结果不确定说明，但不得伪造成功结果。\n\n恢复记录只需表达调用与结果的最小事实，不要求提前实现完整 JSONL 轨迹或事件溯源系统。v1 不承诺任意外部命令恰好执行一次，也不承诺自动撤销副作用。\n\n### Stage 11 storage candidate\n\n2026-09-21，阶段 11 的存储、会话格式、动作状态与恢复调度均已由学习者接入，已落地的协议与验证证据归[原子快照存储与会话状态](../../implemented/architecture/2026-09-21-atomic-session-storage.md)。以下基础格式与检查点候选保留分步设计背景，当前实现以版本 2 接线为准；阶段 12–15 尚未完成，本路线整体保持 proposed。\n\n- 仅 `ENOENT` 表示没有快照；非法 JSON、未知版本、结构不符及其他读取错误必须阻止打开，保留原文件。会话层必须先取锁、再读取校验，读取失败不得继续保存；底层写函数不独自承担会话打开策略。\n- 保存先校验并序列化，再在目标同目录以 `wx` 创建唯一临时文件，写入、`sync`、关闭后 `rename` 替换目标。不先删除旧快照；失败时清理本次临时文件。该协议面向本地文件系统的进程中断边界，没有目录同步与断电故障验证，不承诺断电后最新快照必然存在。\n- 会话整个打开期间持有以 `wx` 排他创建的 `session.lock`，记录 PID 与创建时间，正常退出时释放。保存必须顺序等待；锁约束遵循该协议的会话进程，不阻止外部程序直接改文件。崩溃后遗留锁保守拒绝，不按 PID 或时间自动抢占；后续恢复入口需给出确认旧进程退出后的清理指引。\n- 存储和数据层不执行工具、不迁移旧 todo；REPL 通过独立会话运行入口接线，列表错误隔离、项目身份校验及用户恢复提示均已有验证。\n\n存储模块先在临时目录通过类型检查与八项测试，随后学习者接入常驻源码与测试。学习者与 AI 当时分别验证类型检查和七十七项全量回归通过；主程序已在后续会话接线中使用该模块。\n\n### Stage 11 session ownership candidate\n\nsession-schema.ts 与 session.ts 已由学习者接入，每个会话在规范化项目根目录的 `.mini-agent/sessions/\u003cUUID>/` 保存 snapshot.json 与独占锁。目录 ID 与快照 ID、快照项目根必须匹配，打开只读取数据，不请求模型、不执行工具。新建时不合并已有目录；打开不存在的会话不创建空目录。已落地事实归存储笔记的 Session ownership。\n\n会话句柄持有内存状态与锁，读取 snapshot 返回深副本；update 在独立草稿上修改，经身份与 schema 检查后保存，成功后才发布内存状态。更新允许等待回调完成，但回调只用于修改草稿，不作为执行外部副作用的事务。busy 标记拒绝重叠更新或保存中关闭；close 后不能继续更新。\n\n早期版本 1 只验证文本与 function calling 消息形状、startsTurn 和 todo 编号；正式 CLI 已升级为版本 2，补充轮结果、动作归属与工具结果配对。版本 1 缺少动作证据，拒绝加载并保留原文件，不静默解释成可继续执行的新状态。\n\n列表读取已提交快照，不获取写锁，逐条隔离错误并保留原文件；某条损坏或项目不匹配不会阻断其他条目。选择逻辑隔离而不自动移动坏文件，保留排查位置并减少列出动作的副作用。旧 todo 保留、不自动迁移；当前 todo 工具使用会话句柄，批准缓存启动时清空。\n\n参考先在临时目录通过项目配置的类型检查、与 HistoryMessage 的赋值兼容检查及九项确定性测试；学习者随后接入。学习者与 AI 分别验证类型检查和八十六项全量回归通过，尚不包含 CLI、模型或工具崩溃恢复。\n\n### Stage 11 turn checkpoint candidate\n\n主轮检查点已由学习者接入并报告验收通过：runTurn 返回 completed、paused、cancelled、failed 或 budget_exhausted，控制工具的 endsTurn 携带 completed／paused，而不从终端措辞猜结果。完成只表示调用完成出口，不代表外部验收成功。会话持久化回调已由 runSessionTurn 接入。\n\n主轮通过可选 checkpoint 回调等待消息更新、动作边界及轮结束保存。回调收到消息与事件深副本；工具以本轮消息数组中的 messageIndex 与调用 ID 联合定位，后续会话入口另加 turnId。assistant 的整批调用先随消息保存，参数校验和批准后等待 started 检查点，再进入 execute；started 表达已进入可能执行的窗口，崩溃后不能据此断定实际执行过。\n\n所有工具统一记录。正常返回记 returned，它只证明取得返回文本，不保证任务成功；校验失败、批准拒绝、循环守卫与同批剩余调用记 not_executed；工具抛错或执行中取消记 uncertain 并停止本轮。普通模型或批准错误保留已有消息、给未执行调用补结果，返回失败或取消。主轮直接调用已准备好的 tool.execute，避免公共 executeCall 吞掉未知执行异常；只读子 Agent 的旧路径暂不改造。\n\ncheckpoint 任意异常包装成 CheckpointError 并立即上抛；不继续工具，不在保存失败后再次尝试写“正常收尾”。agent.ts 删除本轮 checkpoint 回滚，消费结构化结果，保存失败时退出。工具结果原文与跨轮完整历史保留在会话中，仅在模型请求视图中裁剪和截断。\n\n备选是只在轮末保存、使用不等待的通知回调或继续将所有工具异常当普通文本：前者缺失轮中动作窗口，第二种不能阻止保存失败后的动作，第三种可能继续执行而掩盖副作用。选择同步等待检查点及保守停止，代价是额外保存、深复制，以及暂时无法区分某些工具抛错前是否真正改变外部状态。callback 在 runTurn 中仍为可选接口，正式 CLI 经 runSessionTurn 注入持久化；它不是完整事件轨迹框架。\n\nAI 在隔离源码副本中验证类型检查及九十六项回归通过，其中十项新测试覆盖保存前后失败、真实临时文件写入后抛错、批准／参数拒绝、模拟取消、后续模型失败、原始结果与模型视图区分、回调隔离与状态分类。副本随后清理。模拟 AbortError 不等于全链路取消；没有进程强杀、真实模型或完整恢复不重放的运行证据。\n\n### Runtime lifecycle and budgets\n\n2026-09-22，阶段 14 的统一运行控制器、有限传输重试、共享预算和脱敏事件已实现，当前协议及验证归[运行韧性](../../implemented/architecture/2026-09-22-runtime-resilience.md)。阶段 15 的 CLI、编译安装和证据汇总已接入，归[交付契约](../../implemented/process/2026-09-22-cli-delivery.md)与[评测汇总](../../../learning/evaluation.md)。下文阶段 10–13 的候选和运行记录保留当时证据；阶段 14–15 人工验收和远程 CI 未完成，路线整体保持 proposed，不把实现完成写成所有环境验收通过。\n\n阶段 11 已接入版本 2 快照，turns 保存 turnId、起始消息位置、轮结果和动作状态；参数保留在原始 assistant 调用中，通过消息位置与调用 ID 关联，不重复保存。schema 校验工具结果配对、动作归属、未结束动作所属轮及结果一致性。普通文本历史允许独立保存，受管理 CLI 请求另有明确轮记录。\n\n接线候选在检查点中同步更新消息与动作，保持 todo 的最新会话状态，避免使用旧副本覆盖工具刚提交的 todo。恢复只把 pending 补为未执行、started 补为不确定，并把中断轮标为 failed；生成的 tool 消息明确标识恢复记录。恢复不请求模型、不执行工具，等待新的用户输入。不确定动作的核查约束作为派生模型提示保留，避免旧轮裁剪后丢掉核查要求。模型请求只裁剪视图，原始会话历史持续保留。\n\nCLI 每次启动选定一个新会话或 --resume 会话；--sessions 可离线列出。批准缓存启动时清空且不持久化；旧项目 todo 保留并提示，不迁移。会话 todo 改为注入句柄的工具工厂，写盘错误包装为 CheckpointError 使主轮立即停止。受控文件工具阻止直接访问 .mini-agent 内部状态；经用户批准的 shell 仍不是沙箱。遗留锁不自动抢占，需确认原进程退出后人工清理。\n\n选择恢复时补有标签的协议结果，保留原始调用和已确认结果，代价是历史同时包含真实观察与显式合成的恢复说明；不采用自动重放或丢弃半轮。版本 1 没有动作证据，拒绝自动迁移，保留旧文件并由用户新建版本 2 会话。学习者已按对话中的逐文件代码接入，落地事实归会话存储笔记，整体路线保留 proposed。\n\n隔离副本先通过类型检查、四十三项相关回归以及最终七项新增集成测试。学习者随后提供实际工作区类型检查与全量 103 项通过记录，以及真实模型添加待办、正常退出、列表、恢复 6 条消息与 1 项待办、等待新输入后列出原待办并完成的记录。受控子进程测试证明写入后 process.exit 遗留锁，确认退出并清锁后不重放；这不等于断电、强杀或全链路取消验收。\n\n阶段 10 确定约定，后续阶段按实际需要接入：每个真实用户轮由入口创建取消控制器，主 Agent、子 Agent、摘要请求、批准等待及工具接收同一取消信号。取消后不再安排新动作，收尾记录已完成与不确定的结果；取消和超时都不表示已撤销副作用。\n\n运行结果区分完成、暂停、取消、失败和预算耗尽，供 CLI、会话保存和轨迹共同使用，不能只靠终端文本猜测，也不能把所有工具异常都转成可继续执行的普通字符串。具体类型由实现阶段确定；取消必须能传播到调度边界。\n\n单次上下文窗口与整轮累计消耗分别配置和检查。整轮预算覆盖主请求、委派、摘要与重试；子 Agent 仍可有更小的局部上限，但不得绕过总上限。摘要和子 Agent 最终总结也必须先取得预算，不能耗尽后再额外请求。usage 缺失时标注未知或估算，不记为零；时间与请求次数仍提供确定的停止边界。\n\n重试由一个明确的层负责，配置时核对 SDK 自带重试，避免与外层重试叠加。只重试尚未产生可见输出和本次工具执行的可重试传输失败，不重跑整轮；协议错误、权限拒绝和结果不确定的工具执行不得自动重试。\n\n阶段 10 先固定以下语义，后续按所属阶段接入，不提前增加尚无消费者的运行时类型：\n\n| 共同约定 | 具体语义与所有者 | 接入阶段 |\n| --- | --- | --- |\n| 用户轮身份 | 入口为每次真实用户输入创建 turnId；委派、摘要、重试保留所属 turnId，子任务另有自己的标识 | 11 起 |\n| 完成结果 | completed、paused、cancelled、failed、budget_exhausted 分开保存；循环守卫中止属于 failed 并记录原因；只有完成出口属于 completed，不等同于外部验收通过 | 11 起 |\n| 取消归属 | 入口持有本轮 AbortController，子流程只接收信号；取消中止当前等待并阻止后续动作；等待下一条用户输入属于 CLI 生命周期，不伪造用户轮 | 13–14 |\n| 请求与时间 | 当前 10／6 为主／子循环局部上限；总预算由同一用户轮持有，请求发送前预留次数，每次真实传输尝试计数，包括失败和重试 | 12 起，14 汇总 |\n| 总时限 | 按单调时钟从用户提交起计时，包含批准等待；批准返回后仍需检查取消与剩余时间，已过期的动作不能开始执行 | 13–14 |\n| token 账目 | 每次发送前检查输入估算与输出预留，响应后结算实际 usage；缺失 usage 保留估算／未知标记，不宣称精确费用硬上限；摘要和委派共享总额 | 12 起，14 汇总 |\n| 收尾与恢复 | 确认完成的动作保留结果，未开始的动作标记未执行，执行结果未确认的动作标记不确定；记录失败后不再继续发起副作用 | 11 起 |\n\n配置与 doctor 的当前实现仅有局部请求次数和单请求超时，上述跨轮记录与全轮信号不是已实现能力。固定任务与 CI 的落地边界见[夹具与 CI 决定](../../implemented/testing/2026-09-21-repeatable-fixture-and-ci.md)。\n\n### Context budget and compaction\n\n在主 Agent、子 Agent 和摘要的每次模型请求前计算输入预算，包含 system、工具定义、历史、当前输入和消息协议开销，并预留输出空间。已知模型使用适配的计数方法；未知兼容模型采用明确标注的保守估算和余量，不把估算称为服务端 token 硬保证。上下文超限响应有明确处理，不能无变化地无限重试。\n\n阶段 12 先实现确定性裁剪：只移除完整旧用户轮，保护工具调用与结果配对，不把内部提示当成用户新轮。若裁掉旧轮后，当前轮、单次输入或工具定义仍超限，则停止并提示缩小任务；不发送已知超限的请求，也不强行切断当前工具配对。v1 无需为了处理所有超长任务实现任意位置的轮内压缩。\n\n之后增加旧轮摘要，保留当前目标、用户约束、已确认动作、拒绝与待核查事项；摘要作为有来源的上下文材料，不提升为新的系统权限。摘要请求本身也受窗口和整轮预算限制。生成、校验或保存失败时保持原状态；仅在裁剪后的上下文仍满足约束时继续，否则明确停止，不循环发起摘要。原始历史持续保留，压缩只改变模型请求视图。\n\n2026-09-21，`buildContext(history, tools, budget)` 及主／子请求链路已由学习者接入。独立预算模块先通过全量 111 项测试，接线后类型检查及全量 120 项通过，并有真实计算得到 391 后完成的记录。随后用户授权 AI 直接完成持久化摘要及失败回退，类型检查、全量 140 项测试和一次受控真实模型摘要／重开／增量摘要用例通过。阶段 12 本地实现与验收完成；实现事实与证据范围归[结果截断与整轮裁剪](../../implemented/architecture/2026-09-05-bounded-conversation-context.md)，配置归[统一配置](../../implemented/architecture/2026-09-21-validated-runtime-config.md)。阶段 13–15 未完成，整体路线保持 proposed。\n\n已接入模块覆盖文本 CLI 的保守估算；模型专用 tokenizer 留作有实际 usage 对照后的适配，粗估不能当作服务端硬保证。窗口、输出预留、安全余量已接入统一配置，输出预留已映射到请求体的生成上限。\n\n摘要已沿用每次请求前检查与明确停止语义，覆盖范围与原文指纹进入 v3 快照，保存成功后发布；主请求与摘要共享主轮次数且摘要前预留一次正常请求。委派仍用局部次数，阶段 14 再统一全轮的主／子／摘要／重试账目、token 与时间总额，不把本阶段主／摘要合计次数描述为完整总预算。\n\n[OpenAI 官方接口](https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create) 的既有核对说明 max_completion_tokens 包含可见输出及推理 token，max_tokens 已弃用且不兼容 o-series；选择后者的兼容服务须以其实际协议为准。真实短任务能成功不等于服务端严格执行配置上限，后续验证保留这一边界。\n\n请求接线候选与学习者正式源码各有 120 项验证记录；摘要接入后 AI 在工作区重新验证 140 项测试。真实摘要用例共四次模型请求，两次摘要及两次完成，保留项目代号和拒绝写入约束，重开后增量压缩通过。全轮统一累计账目仍属于阶段 14。\n\n### Edit approval and filesystem boundary\n\n阶段 13 已按用户授权由 AI 直接实现，当前协议、真实备选及边界归[安全增量编辑](../../implemented/feature/2026-09-21-safe-incremental-editing.md)与[命令中断清理](../../implemented/bug-fix/2026-09-06-shell-interruption-reporting.md)。常驻测试覆盖受控批准、冲突拒写和固定任务经实际 Git Bash 验收，以及 Windows 子孙进程超时／取消退出。真实模型正常修复、拒绝、冲突拒写与命令取消已有学习者终端记录；AI 核实对应文件及相关快照。剩余人工超时和取消后恢复由学习者简短确认完成，未附新日志；Linux 和远程 CI 本轮未运行。阶段 14–15 仍未完成，本路线保持 proposed。\n\n增量编辑要求旧文本精确且唯一匹配，并针对读取到的文件版本生成候选内容与可读 diff。批准绑定项目内目标、基准指纹和候选修改；执行前再次核对路径与文件指纹。批准等待期间文件发生变化时拒绝写入，重新读取、生成 diff 并重新批准，不把旧批准应用到新版本。冲突拒绝不能退化为整文件覆盖。\n\nv1 将 `write_file` 限定为创建新文件，已有文件通过增量编辑修改；创建时仍需批准，并拒绝覆盖批准后出现的同名文件。新建与编辑共同检查项目边界、敏感路径及链接目标；新建文件还需检查已有父目录的真实路径。原子替换保证单文件写入完整，不意味着多个文件修改构成事务，也不能替代冲突检查。\n\n项目路径约束针对受控文件工具。批准后的 shell 仍可访问操作系统允许的范围，预览需显示实际工作目录、shell 和完整命令，不宣称获得沙箱隔离。子进程清理以明确支持的系统／shell 组合验收；不能确认后代进程已结束时如实报告，不能仅凭发送了终止信号就宣称清理成功。\n\n### End-to-end task and incremental evaluation\n\n阶段 10 定义一个可重置的小型 TypeScript 示例仓库：包含一个可复现缺陷、能揭示该缺陷的测试和应保持不变的无关文件。先记录当前能力与失败点，后续阶段沿用同一任务，避免每次只挑新功能容易成功的演示。\n\n主任务链为：定位缺陷 → 阅读证据 → 展示 diff 并取得批准 → 修改 → 执行测试 → 按实际结果总结。以预期文件变化、目标测试、原有回归及无关文件未改作为成功依据；调用 `finish_task` 或声称成功不构成验收证据。\n\n| 场景 | 可检查的结果 | 主要引入阶段 |\n| --- | --- | --- |\n| 配置与基线 | 缺配置、错误 API 路径和不可用 shell 可诊断；现有确定性检查进入 CI | 10 |\n| 中断恢复 | 工具开始前、执行中、执行后保存前注入故障；恢复不自动重放、不把未知结果当成功，损坏快照不覆盖上一份可用状态 | 11 |\n| 长上下文 | 旧轮压缩、当前轮单独超限、摘要失败均有明确结果；每次请求视图合法，原始历史仍可查 | 12 |\n| 编辑与拒绝 | 主任务产生预期 diff；拒绝后目标动作不执行；重复匹配和批准后文件变化均不写入 | 13 |\n| 取消与超时 | 输入／批准等待、模型流、委派和运行中命令可以取消；取消后不启动后续工具，支持环境下验证后代进程清理 | 13–14 |\n| 重试与总预算 | 传输重试不重放此前动作；主请求、委派、摘要、重试统一计数；预算耗尽明确停止 | 14 |\n| 干净环境交付 | Windows 主环境完成安装、doctor、主任务和恢复；Linux 完成配置与非交互检查 | 15 |\n\n故障窗口和状态边界优先用确定性模拟、临时目录和受控子进程验证；不依赖真实模型恰好在某个时刻失败。真实模型逐阶段补普通任务、拒绝、恢复、长上下文与只读委派的使用证据，并记录模型／配置、任务结果、错误修改、请求数、token、耗时和人工干预。重复次数在评测前确定，保留失败记录，不把挑选出的成功运行当成成功率。\n\nv1 交付要求上述确定性验收全部通过、主任务及列出的真实工作流均有可核对的通过记录；成本和耗时先给出测量值，不预设缺乏基线的性能承诺。这些场景是有限能力证据，不代表任意仓库与任务都能成功。\n\n### Explicit non-goals for v1\n\n- 完整操作系统或容器沙箱；v1 明确展示批准与边界，但不宣称能安全执行任意不可信命令。\n- GUI、IDE 插件、远程服务、多用户或跨设备同步。\n- 并行／递归多 Agent、结构化任务图、工作流引擎和分布式队列。\n- 向量数据库、RAG、长期知识库、模型路由和自动供应商切换。\n- MCP／插件市场或允许第三方代码任意扩展工具的运行时平台。\n\n这些方向只有在 v1 的真实使用证据表明现有边界成为瓶颈时才重新评估。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 停在当前教学内核：代码最少，核心原理也已经完整，但对话不能恢复、配置和失败诊断较弱，无法达到“能够落地并长期使用”的目标。\n- 追求 Claude Code 的功能广度：并行 Agent、IDE、远程服务、插件、RAG 和完整沙箱会更强，但需要完全不同的产品与安全工程规模，不符合微型和实习作品的边界。\n- 尽早迁移到 Agent 框架：会快速获得持久化、回调和工具封装，但关键控制流与失败语义被框架隐藏，削弱该项目展示底层理解和工程判断的价值。\n- 先建设通用插件或工作流平台：未来扩展成本可能降低，但当前只有一个主 Agent 和一个只读子 Agent，抽象对象不足；会先产生配置、生命周期和兼容负担，再等待可能不会出现的需求。\n- 只在完整用户轮结束后保存快照：写盘少、历史天然易于配对，但轮中已有副作用而结果未保存时无法给出可靠恢复说明；v1 增加副作用前后的最小记录，接受额外写盘和不确定状态处理。\n- 先建完整事件溯源与通用执行框架：可统一恢复和轨迹，但会提前冻结所有模块接口；v1 先约定取消、结果和预算归属，恢复用最小动作记录，完整轨迹在阶段 14 整合。\n- 直接覆盖 JSON 或先删旧文件再重命名：步骤少，但会在部分写入或替换失败时失去旧快照；候选存储层接受同目录临时文件和额外同步操作的成本。\n- 自动按 PID 或锁龄抢占遗留锁：恢复方便，但 PID 复用、进程存活检查权限及长任务都可能造成误判；候选方案先保守拒绝，接受崩溃后需要核查与人工清理的操作成本。\n- 暴露可变内存对象或更新前发布内存：调用方代码短，但容易绕过写盘或在保存失败后让模型看到未提交状态；会话句柄选择深副本、草稿和保存成功后发布，接受复制完整历史的开销。\n- 自动移动损坏会话到隔离目录：正常目录更整洁，但只列出会话也会改文件位置，失败时还需处理移动与锁；当前候选按条目报告错误并保留原地，后续有明确整理需求再增加显式操作。\n- 首先实现模型摘要以保留更多上下文：长对话信息利用更灵活，但同时引入请求成本、摘要失真和失败恢复；先建立确定性预算边界，再加入摘要，便于分别验证。\n- 保留可覆盖任意已有文件的 `write_file`：调用简单，也适合整份生成，但会成为绕过精确编辑与冲突检查的入口；v1 用它创建文件，已有文件统一走受控编辑，接受复杂重写需要拆分修改的代价。","anchor":"section-2"},{"heading":"Acceptance criteria","body":"- 新机器在安装依赖后，可以通过单一 doctor 命令定位缺少的配置、错误的兼容 API 地址或不可用 shell，且任何输出不包含密钥。\n- 用户可以新建、退出并恢复绑定项目的会话；todo 随会话隔离，批准不跨恢复继承。保存失败或部分写入不破坏上一份可用快照，未知版本和损坏内容不静默覆盖，第二个写入者不能覆盖同一会话。\n- 副作用发生后的失败不能仅以丢弃本轮消息处理；已确认动作与结果不确定动作可区分，恢复不自动重放工具，残缺工具调用不会进入下一次模型请求。中断故障窗口按上表验收。\n- 每次主／子 Agent 和摘要请求均检查完整输入与输出预留；旧轮裁剪、单轮超限和摘要失败有确定行为。摘要不破坏调用配对或真实轮边界，原始历史保持可核查。\n- 受控文件工具限制在项目边界内；增量编辑具有唯一匹配、指纹检查、原子替换和可读 diff，批准后出现冲突不写入，旧写入入口不能绕过保护。命令可批准、超时、取消，并如实报告副作用和清理结果。\n- 完成、暂停、取消、失败和预算耗尽可区分；取消贯穿交互等待、主／子 Agent、摘要、模型请求和工具。传输重试有限且不叠加隐式重试，不重放已经执行的动作。\n- 每轮可以查看脱敏的请求数、工具调用、耗时和 token 汇总，缺失 usage 不伪装为零；委派、摘要和重试计入整轮预算。确定性回归与真实模型评测随阶段累积，主任务成功由文件和测试证明。\n- CLI 帮助、配置说明、工具列表和项目结构与当前实现一致；Windows 为主要验收环境，Linux 至少具备可配置 shell 和非交互自动检查。\n- v1 完成时仍保持单进程本地 CLI、直接 SDK、显式注册表和同步只读子 Agent；没有为了“完整”引入非目标中的平台能力。","anchor":"section-3"},{"heading":"Risks","body":"会话和轨迹可能包含源码、命令输出和模型回复，必须默认保存在本地、明确路径并提供清理方式；日志脱敏不能被描述成绝对不会泄密。\n\n摘要压缩会引入信息损失和额外模型请求，必须保留原始持久化历史或可恢复快照，并用测试保护轮边界。重试若与流式输出或副作用混合，可能导致重复动作，因此只允许在明确尚未产生可见结果和副作用的传输阶段发生。\n\n副作用前后写盘增加 IO 与失败处理；完整历史持续增长，需明确保留和清理方式，不能把单次 prompt 有界等同于磁盘占用有界。原子替换的进程中断保障不自动等于断电持久性保证，具体写盘协议及支持范围由阶段 11 说明和验证。\n\n文件指纹和路径复查用于检测通常的外部修改，无法单独构成抵御恶意并发文件系统变更的完整隔离。Windows／Git Bash 的后代进程清理与其他系统存在差异，必须在声明支持的环境实测，不能仅用 mock 推断。恢复时遇到不可核查副作用需要人工判断，这是保持实现规模可控的代价。\n\n“小而美”容易在阶段推进中被新想法侵蚀。每项新增能力都要回答它关闭了哪个 v1 验收缺口；不能回答时留在非目标列表，而不是顺手加入主线。","anchor":"section-4"}],"problem":"mini-agent 已具备原生工具调用、流式协议组装、权限确认、上下文裁剪、显式出口、todo、同步只读子 Agent 和确定性主轮测试，足以说明 Agent 的核心运行机制。但它仍缺少会话恢复、统一配置诊断、真实上下文预算、安全增量编辑、端到端取消、结构化运行轨迹和可交付 CLI 等产品基本面。\n\n如果继续按“想到什么功能就加什么”的方式推进，项目容易在并行 Agent、RAG、插件系统和更多工具之间膨胀，反而掩盖已经形成的清晰内核。若停在当前状态，它又更像完成度较高的教学样例，还不足以长期作为个人编码助手使用，也不能完整展示一名 Agent 实习生对可靠性、安全、状态和评测的工程理解。","decision":"完善版 v1 的目标是：实现一个微型、功能完整、小而美、能够落地、细节精致但不庞大不冗余，并且可以作为 Agent 实习作品、在常见失败条件下仍然抗打的本地 CLI Agent。\n\n“功能完整”指核心工作链闭合，而不是功能数量最大化：用户可以安装与诊断配置，开始或恢复会话，让 Agent 读取、搜索、安全编辑和执行命令，观察明确的批准与运行轨迹，在长上下文、网络失败、命令超时或进程退出后得到可解释的结果，并通过自动测试和少量真实模型场景验证关键行为。\n\n### Product boundary\n\nv1 保持以下边界：\n\n- 单用户、单进程、单项目根目录的本地 CLI，不建立服务端、Web UI 或多租户体系。\n- 继续直接使用 OpenAI-compatible SDK、原生 Function Calling、Zod 和显式工具注册表，不引入 LangChain、LlamaIndex 或通用工作流框架。\n- 主 Agent 保持单轮顺序执行；现有同步只读子 Agent 足以展示上下文隔离和能力收窄，v1 不增加并行、递归委派或分布式调度。\n- 状态使用可检查的本地文件和原子替换，不引入数据库；配置、会话、轨迹和 todo 各有明确所有者，不共享隐式全局状态。\n- 新抽象必须服务于一个已经存在的失败边界、去除真实重复或建立可测试接口；不为未来插件、供应商或部署形态预建框架。\n- 自动测试负责确定性协议和状态边界，真实模型评测只覆盖少量关键工作流，不把模型措辞当作稳定快照。\n\n### Roadmap\n\n按依赖顺序完成六个阶段，每个阶段都有可单独检查的交付物；恢复、取消和预算遵循下文的共同约定，不把阶段理解为互不相关的模块：\n\n1. **阶段 10：统一配置与启动诊断** — 集中解析模型、base URL、shell、超时和预算；提供不泄露密钥的 doctor。阶段结束前确定取消信号、运行结果和预算归属的最小约定，定义贯穿后续阶段的任务夹具，并将现有确定性检查接入基础 CI；不提前建设完整运行框架。\n2. **阶段 11：会话持久化与恢复** — 保存带格式版本、项目绑定、完整历史、轮边界和会话 todo 的原子快照，支持新建、列出和恢复。保留已执行动作及中断状态，结果不确定时先核查；恢复不自动重放工具。损坏或不兼容文件隔离处理，不静默覆盖。\n3. **阶段 12：上下文预算与压缩** — 先实现每次请求前的预算检查、完整旧轮裁剪与超限停止，再增加可持久化摘要。原始历史与发送给模型的上下文分离；覆盖当前轮过长、工具定义开销、输出预留和摘要失败，不只处理历史轮数。\n4. **阶段 13：安全增量编辑与命令执行** — 增加精确旧文本、文件指纹、原子替换和 diff 预览，批准后执行前重新检查冲突；收紧旧写入入口并统一文件工具的项目边界。接入共同取消信号，在支持的 shell 环境验证命令超时、取消和子进程树清理。\n5. **阶段 14：运行韧性与可观测性** — 验证取消贯穿输入、批准、主／子 Agent、摘要、模型请求和工具；整合有限传输重试、全轮次数／时间／token 预算，以及从类型化事件生成的终端输出和脱敏 JSONL 轨迹。沿用前面阶段的生命周期约定，不在此时重新定义状态归属。\n6. **阶段 15：评测与交付收尾** — 汇总各阶段已经积累的模拟流、故障注入和真实模型证据，完成新环境安装、CLI 参数、帮助、退出码、README、跨平台 shell 配置与可执行入口验收；形成可克隆、可诊断、可运行、可恢复的 v1。\n\n每个阶段开始时再为其中的非平凡机制建立或更新所属决策笔记；本路线固定目标、顺序和跨模块行为保证，具体接口、文件布局和算法留给所属阶段。测试随模块进入常驻回归，阶段 15 不承担补建全部测试的工作。\n\n### Session recovery and state ownership\n\n原子替换只保护单份状态文件，不会把文件修改、shell 命令和会话保存变成一个事务。当前[异常恢复规则](../../implemented/bug-fix/2026-09-06-tool-result-history-recovery.md)会回退本轮消息而保留外部副作用；阶段 11 必须调整这一规则，不能直接把回退后的“干净历史”当成完整恢复依据。\n\n- 会话绑定规范化的项目根目录并保存格式版本；从其他目录打开时明确报告不匹配，不把历史中的相对路径自动解释到新项目。未知版本和损坏内容不得作为空会话覆盖。v1 不支持同一会话的多个写入者，发现已被占用时拒绝再次写入。\n- 原始历史是恢复与核查的依据；供模型使用的裁剪历史和摘要是派生视图，不能覆盖原始历史。摘要应标明覆盖范围，恢复时不能重复拼入已经被摘要覆盖的旧消息。\n- todo 随会话保存，新建会话不继承其他会话的任务。旧项目级 `.mini-agent-todo.json` 保留并提示存在，不默默复制进每个新会话。批准缓存保持进程内有效，切换会话时清空，不写入快照；配置和密钥不随对话恢复。\n- 在有副作用的工具执行前，先可靠保存调用身份、参数和待执行记录；保存失败就不执行。工具返回后保存已确认结果，再继续后续动作。执行中崩溃，或执行后结果尚未可靠保存，恢复时均按“结果不确定”处理，不能猜测为成功或未执行。\n- 恢复先展示中断位置、已确认动作和待核查动作，等待用户继续；不能自动重放未完成调用。继续前核查可观察的外部状态，无法核查的结果如实保留不确定性。协议缺失项可以补为明确的未执行／结果不确定说明，但不得伪造成功结果。\n\n恢复记录只需表达调用与结果的最小事实，不要求提前实现完整 JSONL 轨迹或事件溯源系统。v1 不承诺任意外部命令恰好执行一次，也不承诺自动撤销副作用。\n\n### Stage 11 storage candidate\n\n2026-09-21，阶段 11 的存储、会话格式、动作状态与恢复调度均已由学习者接入，已落地的协议与验证证据归[原子快照存储与会话状态](../../implemented/architecture/2026-09-21-atomic-session-storage.md)。以下基础格式与检查点候选保留分步设计背景，当前实现以版本 2 接线为准；阶段 12–15 尚未完成，本路线整体保持 proposed。\n\n- 仅 `ENOENT` 表示没有快照；非法 JSON、未知版本、结构不符及其他读取错误必须阻止打开，保留原文件。会话层必须先取锁、再读取校验，读取失败不得继续保存；底层写函数不独自承担会话打开策略。\n- 保存先校验并序列化，再在目标同目录以 `wx` 创建唯一临时文件，写入、`sync`、关闭后 `rename` 替换目标。不先删除旧快照；失败时清理本次临时文件。该协议面向本地文件系统的进程中断边界，没有目录同步与断电故障验证，不承诺断电后最新快照必然存在。\n- 会话整个打开期间持有以 `wx` 排他创建的 `session.lock`，记录 PID 与创建时间，正常退出时释放。保存必须顺序等待；锁约束遵循该协议的会话进程，不阻止外部程序直接改文件。崩溃后遗留锁保守拒绝，不按 PID 或时间自动抢占；后续恢复入口需给出确认旧进程退出后的清理指引。\n- 存储和数据层不执行工具、不迁移旧 todo；REPL 通过独立会话运行入口接线，列表错误隔离、项目身份校验及用户恢复提示均已有验证。\n\n存储模块先在临时目录通过类型检查与八项测试，随后学习者接入常驻源码与测试。学习者与 AI 当时分别验证类型检查和七十七项全量回归通过；主程序已在后续会话接线中使用该模块。\n\n### Stage 11 session ownership candidate\n\nsession-schema.ts 与 session.ts 已由学习者接入，每个会话在规范化项目根目录的 `.mini-agent/sessions/\u003cUUID>/` 保存 snapshot.json 与独占锁。目录 ID 与快照 ID、快照项目根必须匹配，打开只读取数据，不请求模型、不执行工具。新建时不合并已有目录；打开不存在的会话不创建空目录。已落地事实归存储笔记的 Session ownership。\n\n会话句柄持有内存状态与锁，读取 snapshot 返回深副本；update 在独立草稿上修改，经身份与 schema 检查后保存，成功后才发布内存状态。更新允许等待回调完成，但回调只用于修改草稿，不作为执行外部副作用的事务。busy 标记拒绝重叠更新或保存中关闭；close 后不能继续更新。\n\n早期版本 1 只验证文本与 function calling 消息形状、startsTurn 和 todo 编号；正式 CLI 已升级为版本 2，补充轮结果、动作归属与工具结果配对。版本 1 缺少动作证据，拒绝加载并保留原文件，不静默解释成可继续执行的新状态。\n\n列表读取已提交快照，不获取写锁，逐条隔离错误并保留原文件；某条损坏或项目不匹配不会阻断其他条目。选择逻辑隔离而不自动移动坏文件，保留排查位置并减少列出动作的副作用。旧 todo 保留、不自动迁移；当前 todo 工具使用会话句柄，批准缓存启动时清空。\n\n参考先在临时目录通过项目配置的类型检查、与 HistoryMessage 的赋值兼容检查及九项确定性测试；学习者随后接入。学习者与 AI 分别验证类型检查和八十六项全量回归通过，尚不包含 CLI、模型或工具崩溃恢复。\n\n### Stage 11 turn checkpoint candidate\n\n主轮检查点已由学习者接入并报告验收通过：runTurn 返回 completed、paused、cancelled、failed 或 budget_exhausted，控制工具的 endsTurn 携带 completed／paused，而不从终端措辞猜结果。完成只表示调用完成出口，不代表外部验收成功。会话持久化回调已由 runSessionTurn 接入。\n\n主轮通过可选 checkpoint 回调等待消息更新、动作边界及轮结束保存。回调收到消息与事件深副本；工具以本轮消息数组中的 messageIndex 与调用 ID 联合定位，后续会话入口另加 turnId。assistant 的整批调用先随消息保存，参数校验和批准后等待 started 检查点，再进入 execute；started 表达已进入可能执行的窗口，崩溃后不能据此断定实际执行过。\n\n所有工具统一记录。正常返回记 returned，它只证明取得返回文本，不保证任务成功；校验失败、批准拒绝、循环守卫与同批剩余调用记 not_executed；工具抛错或执行中取消记 uncertain 并停止本轮。普通模型或批准错误保留已有消息、给未执行调用补结果，返回失败或取消。主轮直接调用已准备好的 tool.execute，避免公共 executeCall 吞掉未知执行异常；只读子 Agent 的旧路径暂不改造。\n\ncheckpoint 任意异常包装成 CheckpointError 并立即上抛；不继续工具，不在保存失败后再次尝试写“正常收尾”。agent.ts 删除本轮 checkpoint 回滚，消费结构化结果，保存失败时退出。工具结果原文与跨轮完整历史保留在会话中，仅在模型请求视图中裁剪和截断。\n\n备选是只在轮末保存、使用不等待的通知回调或继续将所有工具异常当普通文本：前者缺失轮中动作窗口，第二种不能阻止保存失败后的动作，第三种可能继续执行而掩盖副作用。选择同步等待检查点及保守停止，代价是额外保存、深复制，以及暂时无法区分某些工具抛错前是否真正改变外部状态。callback 在 runTurn 中仍为可选接口，正式 CLI 经 runSessionTurn 注入持久化；它不是完整事件轨迹框架。\n\nAI 在隔离源码副本中验证类型检查及九十六项回归通过，其中十项新测试覆盖保存前后失败、真实临时文件写入后抛错、批准／参数拒绝、模拟取消、后续模型失败、原始结果与模型视图区分、回调隔离与状态分类。副本随后清理。模拟 AbortError 不等于全链路取消；没有进程强杀、真实模型或完整恢复不重放的运行证据。\n\n### Runtime lifecycle and budgets\n\n2026-09-22，阶段 14 的统一运行控制器、有限传输重试、共享预算和脱敏事件已实现，当前协议及验证归[运行韧性](../../implemented/architecture/2026-09-22-runtime-resilience.md)。阶段 15 的 CLI、编译安装和证据汇总已接入，归[交付契约](../../implemented/process/2026-09-22-cli-delivery.md)与[评测汇总](../../../learning/evaluation.md)。下文阶段 10–13 的候选和运行记录保留当时证据；阶段 14–15 人工验收和远程 CI 未完成，路线整体保持 proposed，不把实现完成写成所有环境验收通过。\n\n阶段 11 已接入版本 2 快照，turns 保存 turnId、起始消息位置、轮结果和动作状态；参数保留在原始 assistant 调用中，通过消息位置与调用 ID 关联，不重复保存。schema 校验工具结果配对、动作归属、未结束动作所属轮及结果一致性。普通文本历史允许独立保存，受管理 CLI 请求另有明确轮记录。\n\n接线候选在检查点中同步更新消息与动作，保持 todo 的最新会话状态，避免使用旧副本覆盖工具刚提交的 todo。恢复只把 pending 补为未执行、started 补为不确定，并把中断轮标为 failed；生成的 tool 消息明确标识恢复记录。恢复不请求模型、不执行工具，等待新的用户输入。不确定动作的核查约束作为派生模型提示保留，避免旧轮裁剪后丢掉核查要求。模型请求只裁剪视图，原始会话历史持续保留。\n\nCLI 每次启动选定一个新会话或 --resume 会话；--sessions 可离线列出。批准缓存启动时清空且不持久化；旧项目 todo 保留并提示，不迁移。会话 todo 改为注入句柄的工具工厂，写盘错误包装为 CheckpointError 使主轮立即停止。受控文件工具阻止直接访问 .mini-agent 内部状态；经用户批准的 shell 仍不是沙箱。遗留锁不自动抢占，需确认原进程退出后人工清理。\n\n选择恢复时补有标签的协议结果，保留原始调用和已确认结果，代价是历史同时包含真实观察与显式合成的恢复说明；不采用自动重放或丢弃半轮。版本 1 没有动作证据，拒绝自动迁移，保留旧文件并由用户新建版本 2 会话。学习者已按对话中的逐文件代码接入，落地事实归会话存储笔记，整体路线保留 proposed。\n\n隔离副本先通过类型检查、四十三项相关回归以及最终七项新增集成测试。学习者随后提供实际工作区类型检查与全量 103 项通过记录，以及真实模型添加待办、正常退出、列表、恢复 6 条消息与 1 项待办、等待新输入后列出原待办并完成的记录。受控子进程测试证明写入后 process.exit 遗留锁，确认退出并清锁后不重放；这不等于断电、强杀或全链路取消验收。\n\n阶段 10 确定约定，后续阶段按实际需要接入：每个真实用户轮由入口创建取消控制器，主 Agent、子 Agent、摘要请求、批准等待及工具接收同一取消信号。取消后不再安排新动作，收尾记录已完成与不确定的结果；取消和超时都不表示已撤销副作用。\n\n运行结果区分完成、暂停、取消、失败和预算耗尽，供 CLI、会话保存和轨迹共同使用，不能只靠终端文本猜测，也不能把所有工具异常都转成可继续执行的普通字符串。具体类型由实现阶段确定；取消必须能传播到调度边界。\n\n单次上下文窗口与整轮累计消耗分别配置和检查。整轮预算覆盖主请求、委派、摘要与重试；子 Agent 仍可有更小的局部上限，但不得绕过总上限。摘要和子 Agent 最终总结也必须先取得预算，不能耗尽后再额外请求。usage 缺失时标注未知或估算，不记为零；时间与请求次数仍提供确定的停止边界。\n\n重试由一个明确的层负责，配置时核对 SDK 自带重试，避免与外层重试叠加。只重试尚未产生可见输出和本次工具执行的可重试传输失败，不重跑整轮；协议错误、权限拒绝和结果不确定的工具执行不得自动重试。\n\n阶段 10 先固定以下语义，后续按所属阶段接入，不提前增加尚无消费者的运行时类型：\n\n| 共同约定 | 具体语义与所有者 | 接入阶段 |\n| --- | --- | --- |\n| 用户轮身份 | 入口为每次真实用户输入创建 turnId；委派、摘要、重试保留所属 turnId，子任务另有自己的标识 | 11 起 |\n| 完成结果 | completed、paused、cancelled、failed、budget_exhausted 分开保存；循环守卫中止属于 failed 并记录原因；只有完成出口属于 completed，不等同于外部验收通过 | 11 起 |\n| 取消归属 | 入口持有本轮 AbortController，子流程只接收信号；取消中止当前等待并阻止后续动作；等待下一条用户输入属于 CLI 生命周期，不伪造用户轮 | 13–14 |\n| 请求与时间 | 当前 10／6 为主／子循环局部上限；总预算由同一用户轮持有，请求发送前预留次数，每次真实传输尝试计数，包括失败和重试 | 12 起，14 汇总 |\n| 总时限 | 按单调时钟从用户提交起计时，包含批准等待；批准返回后仍需检查取消与剩余时间，已过期的动作不能开始执行 | 13–14 |\n| token 账目 | 每次发送前检查输入估算与输出预留，响应后结算实际 usage；缺失 usage 保留估算／未知标记，不宣称精确费用硬上限；摘要和委派共享总额 | 12 起，14 汇总 |\n| 收尾与恢复 | 确认完成的动作保留结果，未开始的动作标记未执行，执行结果未确认的动作标记不确定；记录失败后不再继续发起副作用 | 11 起 |\n\n配置与 doctor 的当前实现仅有局部请求次数和单请求超时，上述跨轮记录与全轮信号不是已实现能力。固定任务与 CI 的落地边界见[夹具与 CI 决定](../../implemented/testing/2026-09-21-repeatable-fixture-and-ci.md)。\n\n### Context budget and compaction\n\n在主 Agent、子 Agent 和摘要的每次模型请求前计算输入预算，包含 system、工具定义、历史、当前输入和消息协议开销，并预留输出空间。已知模型使用适配的计数方法；未知兼容模型采用明确标注的保守估算和余量，不把估算称为服务端 token 硬保证。上下文超限响应有明确处理，不能无变化地无限重试。\n\n阶段 12 先实现确定性裁剪：只移除完整旧用户轮，保护工具调用与结果配对，不把内部提示当成用户新轮。若裁掉旧轮后，当前轮、单次输入或工具定义仍超限，则停止并提示缩小任务；不发送已知超限的请求，也不强行切断当前工具配对。v1 无需为了处理所有超长任务实现任意位置的轮内压缩。\n\n之后增加旧轮摘要，保留当前目标、用户约束、已确认动作、拒绝与待核查事项；摘要作为有来源的上下文材料，不提升为新的系统权限。摘要请求本身也受窗口和整轮预算限制。生成、校验或保存失败时保持原状态；仅在裁剪后的上下文仍满足约束时继续，否则明确停止，不循环发起摘要。原始历史持续保留，压缩只改变模型请求视图。\n\n2026-09-21，`buildContext(history, tools, budget)` 及主／子请求链路已由学习者接入。独立预算模块先通过全量 111 项测试，接线后类型检查及全量 120 项通过，并有真实计算得到 391 后完成的记录。随后用户授权 AI 直接完成持久化摘要及失败回退，类型检查、全量 140 项测试和一次受控真实模型摘要／重开／增量摘要用例通过。阶段 12 本地实现与验收完成；实现事实与证据范围归[结果截断与整轮裁剪](../../implemented/architecture/2026-09-05-bounded-conversation-context.md)，配置归[统一配置](../../implemented/architecture/2026-09-21-validated-runtime-config.md)。阶段 13–15 未完成，整体路线保持 proposed。\n\n已接入模块覆盖文本 CLI 的保守估算；模型专用 tokenizer 留作有实际 usage 对照后的适配，粗估不能当作服务端硬保证。窗口、输出预留、安全余量已接入统一配置，输出预留已映射到请求体的生成上限。\n\n摘要已沿用每次请求前检查与明确停止语义，覆盖范围与原文指纹进入 v3 快照，保存成功后发布；主请求与摘要共享主轮次数且摘要前预留一次正常请求。委派仍用局部次数，阶段 14 再统一全轮的主／子／摘要／重试账目、token 与时间总额，不把本阶段主／摘要合计次数描述为完整总预算。\n\n[OpenAI 官方接口](https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create) 的既有核对说明 max_completion_tokens 包含可见输出及推理 token，max_tokens 已弃用且不兼容 o-series；选择后者的兼容服务须以其实际协议为准。真实短任务能成功不等于服务端严格执行配置上限，后续验证保留这一边界。\n\n请求接线候选与学习者正式源码各有 120 项验证记录；摘要接入后 AI 在工作区重新验证 140 项测试。真实摘要用例共四次模型请求，两次摘要及两次完成，保留项目代号和拒绝写入约束，重开后增量压缩通过。全轮统一累计账目仍属于阶段 14。\n\n### Edit approval and filesystem boundary\n\n阶段 13 已按用户授权由 AI 直接实现，当前协议、真实备选及边界归[安全增量编辑](../../implemented/feature/2026-09-21-safe-incremental-editing.md)与[命令中断清理](../../implemented/bug-fix/2026-09-06-shell-interruption-reporting.md)。常驻测试覆盖受控批准、冲突拒写和固定任务经实际 Git Bash 验收，以及 Windows 子孙进程超时／取消退出。真实模型正常修复、拒绝、冲突拒写与命令取消已有学习者终端记录；AI 核实对应文件及相关快照。剩余人工超时和取消后恢复由学习者简短确认完成，未附新日志；Linux 和远程 CI 本轮未运行。阶段 14–15 仍未完成，本路线保持 proposed。\n\n增量编辑要求旧文本精确且唯一匹配，并针对读取到的文件版本生成候选内容与可读 diff。批准绑定项目内目标、基准指纹和候选修改；执行前再次核对路径与文件指纹。批准等待期间文件发生变化时拒绝写入，重新读取、生成 diff 并重新批准，不把旧批准应用到新版本。冲突拒绝不能退化为整文件覆盖。\n\nv1 将 `write_file` 限定为创建新文件，已有文件通过增量编辑修改；创建时仍需批准，并拒绝覆盖批准后出现的同名文件。新建与编辑共同检查项目边界、敏感路径及链接目标；新建文件还需检查已有父目录的真实路径。原子替换保证单文件写入完整，不意味着多个文件修改构成事务，也不能替代冲突检查。\n\n项目路径约束针对受控文件工具。批准后的 shell 仍可访问操作系统允许的范围，预览需显示实际工作目录、shell 和完整命令，不宣称获得沙箱隔离。子进程清理以明确支持的系统／shell 组合验收；不能确认后代进程已结束时如实报告，不能仅凭发送了终止信号就宣称清理成功。\n\n### End-to-end task and incremental evaluation\n\n阶段 10 定义一个可重置的小型 TypeScript 示例仓库：包含一个可复现缺陷、能揭示该缺陷的测试和应保持不变的无关文件。先记录当前能力与失败点，后续阶段沿用同一任务，避免每次只挑新功能容易成功的演示。\n\n主任务链为：定位缺陷 → 阅读证据 → 展示 diff 并取得批准 → 修改 → 执行测试 → 按实际结果总结。以预期文件变化、目标测试、原有回归及无关文件未改作为成功依据；调用 `finish_task` 或声称成功不构成验收证据。\n\n| 场景 | 可检查的结果 | 主要引入阶段 |\n| --- | --- | --- |\n| 配置与基线 | 缺配置、错误 API 路径和不可用 shell 可诊断；现有确定性检查进入 CI | 10 |\n| 中断恢复 | 工具开始前、执行中、执行后保存前注入故障；恢复不自动重放、不把未知结果当成功，损坏快照不覆盖上一份可用状态 | 11 |\n| 长上下文 | 旧轮压缩、当前轮单独超限、摘要失败均有明确结果；每次请求视图合法，原始历史仍可查 | 12 |\n| 编辑与拒绝 | 主任务产生预期 diff；拒绝后目标动作不执行；重复匹配和批准后文件变化均不写入 | 13 |\n| 取消与超时 | 输入／批准等待、模型流、委派和运行中命令可以取消；取消后不启动后续工具，支持环境下验证后代进程清理 | 13–14 |\n| 重试与总预算 | 传输重试不重放此前动作；主请求、委派、摘要、重试统一计数；预算耗尽明确停止 | 14 |\n| 干净环境交付 | Windows 主环境完成安装、doctor、主任务和恢复；Linux 完成配置与非交互检查 | 15 |\n\n故障窗口和状态边界优先用确定性模拟、临时目录和受控子进程验证；不依赖真实模型恰好在某个时刻失败。真实模型逐阶段补普通任务、拒绝、恢复、长上下文与只读委派的使用证据，并记录模型／配置、任务结果、错误修改、请求数、token、耗时和人工干预。重复次数在评测前确定，保留失败记录，不把挑选出的成功运行当成成功率。\n\nv1 交付要求上述确定性验收全部通过、主任务及列出的真实工作流均有可核对的通过记录；成本和耗时先给出测量值，不预设缺乏基线的性能承诺。这些场景是有限能力证据，不代表任意仓库与任务都能成功。\n\n### Explicit non-goals for v1\n\n- 完整操作系统或容器沙箱；v1 明确展示批准与边界，但不宣称能安全执行任意不可信命令。\n- GUI、IDE 插件、远程服务、多用户或跨设备同步。\n- 并行／递归多 Agent、结构化任务图、工作流引擎和分布式队列。\n- 向量数据库、RAG、长期知识库、模型路由和自动供应商切换。\n- MCP／插件市场或允许第三方代码任意扩展工具的运行时平台。\n\n这些方向只有在 v1 的真实使用证据表明现有边界成为瓶颈时才重新评估。","alternatives":"- 停在当前教学内核：代码最少，核心原理也已经完整，但对话不能恢复、配置和失败诊断较弱，无法达到“能够落地并长期使用”的目标。\n- 追求 Claude Code 的功能广度：并行 Agent、IDE、远程服务、插件、RAG 和完整沙箱会更强，但需要完全不同的产品与安全工程规模，不符合微型和实习作品的边界。\n- 尽早迁移到 Agent 框架：会快速获得持久化、回调和工具封装，但关键控制流与失败语义被框架隐藏，削弱该项目展示底层理解和工程判断的价值。\n- 先建设通用插件或工作流平台：未来扩展成本可能降低，但当前只有一个主 Agent 和一个只读子 Agent，抽象对象不足；会先产生配置、生命周期和兼容负担，再等待可能不会出现的需求。\n- 只在完整用户轮结束后保存快照：写盘少、历史天然易于配对，但轮中已有副作用而结果未保存时无法给出可靠恢复说明；v1 增加副作用前后的最小记录，接受额外写盘和不确定状态处理。\n- 先建完整事件溯源与通用执行框架：可统一恢复和轨迹，但会提前冻结所有模块接口；v1 先约定取消、结果和预算归属，恢复用最小动作记录，完整轨迹在阶段 14 整合。\n- 直接覆盖 JSON 或先删旧文件再重命名：步骤少，但会在部分写入或替换失败时失去旧快照；候选存储层接受同目录临时文件和额外同步操作的成本。\n- 自动按 PID 或锁龄抢占遗留锁：恢复方便，但 PID 复用、进程存活检查权限及长任务都可能造成误判；候选方案先保守拒绝，接受崩溃后需要核查与人工清理的操作成本。\n- 暴露可变内存对象或更新前发布内存：调用方代码短，但容易绕过写盘或在保存失败后让模型看到未提交状态；会话句柄选择深副本、草稿和保存成功后发布，接受复制完整历史的开销。\n- 自动移动损坏会话到隔离目录：正常目录更整洁，但只列出会话也会改文件位置，失败时还需处理移动与锁；当前候选按条目报告错误并保留原地，后续有明确整理需求再增加显式操作。\n- 首先实现模型摘要以保留更多上下文：长对话信息利用更灵活，但同时引入请求成本、摘要失真和失败恢复；先建立确定性预算边界，再加入摘要，便于分别验证。\n- 保留可覆盖任意已有文件的 `write_file`：调用简单，也适合整份生成，但会成为绕过精确编辑与冲突检查的入口；v1 用它创建文件，已有文件统一走受控编辑，接受复杂重写需要拆分修改的代价。","consequences":"","outLinks":["implemented/architecture/2026-09-05-bounded-conversation-context.md","implemented/architecture/2026-09-21-atomic-session-storage.md","implemented/architecture/2026-09-21-validated-runtime-config.md","implemented/architecture/2026-09-22-runtime-resilience.md","implemented/bug-fix/2026-09-06-shell-interruption-reporting.md","implemented/bug-fix/2026-09-06-tool-result-history-recovery.md","implemented/feature/2026-09-21-safe-incremental-editing.md","implemented/process/2026-09-22-cli-delivery.md","implemented/testing/2026-09-21-repeatable-fixture-and-ci.md"]},{"id":"implemented/feature/2026-09-19-isolated-readonly-subagent.md","sourcePath":"implemented/feature/2026-09-19-isolated-readonly-subagent.md","slug":"2026-09-19-isolated-readonly-subagent","lifecycle":"implemented","cls":"feature","date":"2026-09-19","title":"用同步只读子 Agent 隔离委派上下文和能力","status":"implemented","rawBody":"# Agent Note: 用同步只读子 Agent 隔离委派上下文和能力\n\nStatus: implemented\n\n## Problem\n\n主 Agent 独自承担用户会话、工具执行和最终答复。需要单独调查代码或整理局部信息时，把全部过程继续塞进主历史会增加上下文噪声；但直接再调用一个模型并复制主历史与全部工具，又会让子任务继承不需要的用户信息、写入能力、批准流程和控制出口。\n\n子 Agent 因此必须同时隔离两件事：它能看见的消息，以及它能准备和执行的工具。只在提示词中要求“不要写文件”不能构成能力边界；只从请求 schema 中隐藏工具，也不能代替执行前的注册表校验。\n\n## Decision\n\n主 Agent 通过 `delegate_task({ task })` 同步委派一个可独立调查的子任务。该工具不需要人工批准，也不结束主轮；它调用启动工厂注入的 runner，等待 `runSubAgent(task, options)` 返回，再把文本作为普通工具结果交回主 Agent。\n\n每次 `runSubAgent()` 都新建只含专用 system 消息和 task 的消息数组，不继承主 Agent 的 system、用户历史、内部继续提示或工具结果。它复用[流式响应组装](2026-09-13-streamed-model-response.md)，但不把子模型的中间文本冒充主 Agent 答复；无工具调用的完整文本是本次委派结果。\n\n`createToolRegistry(tools)` 从显式 `Tool[]` 创建能力集合，同一个实例同时生成模型可见 schema 并执行 `prepareCall()`。子 Agent 的实例只包含 `read_file`、`search_files`、`calculate` 和 `current_time`；写入、shell、todo、用户交互、完成／暂停及 `delegate_task` 本身既不暴露，也不能通过准备阶段。\n\n子 Agent 的注册表、模型入口和请求上限由 runtime.ts 组装后注入，默认上限为六次，仍有连续三次相同调用守卫。默认前五次可使用只读工具；最后一次撤下全部工具并加入总结提示，使预算耗尽时仍有一次机会根据已有证据返回结论或明确缺口。工具结果按原生调用 ID 回填子历史，过长结果沿用公共截断。真实执行通过 `onProgress` 报告请求、usage 和工具摘要，模拟测试可以保持静默。\n\n## Execution boundary\n\n- 子请求、最终总结与重试共享主轮的[运行控制器](../architecture/2026-09-22-runtime-resilience.md)，包括取消、请求数、时间及 token 总额；总预算不足立即向主轮传播，最终总结不是额外免费请求。局部上限只保留一次总结机会，不保证网络或总预算不足时仍有总结。\n- 委派是单个且同步的；同一条主模型响应中的多个委派仍按主工具循环顺序执行。\n- 子 Agent 没有副作用工具，因此没有嵌套批准；需要写入或执行命令时只能提出建议，由主 Agent走现有批准流程。\n- todo 属于主 Agent 的计划草稿，不复制给子 Agent，也不允许子 Agent修改。\n- 子 Agent 不调用 `ask_user`。信息不足时在结果中说明缺口，由主 Agent决定是否询问用户。\n- 子 Agent 注册表不含 `delegate_task`，从结构上阻止递归委派。\n- 子 Agent 返回的是调查结果，不是可信证明；主 Agent在执行副作用动作前仍需校验和批准。\n\n## Alternatives considered\n\n- 复用主 Agent 的完整历史和全部工具：实现最少，子 Agent 也掌握全部背景；但这只是增加一层模型调用，没有形成上下文或能力隔离，并会引入嵌套批准与控制出口归属问题。\n- 只在 system prompt 中声明只读，同时继续暴露完整注册表：改动很小，但模型偏离提示时仍能准备写入或 shell 调用，不能作为权限边界。\n- 直接使用 Worker、子进程或并行任务：执行隔离和吞吐潜力更强，但需要处理取消、输出汇合、批准串行化、todo 并发和生命周期恢复，超出当前最小委派协议。\n- 使用一次无工具的模型请求完成子任务：天然没有副作用工具，但无法自行定位和分段读取项目文件，不能覆盖当前主要的代码调查场景。\n- 让第六次请求继续使用工具，耗尽后直接抛错：完整保留六次工具机会，但模型可能在最后一次得到新证据后没有机会总结；真实验收暴露该失败后，当前实现保留最后一次为无工具总结。\n\n## Consequences\n\n独立消息数组减少主历史噪声，显式只读注册表形成代码级能力边界；主循环无需识别子 Agent 特例，新增委派工具仍沿用公共准备、执行和结果回填流程。长文件调查可以在子历史中搜索、分页和补读，主 Agent只接收最终结果。\n\n代价是同步委派增加延迟和 token 消耗，主 Agent 等待期间不能并行处理其他调用。只读工具仍可读取守卫允许的项目内容，因此上下文隔离不等于数据保密。固定六次请求也可能只能返回部分结论；最后一次强制总结保证有结果，但不能制造缺失证据。\n\n当前实现不处理并行、跨进程、共享 todo、持久化子任务、嵌套批准或递归分发。只有出现明确需求并建立状态、取消和权限协议后才扩展这些能力。\n\n## Verification\n\n当前依据：[subagent.ts](../../../../src/subagent.ts)、[delegate.ts](../../../../src/tools/delegate.ts)、[registry.ts](../../../../src/tools/registry.ts)、[index.ts](../../../../src/tools/index.ts)、[subagent.test.ts](../../../../src/subagent.test.ts)、[delegate.test.ts](../../../../src/tools/delegate.test.ts) 和 [registry.test.ts](../../../../src/tools/registry.test.ts)。\n\n2026-09-20，学习者运行 `npm run typecheck` 通过，`npm test` 四十八条通过。阶段 9 的十四条新增测试覆盖显式能力集合、重复名称、独立初始消息、只读工具暴露、工具结果回填、未授权工具拒绝、重复调用、最后一次无工具总结、协议错误传播及委派工具注册和控制属性。\n\n真实模型验收中，主 Agent 调用 `delegate_task`；子 Agent 在独立历史中依次使用 `search_files` 和三次 `read_file`，对首次过长截断主动补读，五次请求后返回 `runTurn` 职责结论。全程没有写入、shell、todo、递归委派或人工批准。主 Agent 接收结果、向用户总结并调用 `finish_task`。\n\n更换兼容 API 后的最初验收曾在主请求处报“流式响应缺少结束原因”。只读探针确认站点根路径 `/chat/completions` 返回 HTTP 200 的 HTML 首页，而 `/v1/chat/completions` 返回标准 JSON；将环境中的 base URL 指向 `/v1` 后，SDK 流收到 `null` 后接 `stop` 的结束原因并完成上述验收。这属于连接配置问题，不放宽流协议完整性检查。\n","sections":[{"heading":"Problem","body":"主 Agent 独自承担用户会话、工具执行和最终答复。需要单独调查代码或整理局部信息时，把全部过程继续塞进主历史会增加上下文噪声；但直接再调用一个模型并复制主历史与全部工具，又会让子任务继承不需要的用户信息、写入能力、批准流程和控制出口。\ t_time`；写入、shell、todo、用户交互、完成／暂停及 `delegate_task` 本身既不暴露，也不能通过准备阶段。\n\n子 Agent 的注册表、模型入口和请求上限由 runtime.ts 组装后注入，默认上限为六次，仍有连续三次相同调用守卫。默认前五次可使用只读工具；最后一次撤下全部工具并加入总结提示，使预算耗尽时仍有一次机会根据已有证据返回结论或明确缺口。工具结果按原生调用 ID 回填子历史，过长结果沿用公共截断。真实执行通过 `onProgress` 报告请求、usage 和工具摘要，模拟测试可以保持静默。","alternatives":"- 复用主 Agent 的完整历史和全部工具：实现最少，子 Agent 也掌握全部背景；但这只是增加一层模型调用，没有形成上下文或能力隔离，并会引入嵌套批准与控制出口归属问题。\n- 只在 system prompt 中声明只读，同时继续暴露完整注册表：改动很小，但模型偏离提示时仍能准备写入或 shell 调用，不能作为权限边界。\n- 直接使用 Worker、子进程或并行任务：执行隔离和吞吐潜力更强，但需要处理取消、输出汇合、批准串行化、todo 并发和生命周期恢复，超出当前最小委派协议。\n- 使用一次无工具的模型请求完成子任务：天然没有副作用工具，但无法自行定位和分段读取项目文件，不能覆盖当前主要的代码调查场景。\n- 让第六次请求继续使用工具，耗尽后直接抛错：完整保留六次工具机会，但模型可能在最后一次得到新证据后没有机会总结；真实验收暴露该失败后，当前实现保留最后一次为无工具总结。","consequences":"独立消息数组减少主历史噪声，显式只读注册表形成代码级能力边界；主循环无需识别子 Agent 特例，新增委派工具仍沿用公共准备、执行和结果回填流程。长文件调查可以在子历史中搜索、分页和补读，主 Agent只接收最终结果。\n\n代价是同步委派增加延迟和 token 消耗，主 Agent 等待期间不能并行处理其他调用。只读工具仍可读取守卫允许的项目内容，因此上下文隔离不等于数据保密。固定六次请求也可能只能返回部分结论；最后一次强制总结保证有结果，但不能制造缺失证据。\n\n当前实现不处理并行、跨进程、共享 todo、持久化子任务、嵌套批准或递归分发。只有出现明确需求并建立状态、取消和权限协议后才扩展这些能力。","outLinks":["implemented/architecture/2026-09-22-runtime-resilience.md","implemented/feature/2026-09-13-streamed-model-response.md"]},{"id":"implemented/feature/2026-09-13-streamed-model-response.md","sourcePath":"implemented/feature/2026-09-13-streamed-model-response.md","slug":"2026-09-13-streamed-model-response","lifecycle":"implemented","cls":"feature","date":"2026-09-13","title":"流式显示与完整消息组装分离","status":"implemented","rawBody":"# Agent Note: 流式显示与完整消息组装分离\n\nStatus: implemented\n\n## Problem\n\n原来的 `runTurn()` 等待完整模型响应后才显示文本。改为流式请求后，文本可以即时到达，但工具调用的 ID、名称和参数可能分散在多个片段中；不完整响应不能直接写入历史或进入工具执行流程。当前主轮入口见 [turn.ts](../../../../src/turn.ts)。\n\n## Decision\n\n[collectResponse](../../../../src/stream.ts) 单独负责消费一次模型流：文本和拒绝文本到达时调用显示回调，并在本次请求私有的 Map 中按调用 index 累积 ID、名称和原始参数字符串。函数只返回完整的 assistant message 与实际收到的 usage，不执行工具、不校验业务参数，也不写历史。\n\n读取结束后，有工具调用时结束原因必须是 `tool_calls`，无工具调用时必须是 `stop`。缺少结束标记、截断、过滤、不支持的调用类型，以及不完整、跳号或重复的调用标识均作为协议错误抛出。返回的函数调用按 index 排序且必须从零连续；当前只支持一个回复候选和 function 工具。\n\n完整响应中的非法 JSON 或业务参数保留原文，交给现有 [prepareCall](../../../../src/tools/registry.ts) 解析和校验，再作为普通工具错误反馈给模型。协议完整性和工具契约校验因此保持为两层边界。\n\n`runTurn()` 使用的 [模型入口](../../../../src/llm.ts) 启用 `stream: true` 与 `stream_options.include_usage`。usage 在 choices 之前读取，以接收 choices 为空的尾部统计片段；终端文本由回调逐片输出，流正常组装后才将 assistant 消息加入历史并进入循环守卫、批准、执行和完成／暂停流程。接收异常继续沿用[本轮历史回退](../bug-fix/2026-09-06-tool-result-history-recovery.md)。\n\n## Alternatives considered\n\n- 在 `runTurn()` 内直接消费所有分片：接入时少一个模块，但协议组装会和批准、执行、循环守卫交织，难以单独回放失败输入。独立函数保留了现有消息结构，并允许用模拟流覆盖边界。\n- 使用 SDK 的自动组装辅助方法：可以减少自维护协议代码，是扩展更多响应类型时可重新考虑的方案；当前项目以手写机制为学习目标，显式累积直接承接了已有练习。这里没有做性能对比实验。\n- 参数一旦能解析就提前执行：可能缩短等待时间，但可解析前缀不证明响应正常结束，也不能确认其余调用及对应历史已完整。等待完整响应才能保持工具结果配对和异常回退边界。\n\n## Consequences\n\n文本可以在模型生成期间显示，同时历史、工具校验和执行仍只接收完整消息；多个同名调用和交错片段不会因名称相同而混合。协议异常与参数错误分开处理，使损坏的流不能触发工具，而模型仍有机会修正完整但不合法的参数。\n\n代价是项目开始自行维护一部分流协议，只覆盖单个回复候选与 function 工具。兼容服务若改变结束原因、调用编号或 usage 尾片行为，需要更新组装器和测试。接收中途失败时，已经显示的文字无法撤回；历史回退也不能撤销此前已经发生的外部动作。\n\n阶段 8 的三个独立练习脚本在正式组装器和常驻测试接入后删除，避免教学脚手架成为第二套实现入口；练习证据保留在[学习进度](../../../learning/progress.md)。\n\n## Verification\n\n2026-09-13，参考实现曾在隔离临时文件中通过 TypeScript 检查和十三项模拟流测试，覆盖文本、拒绝文本、尾部 usage、同名调用交错与排序、名称分片、请求隔离、异常传播、结束状态、ID 与编号校验、不支持类型及非法参数原文保留。\n\n2026-09-19，学习者将实现接入当时位于 `agent.ts` 的主循环，真实模型在同一次响应中组装并执行 `current_time` 与 `calculate`，随后调用 `finish_task`；另一个用例拒绝 `run_bash` 后调用 `pause_task`，没有重试或绕过。两次路径均收到 usage，文本没有重复打印。2026-09-20，主循环迁移到 [turn.ts](../../../../src/turn.ts)，新增的主轮模拟测试与普通请求、委派请求真实验收继续覆盖该流式路径。\n\n十三项模拟场景已固化为 [stream.test.ts](../../../../src/stream.test.ts) 并加入 [package.json](../../../../package.json) 的全量测试。删除三个练习脚本后，学习者运行 `npm run typecheck` 通过，`npm test` 三十四条通过、零失败。\n","sections":[{"heading":"Problem","body":"原来的 `runTurn()` 等待完整模型响应后才显示文本。改为流式请求后，文本可以即时到达，但工具调用的 ID、名称和参数可能分散在多个片段中；不完整响应不能直接写入历史或进入工具执行流程。当前主轮入口见 [turn.ts](../../../../src/turn.ts)。","anchor":"section-0"},{"heading":"Decision","body":"[collectResponse](../../../../src/stream.ts) 单独负责消费一次模型流：文本和拒绝文本到达时调用显示回调，并在本次请求私有的 Map 中按调用 index 累积 ID、名称和原始参数字符串。函数 ()` 等待完整模型响应后才显示文本。改为流式请求后，文本可以即时到达，但工具调用的 ID、名称和参数可能分散在多个片段中；不完整响应不能直接写入历史或进入工具执行流程。当前主轮入口见 [turn.ts](../../../../src/turn.ts)。","decision":"[collectResponse](../../../../src/stream.ts) 单独负责消费一次模型流：文本和拒绝文本到达时调用显示回调，并在本次请求私有的 Map 中按调用 index 累积 ID、名称和原始参数字符串。函数只返回完整的 assistant message 与实际收到的 usage，不执行工具、不校验业务参数，也不写历史。\n\n读取结束后，有工具调用时结束原因必须是 `tool_calls`，无工具调用时必须是 `stop`。缺少结束标记、截断、过滤、不支持的调用类型，以及不完整、跳号或重复的调用标识均作为协议错误抛出。返回的函数调用按 index 排序且必须从零连续；当前只支持一个回复候选和 function 工具。\n\n完整响应中的非法 JSON 或业务参数保留原文，交给现有 [prepareCall](../../../../src/tools/registry.ts) 解析和校验，再作为普通工具错误反馈给模型。协议完整性和工具契约校验因此保持为两层边界。\n\n`runTurn()` 使用的 [模型入口](../../../../src/llm.ts) 启用 `stream: true` 与 `stream_options.include_usage`。usage 在 choices 之前读取，以接收 choices 为空的尾部统计片段；终端文本由回调逐片输出，流正常组装后才将 assistant 消息加入历史并进入循环守卫、批准、执行和完成／暂停流程。接收异常继续沿用[本轮历史回退](../bug-fix/2026-09-06-tool-result-history-recovery.md)。","alternatives":"- 在 `runTurn()` 内直接消费所有分片：接入时少一个模块，但协议组装会和批准、执行、循环守卫交织，难以单独回放失败输入。独立函数保留了现有消息结构，并允许用模拟流覆盖边界。\n- 使用 SDK 的自动组装辅助方法：可以减少自维护协议代码，是扩展更多响应类型时可重新考虑的方案；当前项目以手写机制为学习目标，显式累积直接承接了已有练习。这里没有做性能对比实验。\n- 参数一旦能解析就提前执行：可能缩短等待时间，但可解析前缀不证明响应正常结束，也不能确认其余调用及对应历史已完整。等待完整响应才能保持工具结果配对和异常回退边界。","consequences":"文本可以在模型生成期间显示，同时历史、工具校验和执行仍只接收完整消息；多个同名调用和交错片段不会因名称相同而混合。协议异常与参数错误分开处理，使损坏的流不能触发工具，而模型仍有机会修正完整但不合法的参数。\n\n代价是项目开始自行维护一部分流协议，只覆盖单个回复候选与 function 工具。兼容服务若改变结束原因、调用编号或 usage 尾片行为，需要更新组装器和测试。接收中途失败时，已经显示的文字无法撤回；历史回退也不能撤销此前已经发生的外部动作。\n\n阶段 8 的三个独立练习脚本在正式组装器和常驻测试接入后删除，避免教学脚手架成为第二套实现入口；练习证据保留在[学习进度](../../../learning/progress.md)。","outLinks":["implemented/bug-fix/2026-09-06-tool-result-history-recovery.md"]},{"id":"implemented/process/2026-09-12-readable-board-and-stable-sync.md","sourcePath":"implemented/process/2026-09-12-readable-board-and-stable-sync.md","slug":"2026-09-12-readable-board-and-stable-sync","lifecycle":"implemented","cls":"process","date":"2026-09-12","title":"用独立的项目地图连接运行流程、开发进度与决策依据","status":"implemented","rawBody":"# Agent Note: 用独立的项目地图连接运行流程、开发进度与决策依据\n\nStatus: implemented\n\n首次整理：2026-09-12；当前展示与同步行为核对：2026-09-13。\n\n## Problem\n\n原看板信息密度高，卡片与装饰占据阅读空间，用户希望改为浅色、留白充足的文档工作台。目录热更新时，同一天的笔记又会反复变换顺序，打断查找与阅读。\n\n导航已经提示当前位置，正文仍重复项目或模块标题、导语、节点职责和页脚说明。这些介绍占据首屏，分散了对流程、实际做法和决策正文的注意力。\n\n资料页沿用左侧目录、右侧详情的 Wiki 布局，地图又有常驻的侧边说明。切换入口时导航方式改变，流程空间被固定面板挤占；用户希望直接在流程中展开内容，阅读后回到原来的位置。\n\n按日期、类别或模块排列笔记，仍需要读者自行拼出项目如何工作。当前笔记全是 implemented，这些状态不能说明下一步安排或学习掌握程度。用户需要先看懂任务在各部分之间怎样流转，并直接找到当前实现、待验证项和下一步；只有需要追溯时才阅读全文。\n\n旧实现将文件系统遍历顺序直接传入只按日期排序的数组，并在每次检查后无条件重画所有视图。同日期、同引用数没有确定的次级顺序；focus 与定时检查也没有统一的并发入口。\n\n## Decision\n\n项目看板首页展示可点击的运行流程。主循环、返回路径、辅助状态与控制分支按[项目展示配置](../../../board.json)固定布局；节点展示当前行为、限制，并链接决策依据与源码入口。图中关系根据实际源码和设计决定整理，不从笔记互相引用的数量推断运行时依赖。Mini Agent 的提问分支回填回答后继续当前轮，完成和暂停分支结束本轮、等待新指令。\n\n所有视图共用顶部横向导航，模块通过资料页筛选器选择，移除常驻侧目录和面包屑；页面级 h1 仅保留给辅助技术与键盘焦点。图内和分区使用一个短标题，阅读层只显示一次笔记原题。模板移除介绍段落、操作导语、重复资料入口与页脚统计；配置移除项目独立标题、项目／地图／模块的 description 和节点 purpose 字段。实际行为、限制、笔记全文及有明确用途的筛选计数继续显示。\n\n流程画布占据完整内容宽度，默认收起节点说明。点击节点后只展开一处详情，再次点击或关闭即收起。桌面详情放在节点所属行下方；窄屏主流程与分支详情紧接所选节点，辅助节点共用行下方的展开区。详情展示实现、限制、源码，以及所选决策的取舍和验证节选；备选方案按需展开，切换依据和阅读全文使用同一处入口。内容高度变化时重算窄屏回路线。\n\n顶部的当前实现和下一步候选，以及下方的待验证项，按配置中的章节名读取[现有进度](../../../learning/progress.md)。可选的学习区域读取实践记录、理解证据与练习入口，可在页面折叠或通过配置关闭。教学方法仍由[独立教练约定](2026-09-11-learning-workflow-and-notes.md)管理，不扩展笔记的 class 或 lifecycle，也不从 implemented 状态推断学习者已经掌握。\n\n完整决策、演进记录和方案取舍保留独立入口。资料页使用卡片集合与筛选器，笔记和进度原文在居中的原生 dialog 中打开，正文独立滚动，关联笔记放在正文下方。关闭按钮、Esc、点击背景或浏览器后退关闭阅读层，恢复原视图、筛选、节点、滚动位置和焦点。首次阅读增加一个浏览器历史项，关联资料在此项中替换，层内“返回上一份资料”恢复前一份正文及其位置。阅读状态与两处滚动位置写入历史项，以支持刷新和前进；页面滚动时延迟保存，离开前补存，避免仅在 pagehide 保存而错过 Chromium 的重载历史。\n\n配置中的 groups 组织资料筛选与无地图时的模块集合，笔记去重分配，新增、改名或未配置的记录进入标准类别。缺少展示配置时回到按类别浏览全部笔记，不隐藏记录。\n\n页面模板、浏览器逻辑、资料适配器和生成脚本由项目独立维护，原版 Skill 保持原样。项目名、流程节点、源码路径和学习资料章节留在可选配置中。节点的简短行为解释用于浏览，详细理由仍以决策笔记为依据；阶段和理解证据只在进度文件中维护。两种输出共用解析器，沿用[完整章节读取](2026-09-11-complete-board-sections.md)。\n\n连接项目根目录或 .agents 时，一次检查读取笔记、board.json 和配置明确引用的 Markdown 资料；相同来源只读一次。仅连接 notes 时只显示该目录的笔记，不继承原项目的地图和学习状态。未连接的 board.html 显示生成时的项目概览，完整决策需要连接目录；离线快照同时内嵌笔记。连接操作与状态集中在顶部，显示未连接、离线快照、自动同步或同步失败；手动检查仅在连接后出现，目录名与检查时间放在状态提示中。\n\n检查请求串行执行，重叠触发合并为后续一次检查。内容指纹包含笔记路径与正文、展示配置及资料正文，不依赖文件大小、时间或遍历顺序；同日期和同引用数使用规范路径确定顺序。未变化时不提交数据或替换 DOM；变化时保留节点展开、依据选择、备选和学习区域偏好、当前阅读资料、焦点及两处滚动位置。切换目录使旧读取失效。读取失败或配置尚未写完整时保留最后成功数据；明确删除的配置回退到笔记浏览，缺失的资料或章节显示提示，当前笔记删除后仍在阅读层显示可关闭的缺失状态。\n\n## Alternatives considered\n\n- 只覆盖原页面的 CSS：改动集中，能快速改变配色，但阅读结构、详情缺失和刷新状态仍受原模板控制；独立页面更符合这次重新设计的范围。\n- 继续把模块笔记清单作为首页：便于查找和完整阅读，但运行关系与当前开发重点仍依赖读者自行归纳；清单作为资料入口保留。\n- 自动把笔记引用绘制成架构图：不需要额外维护关系，但引用只能证明相关背景，无法证明调用顺序、状态供给或控制权返回位置；当前使用有源码依据的明确流程配置。\n- 只补一个排序条件：可以稳定同日期的先后关系，但每次扫描仍会替换 DOM，无法保留焦点，也没有处理重叠读取与失败快照。\n- 引入前端框架和开发服务器：组件与更新机制成熟，但看板目前规模小，主要需要直接打开 HTML 和本地目录读取；项目采用无新增依赖的模板生成与原生浏览器逻辑。\n- 将 Mini Agent 的流程、阶段和教学方法写进渲染器或上游 Skill：配置更少，但其他项目必须修改通用工具。独立展示配置与资料来源允许替换项目内容或关闭学习区域，代价是维护节点摘要及其依据链接。\n- 将介绍折叠或增加精简模式：仍可按需展开完整导览，但要继续维护重复说明和额外偏好；已有导航足以定位，当前直接删去这层内容与配置字段。\n- 保留可折叠的左侧模块目录：适合连续查阅文档，但仍以目录层级组织页面，地图与资料的导航方式也不统一；模块筛选与顶部入口足以覆盖当前查找需求。\n- 将节点说明改成右侧抽屉：可以减少常驻内容，但宽屏仍要在流程和侧栏间来回看，窄屏抽屉还会遮住节点；当前就地展开，代价是下方内容随之移动。\n- 全文跳转到独立详情页：地址与整页阅读直观，但离开流程后需要重新建立当前位置；居中阅读层保留背景，代价是显式维护阅读历史、焦点和滚动恢复。\n\n## Consequences\n\n读者可以先沿流程理解项目，再定位当前实现、缺口和详细依据。展示层与学习区域可独立迁移，未改变内容的同步保持页面稳定。代价是项目负责展示逻辑、有限的 Markdown 渲染、资料适配和同步回归；上游看板的界面更新不会自动进入本项目。\n\n精简后的首屏直接呈现进度和流程，模块页直接进入筛选与清单。首次阅读依靠节点标签和实际内容，没有独立的导览介绍；后续只有观察到具体入口无法理解时，才在该入口补充必要提示。\n\n画布只保留一个展开节点，适合沿流程查看，不提供多个节点详情并排比较。全文阅读时背景暂不可操作，跨资料返回由阅读层管理；资料关联仍完整保留。布局不新增依赖，但需要维护原生 dialog、响应式详情位置与浏览器历史之间的状态边界。\n\n流程关系与简短行为解释需要随实现维护，资料章节改名时需要同步配置；校验能发现无效关系与缺失路径，不能证明描述符合源码。当前布局支持二至六步主流程、辅助节点、一个可选回路和控制分支，更复杂的关系需要扩展布局。模板或脚本修改后重新生成并刷新；连接完整项目后的配置、笔记和进度变更无需重新生成页面。\n\n自动同步是可见页面每三秒检查，并在返回页面时检查，并非操作系统文件监听。每次检查读取笔记和引用资料，当前小型项目可接受；规模扩大后再依据实际开销考虑缓存。保存过程中短暂解析失败会保留旧内容，下一次检查恢复。\n\n本地目录连接依赖 Chrome 或 Edge 的文件访问 API 与浏览器授权。目录句柄、筛选、节点与学习区域偏好按页面路径和项目名保存；旧版保存的 notes 句柄仍能浏览笔记，需要重新选择项目根目录才能读取同级配置与学习资料。源码相对链接仍以生成页面所在项目为基准。\n\n## Verification\n\n2026-09-12 在旧页面中反转相同笔记的输入顺序，观察到同日列表顺序改变及 DOM 被替换。当前实现依据：[数据与同步模块](../../../../scripts/notes-board/model.mjs)、[项目资料适配器](../../../../scripts/notes-board/project.mjs)、[页面逻辑](../../../../scripts/notes-board/app.js)、[生成入口](../../../../scripts/build-notes-board.mjs)。\n\n2026-09-13 的 `npm run test:board` 二十六条回归通过，包含原有排序、解析与同步用例，以及地图关系完整性、实际依据路径、资料范围、配置和进度单独变更、缺失来源与无配置回退。`npm run typecheck`、浏览器脚本与生成器语法检查、两种生成命令通过。\n\n浏览器使用隔离 OPFS 目录进行实际文件读写，并通过目录适配入口反复改变遍历顺序。重复检查保留节点、焦点、正文和详情滚动位置，以及依据与学习区域展开状态；等长进度编辑只更新对应区域，配置变更保留选中节点；读取失败后保留内容并恢复。轮询检测新增未分组笔记；关闭学习区域、删除资料、移除配置和只连接 notes 均按约定回退。真实浏览器句柄在重载后恢复连接、节点选择和学习偏好。此测试不代替用户在 Windows 原生目录选择框中的授权。\n\n文案精简后，浏览器逐篇核对二十篇笔记的一百个完整章节，并核对全部备选入口。九个地图节点、决策与进度原文跳转、返回原环节、模块筛选、搜索与清除、时间线月份筛选和键盘焦点通过。1536、1280、1024、800、700、390 和 360px 下的地图、资料、时间线、取舍与模块页均无横向溢出；窄屏导航、详情返回和学习区域开关通过，未出现页面脚本错误。\n\n合并连接控件后，使用独立浏览器上下文与隔离 OPFS 目录验证：未连接状态、单次按钮触发、手动检查、不变内容保留节点和展开状态、配置解析失败后的状态与恢复、真实句柄重载，以及只连接 notes 的二十篇笔记回退均通过。这些检查不代替 Windows 原生目录选择框的人工授权。\n\n2026-09-13 完成全宽布局后，浏览器的一百零一项检查通过：九个节点的桌面与窄屏展开、切换依据、再次点击及 Esc 收起；二十篇笔记的一百个完整章节；搜索、月份筛选、关联资料返回、直接链接与缺失笔记；关闭后恢复原位置和焦点、阅读中重载、浏览器前进与后退。1536、1280、1024、800、700、390 和 360px 下的四个主视图均保留顶部导航且无横向溢出。实际复现并修正了重载丢失阅读位置、展开备选后窄屏回路线长度未更新的问题。\n\n相同版本在隔离 OPFS 目录中的十七项同步检查通过：不变轮询保留 DOM，修改地图或正在阅读的笔记保留阅读层与选择；半写入配置保留上次内容并在恢复后清除提示；关闭后恢复展开区、依据和学习偏好；真实句柄重载后继续阅读；当前笔记删除、进度原文更新、配置移除及只连接 notes 均能正常回退。两组浏览器检查没有页面脚本错误。这些结果属于看板验证，不增加 Agent 运行或学习理解证据。\n","sections":[{"heading":"Problem","body":"原看板信息密度高，卡片与装饰占据阅读空间，用户希望改为浅色、留白充足的文档工作台。目录热更新时，同一天的笔记又会反复变换顺序，打断查找与阅读。\n\n导航已经提示当前位置，正文仍重复项目或模块标题、导语、节点职责和页脚说明。这些介绍占据首屏，分散了对流程、实际做法和决策正文的注意力。\n\n资料页沿用左侧目录、右侧详情的 Wiki 布局，地图又有常驻的侧边说明。切换入口时导航方式改变，流程空间被固定面板挤占；用户希望直接在流程中展开内容，阅读后回到原来的位置。\n\n按日期、类别或模块排列笔记，仍需要读者自行拼出项目如何工作。当前笔记全是 implemented，这些状态不能说明下一步安排或学习掌握程度。用户需要先看懂任务在各部分之间怎样流转，并直接找到当前实现、待验证项和下一步；只有需要追溯时才阅读全文。\n\n旧实现将文件系统遍历顺序直接传入只按日期排序的数组，并在每次检查后无条件重画所有视图。同日期、同引用数没有确定的次级顺序；focus 与定时检查也没有统一的并发入口。","anchor":"section-0"},{"heading":"Decision","body":"项目看板首页展示可点击的运行流程。主循环、返回路径、辅助状态与控制分支按[项目展示配置](../../../board.json)固定布局；节点展示当前行为、限制，并链接决策依据与源码入口。图中关系根据实际源码和设计决定整理，不从笔记互相引用的数量推断运行时依赖。Mini Agent 的提问分支回填回答后继续当前轮，完成和暂停分支结束本轮、等待新指令。\n\n所有视图共用顶部横向导航，模块通过资料页筛选器选择，移除常驻侧目录和面包屑；页面级 h1 仅保留给辅助技术与键盘焦点。图内和分区使用一个短标题，阅读层只显示一次笔记原题。模板移除介绍段落、操作导语、重复资料入口与页脚统计；配置移除项目独立标题、项目／地图／模块的 description 和节点 purpose 字段。实际行为、限制、笔记全文及有明确用途的筛选计数继续显示。\n\n流程画布占据完整内容宽度，默认收起节点说明。点击节点后只展开一处详情，再次点击或关闭即收起。桌面详情放在节点所属行下方；窄屏主流程与分支详情紧接所选节点，辅助节点共用行下方的展开区。详情展示实现、限制、源码，以及所选决策的取舍和验证节选；备选方案按需展开，切换依据和阅读全文使用同一处入口。内容高度变化时重算窄屏回路线。\n\n顶部的当前实现和下一步候选，以及下方的待验证项，按配置中的章节名读取[现有进度](../../../learning/progress.md)。可选的学习区域读取实践记录、理解证据与练习入口，可在页面折叠或通过配置关闭。教学方法仍由[独立教练约定](2026-09-11-learning-workflow-and-notes.md)管理，不扩展笔记的 class 或 lifecycle，也不从 implemented 状态推断学习者已经掌握。\n\n完整决策、演进记录和方案取舍保留独立入口。资料页使用卡片集合与筛选器，笔记和进度原文在居中的原生 dialog 中打开，正文独立滚动，关联笔记放在正文下方。关闭按钮、Esc、点击背景或浏览器后退关闭阅读层，恢复原视图、筛选、节点、滚动位置和焦点。首次阅读增加一个浏览器历史项，关联资料在此项中替换，层内“返回上一份资料”恢复前一份正文及其位置。阅读状态与两处滚动位置写入历史项，以支持刷新和前进；页面滚动时延迟保存，离开前补存，避免仅在 pagehide 保存而错过 Chromium 的重载历史。\n\n配置中的 groups 组织资料筛选与无地图时的模块集合，笔记去重分配，新增、改名或未配置的记录进入标准类别。缺少展示配置时回到按类别浏览全部笔记，不隐藏记录。\n\n页面模板、浏览器逻辑、资料适配器和生成脚本由项目独立维护，原版 Skill 保持原样。项目名、流程节点、源码路径和学习资料章节留在可选配置中。节点的简短行为解释用于浏览，详细理由仍以决策笔记为依据；阶段和理解证据只在进度文件中维护。两种输出共用解析器，沿用[完整章节读取](2026-09-11-complete-board-sections.md)。\n\n连接项目根目录或 .agents 时，一次检查读取笔记、board.json 和配置明确引用的 Markdown 资料；相同来源只读一次。仅连接 notes 时只显示该目录的笔记，不继承原项目的地图和学习状态。未连接的 board.html 显示生成时的项目概览，完整决策需要连接目录；离线快照同时内嵌笔记。连接操作与状态集中在顶部，显示未连接、离线快照、自动同步或同步失败；手动检查仅在连接后出现，目录名与检查时间放在状态提示中。\n\n检查请求串行执行，重叠触发合并为后续一次检查。内容指纹包含笔记路径与正文、展示配置及资料正文，不依赖文件大小、时间或遍历顺序；同日期和同引用数使用规范路径确定顺序。未变化时不提交数据或替换 DOM；变化时保留节点展开、依据选择、备选和学习区域偏好、当前阅读资料、焦点及两处滚动位置。切换目录使旧读取失效。读取失败或配置尚未写完整时保留最后成功数据；明确删除的配置回退到笔记浏览，缺失的资料或章节显示提示，当前笔记删除后仍在阅读层显示可关闭的缺失状态。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 只覆盖原页面的 CSS：改动集中，能快速改变配色，但阅读结构、详情缺失和刷新状态仍受原模板控制；独立页面更符合这次重新设计的范围。\n- 继续把模块笔记清单作为首页：便于查找和完整阅读，但运行关系与当前开发重点仍依赖读者自行归纳；清单作为资料入口保留。\n- 自动把笔记引用绘制成架构图：不需要额外维护关系，但引用只能证明相关背景，无法证明调用顺序、状态供给或控制权返回位置；当前使用有源码依据的明确流程配置。\n- 只补一个排序条件：可以稳定同日期的先后关系，但每次扫描仍会替换 DOM，无法保留焦点，也没有处理重叠读取与失败快照。\n- 引入前端框架和开发服务器：组件与更新机制成熟，但看板目前规模小，主要需要直接打开 HTML 和本地目录读取；项目采用无新增依赖的模板生成与原生浏览器逻辑。\n- 将 Mini Agent 的流程、阶段和教学方法写进渲染器或上游 Skill：配置更少，但其他项目必须修改通用工具。独立展示配置与资料来源允许替换项目内容或关闭学习区域，代价是维护节点摘要及其依据链接。\n- 将介绍折叠或增加精简模式：仍可按需展开完整导览，但要继续维护重复说明和额外偏好；已有导航足以定位，当前直接删去这层内容与配置字段。\n- 保留可折叠的左侧模块目录：适合连续查阅文档，但仍以目录层级组织页面，地图与资料的导航方式也不统一；模块筛选与顶部入口足以覆盖当前查找需求。\n- 将节点说明改成右侧抽屉：可以减少常驻内容，但宽屏仍要在流程和侧栏间来回看，窄屏抽屉还会遮住节点；当前就地展开，代价是下方内容随之移动。\n- 全文跳转到独立详情页：地址与整页阅读直观，但离开流程后需要重新建立当前位置；居中阅读层保留背景，代价是显式维护阅读历史、焦点和滚动恢复。","anchor":"section-2"},{"heading":"Consequences","body":"读者可以先沿流程理解项目，再定位当前实现、缺口和详细依据。展示层与学习区域可独立迁移，未改变内容的同步保持页面稳定。代价是项目负责展示逻辑、有限的 Markdown 渲染、资料适配和同步回归；上游看板的界面更新不会自动进入本项目。\n\n精简后的首屏直接呈现进度和流程，模块页直接进入筛选与清单。首次阅读依靠节点标签和实际内容，没有独立的导览介绍；后续只有观察到具体入口无法理解时，才在该入口补充必要提示。\n\n画布只保留一个展开节点，适合沿流程查看，不提供多个节点详情并排比较。全文阅读时背景暂不可操作，跨资料返回由阅读层管理；资料关联仍完整保留。布局不新增依赖，但需要维护原生 dialog、响应式详情位置与浏览器历史之间的状态边界。\n\n流程关系与简短行为解释需要随实现维护，资料章节改名时需要同步配置；校验能发现无效关系与缺失路径，不能证明描述符合源码。当前布局支持二至六步主流程、辅助节点、一个可选回路和控制分支，更复杂的关系需要扩展布局。模板或脚本修改后重新生成并刷新；连接完整项目后的配置、笔记和进度变更无需重新生成页面。\n\n自动同步是可见页面每三秒检查，并在返回页面时检查，并非操作系统文件监听。每次检查读取笔记和引用资料，当前小型项目可接受；规模扩大后再依据实际开销考虑缓存。保存过程中短暂解析失败会保留旧内容，下一次检查恢复。\n\n本地目录连接依赖 Chrome 或 Edge 的文件访问 API 与浏览器授权。目录句柄、筛选、节点与学习区域偏好按页面路径和项目名保存；旧版保存的 notes 句柄仍能浏览笔记，需要重新选择项目根目录才能读取同级配置与学习资料。源码相对链接仍以生成页面所在项目为基准。","anchor":"section-3"},{"heading":"Verification","body":"2026-09-12 在旧页面中反转相同笔记的输入顺序，观察到同日列表顺序改变及 DOM 被替换。当前实现依据：[数据与同步模块](../../../../scripts/notes-board/model.mjs)、[项目资料适配器](../../../../scripts/notes-board/project.mjs)、[页面逻辑](../../../../scripts/notes-board/app.js)、[生成入口](../../../../scripts/build-notes-board.mjs)。\n\n2026-09-13 的 `npm run test:board` 二十六条回归通过，包含原有排序、解析与同步用例，以及地图关系完整性、实际依据路径、资料范围、配置和进度单独变更、缺失来源与无配置回退。`npm run typecheck`、浏览器脚本与生成器语法检查、两种生成命令通过。\n\n浏览器使用隔离 OPFS 目录进行实际文件读写，并通过目录适配入口反复改变遍历顺序。重复检查保留节点、焦点、正文和详情滚动位置，以及依据与学习区域展开状态；等长进度编辑只更新对应区域，配置变更保留选中节点；读取失败后保留内容并恢复。轮询检测新增未分组笔记；关闭学习区域、删除资料、移除配置和只连接 notes 均按约定回退。真实浏览器句柄在重载后恢复连接、节点选择和学习偏好。此测试不代替用户在 Windows 原生目录选择框中的授权。\n\n文案精简后，浏览器逐篇核对二十篇笔记的一百个完整章节，并核对全部备选入口。九个地图节点、决策与进度原文跳转、返回原环节、模块筛选、搜索与清除、时间线月份筛选和键盘焦点通过。1536、1280、1024、800、700、390 和 360px 下的地图、资料、时间线、取舍与模块页均无横向溢出；窄屏导航、详情返回和学习区域开关通过，未出现页面脚本错误。\n\n合并连接控件后，使用独立浏览器上下文与隔离 OPFS 目录验证：未连接状态、单次按钮触发、手动检查、不变内容保留节点和展开状态、配置解析失败后的状态与恢复、真实句柄重载，以及只连接 notes 的二十篇笔记回退均通过。这些检查不代替 Windows 原生目录选择框的人工授权。\n\n2026-09-13 完成全宽布局后，浏览器的一百零一项检查通过：九个节点的桌面与窄屏展开、切换依据、再次点击及 Esc 收起；二十篇笔记的一百个完整章节；搜索、月份筛选、关联资料返回、直接链接与缺失笔记；关闭后恢复原位置和焦点、阅读中重载、浏览器前进与后退。1536、1280、1024、800、700、390 和 360px 下的四个主视图均保留顶部导航且无横向溢出。实际复现并修正了重载丢失阅读位置、展开备选后窄屏回路线长度未更新的问题。\n\n相同版本在隔离 OPFS 目录中的十七项同步检查通过：不变轮询保留 DOM，修改地图或正在阅读的笔记保留阅读层与选择；半写入配置保留上次内容并在恢复后清除提示；关闭后恢复展开区、依据和学习偏好；真实句柄重载后继续阅读；当前笔记删除、进度原文更新、配置移除及只连接 notes 均能正常回退。两组浏览器检查没有页面脚本错误。这些结果属于看板验证，不增加 Agent 运行或学习理解证据。","anchor":"section-4"}],"problem":"原看板信息密度高，卡片与装饰占据阅读空间，用户希望改为浅色、留白充足的文档工作台。目录热更新时，同一天的笔记又会反复变换顺序，打断查找与阅读。\n\n导航已经提示当前位置，正文仍重复项目或模块标题、导语、节点职责和页脚说明。这些介绍占据首屏，分散了对流程、实际做法和决策正文的注意力。\n\n资料页沿用左侧目录、右侧详情的 Wiki 布局，地图又有常驻的侧边说明。切换入口时导航方式改变，流程空间被固定面板挤占；用户希望直接在流程中展开内容，阅读后回到原来的位置。\n\n按日期、类别或模块排列笔记，仍需要读者自行拼出项目如何工作。当前笔记全是 implemented，这些状态不能说明下一步安排或学习掌握程度。用户需要先看懂任务在各部分之间怎样流转，并直接找到当前实现、待验证项和下一步；只有需要追溯时才阅读全文。\n\n旧实现将文件系统遍历顺序直接传入只按日期排序的数组，并在每次检查后无条件重画所有视图。同日期、同引用数没有确定的次级顺序；focus 与定时检查也没有统一的并发入口。","decision":"项目看板首页展示可点击的运行流程。主循环、返回路径、辅助状态与控制分支按[项目展示配置](../../../board.json)固定布局；节点展示当前行为、限制，并链接决策依据与源码入口。图中关系根据实际源码和设计决定整理，不从笔记互相引用的数量推断运行时依赖。Mini Agent 的提问分支回填回答后继续当前轮，完成和暂停分支结束本轮、等待新指令。\n\n所有视图共用顶部横向导航，模块通过资料页筛选器选择，移除常驻侧目录和面包屑；页面级 h1 仅保留给辅助技术与键盘焦点。图内和分区使用一个短标题，阅读层只显示一次笔记原题。模板移除介绍段落、操作导语、重复资料入口与页脚统计；配置移除项目独立标题、项目／地图／模块的 description 和节点 purpose 字段。实际行为、限制、笔记全文及有明确用途的筛选计数继续显示。\n\n流程画布占据完整内容宽度，默认收起节点说明。点击节点后只展开一处详情，再次点击或关闭即收起。桌面详情放在节点所属行下方；窄屏主流程与分支详情紧接所选节点，辅助节点共用行下方的展开区。详情展示实现、限制、源码，以及所选决策的取舍和验证节选；备选方案按需展开，切换依据和阅读全文使用同一处入口。内容高度变化时重算窄屏回路线。\n\n顶部的当前实现和下一步候选，以及下方的待验证项，按配置中的章节名读取[现有进度](../../../learning/progress.md)。可选的学习区域读取实践记录、理解证据与练习入口，可在页面折叠或通过配置关闭。教学方法仍由[独立教练约定](2026-09-11-learning-workflow-and-notes.md)管理，不扩展笔记的 class 或 lifecycle，也不从 implemented 状态推断学习者已经掌握。\n\n完整决策、演进记录和方案取舍保留独立入口。资料页使用卡片集合与筛选器，笔记和进度原文在居中的原生 dialog 中打开，正文独立滚动，关联笔记放在正文下方。关闭按钮、Esc、点击背景或浏览器后退关闭阅读层，恢复原视图、筛选、节点、滚动位置和焦点。首次阅读增加一个浏览器历史项，关联资料在此项中替换，层内“返回上一份资料”恢复前一份正文及其位置。阅读状态与两处滚动位置写入历史项，以支持刷新和前进；页面滚动时延迟保存，离开前补存，避免仅在 pagehide 保存而错过 Chromium 的重载历史。\n\n配置中的 groups 组织资料筛选与无地图时的模块集合，笔记去重分配，新增、改名或未配置的记录进入标准类别。缺少展示配置时回到按类别浏览全部笔记，不隐藏记录。\n\n页面模板、浏览器逻辑、资料适配器和生成脚本由项目独立维护，原版 Skill 保持原样。项目名、流程节点、源码路径和学习资料章节留在可选配置中。节点的简短行为解释用于浏览，详细理由仍以决策笔记为依据；阶段和理解证据只在进度文件中维护。两种输出共用解析器，沿用[完整章节读取](2026-09-11-complete-board-sections.md)。\n\n连接项目根目录或 .agents 时，一次检查读取笔记、board.json 和配置明确引用的 Markdown 资料；相同来源只读一次。仅连接 notes 时只显示该目录的笔记，不继承原项目的地图和学习状态。未连接的 board.html 显示生成时的项目概览，完整决策需要连接目录；离线快照同时内嵌笔记。连接操作与状态集中在顶部，显示未连接、离线快照、自动同步或同步失败；手动检查仅在连接后出现，目录名与检查时间放在状态提示中。\n\n检查请求串行执行，重叠触发合并为后续一次检查。内容指纹包含笔记路径与正文、展示配置及资料正文，不依赖文件大小、时间或遍历顺序；同日期和同引用数使用规范路径确定顺序。未变化时不提交数据或替换 DOM；变化时保留节点展开、依据选择、备选和学习区域偏好、当前阅读资料、焦点及两处滚动位置。切换目录使旧读取失效。读取失败或配置尚未写完整时保留最后成功数据；明确删除的配置回退到笔记浏览，缺失的资料或章节显示提示，当前笔记删除后仍在阅读层显示可关闭的缺失状态。","alternatives":"- 只覆盖原页面的 CSS：改动集中，能快速改变配色，但阅读结构、详情缺失和刷新状态仍受原模板控制；独立页面更符合这次重新设计的范围。\n- 继续把模块笔记清单作为首页：便于查找和完整阅读，但运行关系与当前开发重点仍依赖读者自行归纳；清单作为资料入口保留。\n- 自动把笔记引用绘制成架构图：不需要额外维护关系，但引用只能证明相关背景，无法证明调用顺序、状态供给或控制权返回位置；当前使用有源码依据的明确流程配置。\n- 只补一个排序条件：可以稳定同日期的先后关系，但每次扫描仍会替换 DOM，无法保留焦点，也没有处理重叠读取与失败快照。\n- 引入前端框架和开发服务器：组件与更新机制成熟，但看板目前规模小，主要需要直接打开 HTML 和本地目录读取；项目采用无新增依赖的模板生成与原生浏览器逻辑。\n- 将 Mini Agent 的流程、阶段和教学方法写进渲染器或上游 Skill：配置更少，但其他项目必须修改通用工具。独立展示配置与资料来源允许替换项目内容或关闭学习区域，代价是维护节点摘要及其依据链接。\n- 将介绍折叠或增加精简模式：仍可按需展开完整导览，但要继续维护重复说明和额外偏好；已有导航足以定位，当前直接删去这层内容与配置字段。\n- 保留可折叠的左侧模块目录：适合连续查阅文档，但仍以目录层级组织页面，地图与资料的导航方式也不统一；模块筛选与顶部入口足以覆盖当前查找需求。\n- 将节点说明改成右侧抽屉：可以减少常驻内容，但宽屏仍要在流程和侧栏间来回看，窄屏抽屉还会遮住节点；当前就地展开，代价是下方内容随之移动。\n- 全文跳转到独立详情页：地址与整页阅读直观，但离开流程后需要重新建立当前位置；居中阅读层保留背景，代价是显式维护阅读历史、焦点和滚动恢复。","consequences":"读者可以先沿流程理解项目，再定位当前实现、缺口和详细依据。展示层与学习区域可独立迁移，未改变内容的同步保持页面稳定。代价是项目负责展示逻辑、有限的 Markdown 渲染、资料适配和同步回归；上游看板的界面更新不会自动进入本项目。\n\n精简后的首屏直接呈现进度和流程，模块页直接进入筛选与清单。首次阅读依靠节点标签和实际内容，没有独立的导览介绍；后续只有观察到具体入口无法理解时，才在该入口补充必要提示。\n\n画布只保留一个展开节点，适合沿流程查看，不提供多个节点详情并排比较。全文阅读时背景暂不可操作，跨资料返回由阅读层管理；资料关联仍完整保留。布局不新增依赖，但需要维护原生 dialog、响应式详情位置与浏览器历史之间的状态边界。\n\n流程关系与简短行为解释需要随实现维护，资料章节改名时需要同步配置；校验能发现无效关系与缺失路径，不能证明描述符合源码。当前布局支持二至六步主流程、辅助节点、一个可选回路和控制分支，更复杂的关系需要扩展布局。模板或脚本修改后重新生成并刷新；连接完整项目后的配置、笔记和进度变更无需重新生成页面。\n\n自动同步是可见页面每三秒检查，并在返回页面时检查，并非操作系统文件监听。每次检查读取笔记和引用资料，当前小型项目可接受；规模扩大后再依据实际开销考虑缓存。保存过程中短暂解析失败会保留旧内容，下一次检查恢复。\n\n本地目录连接依赖 Chrome 或 Edge 的文件访问 API 与浏览器授权。目录句柄、筛选、节点与学习区域偏好按页面路径和项目名保存；旧版保存的 notes 句柄仍能浏览笔记，需要重新选择项目根目录才能读取同级配置与学习资料。源码相对链接仍以生成页面所在项目为基准。","outLinks":["implemented/process/2026-09-11-complete-board-sections.md","implemented/process/2026-09-11-learning-workflow-and-notes.md"]},{"id":"implemented/architecture/2026-09-11-user-turn-boundaries.md","sourcePath":"implemented/architecture/2026-09-11-user-turn-boundaries.md","slug":"2026-09-11-user-turn-boundaries","lifecycle":"implemented","cls":"architecture","date":"2026-09-11","title":"用 startsTurn 区分真实用户轮与内部继续提示","status":"implemented","rawBody":"# Agent Note: 用 startsTurn 区分真实用户轮与内部继续提示\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n继续提示与真实用户输入都使用 user 角色。按角色计轮时，一次请求里的多条内部提示会被算作多轮，可能把原始目标和约束提前裁掉。\n\n## Decision\n\n本地 HistoryMessage 使用 startsTurn 标记真实轮的开始，只有 REPL 新输入设置它。内部提示、assistant 回复和 tool 结果不产生新轮；ask_user 的回答仍属于发起询问的当前轮。\n\ntrimHistory 按标记选择完整轮次。发送请求时，toModelMessages 产生去除本地标记的数组，但不修改本地历史，避免下一次裁剪丢失边界。\n\n本决定细化[整轮上下文裁剪](2026-09-05-bounded-conversation-context.md)。轮边界与[调用结果配对](../bug-fix/2026-09-06-tool-result-history-recovery.md)是相关但不同的约束：误计轮首先会丢目标，不应直接宣称必然导致协议 400。\n\n## Alternatives considered\n\n- 继续按 user 角色计数：无需新字段，但无法区分外部目标和程序内部提示。\n- 只增加保留轮数：能延后问题，但轮次仍算错，长一点的内部循环还会触发。\n- 把内部提示换成另一种角色：可能改变模型对提示的解释，且仍把本地会话边界绑定到 API 角色；本地标记能直接表达目的。\n\n## Consequences\n\n真实轮数不依赖协议角色，代价是所有新输入入口必须维护标记，旧的无标记历史不会自动修复。标记仅服务本地管理，不随请求传给模型。\n\n这一改动解决轮次识别，不提供 token 硬上限、跨进程会话恢复或全部异常历史修复。\n\n## Verification\n\n日期依据：[cd3fa0c](https://github.com/xilele777/mini-agent/commit/cd3fa0c) 于 2026-09-11 接入并验证。当前依据：[context.ts](../../../../src/context.ts)、[agent.ts](../../../../src/agent.ts)、[turn.ts](../../../../src/turn.ts) 和 [turn.test.ts](../../../../src/turn.test.ts)。上下文测试覆盖整轮裁剪和 API 消息去标记；主轮测试确认持续纯文本追加的内部提示不产生新的 `startsTurn`。\n","sections":[{"heading":"Problem","body":"继续提示与真实用户输入都使用 user 角色。按角色计轮时，一次请求里的多条内部提示会被算作多轮，可能把原始目标和约束提前裁掉。","anchor":"section-0"},{"heading":"Decision","body":"本地 HistoryMessage 使用 startsTur
