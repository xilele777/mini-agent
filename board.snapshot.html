window.__PROJECT_DOCUMENTS__ = {"learning/progress.md":"# mini-agent 学习进度\n\n状态核对日期：2026-09-22。阶段 7 主循环源码基线：`cd3fa0c`；后续阶段以当前工作区为准。本文件保存当前摘要，详细历史可在本地 `docs/HANDOFF.md` 查阅；缺少历史文件不影响使用本摘要。\n\n## 当前阶段\n\n阶段 7–13 已完成已有记录范围内的本地实现与验收；阶段 12 收尾提交为 `8e819d9`，阶段 13 已提交。阶段 14–15 按学习者明确授权由 AI 直接实现。阶段 15 已接入正式 CLI、编译入口、干净安装检查及评测证据汇总；当前核心 186 项测试全部通过，干净目录仅生产依赖安装、诊断与会话恢复通过。内部人工场景保留在 [评测记录](evaluation.md)，不作为公开 README 内容；发布状态以 GitHub Release 及对应 CI 为准。AI 代改和自动测试不构成学习者独立理解的证据。\n\n| 范围 | 当前代码状态 |\n| --- | --- |\n| 阶段 0–3 | API 调用、Function Calling、Tool 接口与注册表已接入 |\n| 阶段 4–5 | 文件及 shell 工具、人工批准、上下文裁剪与循环守卫已接入 |\n| 阶段 6 | todo 已在阶段 11 改为会话句柄持有，与消息及轮记录共用原子快照 |\n| 阶段 7 | `finish_task`、`ask_user`、`pause_task`、继续提示及 `startsTurn` 已接入 |\n| 阶段 8 | `collectResponse()` 已统一组装文本、拒绝文本、多工具调用和 usage；`runTurn()` 已改用流请求并沿用原有工具执行及显式出口流程 |\n| 阶段 9 | `delegate_task` 同步调用独立上下文的只读 `runSubAgent()`；能力集合、预算、最终总结、日志、模拟测试与真实委派均已接入 |\n| 稳定性课 | `runTurn()` 已抽到可独立导入的 `turn.ts`；模型流、请求预算和输出可窄注入，四条主轮组合测试已接入 |\n| 完善版 v1 | 阶段 10–13 本地验收完成；阶段 14–15 运行韧性与交付已实现并自动验证，人工验收与远程平台结果待补 |\n\n实现详情以 [agent.ts](../../src/agent.ts)、[turn.ts](../../src/turn.ts)、[turn.test.ts](../../src/turn.test.ts)、[stream.ts](../../src/stream.ts)、[stream.test.ts](../../src/stream.test.ts)、[context.ts](../../src/context.ts)、[todo.ts](../../src/tools/todo.ts) 和 [control.ts](../../src/tools/control.ts) 为准。\n阶段 8 的三个独立练习脚本已在完整实现和常驻测试接入后删除；其运行证据保留在下文，不再把教学脚手架作为当前源码入口。\n\n## 已有验证证据\n\n以下为已有交接中的运行记录，保留其覆盖范围，不当作本次重新执行：\n\n- 学习者完成读文件、写文件、回读核对、移除已完成待办、调用 `finish_task` 的任务链。\n- 在 `ask_user` 回答“不”，以及在 shell 批准框输入 `n`，均有随后调用 `pause_task` 的用例记录。这些用例明确要求拒绝后暂停。\n- “只记录待办，暂不执行”的用例保留待办，并在经过一次继续提示后正常结束。\n- 十条上下文测试覆盖循环检测、工具结果截断、真实轮边界与 API 消息去除本地标记；完整测试记录为二十一条通过。\n\n## 阶段 8 基础练习（2026-09-13）\n\n- 学习者提供的终端记录显示：`npm run typecheck` 通过，随后两次运行 `npx tsx src/stream-demo.ts` 均收到模型文本。\n- 第一次保留循环内的 `process.stdout.write(text)`，输出文本与循环后打印的 `content` 一致；第二次按指导注释该行，`Agent:` 后无片段文本，循环后仍能打印累积结果。\n- 学习者随后补上模拟参数练习中的 `rawArgs += part`，提供类型检查通过及三次累积输出的终端记录；最终得到 `{\"expression\":\"123 * 456\"}`，`prepared.ok` 为 `true`。这验证了该组模拟参数的拼接和校验，脚本未执行计算工具。\n- 学习者将参数脚本改为真实工具流观察版本，提供类型检查通过和模型运行记录：所有调用片段的 `index` 为 `0`；第一片包含调用 ID、`type: 'function'`、名称 `calculate` 和空参数；后续片段的名称为空字符串，参数逐片补充；最终 `finish_reason` 为 `tool_calls`。该版本只观察请求片段，尚未组装或校验真实调用，也未执行工具。\n- 学习者接入单调用组装后，首次因重复累积名称、未累积参数而得到 `calculatecalculate` 和空参数。对照源码指出重复行后，学习者改为分别累积 `name` 与 `rawArgs`；随后提供类型检查通过及真实模型运行记录，得到非空调用 ID、名称 `calculate`、完整表达式参数，`prepared.ok` 为 `true`。\n- AI 已核对两个练习脚本；文本练习、模拟参数练习、真实工具流观察及修正后的单调用组装版本的 `npm run typecheck` 均实际运行通过。模拟参数版本另由 AI 重新运行，三次累积结果及最终校验均符合预期。真实模型调用证据来自学习者的文本流和工具流运行记录，AI 未重跑模型请求；终端转录未记录各片段到达的时序。\n- 学习者提供多调用模拟脚本的类型检查与运行记录：`index` 依次为 0、1、0、1，两份表达式分别拼接完整并校验通过。AI 重新运行该脚本，结果一致；学习者尚未提供调整片段到达顺序后的运行记录。\n- 按用户要求切换为整模块推进后，AI 在临时文件中验证完整 `collectResponse()` 参考与 `agent.ts` 接入代码：使用项目的 TypeScript 配置检查通过，十三项模拟流测试通过，覆盖文本与拒绝文本、尾部 usage、同名调用交错且编号 1 先到、名称分片、请求隔离、异常传播、结束状态、编号与 ID 完整性、不支持类型及保留非法参数供后续反馈。临时文件已清理；这些是候选代码的验证，尚不构成当前主循环已接入或真实模型整体验收的证据。\n- 2026-09-19，学习者将完整组装器写入 `src/stream.ts` 并在 `runTurn()` 启用 `stream: true` 与 `stream_options.include_usage`。学习者提供的记录显示 `npm run typecheck` 和原有二十一条测试通过。\n- 真实多工具用例在同一次模型响应中组装并执行 `current_time` 与 `calculate`，得到时间和 `56088`，下一次响应调用 `finish_task`；输出文本没有重复打印，两次请求均收到 usage。\n- 批准拒绝用例中，流式响应发起 `run_bash({ command: \"pwd\" })`，学习者输入 `n` 后工具未执行；下一次响应调用 `pause_task`，没有重试或绕过。\n- AI review 当前 `stream.ts` 与 `agent.ts` 后未发现阻塞问题，并重新运行类型检查及原有二十一条测试，均通过。另在临时测试文件中对当前实现运行十三项模拟流测试，全部通过；临时文件已删除，这些用例尚未进入仓库常驻测试。\n- 学习者随后将十三项模拟流用例固化为 `src/stream.test.ts` 并加入 `npm test`。学习者提供的记录显示类型检查通过、全量三十四条测试通过；删除三个阶段 8 练习脚本后再次运行，结果仍为三十四条通过。\n\n## 待验证项\n\n- 阶段 14–15：学习者按 [统一验收](evaluation.md)检查真实模型、原生 Ctrl+C、共享预算及轨迹，并记录预先约定的一次计算、只读委派和固定任务修复。远程 Windows／Ubuntu Actions、本轮 Linux/macOS 实机未运行；不据 Windows 本地通过推断其他系统全部通过。\n\n- 阶段 13：真实模型固定任务、拒绝、批准期间外部修改及运行中 Ctrl+C 已有人工证据；命令超时及取消后恢复不重放按 [内部评测记录](evaluation.md#阶段-13-人工验收)由学习者简短确认完成，未附新终端记录，不标成 AI 独立验证。冲突用例中模型已发现代码正确仍提出等价改写，记录为不必要修改的行为问题；安全拒写机制通过不等于模型任务判断正确。端到端取消组合、统一重试／总预算和事件轨迹已在阶段 14 自动验证，真实人工边界见上项。\n\n- 同批结束工具补“未执行”结果、循环守卫累计中止、纯文本耗尽请求预算和多工具 ID 配对已进入 `turn.test.ts`；这些分支不再列为待验证项。\n- 阶段 8 的流协议用例已进入常驻回归，主循环也已有真实多工具、usage、完成和批准拒绝后暂停证据。接收中途失败时已经显示的文字仍无法撤回，这是流式终端输出的既有代价，不当作测试缺口。\n- 阶段 9 已有模拟回归和一次真实只读代码调查；尚未专门验证同一主模型响应内连续提出多个委派，以及子 Agent 协议错误经 `executeCall()` 回填后主 Agent如何收敛。\n\n## 阶段 9 第一课：工具集合边界（2026-09-20）\n\n- 学习者新增 `src/tools/registry.ts`，把 schema 生成、查表、JSON 解析和 Zod 校验封装为 `createToolRegistry(tools)`；重复工具名在建立注册表时抛错。\n- `src/tools/index.ts` 使用全部工具创建 `MAIN_REGISTRY`，原有 `getToolSchemas()`、`prepareCall()` 和 `executeCall` 导出保持兼容，`agent.ts` 无需修改。\n- 新增四条注册表测试，证明只暴露显式成员、合法调用能准备、未加入集合的现存工具会被拒绝、重复名称不能注册。\n- 学习者首次类型检查遇到 OpenAI `ChatCompletionTool` 包含 custom 分支，以及断言导致判别联合被收窄为 `never`；按指导将返回类型收窄为 `ChatCompletionFunctionTool[]` 并调整测试分支。\n- 学习者提供的最终记录显示 `npm run typecheck` 通过，`npm test` 三十八条通过、零失败。阶段 9 尚未进行真实模型验收。\n\n## 阶段 9 第二课：独立子 Agent 循环（2026-09-20）\n\n- 学习者新增 `src/subagent.ts`，每次委派创建独立的 system + task 历史，不读取主 Agent 的消息数组。\n- 子 Agent 使用只读注册表，只暴露 `read_file`、`search_files`、`calculate`、`current_time`；完整工具调用由 `collectResponse()` 组装后，经该注册表准备并顺序执行。\n- 子 Agent 的纯文本响应直接作为 `runSubAgent()` 返回值，不使用主循环的 `CONTINUE_NUDGE`、`finish_task` 或 `pause_task`。工具结果先回填子历史，再发起下一次请求。\n- `createStream` 依赖注入使测试不加载 `llm.ts`；模拟测试覆盖消息隔离、只读工具集合、结果回填、未授权工具拒绝、独立重复守卫、独立请求上限和流协议错误传播。\n- 学习者提供的记录显示 `npm run typecheck` 通过，`npm test` 四十四条通过、零失败。第二课仍没有真实模型或主 Agent 委派入口证据。\n\n## 阶段 9 第三课与真实验收（2026-09-20）\n\n- 学习者新增 `delegate_task` 并注册到主工具集合；工具通过注入 runner 测试委派参数和结果，不需要批准，也不带 `endsTurn`，因此结果回填后主 Agent继续本轮。\n- 首次真实委派因子 Agent 六次请求均可继续调用工具，最后一次取得观察后没有总结机会而耗尽。修正后第六次撤下工具并加入最终总结提示，同时通过 `[sub]` 日志显示请求、usage 和工具摘要；相应预算测试改为验证最后一次工具列表为空。\n- 更换兼容 API 后，站点根路径让 SDK 命中返回 HTML 的 `/chat/completions`，主请求收到零个 chunk 并触发“缺少结束原因”。只读探针确认 `/v1/chat/completions` 返回标准 JSON，修正 base URL 后流式响应正常；这证明协议检查阻止了错误页面被当作模型回复。\n- 最终记录显示 `npm run typecheck` 通过，`npm test` 四十八条通过、零失败。真实委派中，子 Agent依次使用搜索和三次读取，对截断内容补读，五次请求后返回 `runTurn` 的职责与边界；主 Agent总结后调用 `finish_task`，没有写入、shell、todo、递归委派或批准请求。\n\n## 阶段 9 后稳定性课：可测试主轮执行器（2026-09-20）\n\n- 学习者将 `SYSTEM_PROMPT`、`runTurn()`、工具公共处理和本轮控制常量从 `agent.ts` 抽到 `src/turn.ts`；`agent.ts` 只保留启动、REPL 输入、跨轮裁剪、checkpoint 回滚、取消处理和 UI 释放。\n- `runTurn(messages, options)` 继续直接维护传入历史，只对模型流、请求上限和文本／日志输出提供窄注入。默认模型入口动态加载 `llm.ts`，测试导入不需要 API 环境变量。\n- `src/turn.test.ts` 新增四条组合测试，覆盖结束工具后同批补结果、累计两次循环守卫中止、纯文本请求预算与真实用户轮边界、多工具结果按 ID 回填到下一次请求。\n- 学习者与 AI 分别运行 `npm run typecheck` 和全量测试，均为五十二条通过、零失败。源码 review 未发现阻塞问题。\n- 普通真实请求调用 `calculate` 得到 `391` 后调用 `finish_task`。真实委派请求中，主模型先维护 todo，再调用 `delegate_task`；子 Agent 搜索并分段读取 `src/turn.ts`，最终总结 `runTurn()` 的职责，主模型清理临时 todo、转述结果并调用 `finish_task`。\n\n## 初次建立配置时的检查（2026-09-11）\n\n建立开发协作配置后，在当前 PowerShell 环境实际运行：\n\n- `npm run verify-notes`：五篇笔记的目录、链接与格式检查通过。\n- `npm run typecheck`：通过。\n- `npm test`：二十一条通过，零失败。\n- 两个 Skill 的 frontmatter 与结构检查通过；上游四十三个文件逐一与固定提交的 Git blob 匹配。\n\n这些检查验证配置及现有自动化用例，不增加真实模型交互或学习掌握程度的证据。人工交互用例仍按上一节的既有记录理解。\n\n## 笔记重整与看板验证（2026-09-11 至 2026-09-12）\n\n对照当前源码、Git 提交和已有交接，将首批五篇笔记重整为十九篇，补足阶段 0–7 的主要工程取舍、代价与已知限制。历史日期使用最早可核实的记录，并注明实际整理日期；备选理由不冒充当时做过的实验。\n\n本次实际完成：\n\n- `npm run verify-notes`：十九篇笔记的目录、链接与格式检查通过。\n- `npm run board` 和 `npm run board:bundle`：分别生成本地目录看板与离线快照。项目适配脚本修复每节只提取首行的问题，上游 Skill 保持原样。\n- `node --check scripts/fix-notes-board.mjs`：通过。对照 Markdown 核对本地解析与离线数据，七十六个展示字段完整、五十七条备选齐全、四十二条笔记关联有效；多段正文、不同换行和文件末尾边界检查通过。\n- 浏览器实际打开离线快照：十九篇笔记与全部详情文字一致；时间线日期、月份筛选、备选卡片与关联跳转正常，控制台无错误。本地目录模式的章节解析另与源文核对。\n\n本次新增验证范围为决策文档和看板；源码检查与模型交互证据仍按前两节记录。学习阶段及理解证据没有因此增加。\n\n## 看板重设计与同步验证（2026-09-12）\n\n用户选择浅色文档工作台。项目看板改为侧栏导航、决策列表和完整阅读页，新增一篇管理决策后共二十篇。项目生成器与原版 Skill 分开维护，旧正则补丁已由两种页面共用的解析器替代。\n\n- `npm run test:board`：十六条回归通过，覆盖固定排序、内容比较、完整解析、串行检查及收尾、目录切换与失败恢复。\n- `npm run typecheck`：本轮通过；Agent 核心源码没有改动。\n- 两种生成命令通过；浏览器核对二十篇笔记的一百个章节、六十条备选，完整包含 Verification。\n- 在浏览器隔离的 OPFS 目录中使用真实文件读写，并注入可改变顺序的目录入口，重复检查后列表节点、顺序、搜索焦点、筛选及滚动位置保持不变；等长编辑更新当前正文，自动轮询检测到新增文件，删除当前笔记显示明确提示，模拟权限错误后保留内容并能恢复。\n- 使用真实浏览器目录句柄验证页面重载后连接与筛选偏好恢复；桌面和 390px 窄屏阅读、菜单和溢出检查通过。此验证未代替用户在 Windows 原生目录选择框中的授权操作。\n\n2026-09-12 随后按用户确认的“项目全貌”调整首页，当时按六个项目模块展示关键决定、状态和笔记关联，摘要可展开，阅读时保留模块笔记目录；项目分组由独立的 `.agents/board.json` 提供，原版 Skill 保持原样。\n\n- 本次 `npm run test:board` 十九条通过，新增模块分组顺序、重复路径去重、缺失与无配置时的回退覆盖。\n- 本次浏览器核对六个模块与二十篇笔记的全部章节和备选，摘要开关、模块筛选、关联跳转及 390px 阅读布局通过。\n- 在隔离 OPFS 目录中重新检查：不变的扫描保留模块节点、焦点及正文和目录的滚动位置；等长修改更新正文并保留折叠目录；新增的未配置笔记由自动检查显示在分类分组。失败恢复、当前笔记删除提示、真实句柄重载及模块、搜索、目录偏好恢复通过。移除展示配置后仍按标准类别展示全部笔记。\n\n这些属于开发管理工具验证，Agent 核心源码与阶段 7 的理解证据仍按已有记录，不据此推进阶段 8。\n\n## 当前看板与验证（2026-09-13）\n\n看板已采用统一顶部导航、全宽流程画布和节点就地展开，移除了常驻左右侧栏。完整笔记及进度原文在居中阅读层打开，关闭后恢复原视图、筛选、节点、焦点与滚动位置。当前实现、下一步候选、待验证项和可选学习区域读取本文件的对应章节；阶段与理解证据不在展示配置中另存一份。重复标题、介绍、节点职责导语和页脚统计已移除。\n\n- `npm run test:board`：二十六条通过，包含地图引用、实际依据路径和进度章节、资料读取范围、单独修改配置或进度、来源缺失与无配置回退。\n- `npm run verify-notes`：二十篇笔记通过；`npm run typecheck`、浏览器脚本和生成器语法检查通过。两种看板生成命令通过。\n- 全宽布局的一百零一项浏览器检查通过：九个节点的展开和收起、依据切换、二十篇笔记的一百个完整章节、搜索与月份筛选、关联资料返回、关闭后恢复焦点和位置、阅读中重载及浏览器前进／后退。\n- 1536、1280、1024、800、700、390 和 360px 下，四个主视图的顶部导航可用且无横向溢出。窄屏详情紧接所选节点，展开备选后回路线随高度更新，调整窗口后详情回到对应行。\n- 隔离 OPFS 目录中的十七项同步检查通过：不变轮询保留 DOM，修改地图和正在阅读的笔记保留阅读层；无效配置保留内容并恢复；关闭后恢复节点、依据和学习偏好；真实句柄重载后继续阅读；当前笔记删除、进度更新、移除配置和只连接 notes 正常回退。浏览器未出现页面脚本错误。\n- 上述目录检查使用浏览器的真实文件句柄，Windows 原生目录选择授权仍由用户浏览器完成。历史的遍历顺序、等长修改和新增未分组笔记检查保留在[看板决定](../notes/implemented/process/2026-09-12-readable-board-and-stable-sync.md)中。\n\n上述看板工作只变更展示、资料适配、管理文档和相应检查。当时 Agent 核心源码没有修改，阶段 8 尚未开始，学习者的理解证据保持原状。\n\n## 理解证据\n\n已有记录显示学习者亲自接入了代码并运行上述验收。对注册表职责、真实轮边界和暂停语义的独立解释或迁移改造，尚未在本摘要中建立具体证据。\n\n这些内容标为“待观察”；继续教学时结合当次表现补充，不要求从头重学，也不将阶段完成等同于全部掌握。\n\n阶段 8 已观察到学习者按指导完成文本输出开关对照、模拟参数拼接、真实工具流观察、单调用组装、多调用参数分组，以及完整组装器与主循环接入；学习者能按统一参考落地代码并完成真实多工具和拒绝路径验收。这是有提示的实现与纠错证据。学习者随后独立说明：`collectResponse()` 负责确认流正常结束并完整收集调用，`prepareCall()` 负责验证完整调用是否符合工具契约，因此缺少 `finish_reason` 属于协议错误，而完整但非法的参数应留给工具准备层反馈。按 index 分组而不是按名称分组的理由仍待独立观察。\n\n阶段 9 已观察到学习者按完整参考接入可实例化注册表、独立子 Agent 循环、委派工具、最终总结预算和十四条测试，并完成真实只读委派。这是有指导的实现和运行验收证据；学习者尚未独立解释“schema 隐藏与准备阶段必须共用同一能力集合”以及“为何最后一次请求必须撤下工具”，后续结合改造或提问观察，不因阶段完成自动推断掌握。\n\n稳定性课已观察到学习者按完整模块参考完成主轮抽取、四条组合测试和两条真实模型验收。测试结果证明实现存在并按预期运行；“为何只注入模型流与输出，而不建立完整工具 mock 层”尚未由学习者独立解释，保留为后续架构理解观察点。\n\n## 当前限制\n\n- 完成与暂停的选择依赖模型、提示词和工具描述；已有用例不代表所有自然表述都已验证。\n- todo 条目只有 `id/title`，归属当前会话；轮结果持久化，同一会话以独占锁限制写入者。崩溃遗留锁仍需核查原进程退出后人工清理。\n- 原始历史完整保存，主／子请求按文本保守估算检查窗口；主轮按需裁剪旧轮并尝试有界摘要，摘要有损且不保证语义无遗漏。主／子／摘要／重试现共享总次数、时间与 token 账目；缺 usage 保留估算，服务端精确计数及严格生成上限不由本地估算保证。总时限为协作式中止，清理和可靠保存可继续收尾。\n- 受控文件工具统一项目范围与敏感路径，编辑／新建进一步拒绝链接路径、校验 SHA-256 并逐次批准；只支持最大 1 MiB 的 UTF-8 修改。检查到提交间仍有竞态，shell 依赖批准，不构成完整沙箱；脱离进程树的后台服务不能保证清理。\n- 子 Agent 当前同步且只读，固定六次请求并保留最后一次总结；不并行、不持久化、不共享 todo，也不支持嵌套批准或递归委派。\n- 决策笔记已建立对应设计理由。后续变更优先更新所属笔记，避免将这些摘要扩展成第二套设计文档。\n\n## 完善版 v1 目标与路线（2026-09-20）\n\n目标不是复制大型商业 Agent，而是把当前内核补成一个微型、功能闭环、能长期作为个人本地编码助手使用，并能展示 Agent 实习工程能力的作品。v1 继续采用直接 SDK、原生 Function Calling、显式工具注册表、单进程 CLI 和同步只读子 Agent；不引入框架、数据库、Web UI、并行多 Agent、RAG 或插件平台。\n\n| 阶段 | 完整模块 | 主要验收面 |\n| --- | --- | --- |\n| 10 | 统一配置与启动诊断 | 集中配置与 doctor；确定取消／结果／预算约定、主任务夹具和基础 CI |\n| 11 | 会话持久化与恢复 | 项目绑定与会话 todo、原子快照、动作状态、损坏隔离；恢复不自动重放 |\n| 12 | 上下文预算与压缩 | 每次请求先检查预算、裁剪再摘要；单轮超限与摘要失败有退路，保留原始历史 |\n| 13 | 安全增量编辑与命令执行 | 精确替换、指纹、diff 与批准绑定、冲突拒写；限制旧写入入口，接入取消与子进程清理 |\n| 14 | 运行韧性与可观测性 | 贯通取消、整合有限重试与含委派／摘要／重试的总预算、类型化事件和脱敏轨迹 |\n| 15 | 评测与交付收尾 | 汇总逐阶段测试及真实模型证据；干净环境安装、CLI 帮助、可执行入口、跨平台配置和文档同步 |\n\n完整产品边界、跨模块约定、备选和验收场景见[完善版 v1 路线提案](../notes/proposed/architecture/2026-09-20-practical-mini-agent-v1.md)。每个阶段开始时再确定该模块的具体设计，不把路线图当作已经实现的代码事实。\n\n2026-09-21，按用户确认补齐路线审阅发现的恢复、生命周期、上下文、编辑批准与贯穿任务验收缺口，保留六阶段顺序。本次 `npm run verify-notes` 通过，二十四篇笔记的目录、相对链接和格式检查通过。此次仅更新计划与学习入口，阶段 10 仍未开始实现；代码状态、运行验收和理解证据不因此推进。\n\n## 下一次学习入口\n\n发布收尾（2026-09-22）：用户要求 README 面向开源使用者，并明确授权检查后 push 与发布。公开 README 已移除教学阶段和人工验收，贡献与检查说明归 CONTRIBUTING，阶段场景迁至本目录 evaluation.md，发行包排除内部评测资料。版本设为 1.1.0，通过 GitHub Release 分发 tarball 和 SHA-256 校验文件；本地 `npm run verify` 实际通过，包含 186 项核心测试、26 项看板测试、30 篇笔记及 42 文件发行包的隔离安装检查。对应提交的远程 CI 与 Release 作为发布执行凭证；既有人工待观察项不因发布而自动标为通过，也不再作为开源用户安装前的教学要求。\n\n阶段 15 交接（2026-09-22）：用户要求加快进度、由 AI 直接修改并交付人工验收。新增 [cli.ts](../../src/cli.ts)、[bin 入口](../../bin/mini-agent.mjs)、[构建脚本](../../scripts/build.mjs)与[隔离安装检查](../../scripts/verify-delivery.mjs)；帮助／版本／列表无配置可用，参数错误退出 2、用户取消退出 130；doctor 共用诊断函数。EOF 现在显式结束输入等待并释放会话锁，子进程重开同会话通过。生产包不依赖 tsx，保留 private；该次交接尚未发布或打标签。\n\n运行验证：AI 在 const CLASSES = ['architecture', 'feature', 'bug-fix', 'simplification', 'process', 'testing'];
const STATUS_LABELS = { implemented: '已落地', proposed: '待评审', rejected: '已否决', archived: '已归档' };

function compareText(a, b) {
  return a < b ? -1 : a > b ? 1 : 0;
}

function compareNotes(a, b, mode = 'new', incoming = new Map()) {
  if (mode === 'references') {
    const difference = (incoming.get(b.id) || 0) - (incoming.get(a.id) || 0);
    if (difference) return difference;
  }
  const date = mode === 'old' ? compareText(a.date, b.date) : compareText(b.date, a.date);
  return date || compareText(a.id, b.id);

function splitSections(raw) {
  const sections = [];
  let section = null;
  let fence = null;
  for (const line of raw.replace(/\r\n?/g, '\n').split('\n')) {
    const marker = /^\s*(`{3,}|~{3,})/.exec(line);
    if (marker) {
      if (!fence) fence = marker[1];
      else if (marker[1][0] === fence[0] && marker[1].length >= fence.length) fence = null;
    }
    const heading = !fence && /^##\s+(.+?)\s*$/.exec(line);
    if (heading) {
      section = { heading: heading[1], lines: [] };
      sections.push(section);
    } else if (section) section.lines.push(line);
  }
  return sections.map(({ heading, lines }, index) => ({ heading, body: lines.join('\n').trim(), anchor: 'section-' + index }));

function resolveNoteLink(id, href) {
  const clean = href.split(/[?#]/)[0].replace(/\\/g, '/').replace(/\.zh\.md$/, '.md');
  if (!clean || /^[a-z][a-z\d+.-]*:/i.test(clean) || clean.startsWith('/')) return null;

    if (!part || part === '.') continue;
    if (part === '..') {
      if (!segments.length) return null;
      segments.pop();
    } else segments.push(part);
  }
  return segments.join('/');

function buildDataset(files) {

  for (const file of [...files].sort((a, b) => compareText(a.path, b.path))) {
    const path = file.path.replace(/\\/g, '/');

      date: filename.slice(0, 10), title, status, rawBody, sections,

      decision: section('Decision', 'Proposal', '决策', '提案'),
      alternatives: section('Alternatives considered', '曾考虑的替代方案', '曾考虑的备选'),
      consequences: section('Consequences', '后果'),
      outLinks: [],

  const ids = new Set(notes.map(note => note.id));
  for (const note of notes) {

      if (target && target !== note.id && ids.has(target)) links.add(target);

  return notes.sort(compareNotes);
}

function datasetSignature(notes) {

  return JSON.stringify([...notes].sort((a, b) => compareText(a.id, b.id)).map(note => [note.id, note.sourcePath, note.rawBody]));

function alternativeItems(note) {

function countReferences(notes) {

function groupNotes(notes, presentation = {}) {
  const byId = new Map(notes.map(note => [note.id, note]));
  const used = new Set();
  const groups = [];
  if (Array.isArray(presentation.groups)) {

      for (const entry of group.notes || []) {

        used.add(entry.id);
        entries.push({ note: byId.get(entry.id), label: entry.label || byId.get(entry.id).title });

      if (entries.length) groups.push({ id: group.id, title: group.title, entries });

async function readNoteDirectory(root) {
  const files = [];
  async function walk(directory, parts = []) {
    const entries = [];
    for await (const entry of directory.values()) entries.push(entry);
    entries.sort((a, b) => compareText(a.name, b.name));
    for (const entry of entries) {

        const file = await entry.getFile();

  await walk(root);
  return buildDataset(files);

function createLiveSync({ read = readNoteDirectory, signatureOf = datasetSignature, countOf = value => value.length, commit, report = () => {} }) {
  let source = null;
  let generation = 0;
  let signature = null;
  let queued = false;
  let active = null;
  async function drain() {
    while (queued && source) {
      queued = false;
      const reading = source;
      const version = generation;
      try {
        const notes = await read(reading);
        if (version !== generation) continue;
        const next = signatureOf(notes);
        const changed = signature !== next;
        if (changed) {
          commit(notes);
          signature = next;
        }
        report({ ok: true, changed, count: countOf(notes), checkedAt: Date.now() });
      } catch (error) {
        if (version === generation) report({ ok: false, error });
      }

    queued = true;
    if (!active) active = Promise.resolve().then(drain).finally(() => {

      // A microtask can enqueue a check after drain exits but before this cleanup.
      if (queued && source) return request();

    return active;

      generation++;

      queued = !!handle && !!active;
    },
    request,
  };

    if (!object(group) || !slug(group.id) || group.id.startsWith('class-') || groupIds.has(group.id)) fail('模块 ID 需要唯一，且不能使用 class- 前缀。');
    if (!string(group.title) || !Array.isArray(group.notes)) fail('模块需要标题和笔记清单。');
    for (const note of group.notes) if (!object(note) || !string(note.id) || (note.label !== undefined && typeof note.label !== 'string')) fail('笔记入口需要路径和可选的短标题。');
    groupIds.add(group.id);
  }
  if (value.map !== undefined) {
    const map = value.map;
    if (!object(map) || !string(map.title) || !Array.isArray(map.nodes) || !Array.isArray(map.flow) || map.flow.length < 2 || map.flow.length > 6) fail('项目地图需要标题、节点和 2–6 步主流程。');
    const ids = new Set();
    for (const node of map.nodes) {
      if (!object(node) || !slug(node.id) || ids.has(node.id)) fail('地图节点 ID 需要唯一。');
      for (const key of ['title', 'caption', 'boundary']) if (!string(node[key])) fail('地图节点需要 ' + key + '。');
      if (!Array.isArray(node.behavior) || !node.behavior.length || node.behavior.some(item => !string(item))) fail('节点需要当前做法。');
      if (!Array.isArray(node.notes) || node.notes.some(item => !string(item))) fail('节点的依据需要笔记路径。');
      if (node.sources !== undefined && (!Array.isArray(node.sources) || node.sources.some(item => !object(item) || !string(item.label) || !relativeReference(item.path)))) fail('源码入口需要 label 和相对路径。');
      ids.add(node.id);
    }
    const placed = new Set();
    const place = id => { if (!ids.has(id) || placed.has(id)) fail('地图位置引用了缺失或重复的节点：' + id); placed.add(id); };
    map.flow.forEach(place);
    if (map.supports !== undefined && !Array.isArray(map.supports)) fail('supports 需要是数组。');
    for (const item of map.supports || []) {
      if (!object(item) || !map.flow.includes(item.target) || !string(item.label)) fail('辅助模块需要指向主流程并说明关系。');
      place(item.id);
    }
    if (map.branches !== undefined) {
      if (!object(map.branches) || !map.flow.includes(map.branches.from) || !string(map.branches.title) || !Array.isArray(map.branches.items)) fail('分支需要起点、标题和节点清单。');
      for (const item of map.branches.items) {
        if (!object(item) || !map.flow.includes(item.returnsTo) || !string(item.label)) fail('分支需要返回位置和说明。');
        place(item.id);
      }
    }
    if (placed.size !== ids.size) fail('每个节点都需要在地图中有位置。');
    if (map.loop !== undefined && (!object(map.loop) || !map.flow.includes(map.loop.from) || !map.flow.includes(map.loop.to) || map.flow.indexOf(map.loop.from) <= map.flow.indexOf(map.loop.to) || !string(map.loop.label))) fail('回路需要从后续步骤返回前面的步骤。');
    if (map.defaultNode !== undefined && !ids.has(map.defaultNode)) fail('默认节点不存在。');
  }
  for (const key of ['brief', 'learning']) {
    const block = value[key];
    if (block === undefined) continue;
    if (!object(block) || !documentPath(block.source)) fail(key + ' 的来源需要是配置目录内的 Markdown 相对路径。');
    if (key === 'brief') {
      for (const field of ['current', 'next', 'attention']) if (!string(block[field])) fail('brief 需要 ' + field + ' 章节名称。');
    } else {
      if (block.enabled !== undefined && typeof block.enabled !== 'boolean') fail('learning.enabled 需要是布尔值。');
      if (!string(block.title) || !Array.isArray(block.sections) || block.sections.some(section => !object(section) || !string(section.title) || !string(section.heading))) fail('学习区域需要标题和来源章节。');
    }
  }
  return value;
}

async function readRelativeFile(root, path) {
  const parts = path.split('/');
  let directory = root;
  for (const part of parts.slice(0, -1)) directory = await directory.getDirectoryHandle(part);
  return (await (await directory.getFileHandle(parts.at(-1))).getFile()).text();
}

async function readPresentationDirectory(root) {
  let presentation = {};
  try { presentation = validatePresentation(JSON.parse(await readRelativeFile(root, 'board.json'))); }
  catch (error) { if (!missingEntry(error)) throw error; }
  const paths = [...new Set([presentation.brief?.source, presentation.learning?.enabled !== false && presentation.learning?.source].filter(Boolean))].sort();
  const entries = await Promise.all(paths.map(async path => {
    try { return [path, await readRelativeFile(root, path)]; }
    catch (error) { if (missingEntry(error)) return [path, null]; throw error; }
  }));
  return { presentation, documents: Object.fromEntries(entries) };
}

async function readProjectDirectory(root) {
  let workspace = null;
  try { workspace = await root.getDirectoryHandle('.agents'); }
  catch (error) { if (!missingEntry(error)) throw error; }
  if (!workspace) {
    try { await root.getDirectoryHandle('notes'); workspace = root; }
    catch (error) { if (!missingEntry(error)) throw error; }
  }
  if (workspace) {
    const notesRoot = await workspace.getDirectoryHandle('notes');
    const [notes, assets] = await Promise.all([readNoteDirectory(notesRoot), readPresentationDirectory(workspace)]);
    return { notes, ...assets, scope: 'project', label: assets.presentation.name || (workspace === root ? '项目' : root.name) };
  }
  // A notes-only handle cannot read a sibling board.json or learning folder.
  // Do not carry the previously selected project's map into another directory.
  return { notes: await readNoteDirectory(await resolveNotesDirectory(root)), presentation: {}, documents: {}, scope: 'notes', label: '决策笔记' };
}

function projectSignature(project) {
  return JSON.stringify([datasetSignature(project.notes), project.presentation, Object.entries(project.documents).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0), project.scope, project.label]);
}

function documentSection(documents, source, heading) {
  const content = documents[source];
  if (typeof content !== 'string') return null;
  return splitSections(content).find(section => section.heading === heading)?.body ?? null;
}

function firstParagraph(text) {
  if (!text) return '';
  return text.split(/\n\s*\n/).find(block => block.trim() && !/^(?:\s*[-*+|]|#{1,6}\s)/.test(block))?.trim() || '';
}

function sectionItems(text) {
  return (text || '').split('\n').filter(line => /^\s*[-*+]\s+/.test(line)).map(line => line.replace(/^\s*[-*+]\s+/, ''));
}

function inlineMarkdown(text, note, links = true) {
  const pattern = /`([^`\n]+)`|\*\*([^*\n]+)\*\*|\[([^\]\n]+)\]\(([^)\n]+)\)/g;
  let html = '', start = 0;
  for (const match of text.matchAll(pattern)) {
    html += escapeHtml(text.slice(start, match.index));
    if (match[1] !== undefined) html += '<code>' + escapeHtml(match[1]) + '</code>';
    else if (match[2] !== undefined) html += '<strong>' + escapeHtml(match[2]) + '</strong>';
    else html += links ? renderLink(match[3], match[4].trim(), note) : escapeHtml(match[3]);
    start = match.index + match[0].length;
  }
  return html + escapeHtml(text.slice(start));
}

function markdown(text, note) {
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const output = [];
  const special = line => /^(?:\s*$|\s*(?:`{3,}|~{3,})|#{3,6}\s|\s*[-*+]\s|\s*\d+\.\s|>\s?)/.test(line);
  for (let index = 0; index < lines.length;) {
    const line = lines[index];
    if (!line.trim()) { index++; continue; }
    const fence = /^\s*(`{3,}|~{3,})/.exec(line);
    if (fence) {
      const code = []; index++;
      const end = new RegExp('^\\s*' + fence[1][0] + '{' + fence[1].length + ',}\\s*$');
      while (index < lines.length && !end.test(lines[index])) code.push(lines[index++]);
      if (index < lines.length) index++;
      output.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>'); continue;
    }
    const heading = /^(#{3,6})\s+(.+)$/.exec(line);
    if (heading) { output.push('<h3>' + inlineMarkdown(heading[2], note) + '</h3>'); index++; continue; }
    if (/^\s*[-*+]\s/.test(line) || /^\s*\d+\.\s/.test(line)) {
      const ordered = /^\s*\d+\.\s/.test(line);
      const rule = ordered ? /^\s*\d+\.\s+(.*)$/ : /^\s*[-*+]\s+(.*)$/;
      const items = [];
      while (index < lines.length) {
        const item = rule.exec(lines[index]);
        if (!item) break;
        const content = [item[1]]; index++;
        while (index < lines.length && lines[index].trim() && !special(lines[index])) content.push(lines[index++].trim());
        items.push('<li>' + inlineMarkdown(content.join(' '), note) + '</li>');
      }
      output.push('<' + (ordered ? 'ol' : 'ul') + '>' + items.join('') + '</' + (ordered ? 'ol' : 'ul') + '>'); continue;
    }
    if (/^>/.test(line)) {
      const quote = [];
      while (index < lines.length && /^>/.test(lines[index])) quote.push(lines[index++].replace(/^>\s?/, ''));
      output.push('<blockquote>' + inlineMarkdown(quote.join(' '), note) + '</blockquote>'); continue;
    }
    if (line.trim().startsWith('|') && /^\s*\|?[\s:|-]+\|\s*$/.test(lines[index + 1] || '')) {
      const cells = row => row.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());
      const head = cells(line); index += 2;
      const rows = [];
      while (index < lines.length && lines[index].trim().startsWith('|')) rows.push(cells(lines[index++]));
      output.push('<div class="table-wrap"><table><thead><tr>' + head.map(cell => '<th>' + inlineMarkdown(cell, note) + '</th>').join('') + '</tr></thead><tbody>' + rows.map(row => '<tr>' + row.map(cell => '<td>' + inlineMarkdown(cell, note) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>'); continue;
    }
    const paragraph = [line]; index++;
    while (index < lines.length && !special(lines[index])) paragraph.push(lines[index++]);
    output.push('<p>' + inlineMarkdown(paragraph.join('\n'), note).replace(/\n/g, '<br>') + '</p>');
  }
  return output.join('');
}

function placeMapDetail() {

  const detail = $('map-detail');
  const button = $('project-map').querySelector('[data-map-node="' + state.nodeId + '"]');
  if (!button) return;
  for (const slot of document.querySelectorAll('.map-detail-slot')) slot.hidden = true;
  let slot;
  if (button.classList.contains('support-node')) slot = $('support-detail-slot');
  else if (mobileLayout.matches) slot = button.parentElement;
  else slot = $(button.classList.contains('main-node') ? 'flow-detail-slot' : 'branch-detail-slot');
  if (mobileLayout.matches && button.classList.contains('branch-node')) {

const scrollTargets = '.map-node, #map-detail, #project-brief, #project-focus, #learning-panel, .decision-row, .timeline-card, [data-alternative-id], .module-decision, .reader-section';

}

  restoreScroll($('main-scroll'), position.main);

      || (position.focusId && $(position.focusId)?.getClientRects().length && $(position.focusId))

function applyDataset(notes) {

    readerTrail = [];
  }
  state.selectedId = source ? null : id; state.sourceId = source ? id : null;
  setHash((source ? '#source=' : '#note=') + encodeURIComponent(id), alreadyOpen, { board: readerOrigin.context, readerLayer: alreadyOpen ? history.state?.readerLayer === true : true, originHash: readerOrigin.hash });
  render();
  $('reader-scroll').scrollTop = 0;
  $('reader-title')?.focus({ preventScroll: true });
  checkpoint();
}
function openNote(id) { openReader(id); }
function openDocument(path) { openReader(path, true); }
function readerBack() {
  const previous = readerTrail.pop();
  if (!previous) return;
  state.selectedId = previous.selectedId; state.sourceId = previous.sourceId;
  setHash((state.sourceId ? '#source=' : '#note=') + encodeURIComponent(state.sourceId || state.selectedId), true, history.state);
  render();
  restoreScroll($('reader-scroll'), previous.position);
  $('reader-title')?.focus({ preventScroll: true });
  checkpoint();
}
function closeReader() {
  if (!$('reader-dialog').open) return;
  checkpoint();
  if (history.state?.readerLayer) { history.back(); return; }
  const origin = readerOrigin;
  state.selectedId = null; state.sourceId = null;
  if (origin) restoreBoardContext(origin.context);
  setHash(collectionHash(), true); render();
  restorePosition(origin?.position, { focus: true });
  readerOrigin = null; readerTrail = [];
}
function readRoute() {
  let hash = location.hash.slice(1);
  state.selectedId = null; state.sourceId = null;
  if (hash.startsWith('note=')) {
    try { state.selectedId = decodeURIComponent(hash.slice(5)); } catch { /* Invalid fragment. */ }
  } else if (hash.startsWith('source=')) {
    try { state.sourceId = decodeURIComponent(hash.slice(7)); } catch { /* Invalid fragment. */ }
  } else if (hash.startsWith('map=')) {
    try { state.nodeId = decodeURIComponent(hash.slice(4)); } catch { state.nodeId = ''; }
    state.view = 'overview'; state.nodeExpanded = true; clearFilters();
  } else if (hash.startsWith('module=')) {
    let group;
    try { group = decodeURIComponent(hash.slice(7)); } catch { group = ''; }
    if (state.group !== group) clearFilters();
    state.group = group; state.view = 'library';
  } else {
    hash = { baseline: 'overview', directory: 'library' }[hash] || hash;
    if (viewLabels[hash]) { state.view = hash; state.group = ''; if (hash === 'overview') state.nodeExpanded = false; }
  }
  restoreBoardContext(history.state?.board);
  if (state.selectedId || state.sourceId) {
    readerOrigin = history.state?.readerOrigin || null;
    readerTrail = history.state?.readerTrail || [];
  }
  lastRouteHash = location.hash;
}
function handleRoute() {
  if (lastRouteHash === location.hash) return;
  clearTimeout(checkpointTimer);
  const wasReading = $('reader-dialog').open;
  const origin = readerOrigin;
  readRoute(); render();
  if (!$('reader-dialog').open) {
    if (wasReading && origin && location.hash === origin.hash) restorePosition(origin.position, { focus: true });
    else if (history.state?.position) restoreHistoryPosition();
    else $('main-scroll').scrollTop = state.scrolls.get(routeKey()) || 0;
    readerOrigin = null; readerTrail = [];
  } else {
    restoreHistoryPosition();
    $('reader-title')?.focus({ preventScroll: true });
  }
}
function clearFilters() {
  state.query = ''; state.cls = ''; state.status = ''; state.month = ''; state.group = '';
  $('search-input').value = '';
}
function resetFilters() {
  checkpoint(); clearFilters(); setHash(collectionHash()); render(); $('main-scroll').scrollTop = 0;
}

async function savedDirectory(handle) {
  let database;
  try {
    database = await new Promise((resolve, reject) => {
      const request = indexedDB.open('AgentNotesBoardDB', 1);
      request.onupgradeneeded = () => { if (!request.result.objectStoreNames.contains('handles')) request.result.createObjectStore('handles'); };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    return await new Promise((resolve, reject) => {
      const transaction = database.transaction('handles', handle ? 'readwrite' : 'readonly');
      const store = transaction.objectStore('handles');
      const request = handle ? store.put(handle, preferenceKey) : store.get(preferenceKey);
      transaction.oncomplete = () => resolve(handle || request.result || null);
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error);
    });
  } catch { return null; }
  finally { database?.close(); }
}

let directory = null;
let latestSync = null;
let connectAttempt = 0;
const liveSync = createLiveSync({
  read: readProjectDirectory,
  signatureOf: projectSignature,
  countOf: value => value.notes.length,
  commit(project) {
    state.connected = true;
    presentation = project.presentation;
    state.documents = project.documents;
    state.scope = project.scope;
    state.label = project.label;
    applyDataset(project.notes);
  },
  report(result) {
    latestSync = result;
    const position = capturePosition();
    if (result.ok) {
      $('sync-dot').className = 'status-dot live';
      $('source-status').textContent = '自动同步';
      $('source-status').title = directory.name + ' · 上次检查：' + new Date(result.checkedAt).toLocaleTimeString('zh-CN');
      $('connect-button').querySelector('span').textContent = '切换目录';
      $('connect-button').title = '切换项目目录';
      $('connect-button').setAttribute('aria-label', '切换项目目录');
      notice(state.scope === 'notes' ? '当前只连接了 notes 文件夹。连接项目根目录或 .agents 后，即可一并读取项目地图与进度记录。' : '');
    } else {
      $('sync-dot').className = 'status-dot error';
      $('source-status').textContent = '同步失败';
      $('source-status').title = '保留上次内容，下次检查时重试';
      const permission = ['NotAllowedError', 'SecurityError'].includes(result.error?.name);
      notice(permission ? '目录访问权限已失效，请重新连接项目目录。当前内容已保留。' : '暂时无法读取完整项目资料，将在下次检查时重试。' + (result.error?.message ? ' ' + result.error.message : ''));
    }
    restorePosition(position);
  },
});

async function connectDirectory() {
  if (!('showDirectoryPicker' in window)) {
    notice('连接本地目录需要 Chrome 或 Edge。当前浏览器可以直接打开 board.snapshot.html 阅读离线快照。'); return;
  }
  const attempt = ++connectAttempt;
  try {
    const picked = await window.showDirectoryPicker({ mode: 'read', id: 'agent-notes' });
    if (attempt !== connectAttempt) return;
    directory = picked;
    $('source-status').textContent = '正在读取…';
    $('refresh-button').disabled = false;
    $('refresh-button').hidden = false;
    liveSync.setSource(picked);
    await liveSync.request();
    if (attempt === connectAttempt && latestSync?.ok) await savedDirectory(picked);
  } catch (error) {
    if (attempt === connectAttempt && error.name !== 'AbortError') notice(error.message || '目录连接失败，请重新选择笔记目录。');
  }
}

document.addEventListener('click', event => {
  const target = event.target instanceof Element ? event.target : null;
  if (!target) return;
  const mapNode = target.closest('[data-map-node]');
  if (mapNode) { openMapNode(mapNode.dataset.mapNode); return; }
if (target.closest('[data-map-close]')) { collapseMapNode(); return; }

  const source = target.closest('[data-source-id]');
  if (source) {
    if (source.tagName === 'A' && (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey)) return;
    event.preventDefault(); openDocument(source.dataset.sourceId); return;
  }
  const note = target.closest('[data-note-id]');
  if (note) {
    if (note.tagName === 'A' && (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey)) return;
    event.preventDefault(); openNote(note.dataset.noteId); return;
  }
  const view = target.closest('[data-view]');
  if (view) { event.preventDefault(); goToView(view.dataset.view, { reset: true }); return; }
  if (target.closest('#toggle-excerpts')) {
    state.showExcerpts = !state.showExcerpts;
    renderOverview(); rememberPreferences(); $('toggle-excerpts').focus({ preventScroll: true }); return;
  }


  const group = target.closest('[data-group-id]');
  if (group) {
    goToView('library', { reset: true, group: group.dataset.groupId });
    $('main-scroll').scrollTop = 0; return;
  }
  const status = target.closest('[data-status]');
  if (status) { clearFilters(); state.status = status.dataset.status; goToView('library'); $('main-scroll').scrollTop = 0; return; }
  const month = target.closest('[data-month]');
  if (month) { state.month = month.dataset.month; render(); return; }
  const section = target.closest('[data-section]');
  if (section) { event.preventDefault(); $(section.dataset.section)?.scrollIntoView({ block: 'start' }); return; }
  if (target.closest('[data-reset]')) resetFilters();
  if (target.closest('[data-connect]')) void connectDirectory();
  if (target.closest('#copy-note-path')) {
    const current = state.byId.get(state.selectedId);
    if (current) {
      const path = (config.noteBase || '.agents/notes') + '/' + current.sourcePath;
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(path).then(() => toast('已复制笔记路径'), () => toast('复制未成功，可右键“查看 Markdown 原文”复制链接。'));
      else toast('可右键“查看 Markdown 原文”复制链接。');
    }
  }
});
$('reader-back').addEventListener('click', readerBack);
$('reader-close').addEventListener('click', closeReader);
$('reader-dialog').addEventListener('cancel', event => { event.preventDefault(); closeReader(); });
$('reader-dialog').addEventListener('click', event => {
  if (event.target !== $('reader-dialog')) return;
  const rect = $('reader-dialog').getBoundingClientRect();
  if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) closeReader();
});
document.addEventListener('change', event => {
  if (event.target.id !== 'map-note-select') return;
  const position = capturePosition();
  state.evidenceId = event.target.value;
  renderMapDetail(presentation.map.nodes.find(node => node.id === state.nodeId));
  restorePosition(position); rememberPreferences();
});
$('reset-filters').addEventListener('click', resetFilters);
$('connect-button').addEventListener('click', () => void connectDirectory());
const manualRefresh = async () => {
  await liveSync.request();
  if (latestSync?.ok) toast(latestSync.changed ? '已更新项目资料' : '已是最新内容');
};
$('refresh-button').addEventListener('click', manualRefresh);
$('learning-toggle').addEventListener('click', () => {
  state.showLearning = !state.showLearning; renderLearning(); rememberPreferences();
});
$('search-input').value = state.query;
$('search-input').addEventListener('input', event => {
  const query = event.target.value;
  if (state.selectedId || state.sourceId || state.view === 'overview') { clearFilters(); state.selectedId = null; state.sourceId = null; state.view = 'library'; setHash('#library'); }
  state.query = query; $('search-input').value = query;
  render(); $('main-scroll').scrollTop = 0;
});
for (const [id, key] of [['group-filter', 'group'], ['status-filter', 'status'], ['class-filter', 'cls'], ['sort-select', 'sort']]) {
  $(id).addEventListener('change', event => {
    state[key] = event.target.value;
    if (key !== 'sort') state.month = '';
    if (key === 'group') setHash(collectionHash());
    render(); $('main-scroll').scrollTop = 0;
  });
}
setHtml('class-filter', '<option value="">全部类别</option>' + CLASSES.map(cls => '<option value="' + cls + '">' + CLASS_LABELS[cls] + '</option>').join(''));
window.addEventListener('keydown', event => {
  const editing = event.target instanceof Element && (event.target.matches('input, textarea, select') || event.target.isContentEditable);
  if (!$('reader-dialog').open && ((event.key === '/' && !editing) || ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k'))) {
    event.preventDefault(); $('search-input').focus(); $('search-input').select();
  }
  if (event.key === 'Escape' && !$('reader-dialog').open && state.nodeExpanded && state.view === 'overview' && !editing) {
    event.preventDefault(); collapseMapNode();
  }
});
window.addEventListener('popstate', handleRoute);
window.addEventListener('hashchange', handleRoute);
// Save before navigation: pagehide alone is too late for reload history in Chromium.
window.addEventListener('beforeunload', checkpoint);
$('main-scroll').addEventListener('scroll', scheduleCheckpoint, { passive: true });
$('reader-scroll').addEventListener('scroll', scheduleCheckpoint, { passive: true });

const checkForUpdates = () => { if (directory && document.visibilityState !== 'hidden') void liveSync.request(); };
window.addEventListener('focus', checkForUpdates);
document.addEventListener('visibilitychange', checkForUpdates);
setInterval(checkForUpdates, 3000);

async function start() {
  const initialHash = location.hash;
  readRoute();
  $('source-status').textContent = config.mode === 'snapshot' ? '离线快照' : '未连接';
  $('source-status').title = '当前显示生成时的内容';
  if (config.mode === 'snapshot') {
    applyDataset(window.__INLINE_DATA__ || []);
  } else {
    render();
    const attempt = connectAttempt;
    const saved = await savedDirectory();
    if (saved && attempt === connectAttempt) {
      try {
        const permission = await saved.queryPermission({ mode: 'read' });
        if (attempt !== connectAttempt) return;
        if (permission === 'granted') {
          directory = saved; $('refresh-button').disabled = false; $('refresh-button').hidden = false;
          liveSync.setSource(saved); await liveSync.request();
        } else $('source-status').textContent = '需重新连接';
      } catch { $('source-status').textContent = '需重新连接'; }
    }
  }
  if (location.hash === initialHash) restoreHistoryPosition();
}
void start();

  })();
  </script>
