<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="查看项目运行流程、当前开发重点与设计依据。">
  <title>mini-agent · 项目地图</title>
  <style>:root {
  --canvas: #f7f8f6;
  --paper: #ffffff;
  --text: #222b3a;
  --muted: #596577;
  --quiet: #687386;
  --line: #e0e4eb;
  --accent: #26745f;
  --accent-soft: #eaf4ef;
  --hover: #f2f7f4;
  --architecture: #557cba;
  --feature: #42856b;
  --bug-fix: #b87448;
  --simplification: #97803d;
  --process: #8770ab;
  --testing: #4e8794;
  --radius: 12px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.65;
  color: var(--text);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); }
button, input, select { font: inherit; color: inherit; }
button, a, input, select { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; opacity: .45; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { font-weight: 650; }
button, input, select { border-radius: 6px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid #7295e8;
  outline-offset: 3px;
}
[hidden] { display: none !important; }
.icon {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: middle;
  flex-shrink: 0;
}
.icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: fixed;
  left: 20px;
  top: -80px;
  background: var(--accent);
  color: white;
  padding: 10px 18px;
  z-index: 100;
}
.skip-link:focus { top: 12px; }

.brand-mark {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.brand-mark .icon { width: 23px; height: 23px; }
.status-dot { height: 7px; width: 7px; flex-shrink: 0; border-radius: 50%; background: #909cad; }
.status-dot.live { background: #328263; }
.status-dot.error { background: #bd8139; }
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 13px;
  border: 1px solid #ced6e3;
  background: white;
  min-height: 39px;
  font-size: 14px;
  font-weight: 500;
}
.button:hover { background: var(--hover); border-color: #97aed7; }
.button-primary { background: var(--accent); border-color: var(--accent); color: white; padding: 11px 20px; }
.button-primary:hover { background: #205f4e; border-color: #205f4e; }
.icon-button { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.icon-button:hover { background: var(--hover); }
.text-button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 0; color: var(--accent); font-size: 14px; white-space: nowrap; }
.text-button:hover { text-decoration: underline; text-underline-offset: 4px; }

/* One shared horizontal navigation for every view. */
.workspace { height: 100dvh; display: flex; flex-direction: column; min-width: 0; }
.topbar { min-height: 70px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 max(28px, calc((100vw - 1500px) / 2)); border-bottom: 1px solid var(--line); background: var(--paper); }
.topbar-brand { display: flex; align-items: center; gap: 10px; font-size: 17px; white-space: nowrap; min-width: 0; }
.topbar-brand strong { overflow: hidden; text-overflow: ellipsis; }
.topbar-brand .brand-mark { width: 33px; height: 33px; border-radius: 9px; }
.topbar-brand .brand-mark .icon { width: 22px; height: 22px; }
.workspace-tabs { display: flex; align-items: stretch; align-self: stretch; gap: 26px; margin-right: auto; }
.workspace-tabs a { display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--muted); font-size: 14px; white-space: nowrap; min-height: 44px; }
.workspace-tabs a:hover { color: var(--accent); }
.workspace-tabs a.active { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.search-box { display: flex; align-items: center; gap: 9px; min-width: 150px; flex: 0 1 245px; margin-left: auto; border: 1px solid var(--line); border-radius: 7px; background: #fafbf9; padding: 8px 11px; color: var(--quiet); }
.search-box:focus-within { border-color: #6ba58b; box-shadow: 0 0 0 3px #eaf4ef; }
.search-box input { min-width: 0; width: 100%; outline: none; border: 0; background: transparent; font-size: 14px; padding: 0; }
.search-box input::placeholder { color: var(--quiet); }
.search-box kbd { font-family: inherit; font-size: 12px; border: 1px solid #dce2ec; border-radius: 3px; width: 20px; line-height: 22px; text-align: center; background: white; }
.connection-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.connection-status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--quiet); white-space: nowrap; }
#connect-button { font-size: 13px; min-height: 36px; }
.main-scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; scrollbar-gutter: stable; outline: none; overscroll-behavior: contain; }
.page-content { max-width: 1500px; margin: auto; padding: 27px 28px 32px; }
#page-title:focus, #map-detail-title:focus, #reader-title:focus { outline: none; }

/* Overview: decisions grouped by the actual parts of the project. */
.overview-summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 20px; padding: 0 0 13px; border-bottom: 1px solid var(--line); }
.overview-summary > p { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
.overview-summary > p strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.overview-summary > p > span { color: #a3adbd; margin: 0 7px; }
.overview-statuses { display: flex; gap: 8px; flex-wrap: wrap; }
.overview-controls { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
.excerpt-toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--accent); background: var(--paper); border: 1px solid #d5dfee; padding: 6px 10px; }
.excerpt-toggle .icon { width: 15px; height: 15px; }
.excerpt-toggle:hover { background: var(--accent-soft); }
.status-filter-button { display: flex; align-items: center; gap: 7px; font-size: 13px; padding: 3px 5px; color: var(--muted); }
.status-filter-button:hover { background: #e8edf6; }
.module-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
.module-grid.show-excerpts { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.module-card { display: flex; flex-direction: column; min-width: 0; background: var(--paper); border: 1px solid #dbe1eb; border-radius: var(--radius); overflow: hidden; box-shadow: 0 2px 3px #29354b03; }
.module-card-heading { display: flex; gap: 10px; align-items: flex-start; padding: 20px 18px 17px; border-bottom: 1px solid var(--line); background: #fcfdff; }
.module-number { display: grid; place-items: center; flex-shrink: 0; width: 34px; height: 34px; margin-top: 1px; background: #edf2fc; color: var(--accent); border: 1px solid #e0e8f8; border-radius: 8px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.module-card-heading > div { flex: 1; min-width: 0; }
.module-card-heading h2 { font-size: 18px; line-height: 1.5; }
.module-card-heading h2 button { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; font-weight: inherit; padding: 0; }
.module-card-heading h2 button:hover { color: var(--accent); }
.module-card-heading h2 .icon { width: 17px; height: 17px; color: var(--quiet); margin-left: 12px; }
.module-decisions { flex: 1; }
.module-decision { display: block; width: 100%; text-align: left; padding: 13px 18px; border-bottom: 1px solid #e9edf3; border-radius: 0; }
.module-decision:last-child { border-bottom: 0; }
.module-decision:hover { background: var(--hover); }
.module-decision:hover h3 { color: var(--accent); }
.module-decision-title { display: flex; align-items: flex-start; gap: 8px; justify-content: space-between; }
.module-decision-title h3 { font-size: 14px; font-weight: 500; line-height: 1.7; }
.module-decision-title .status-badge { margin-top: 1px; }
.module-decision > p { display: none; color: var(--muted); font-size: 14px; line-height: 1.8; margin-top: 7px; overflow-wrap: anywhere; }
.show-excerpts .module-decision { padding: 17px 22px; }
.show-excerpts .module-decision > p { display: block; }
.show-excerpts .module-decision-title h3 { font-size: 15px; font-weight: 600; }
.module-links { padding: 11px 18px 14px; border-top: 1px solid var(--line); background: #fcfdff; font-size: 12px; }
.module-links > span { display: flex; align-items: center; gap: 5px; color: var(--quiet); margin-bottom: 7px; }
.module-links .icon { width: 13px; height: 13px; }
.module-links > div { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 9px; }
.module-links button { padding: 2px 7px; background: #f0f3f9; color: #4f6489; font-size: 12px; }
.module-links button:hover { background: var(--accent-soft); color: var(--accent); }

/* Note metadata, full collections and filters. */
.row-meta { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--quiet); margin-bottom: 9px; flex-wrap: wrap; }
.class-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.category-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--category); flex-shrink: 0; }
.group-tag { color: #586c91; }
.status-badge { font-size: 11px; font-weight: 500; border-radius: 4px; padding: 2px 6px; line-height: 1.65; background: #edf5f0; color: #367154; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
.status-badge::before { content: ""; width: 4px; height: 4px; background: currentColor; border-radius: 50%; }
.status-badge.proposed { background: #fbf2dc; color: #886513; }
.status-badge.rejected { background: #faeeeb; color: #9c5044; }
.status-badge.archived { background: #eef0f3; color: #5f6978; }
.collection-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 0 17px; margin-bottom: 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.collection-options { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.filter-controls { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
select { background: white; border: 1px solid #d8dfeb; color: var(--muted); padding: 8px 26px 8px 11px; font-size: 13px; cursor: pointer; max-width: 100%; min-height: 38px; }
.sort-control select { background: transparent; border-color: transparent; }
.results-summary { color: var(--muted); font-size: 12px; white-space: nowrap; }
.decision-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.decision-row { display: flex; flex-direction: column; gap: 18px; min-width: 0; text-align: left; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.decision-row:hover { background: var(--hover); border-color: #9dbcaa; }
.decision-row:hover h2 { color: var(--accent); }
.decision-row h2 { font-size: 17px; line-height: 1.65; font-weight: 600; margin-bottom: 9px; }
.decision-row p { font-size: 14px; color: var(--muted); line-height: 1.8; margin-bottom: 16px; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.decision-row .row-meta { margin: 0; gap: 6px 9px; }
.decision-side { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: auto; padding-top: 12px; border-top: 1px solid #edf0ed; font-size: 12px; color: var(--quiet); }
.decision-side .icon { width: 16px; height: 16px; }
.month-filters { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }
.month-filters button { border: 1px solid var(--line); padding: 5px 12px; font-size: 13px; color: var(--muted); background: var(--paper); }
.month-filters button.active { background: var(--accent-soft); border-color: #c4d3f3; color: var(--accent); }
.timeline-group { display: grid; grid-template-columns: 100px minmax(0,1fr); gap: 24px; margin-top: 26px; }
.timeline-label { font-size: 15px; font-weight: 600; padding-top: 16px; }
.timeline-label small { display: block; font-size: 12px; color: var(--quiet); font-weight: 400; margin-top: 5px; }
.timeline-items { padding-left: 24px; border-left: 1px solid #cfd9eb; }
.timeline-card { display: block; width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 21px 24px; text-align: left; margin: 0 0 16px; position: relative; }
.timeline-card::before { content: ""; position: absolute; left: -29px; top: 25px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--canvas); background: #7898d3; }
.timeline-card:hover { border-color: #a9bde1; }
.timeline-card h3 { font-size: 17px; font-weight: 600; line-height: 1.6; }
.timeline-card p { color: var(--muted); font-size: 14px; margin-top: 8px; line-height: 1.8; overflow-wrap: anywhere; }
.alternatives-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 22px; align-items: start; }
.alternative-group { border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); padding: 24px; min-width: 0; }
.alternative-group .alternative-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 0; font-size: 17px; line-height: 1.7; font-weight: 600; margin: 9px 0 19px; }
.alternative-heading .icon { margin-top: 5px; width: 16px; height: 16px; }
.alternative-heading:hover { color: var(--accent); }
.alternative-option { border-top: 1px solid #e8edf4; padding: 16px 0; overflow-wrap: anywhere; }
.alternative-option:last-child { padding-bottom: 0; }
.alternative-option h3 { font-size: 14px; line-height: 1.8; font-weight: 600; display: flex; gap: 8px; }
.option-number { color: var(--quiet); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; flex-shrink: 0; }
.alternative-option p { color: var(--muted); font-size: 14px; line-height: 1.9; margin-top: 6px; padding-left: 24px; }
.alternative-option a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* A centered, modal reading surface with its own scroll position. */
.reader-dialog { width: min(960px, calc(100vw - 64px)); height: min(940px, calc(100dvh - 72px)); max-width: none; max-height: none; padding: 0; border: 1px solid #dce3dc; border-radius: 16px; background: var(--paper); color: var(--text); box-shadow: 0 24px 90px #172a2440; overflow: hidden; }
.reader-dialog[open] { display: flex; flex-direction: column; }
.reader-dialog::backdrop { background: #23352d66; backdrop-filter: blur(3px); }
.reader-toolbar { display: flex; align-items: center; gap: 16px; flex-shrink: 0; min-height: 56px; padding: 8px 20px; border-bottom: 1px solid var(--line); background: #fbfcfa; }
#reader-close { margin-left: auto; width: 38px; height: 38px; }
.reader-scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; overscroll-behavior: contain; padding: 32px 48px 44px; outline: none; }
.reader-content { min-width: 0; }
.reader-header { border-bottom: 1px solid var(--line); padding-bottom: 25px; margin-bottom: 30px; }
.reader-header .row-meta { margin-bottom: 14px; font-size: 13px; }
.reader-header h1 { font-size: 29px; line-height: 1.5; letter-spacing: -.4px; margin: 0; font-weight: 650; text-wrap: pretty; overflow-wrap: anywhere; }
.reader-source { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); margin-top: 15px; line-height: 1.8; }
.reader-source .icon { width: 15px; height: 15px; }
.reader-source:hover { text-decoration: underline; text-underline-offset: 4px; }
.reader-preamble { margin-top: 14px; font-size: 13px; color: var(--muted); line-height: 1.8; overflow-wrap: anywhere; }
.reader-quick-nav { display: flex; flex-wrap: wrap; gap: 6px 18px; border-bottom: 1px solid var(--line); padding-bottom: 17px; margin: -8px 0 27px; }
.reader-quick-nav a { color: var(--accent); font-size: 13px; padding: 3px 0; }
.reader-quick-nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
.reader-section { margin: 0 0 34px; scroll-margin-top: 25px; }
.reader-section > h2 { font-size: 20px; line-height: 1.6; margin-bottom: 15px; font-weight: 650; }
.markdown { font-size: 16px; line-height: 1.95; color: #334155; overflow-wrap: anywhere; }
.markdown p { margin-bottom: 16px; }
.markdown p:last-child { margin-bottom: 0; }
.markdown a { color: var(--accent); text-decoration: underline; text-decoration-color: #a7bce6; text-underline-offset: 3px; }
.markdown a:hover { text-decoration-color: var(--accent); }
.markdown code { font-family: "Cascadia Code", Consolas, monospace; font-size: .89em; background: #edf0f6; color: #3c5176; border: 1px solid #dfe5ef; padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
.markdown pre { overflow-x: auto; padding: 17px 19px; border: 1px solid var(--line); border-radius: 8px; background: #f0f3f8; line-height: 1.75; margin: 16px 0; }
.markdown pre code { border: 0; padding: 0; background: none; overflow-wrap: normal; }
.markdown ul, .markdown ol { padding-left: 24px; margin: 12px 0 18px; }
.markdown li { padding-left: 3px; margin: 11px 0; }
.markdown li::marker { color: #6781ad; }
.markdown h3, .markdown h4 { font-size: 17px; margin: 25px 0 12px; color: var(--text); }
.markdown blockquote { margin: 16px 0; padding: 11px 17px; border-left: 3px solid #a7bbdf; background: #edf2fb; color: var(--muted); }
.markdown .table-wrap { overflow: auto; margin: 16px 0; }
.markdown table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.markdown th, .markdown td { padding: 9px 12px; border: 1px solid var(--line); text-align: left; }
.markdown th { background: #eef2f9; font-weight: 600; }
.reader-related { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; margin-top: 28px; }
.reader-related:empty { display: none; }
.related-group { border-top: 1px solid var(--line); padding-top: 18px; min-width: 0; }
.related-group h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.related-group h2 > span { font-size: 12px; color: var(--quiet); font-weight: 400; }
.related-link { display: block; text-align: left; width: 100%; font-size: 14px; line-height: 1.75; padding: 8px; margin: 0 0 4px -8px; overflow-wrap: anywhere; }
.related-link small { display: block; font-size: 12px; color: var(--quiet); margin-top: 3px; }
.related-link:hover { background: var(--accent-soft); color: var(--accent); }
.reader-tools { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; }
.related-empty { font-size: 13px; color: var(--quiet); }

/* Empty and connection states. */
.empty-state { text-align: center; padding: 64px 24px; background: var(--paper); border: 1px dashed #cad5e8; border-radius: var(--radius); }
.empty-state > .icon { width: 30px; height: 30px; color: #8299bc; margin-bottom: 15px; }
.empty-state h2, .empty-state h1 { font-size: 20px; font-weight: 600; }
.empty-state p { font-size: 15px; color: var(--muted); margin: 12px 0 22px; }
.onboarding { max-width: 750px; margin: 36px auto 70px; text-align: center; padding: 46px 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.onboarding-art { width: 145px; margin: 0 auto 20px; }
.onboarding h2 { font-size: 24px; letter-spacing: -.4px; font-weight: 600; }
.onboarding p { font-size: 15px; color: var(--muted); line-height: 1.9; margin: 17px auto 25px; }
.text-link { color: var(--accent); font-size: 14px; }
.text-link:hover { text-decoration: underline; }
.snapshot-link { display: block; margin-top: 19px; }
.notice { font-size: 14px; line-height: 1.8; padding: 12px 16px; background: #fff8e9; border: 1px solid #e9d9b0; border-radius: 8px; margin-bottom: 22px; color: #806129; overflow-wrap: anywhere; }
.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #293a59; color: white; border-radius: 8px; padding: 11px 19px; font-size: 14px; box-shadow: 0 6px 25px #17274b20; z-index: 60; max-width: calc(100vw - 30px); text-align: center; }

/* A full-width flow canvas; node details are inserted below the selected row. */
.project-brief { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; align-items: center; gap: 20px; background: #edf3ed; border: 1px solid #dce7dc; border-radius: 10px; padding: 14px 18px; margin-bottom: 22px; }
.brief-item { min-width: 0; }
.brief-next { border-left: 1px solid #d4e1d2; padding-left: 20px; }
.current-marker { display: flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 12px; font-weight: 600; color: #37604b; }
.current-marker .icon { width: 16px; height: 16px; }
.current-description { font-size: 13px; color: #344b3d; margin-top: 5px; }
.source-button { font-size: 12px; white-space: nowrap; gap: 6px; }
.source-button .icon { width: 14px; height: 14px; }
.source-missing { color: #936326; font-size: 13px; }
.map-surface { min-width: 0; background: white; border: 1px solid #dce3dc; border-radius: 14px; overflow: hidden; scroll-margin-top: 20px; }
.map-heading { padding: 18px 24px; }

window.__INLINE_DATA__ = [{"id":"implemented/architecture/2026-09-22-runtime-resilience.md","sourcePath":"implemented/architecture/2026-09-22-runtime-resilience.md","slug":"2026-09-22-runtime-resilience","lifecycle":"implemented","cls":"architecture","date":"2026-09-22","title":"每个用户轮共享取消、传输预算和脱敏运行事件","status":"implemented","rawBody":"# Agent Note: 每个用户轮共享取消、传输预算和脱敏运行事件\n\nStatus: implemented\n\n## Problem\n\n主轮与摘要原先共享局部次数，委派另有六次额度，SDK 禁用重试。一次委派或网络失败的成本不能反映在主轮总额中；只有单次请求及命令超时，批准等待没有总截止时间。普通终端文本也难以关联同一用户轮的摘要、子任务、失败尝试和 token 消耗。\n\n## Decision\n\n[run-control.ts](../../../../src/run-control.ts) 为每个真实用户轮建立 RunControl；[session-runner.ts](../../../../src/session-runner.ts) 在初始检查点保存前创建并在 finally 释放。CLI 生命周期信号连接本轮控制器，轮内总时限使用单调时钟并包含批准、摘要、委派、退避、工具和检查点等待。等待下一条用户输入不占轮预算。外部取消为 cancelled，总时限为 budget_exhausted；单请求超时在有限重试后为 failed。取消或超时都不撤销副作用，清理及可靠保存可在截止后继续完成。\n\n每次实际传输之前预留一次请求与“输入估算 + 输出上限”，包括失败尝试、摘要、子任务及重试。正常报告的有效 usage 替换本次预留值；缺少或非法 usage 保留估算并单独计数，失败请求也不记零。实际 usage 超总额时停止后续动作。默认全轮 24 次、200000 tokens、600000ms；主／摘要局部十次、子任务局部六次继续限制逻辑请求，不包含同一逻辑请求的传输重试。子任务最终总结仍须取得总预算。摘要开始前需要至少两次剩余额度；后续重试可能耗尽余量，不能额外借出回答额度。\n\n重试只有 RunControl 一层，SDK 仍为 maxRetries=0。连接错误、单请求超时、HTTP 408/429/500/502/503/504 在零 chunk 时最多重试两次，以 500ms 起指数退避、上限 10000ms。任意 chunk（含角色、工具参数或 usage）交付后不重试；认证、协议、上下文、批准和工具执行错误不重试。每次重试重新预留预算，取消可打断退避。只重试当前传输，不重跑主循环已确认动作。\n\n[telemetry.ts](../../../../src/telemetry.ts) 定义请求、重试、工具、批准与轮结果的类型化事件，驱动终端运行提示及每会话 trace.jsonl。每条轨迹携带 sessionId、turnId、递增序号和时间；子任务另用生成的 taskId，同轮工具用递增动作编号。请求记录范围、预留／结算 tokens、actual/estimated、结果及耗时；轮末汇总请求、已启动工具、总时间和 token。工具名只接受内置白名单，扩展工具记 other；不记录用户／模型正文、参数、命令、路径、工具结果、调用方原始 ID、API 配置或异常正文。Zod 运行时白名单再次丢弃多余字段。\n\n轨迹为追加诊断副本，不作为恢复来源；写失败只警告一次并禁用本轮轨迹。快照的原子检查点仍必须等待，保存失败照常终止。原始快照和正常交互输出仍含任务内容，不能当成脱敏资料分享。恢复不读取或重放轨迹；新输入建立新账本。沿用[会话恢复](2026-09-21-atomic-session-storage.md)、[上下文及摘要](2026-09-05-bounded-conversation-context.md)、[只读子 Agent](../feature/2026-09-19-isolated-readonly-subagent.md)的边界。\n\n文件读取和目录搜索接收同一信号，readFile 可中止，目录遍历逐项检查。注册表执行包装不得吞掉取消；子请求总预算错误向主轮传播。started 检查点已提交后才收到取消时按 uncertain 收尾，避免把已开始状态错误转换为 not_executed；命令的原始清理报告仍保留。\n\n## Alternatives considered\n\n- 开启 SDK 内置重试：实现少且覆盖常见网络错误，但内部尝试无法与委派、摘要共同预留总额，也难以对已交付片段统一限制；保留 SDK 零重试，在共享传输包装层负责。\n- 只在主循环累计成功 usage：改动较少且统计简单，但漏掉失败尝试和无 usage 请求，预算耗尽后才发现成本；采用发送前预留、返回后结算，接受估算偏保守。\n- 用 JSONL 同时做恢复事件源：可以统一审计与恢复，但需要新重放协议和事件迁移；已有快照明确动作窗口，继续以快照恢复、轨迹作可丢诊断副本。\n- 完整记录请求与结果后用正则脱敏：调试上下文最丰富，但密钥和私有内容形态不可枚举；采用白名单元数据，接受必须结合本地快照才能调查正文细节。\n\n## Consequences\n\n同一用户轮的主／子／摘要／重试有统一可观察账目，批准、模型和命令等待有共同停止信号。代价是故障请求按完整预留估算可能较早停止，轨迹使用同步短行写入增加少量 I/O，且元数据不能复原对话。\n\n输入估算并非供应商 tokenizer；usage 缺失、服务端忽略输出限制或计量延迟时不承诺精确费用硬上限。取消是协作式的，不能抢占阻塞 JavaScript 的同步计算或任意不遵守信号的工具；截止后会在下一个调度边界停止，命令树清理继续沿用已验证的平台边界。JSONL 不做 fsync，也不作为断电保证；本阶段不增加轨迹轮转和跨进程执行。\n\n## Verification\n\n2026-09-22，本地 `npm run typecheck` 与全量 178 项测试通过，零失败／跳过；其中 [run-control.test.ts](../../../../src/run-control.test.ts) 新增十八项，`npm run test:resilience` 可独立重跑。覆盖传输重试计数、actual/estimated 结算、token 零请求拒绝及服务端超额、部分流与协议／认证不重试、动作不重放、退避取消、批准总时限、started 窗口取消、runtime 委派共享预算、SDK 真实适配器与故障 fetch、实际会话摘要耗尽、真实 readline 输入／批准／ask_user 取消、轨迹白名单／写失败及会话恢复。\n\n同次全量测试包含实际 Windows Git Bash 子孙进程清理与固定运费任务修复回归。故障注入通过不代表已调用真实模型服务；阶段 14 的真实模型及 Ctrl+C 人工验收由学习者执行，步骤见[内部评测记录](../../../learning/evaluation.md#阶段-14-人工验收)。\n","sections":[{"heading":"Problem","body":"主轮与摘要原先共享局部次数，委派另有六次额度，SDK 禁用重试。一次委派或网络失败的成本不能反映在主轮总额中；只有单次请求及命令超时，批准等待没有总截止时间。普通终端文本也难以关联同一用户轮的摘要、子任务、失败尝试和 token 消耗。","anchor":"section-0"},{"heading":"Decision","body":"[run-control.ts](../../../../src/run-control.ts) 为每个真实用户轮建立 RunControl；[session-runner.ts](../../../../src/session-runner.ts) 在初始检查点保存前创建并在 finally 释放。CLI 生命周期信号连接本轮控制器，轮内总时限使用单调时钟并包含批准、摘要、委派、退避、工具和检查点等待。等待下一条用户输入不占轮预算。外部取消为 cancelled，总时限为 budget_exhausted；单请求超时在有限重试后为 failed。取消或超时都不撤销副作用，清理及可靠保存可在截止后继续完成。\n\n每次实际传输之前预留一次请求与“输入估算 + 输出上限”，包括失败尝试、摘要、子任务及重试。正常报告的有效 usage 替换本次预留值；缺少或非法 usage 保留估算并单独计数，失败请求也不记零。实际 usage 超总额时停止后续动作。默认全轮 24 次、200000 tokens、600000ms；主／摘要局部十次、子任务局部六次继续限制逻辑请求，不包含同一逻辑请求的传输重试。子任务最终总结仍须取得总预算。摘要开始前需要至少两次剩余额度；后续重试可能耗尽余量，不能额外借出回答额度。\n\n重试只有 RunCon 较少且统计简单，但漏掉失败尝试和无 usage 请求，预算耗尽后才发现成本；采用发送前预留、返回后结算，接受估算偏保守。\n- 用 JSONL 同时做恢复事件源：可以统一审计与恢复，但需要新重放协议和事件迁移；已有快照明确动作窗口，继续以快照恢复、轨迹作可丢诊断副本。\n- 完整记录请求与结果后用正则脱敏：调试上下文最丰富，但密钥和私有内容形态不可枚举；采用白名单元数据，接受必须结合本地快照才能调查正文细节。","consequences":"同一用户轮的主／子／摘要／重试有统一可观察账目，批准、模型和命令等待有共同停止信号。代价是故障请求按完整预留估算可能较早停止，轨迹使用同步短行写入增加少量 I/O，且元数据不能复原对话。\n\n输入估算并非供应商 tokenizer；usage 缺失、服务端忽略输出限制或计量延迟时不承诺精确费用硬上限。取消是协作式的，不能抢占阻塞 JavaScript 的同步计算或任意不遵守信号的工具；截止后会在下一个调度边界停止，命令树清理继续沿用已验证的平台边界。JSONL 不做 fsync，也不作为断电保证；本阶段不增加轨迹轮转和跨进程执行。","outLinks":["implemented/architecture/2026-09-05-bounded-conversation-context.md","implemented/architecture/2026-09-21-atomic-session-storage.md","implemented/feature/2026-09-19-isolated-readonly-subagent.md"]},{"id":"implemented/process/2026-09-22-cli-delivery.md","sourcePath":"implemented/process/2026-09-22-cli-delivery.md","slug":"2026-09-22-cli-delivery","lifecycle":"implemented","cls":"process","date":"2026-09-22","title":"用编译产物与明确 CLI 契约交付本地 Agent","status":"implemented","rawBody":"# Agent Note: 用编译产物与明确 CLI 契约交付本地 Agent\n\nStatus: implemented\n\n## Problem\n\n只有 tsx 开发入口时，使用者需要源码及开发依赖；参数错误和用户取消也没有稳定退出码。关闭 stdin 后 readline 的未完成询问可能让 Node 退出而没有执行会话 finally，留下锁。交付需要在没有维护者 .env、node_modules 和学习记录的目录证明可安装、可诊断与可恢复。\n\n## Decision\n\n[cli.ts](../../../../src/cli.ts)集中解析互斥命令，支持帮助、版本、会话列表、UUID 恢复与 doctor；未知参数、缺参和组合冲突返回 2，不回显任意参数。帮助与列表在加载模型配置前处理，不创建会话。版本读取同包 package.json，不另维护版本号。\n\n[agent.ts](../../../../src/agent.ts)与独立 doctor 入口复用诊断函数；统一入口的取消信号同时贯穿 shell 探针和在线模型流。进程正常退出为 0，启动／诊断／存储错误为 1，用户取消为 130。REPL 允许失败任务后继续新指令，所以任务是否成功仍由每轮状态决定；进程退出码不聚合历史任务结果。\n\n[ui.ts](../../../../src/ui.ts)把输入流关闭转成 InputClosedError，让 REPL 退出经过 finally 释放会话锁。执行中的批准／提问若失去输入仍沿用工具失败和动作记录语义，不把 EOF 当作同意。\n\n[构建脚本](../../../../scripts/build.mjs)先校验并清理本项目 dist，再以 TypeScript 编译运行时模块；排除测试、测试辅助与阶段 0 演示。目标 ES2022，Node 22+；[bin 入口](../../../../bin/mini-agent.mjs)直接运行 JavaScript，生产环境无需 tsx。npm files 白名单只交付运行代码、使用说明与配置模板，prepack 确保普通 npm pack 前构建。保持 private，不发布 npm、不改已有版本标签。\n\n工具始终以调用时 cwd 为项目，读取该目录 .env，保存该目录 .mini-agent；安装目录不成为用户项目。Windows 要求显式 Git Bash 路径，POSIX 默认 /bin/sh。配置模板避免把维护者的本机路径设成跨平台默认值。\n\n公开 README 只说明产品能力、安装、配置、使用及真实边界；开发检查和贡献方式归 CONTRIBUTING，阶段验收与学习证据集中在 `.agents/learning/evaluation.md`。发行包不包含内部记录。GitHub Release 分发带版本的 tarball 与 SHA-256 校验文件；本地验证后 push，对应提交的 Windows／Ubuntu CI 通过才发布，保留 private 防止误发 npm registry。\n\n## Alternatives considered\n\n- bin 直接调用 tsx 源码：无需构建，但使用者必须安装 TypeScript 执行器；编译产物让开发工具只留在开发依赖中，接受维护构建配置的成本。\n- 将全部依赖打成单文件或原生可执行文件：部署文件较少，但会引入打包器、依赖兼容与平台二进制维护；当前用户已有 Node，保留标准 npm 包。\n- 根据最后一轮结果决定 REPL 退出码：方便部分自动化，却无法代表多轮会话中所有任务；当前明确区分进程结束和任务结果，批处理模式如有需要另行定义。\n- 把产品用法、教学交接和人工场景都放在 README：资料入口单一，但普通使用者会被内部阶段和待办打断；按使用者、贡献者和项目内部记录分开，接受维护文档链接的成本。\n\n## Consequences\n\n同一入口可从源码开发、编译后运行或本地 tarball 安装，帮助和错误码有稳定契约。代价是源码修改后需重建；npm 包不包含开发评测夹具及学习笔记，完整开发和评测仍应克隆仓库。发行包 README 中开发资料链接面向源码仓库。\n\nEOF 测试保护锁释放，但管道批量发送多行不是受支持的任务队列接口。正常交互退出和每轮 completed 也不能代替文件级任务验收。\n\n## Verification\n\n验证入口为 [CLI 子进程测试](../../../../src/cli.test.ts)和[干净安装检查](../../../../scripts/verify-delivery.mjs)。实际运行结果及人工验收边界统一记录在 [内部评测记录](../../../learning/evaluation.md)，不把配置模拟或打包成功写成真实模型评测通过。\n","sections":[{"heading":"Problem","body":"只有 tsx 开发入口时，使用者需要源码及开发依赖；参数错误和用户取消也没有稳定退出码。关闭 stdin 后 readline 的未完成询问可能让 Node 退出而没有执行会话 finally，留下锁。交付需要在没有维护者 .env、node_modules 和学习记录的目录证明可安装、可诊断与可恢复。","anchor":"section-0"},{"heading":"Decision","body":"[cli.ts](../../../../src/cli.ts)集中解析互斥命令，支持帮助、版本、会话列表、UUID 恢复与 doctor；未知参数、缺参和组合冲突返回 2，不回显任意参数。帮助与列表在加载模型配置前处理，不创建会话。版本读取同包 package.json，不另维护版本号。\n\n[agent.ts](../../../../src/agent.ts)与独立 doctor 入口复用诊断函数；统一入口的取消信号同时贯穿 shell 探针和在线模型流。进程正常退出为 0，启动／诊断／存储错误为 1，用户取消为 130。REPL 允许失败任务后继续新指令，所以任务是否成功仍由每轮状态决定；进程退出码不聚合历史任务结果。\n\n[ui.ts](../../../../src/ui.ts)把输入流关闭转成 InputClosedError，让 REPL 退出经过 finally 释放会话锁。执行中的批准／提问若失去输入仍沿用工具失败和动作记录语义，不把 EOF 当作同意。\n\n[构建脚本](../../../../scripts/build.mjs)先校验并清理本项目 dist，再以 TypeScript 编译运行时模块；排除测试、测试辅助与阶段 0 演示。目标 ES2022，Node 22+；[bin 入口](../../../../bin/mini-agent.mjs)直接运行 JavaScript，生产环境无需 tsx。npm files 白名单只交付运行代码、使用说明与配置模板，prepack 确保普通 npm pack  `wx` 排他创建 session.lock，记录 PID 与时间。锁由文件存在与否表达，文件句柄关闭不等于释放；返回的释放函数只执行一次，避免旧释放函数删掉新持有者的锁。打开期间持有，正常关闭后删除；遗留锁保守拒绝，不按 PID 或锁龄自动抢占。\n\n源码入口通过[完善版路线](../../proposed/architecture/2026-09-20-practical-mini-agent-v1.md)关联本决定。[agent.ts](../../../../src/agent.ts) 已通过会话入口使用本模块；会话 todo 与[异常保留规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)共同使用快照。\n\n## Session ownership\n\n[session.ts](../../../../src/session.ts) 在真实项目根目录的 `.mini-agent/sessions/\u003cUUID>/` 新建与打开会话。目录 ID、快照 ID 与规范化项目根必须匹配；复制到其他项目的快照不能直接打开。新建不合并已存在的会话目录，打开不存在的会话也不创建空目录。\n\n会话句柄持有状态与锁；snapshot 返回深副本，update 在独立草稿上执行回调、校验身份与结构、保存，成功后发布内存状态。回调可等待完成，但用途限于修改草稿，不构成外部副作用事务。busy 标记拒绝重叠更新及保存中关闭；close 后禁止继续更新。\n\n[session-schema.ts](../../../../src/session-schema.ts) 的版本 3 保存文本与 function calling 消息、startsTurn、会话 todo、带 turnId 的轮结果与动作记录，以及独立的 summary。schema 校验轮边界、动作归属及工具结果配对；todo 编号唯一且小于 nextId。可选消息字段在解析出口省略 undefined，以满足 exactOptionalPropertyTypes。\n\nsummary 为 null 或覆盖上界、原文指纹与正文；只能覆盖已结束的完整旧轮，边界须对齐已有下一轮，SHA-256 必须匹配相应原始消息前缀。摘要保存不覆盖消息、动作和 todo，来源变化时拒绝旧摘要。具体策略见[上下文压缩](2026-09-05-bounded-conversation-context.md)。版本 2 有完整动作证据且仅缺摘要字段，读取时补 summary=null 并升级内存版本为 3，列表／打开不回写，下次正常原子保存才写 v3。版本 1 缺少动作证据及未知版本继续拒绝加载并保留原文件。\n\n列表只读已提交快照，逐条返回正常摘要或错误，不获取写锁或自动移动文件。旧项目 todo 保留并提示存在，不被新会话继承；当前 todo 工具由会话句柄工厂创建，与主循环使用同一状态所有者。\n\n[session-runner.ts](../../../../src/session-runner.ts) 在模型请求前保存用户输入，等待每个检查点提交消息、动作及轮结果；更新使用最新草稿，保留工具刚提交的 todo。恢复将 pending 补为 not_executed、started 补为 uncertain，并追加有标签的恢复说明、将中断轮标为 failed。恢复不请求模型、不重放工具，CLI 等待用户新指令。完整历史持久化，裁剪只作用于模型视图；历史中存在不确定动作时另加核查提示。\n\n## Alternatives considered\n\n- 直接覆盖 JSON：步骤少，适合早期教学，但部分写入可能破坏唯一快照。同目录临时文件保留提交前的旧版本，代价是额外写入、同步与清理。\n- 先删除旧快照再重命名：避免处理替换语义，但删除后失败会丢失唯一可用版本，因此不采用。\n- 自动根据 PID 或时间抢占锁：恢复操作方便，但 PID 复用、进程检查权限和长任务会导致误判；当前先要求核查原进程，接受人工清理遗留锁的成本。\n- SQLite：事务与并发控制更完整，但现有目标是单写入者、可检查的本地快照；尚不需要查询或多会话事务，引入另一存储系统不能解决外部工具副作用与快照之间的事务缺口。\n- 暴露可变内存对象或先发布内存：调用代码短，但容易绕过保存或在保存失败后使用未提交状态；句柄采用深副本和草稿，接受复制完整历史的成本。\n- 自动移动损坏文件：目录更整洁，但只列出会话也会修改文件位置并增加锁与移动失败边界；当前逐条报告错误并保留原文件。\n- 只在轮末保存或自动重放未完成调用：前者丢失轮中副作用证据，后者可能重复执行；采用执行前后等待检查点及保守恢复，接受额外 IO 和人工核查成本。\n- 拒绝所有旧版本：代码最简单，但 v2 的消息和动作证据完整，补空摘要无需猜测；采用只读兼容迁移，代价是 schema 同时负责这一条有限的输入迁移。旧程序不能读取新写入的 v3，不支持双向降级。\n\n## Consequences\n\n读取错误与无文件明确分开，提交前故障不会直接改写旧快照；锁阻止遵循协议的第二个写入者。代价是每次保存需要额外 IO，进程崩溃可能遗留锁及临时文件。外部程序直接改文件不受该锁约束。\n\n文件内容同步不等于断电持久性保证：当前未做目录同步或断电故障实验。原子替换也不把 shell、文件修改和会话保存合成事务。项目绑定、会话身份及坏条目隔离由数据层负责；动作不确定状态由恢复入口展示并要求核查，不能保证外部命令恰好执行一次。出现多写入者或更强断电保证的实际需求时重新评估协议。\n\n## Verification\n\n2026-09-21，学习者接入模块与八项常驻测试，并提供类型检查及全量七十七项测试通过的记录。AI review 后独立运行 `npm run typecheck` 和 `npm test`，均通过，七十七项零失败。\n\n[session-storage.test.ts](../../../../src/session-storage.test.ts) 覆盖缺失、替换读回、损坏 JSON、未知版本、无效新状态、替换前故障、读取目录错误及锁竞争与释放。故障测试在替换入口抛错；锁竞争为同一进程发起的两次排他创建，不是多进程强杀、断电或完整恢复流程的验证。\n\n随后学习者接入基础会话 schema、句柄和 [session.test.ts](../../../../src/session.test.ts) 的九项测试。学习者与 AI 分别运行类型检查和八十六项全量回归，均通过。新增证据包括独立会话、重开、状态副本、无效更新、跨项目拒绝、坏文件隔离、非法 ID、并发保存与关闭及锁释放，不包含真实模型或工具中断恢复。\n\n同日学习者完成 CLI 接线，提供类型检查、103 项全量测试通过记录。[session-runner.test.ts](../../../../src/session-runner.test.ts) 覆盖离线列表、恢复等待、todo 保存、执行前后保存失败、配对校验、视图裁剪，以及受控子进程写文件后 process.exit、遗留锁拒绝、确认退出后清锁恢复不重放。真实模型记录证明添加待办、正常退出、列表、恢复 6 条消息与 1 项待办、新指令下列出原待办并完成；不证明断电、强杀或全链路取消。AI 本次只核对接线和学习者日志，未重跑这些验收。\n\n阶段 12 摘要接入后，AI 实际运行类型检查与全量 140 项测试通过。新增摘要测试验证 v2 读取／列表不改原文件、下一次更新写 v3、v1／未知版本拒绝，以及摘要落盘恢复、无效覆盖范围与指纹拒绝、保存失败不发布候选；旧存储和生命周期回归仍通过。\n","sections":[{"heading":"Problem","body":"直接覆盖 JSON 在部分写入失败时可能破坏上一份状态。把读取错误统一回退为空状态，会让损坏会话在后续保存时被覆盖；两个进程各自写入也可能相互丢失更新。阶段 11 需要先建立可验证的存储边界，再接入具体会话格式和主循环。","anchor":"section-0"},{"heading":"Decision","body":"[session-storage.ts](../../../../src/session-storage.ts) 提供接收 JSON 数据 Zod schema 的读取与保存函数，以及独立的会话锁。`readSnapshot` 仅在 `ENOENT` 时返回 null；JSON 解析错误、schema 不符和其他读取错误继续报错，保留原文件。上层必须先获取锁、读取校验，成功打开或确认缺失后才能保存；写函数不自行判断是否允许覆盖一个既有会话。\n\n`writeSnapshot` 先校验、序列化，再在目标同目录以 `wx` 创建唯一临时文件，写入、同步、关闭后通过 rename 替换目标；不先删除旧文件。失败时清理本次临时文件，替换入口提供窄注入用于模拟提交前失败。调用方必须顺序等待保存，锁本身不串行化同一进程中的调用。\n\n`acquireSessionLock` 以 `wx` 排他创建 session.lock，记录 PID 与时间。锁由文件存在与否表达，文件句柄关闭不等于释放；返回的释放函数只执行一次，避免旧释放函数删掉新持有者的锁。打开期间持有，正常关闭后删除；遗留锁保守拒绝，不按 PID 或锁龄自动抢占。\n\n源码入口通过[完善版路线](../../proposed/architecture/2026-09-20-practical-mini-agent-v1.md)关联本决定。[agent.ts](../../../../src/agent.ts) 已通过会话入口使用本模块；会话 todo 与[异常保留规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)共同使用快照。","anchor":"section-1"},{"heading":"Session ownership","body":"[session.ts](../../../../src/session.ts) 在真实项目根目录的 `.mini-agent/sessions/\u003cUUID>/` 新建与打开会话。目录 ID、快照 ID 与规范化项目根必须匹配；复制到其他项目的快照不能直接打开。新建不合并已存在的会话目录，打开不存在的会话也不创建空目录。\n\n会话句柄持有状态与锁；snapshot 返回深副本，update 在独立草稿上执行回调、校验身份与结构、保存，成功后发布内存状态。回调可等待完成，但用途限于修改草稿，不构成外部副作用事务。busy 标记拒绝重叠更新及保存中关闭；close 后禁止继续更新。\n\n[session-schema.ts](../../../../src/session-schema.ts) 的版本 3 保存文本与 function calling 消息、startsTurn、会话 todo、带 turnId 的轮结果与动作记录，以及独立的 summary。schema 校验轮边界、动作归属及工具结果配对；todo 编号唯一且小于 nextId。可选消息字段在解析出口省略 undefined，以满足 exactOptionalPropertyTypes。\n\nsummary 为 null 或覆盖上界、原文指纹与正文；只能覆盖已结束的完整旧轮，边界须对齐已有下一轮，SHA-256 必须匹配相应原始消息前缀。摘要保存不覆盖消息、动作和 todo，来源变化时拒绝旧摘要。具体策略见[上下文压缩](2026-09-05-bounded-conversation-context.md)。版本 2 有完整动作证据且仅缺摘要字段，读取时补 summary=null 并升级内存版本为 3，列表／打开不回写，下次正常原子保存才写 v3。版本 1 缺少动作证据及未知版本继续拒绝加载并保留原文件。\n\n列表只读已提交快照，逐条返回正常摘要或错误，不获取写锁或自动移动文件。旧项目 todo 保留并提示存在，不被新会话继承；当前 todo 工具由会话句柄工厂创建，与主循环使用同一状态所有者。\n\n[session-runner.ts](../../../../src/session-runner.ts) 在模型请求前保存用户输入，等待每个检查点提交消息、动作及轮结果；更新使用最新草稿，保留工具刚提交的 todo。恢复将 pending 补为 not_executed、started 补为 uncertain，并追加有标签的恢复说明、将中断轮标为 failed。恢复不请求模型、不重放工具，CLI 等待用户新指令。完整历史持久化，裁剪只作用于模型视图；历史中存在不确定动作时另加核查提示。","anchor":"section-2"},{"heading":"Alternatives considered","body":"- 直接覆盖 JSON：步骤少，适合早期教学，但部分写入可能破坏唯一快照。同目录临时文件保留提交前的旧版本，代价是额外写入、同步与清理。\n- 先删除旧快照再重命名：避免处理替换语义，但删除后失败会丢失唯一可用版本，因此不采用。\n- 自动根据 PID 或时间抢占锁：恢复操作方便，但 PID 复用、进程检查权限和长任务会导致误判；当前先要求核查原进程，接受人工清理遗留锁的成本。\n- SQLite：事务与并发控制更完整，但现有目标是单写入者、可检查的本地快照；尚不需要查询或多会话事务，引入另一存储系统不能解决外部工具副作用与快照之间的事务缺口。\n- 暴露可变内存对象或先发布内存：调用代码短，但容易绕过保存或在保存失败后使用未提交状态；句柄采用深副本和草稿，接受复制完整历史的成本。\n- 自动移动损坏文件：目录更整洁，但只列出会话也会修改文件位置并增加锁与移动失败边界；当前逐条报告错误并保留原文件。\n- 只在轮末保存或自动重放未完成调用：前者丢失轮中副作用证据，后者可能重复执行；采用执行前后等待检查点及保守恢复，接受额外 IO 或锁龄自动抢占。\n\n源码入口通过[完善版路线](../../proposed/architecture/2026-09-20-practical-mini-agent-v1.md)关联本决定。[agent.ts](../../../../src/agent.ts) 已通过会话入口使用本模块；会话 todo 与[异常保留规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)共同使用快照。","alternatives":"- 直接覆盖 JSON：步骤少，适合早期教学，但部分写入可能破坏唯一快照。同目录临时文件保留提交前的旧版本，代价是额外写入、同步与清理。\n- 先删除旧快照再重命名：避免处理替换语义，但删除后失败会丢失唯一可用版本，因此不采用。\n- 自动根据 PID 或时间抢占锁：恢复操作方便，但 PID 复用、进程检查权限和长任务会导致误判；当前先要求核查原进程，接受人工清理遗留锁的成本。\n- SQLite：事务与并发控制更完整，但现有目标是单写入者、可检查的本地快照；尚不需要查询或多会话事务，引入另一存储系统不能解决外部工具副作用与快照之间的事务缺口。\n- 暴露可变内存对象或先发布内存：调用代码短，但容易绕过保存或在保存失败后使用未提交状态；句柄采用深副本和草稿，接受复制完整历史的成本。\n- 自动移动损坏文件：目录更整洁，但只列出会话也会修改文件位置并增加锁与移动失败边界；当前逐条报告错误并保留原文件。\n- 只在轮末保存或自动重放未完成调用：前者丢失轮中副作用证据，后者可能重复执行；采用执行前后等待检查点及保守恢复，接受额外 IO 和人工核查成本。\n- 拒绝所有旧版本：代码最简单，但 v2 的消息和动作证据完整，补空摘要无需猜测；采用只读兼容迁移，代价是 schema 同时负责这一条有限的输入迁移。旧程序不能读取新写入的 v3，不支持双向降级。","consequences":"读取错误与无文件明确分开，提交前故障不会直接改写旧快照；锁阻止遵循协议的第二个写入者。代价是每次保存需要额外 IO，进程崩溃可能遗留锁及临时文件。外部程序直接改文件不受该锁约束。\n\n文件内容同步不等于断电持久性保证：当前未做目录同步或断电故障实验。原子替换也不把 shell、文件修改和会话保存合成事务。项目绑定、会话身份及坏条目隔离由数据层负责；动作不确定状态由恢复入口展示并要求核查，不能保证外部命令恰好执行一次。出现多写入者或更强断电保证的实际需求时重新评估协议。","outLinks":["implemented/architecture/2026-09-05-bounded-conversation-context.md","implemented/bug-fix/2026-09-06-tool-result-history-recovery.md","proposed/architecture/2026-09-20-practical-mini-agent-v1.md"]},{"id":"implemented/architecture/2026-09-21-validated-runtime-config.md","sourcePath":"implemented/architecture/2026-09-21-validated-runtime-config.md","slug":"2026-09-21-validated-runtime-config","lifecycle":"implemented","cls":"architecture","date":"2026-09-21","title":"纯配置解析与启动诊断分层","status":"implemented","rawBody":"# Agent Note: 纯配置解析与启动诊断分层\n\nStatus: implemented\n\n## Problem\n\n原先模型配置在 `src/llm.ts` 导入时读取环境并校验，模型名、shell 和请求次数分别固定在多个模块中，文件读取工具另行解析环境变量。配置错误缺少统一出口；将这些读取直接搬进一个全局对象，又会使只导入业务模块的测试依赖真实环境。\n\n这是[完善版 v1 路线](../../proposed/architecture/2026-09-20-practical-mini-agent-v1.md)阶段 10 的配置边界。配置、运行接线、doctor 与启动失败诊断均已接入，具有模拟回归和真实模型证据。相关职责见[本地 CLI 与 SDK](2026-08-30-local-cli-and-sdk.md)和[可测试主轮执行器](2026-09-20-testable-turn-runner.md)。\n\n## Decision\n\n纯函数 `loadConfig(env, platform)` 只校验显式输入，返回只读的 `AppConfig`。模块导入与函数执行均不读 `.env`、不访问磁盘、不发模型请求。环境加载由启动入口负责，业务模块接收已校验配置；doctor 复用同一解析器，再检查 shell 与兼容 API 的实际可用性。\n\n学习者已接入 [config.ts](../../../../src/config.ts)、[runtime.ts](../../../../src/runtime.ts)、[doctor.ts](../../../../src/doctor.ts) 与相应测试。已校验配置进入模型、主／子 Agent 注册表、读取与命令工具，doctor 的离线及在线探针均有通过记录。\n\n- API key、base URL 和模型名必填。保留兼容 API 的自定义路径，不猜测或自动补 `/v1`；URL 只接受 HTTP(S)，不接受认证信息、查询参数或片段。格式合法不证明协议端点可用。\n- Windows 显式填写绝对 shell 路径，不沿用开发者机器上的 Git 安装位置；其他系统缺省 `/bin/sh`。解析器不检查文件存在，doctor 再做可用性诊断。\n- 请求超时缺省 120000 毫秒，命令超时 30000 毫秒；超时不能超过 Node 定时器范围。主请求和子 Agent 局部次数缺省 10 与 6；文件读取缺省 5 MiB，沿用 `MINI_AGENT_MAX_READ_MB` 并换算成字节。\n- 未提供的可选项使用默认值；非法次数、超时及预算关系报告错误，不静默回退。上下文窗口缺省 32768、输出预留 4096、安全余量 1024；窗口必须大于另外两者之和，安全余量允许零。这些是可覆盖的本地预算，不是自动识别模型能力。整轮共享次数、时间、token 及重试配置现由[运行控制器](2026-09-22-runtime-resilience.md)消费，默认值和执行语义归该笔记。\n- 输出参数缺省 max_completion_tokens，可显式选择兼容服务使用的 max_tokens；适配器始终写入生成上限，不自动切换参数或移除限制。具体请求预算行为见[上下文预算](2026-09-05-bounded-conversation-context.md)。\n- 报错只包含固定环境变量名，不直接抛出可能携带输入值的校验错误。成功返回的配置仍包含密钥，不能整体打印或写入轨迹；doctor 只输出固定诊断分类。\n- `AppConfig` 从函数返回类型推导，避免手写类型与实际解析结果漂移。顶层配置及嵌套 contextBudget 均冻结，不承担生命周期或工具状态存储。\n\n### Startup wiring and doctor\n\n`createRuntime(config)` 组装模型流工厂、带读取上限的文件工具、带 shell／超时的命令工具，以及主／子 Agent 的注册表、局部请求上限和上下文预算。主／子循环必须接收模型入口、注册表、次数与 contextBudget，不再动态加载环境配置。委派工具只接收 runner，由组装入口负责连接子 Agent，避免工具集合与循环互相建立隐式配置依赖。\n\n仅 CLI 入口加载 `.env` 并调用解析器；`llm.ts` 为显式配置工厂。模型请求关闭 SDK 隐式重试，并用覆盖整个流消费过程的超时信号限制等待；阶段 14 的运行控制器统一总预算、有限重试及贯穿主／子／摘要的取消，单请求超时仍是独立且较小的请求边界。\n\ndoctor 分为可导入的检查函数与独立 CLI。默认只做配置及 POSIX shell 非交互探针，明确显示模型检查被跳过；`--online` 才发起一次真实流式请求。在线探针要求返回指定函数及参数，由现有流组装器检查完整性，不执行任何模型工具。诊断只打印固定分类信息，不打印密钥、完整配置、模型文本或服务端原始错误正文。\n\n当前 shell 接入范围为 Windows Git Bash 与 Linux sh/bash；配置绝对路径并不意味着任意 shell 方言都受支持。阶段 10 的简单 shell 探针不证明完整子进程树清理，后者仍在阶段 13 验收。\n\n## Alternatives considered\n\n- 模块导入时建立全局配置：使用方便且只解析一次，但会把环境依赖传给业务模块和测试，并且 doctor 难以控制启动失败的展示；采用纯解析函数，由入口控制何时校验与注入。\n- 配置错误时尽量沿用默认值：启动更宽容，但拼错预算或超时会静默改变实际行为；只有未提供的可选字段采用默认值，显式非法值直接报错。\n- 解析时自动探测 shell 和 API：可以一次得到最终可用配置，但会使每个配置测试依赖机器、网络及密钥；分成纯解析和 doctor 探测两层，接受格式通过后仍可能诊断失败。\n- 保留全局注册表并在启动时修改其中的工具配置：改动位置较少，但容易让 schema、实际执行与子 Agent 使用不同配置；用启动工厂显式构建集合，代价是现有循环测试需要传入依赖。\n- doctor 默认发起模型请求：一次命令能覆盖更多问题，但每次本地排错都会依赖网络并可能计费；默认离线并明确 SKIP，在线检查通过 `--online` 选择。\n\n## Tested boundaries\n\n- 不需要真实 API 环境即可导入模块，用输入对象检查默认值、覆盖与单位换算。\n- 缺失模型字段、Windows 未配置 shell、非法数值和不允许的 URL 均被拒绝；错误不包含原始输入值。\n- 自定义 base URL 路径保持，shell 存在性不在纯解析器中检查；输出只读且不修改输入对象。\n- CLI 和 doctor 复用解析器，业务导入不引发环境读取或网络访问；运行组装由常驻模拟回归和真实 doctor／REPL 记录验证。\n- CLI 启动缺少必填项时，报告字段名且以非零状态退出；ConfigError 必须由覆盖配置加载的外层 catch 处理，不能仅放在 runTurn 的内层 catch。\n\n## Consequences\n\n集中配置与显式组装使主／子 Agent 使用一致配置，启动错误、网络探针和纯函数测试各有可观察边界。代价是调用方必须提供完整依赖，模型名和 Windows shell 也需要首次显式配置。纯函数通过仅证明配置结构符合约定，服务兼容性仍依赖 doctor；全轮取消和共享总预算由运行控制器实施，不能仅从配置解析通过推断执行正确。\n\n## Verification\n\n阶段 12 请求预算接线后，学习者提供类型检查及全量 120 项测试通过记录；[context-wiring.test.ts](../../../../src/context-wiring.test.ts) 验证新配置关系、runtime 传递与 SDK 实际请求体的输出参数。真实计算请求得到 391 后完成，服务未拒绝该次请求；短输出不证明服务端严格执行生成上限。本轮 AI 静态核对源码，未重新运行相同源码检查或模型请求。\n\n2026-09-21，AI 在临时目录用项目 TypeScript 配置验证候选模块，并执行七项配置测试，全部通过。测试使用虚构密钥与域名，没有读取真实 `.env` 或发起模型请求。候选文件随后清理；这不是学习者已接入源码、真实启动成功或已掌握配置边界的证据。\n\n随后学习者接入纯配置模块并提供 `npm run typecheck` 通过、全量五十九项测试通过的记录，AI 静态 review 未发现阻塞问题。AI 另在临时源码副本中验证启动接线与 doctor 候选：类型检查通过，五十九项原有回归和九项新增验证分别通过。新增覆盖请求配置、探针协议、错误脱敏、关闭重试、响应头之后的流停滞超时、工具配置消费、委派注入和离线 CLI 的失败退出。临时副本清理；真实 API、用户本机 shell 和学习者接线尚待验证。\n\n随后学习者完成启动接线并提供类型检查、六十八项测试、离线 doctor 和在线探针通过的记录。真实普通请求计算 17 × 23 得到 391 后完成；真实只读委派读取 config.ts，子 Agent 两次请求后返回职责说明，主 Agent 总结并完成。AI 在当前源码重新运行类型检查和六十八项测试，均通过。\n\n本次静态 review 发现 ConfigError 分支误放在 agent.ts 的内层 catch。用虚构配置和空模型名运行真实入口，复现退出 1 但只有通用启动失败提示。临时候选将分支移至外层后，同一检查报告 OPENAI_MODEL、不启动 REPL、不回显密钥。候选已清理，核心源码留给学习者修正；六十八项现有回归尚未覆盖此启动错误场景。\n\n随后学习者将 ConfigError 处理移至外层，并将真实启动缺配置场景加入 runtime.test.ts。学习者提供类型检查和六十九项测试通过、夹具三条自检通过的记录；AI 提交前重新运行类型检查及六十九项测试，全部通过。此前六十八项回归的缺口已由新增用例覆盖，不再列为待完成。\n","sections":[{"heading":"Problem","body":"原先模型配置在 `src/llm.ts` 导入时读取环境并校验，模型名、shell 和请求次数分别固定在多个模块中，文件读取工具另行解析环境变量。配置错误缺少统一出口；将这些读取直接搬进一个全局对象，又会使只导入业务模块的测试依赖真实环境。\n\n这是[完善版 v1 路线](../../proposed/architecture/2026-09-20-practical-mini-agent-v1.md)阶段 10 的配置边界。配置、运行接线、doctor 与启动失败诊断均已接入，具有模拟回归和真实模型证据。相关职责见[本地 CLI 与 SDK](2026-08-30-local-cli-and-sdk.md)和[可测试主轮执行器](2026-09-20-testable-turn-runner.md)。","anchor":"section-0"},{"heading":"Decision","body":"纯函数 `loadConfig(env, platform)` 只校验显式输入，返回只读的 `AppConfig`。模块导入与函数执行均不读 `.env`、不访问磁盘、不发模型请求。环境加载由启动入口负责，业务模块接收已校验配置；doctor 复用同一解析器，再检查 shell 与兼容 API 的实际可用性。\n\n学习者已接入 [config.ts](../../../../src/config.ts)、[runtime.ts](../../../../src/runtime.ts)、[doctor.ts](../../../../src/doctor.ts) 与相应测试。已校验配置进入模型、主／子 Agent 注册表、读取与命令工具，doctor 的离线及在线探针均有通过记录。\n\n- API key、base URL 和模型名必填。保留兼容 API 的自定义路径，不猜测或自动补 `/v1`；URL 只接受 HTTP(S)，不接受认证信息、查询参数或片段。格式合法不证明协议端点可用。\n- Windows 显式填写绝对 shell 路径，不沿用开发者机器上的 Git 安装位置；其他系统缺省 `/bin/sh`。解析器不检查文件存在，doctor 再做可用性诊断。\n- 请求超时缺省 120000 毫秒，命令超时 30000 毫秒；超时不能超过 Node 定时器范围。主请求和子 Agent 局部次数缺省 10 与 6；文件读取缺省 5 MiB，沿用 `MINI_AGENT_MAX_READ_MB` 并换算成字节。\n- 未提供的可选项使用默认值；非法次数、超时及预算关系报告错误，不静默回退。上下文窗口缺省 32768、输出预留 4096、安全余量 1024；窗口必须大于另外两者之和，安全余量允许零。这些是可覆盖的本地预算，不是自动识别模型能力。整轮共享次数、时间、token 及重试配置现由[运行控制器](2026-09-22-runtime-resilience.md)消费，默认值和执行语义归该笔记。\n- 输出参数缺省 max_completion_tokens，可显式选择兼容服务使用的 max_tokens；适配器始终写入生成上限，不自动切换参数或移除限制。具体请求预算行为见[上下文预算](2026-09-05-bounded-conversation-context.md)。\n- 报错只包含固定环境变量名，不直接抛出可能携带输入值的校验错误。成功返回的配置仍包含密钥，不能整体打印或写入轨迹；doctor 只输出固定诊断分类。\n- `AppConfig` 从函数返回类型推导，避免手写类型与实际解析结果漂移。顶层配置及嵌套 contextBudget 均冻结，不承担生命周期或工具状态存储。\n\n### Startup wiring and doctor\n\n`createRuntime(config)` 组装模型流工厂、带读取上限的文件工具、带 shell／超时的命令工具，以及主／子 Agent 的注册表、局部请求上限和上下文预算。主／子循环必须接收模型入口、注册表、次数与 contextBudget，不再动态加载环境配置。委派工具只接收 runner，由组装入口负责连接子 Agent，避免工具集合与循环互相建立隐式配置依赖。\n\n仅 CLI 入口加载 `.env` 并调用解析器；`llm.ts` 为显式配置工厂。模型请求关闭 SDK 隐式重试，并用覆盖整个流消费过程的超时信号限制等待；阶段 14 的运行控制器统一总预算、有限重试及贯穿主／子／摘要的取消，单请求超时仍是独立且较小的请求边界。\n\ndoctor 分为可导入的检查函数与独立 CLI。默认只做配置及 POSIX shell 非交互探针，明确显示模型检查被跳过；`--online` 才发起一次真实流式请求。在线探针要求返回指定函数及参数，由现有流组装器检查完整性，不执行任何模型工具。诊断只打印固定分类信息，不打印密钥、完整配置、模型文本或服务端原始错误正文。\n\n当前 shell 接入范围为 Windows Git Bash 与 Linux sh/bash；配置绝对路径并不意味着任意 shell 方言都受支持。阶段 10 的简单 shell 探针不证明完整子进程树清理，后者仍在阶段 13 验收。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 模块导入时建立全局配置：使用方便且只解析一次，但会把环境依赖传给业务模块和测试，并且 doctor 难以控制启动失败的展示；采用纯解析函数，由入口控制何时校验与注入。\n- 配置错误时尽量沿用默认值：启动更宽容，但拼错预算或超时会静默改变实际行为；只有未提供的可选字段采用默认值，显式非法值直接报错。\n- 解析时自动探测 shell 和 API：可以一次得到最终可用配置，但会使每个配置测试依赖机器、网络及密钥；分成纯解析和 doctor 探测两层，接受格式通过后仍可能诊断失败。\n- 保留全局注册表并在启动时修改其中的工具配置：改动位置较少，但容易让 schema、实际执行与子 Agent 使用不同配置；用启动工厂显式构建集合，代价是现有循环测试需要传入依赖。\n- doctor 默认发起模型请求：一次命令能覆盖更多问题，但每次本地排错都会依赖网络并可能计费；默认离线并明确 SKIP，在线检查通过 `--online` 选择。","anchor":"section-2"},{"heading":"Tested boundaries","body":"- 不需要真实 API 环境即可导入模块，用输入对象检查默认值、覆盖与单位换算。\n- 缺失模型字段、Windows 未配置 shell、非法数值和不允许的 URL 均被拒绝；错误不包含原始输入值。\n- 自定义 base URL 路径保持，shell 存在性不在纯解析器中检查；输出只读且不修改输入对象。\n- CLI 和 doctor 复用解析器，业务导入不引发环境读取或网络访问；运行组装由常驻模拟回归和真实 doctor／REPL 记录验证。\n- CLI 启动缺少必填项时，报告字段名且以非零状态退出；ConfigError 必须由覆盖配置加载的外层 catch 处理，不能仅放在 runTurn 的内层 catch。","anchor":"section-3"},{"heading":"Consequences","body":"集中配置与显式组装使主／子 Agent 使用一致配置，启动错误、网络探针和纯函数测试各有可观察边界。代价是调用方必须提供完整依赖，模型名和 Windows shell 也需要首次显式配置。纯函数通过仅证明配置结构符合约定，服务兼容性仍依赖 doctor；全轮取消和共享总预算由运行控制器实施，不能仅从配置解析通过推断执行正确。","anchor":"section-4"},{"heading":"Verification","body":"阶段 12 请求预算接线后，学习者提供类型检查及全量 120 项测试通过记录；[context-wiring.test.ts](../../../../src/context-wiring.test.ts) 验证新配置关系、runtime 传递与 SDK 实际请求体的输出参数。真实计算请求得到 391 后完成，服务未拒绝该次请求；短输出不证明服务端严格执行生成上限。本轮 AI 静态核对源码，未重新运行相同源码检查或模型请求。\n\n2026-09-21，AI 在临时目录用项目 TypeScript 配置验证候选模块，并执行七项配置测试，全部通过。测试使用虚构密钥与域名，没有读取真实 `.env` 或发起模型请求。候选文件随后清理；这不是学习者已接入源码、真实启动成功或已掌握配置边界的证据。\n\n随后学习者接入纯配置模块并提供 `npm run typecheck` 通过、全量五十九项测试通过的记录，AI 静态 review 未发现阻塞问题。AI 另在临时源码副本中验证启动接线与 doctor 候选：类型检查通过，五十九项原有回归和九项新增验证分别通过。新增覆盖请求配置、探针协议、错误脱敏、关闭重试、响应头之后的流停滞超时、工具配置消费、委派注入和离线 CLI 的失败退出。临时副本清理；真实 API、用户本机 shell 和学习者接线尚待验证。\n\n随后学习者完成启动接线并提供类型检查、六十八项测试、离线 doctor 和在线探针通过的记 生命周期或工具状态存储。\n\n### Startup wiring and doctor\n\n`createRuntime(config)` 组装模型流工厂、带读取上限的文件工具、带 shell／超时的命令工具，以及主／子 Agent 的注册表、局部请求上限和上下文预算。主／子循环必须接收模型入口、注册表、次数与 contextBudget，不再动态加载环境配置。委派工具只接收 runner，由组装入口负责连接子 Agent，避免工具集合与循环互相建立隐式配置依赖。\n\n仅 CLI 入口加载 `.env` 并调用解析器；`llm.ts` 为显式配置工厂。模型请求关闭 SDK 隐式重试，并用覆盖整个流消费过程的超时信号限制等待；阶段 14 的运行控制器统一总预算、有限重试及贯穿主／子／摘要的取消，单请求超时仍是独立且较小的请求边界。\n\ndoctor 分为可导入的检查函数与独立 CLI。默认只做配置及 POSIX shell 非交互探针，明确显示模型检查被跳过；`--online` 才发起一次真实流式请求。在线探针要求返回指定函数及参数，由现有流组装器检查完整性，不执行任何模型工具。诊断只打印固定分类信息，不打印密钥、完整配置、模型文本或服务端原始错误正文。\n\n当前 shell 接入范围为 Windows Git Bash 与 Linux sh/bash；配置绝对路径并不意味着任意 shell 方言都受支持。阶段 10 的简单 shell 探针不证明完整子进程树清理，后者仍在阶段 13 验收。","alternatives":"- 模块导入时建立全局配置：使用方便且只解析一次，但会把环境依赖传给业务模块和测试，并且 doctor 难以控制启动失败的展示；采用纯解析函数，由入口控制何时校验与注入。\n- 配置错误时尽量沿用默认值：启动更宽容，但拼错预算或超时会静默改变实际行为；只有未提供的可选字段采用默认值，显式非法值直接报错。\n- 解析时自动探测 shell 和 API：可以一次得到最终可用配置，但会使每个配置测试依赖机器、网络及密钥；分成纯解析和 doctor 探测两层，接受格式通过后仍可能诊断失败。\n- 保留全局注册表并在启动时修改其中的工具配置：改动位置较少，但容易让 schema、实际执行与子 Agent 使用不同配置；用启动工厂显式构建集合，代价是现有循环测试需要传入依赖。\n- doctor 默认发起模型请求：一次命令能覆盖更多问题，但每次本地排错都会依赖网络并可能计费；默认离线并明确 SKIP，在线检查通过 `--online` 选择。","consequences":"集中配置与显式组装使主／子 Agent 使用一致配置，启动错误、网络探针和纯函数测试各有可观察边界。代价是调用方必须提供完整依赖，模型名和 Windows shell 也需要首次显式配置。纯函数通过仅证明配置结构符合约定，服务兼容性仍依赖 doctor；全轮取消和共享总预算由运行控制器实施，不能仅从配置解析通过推断执行正确。","outLinks":["implemented/architecture/2026-08-30-local-cli-and-sdk.md","implemented/architecture/2026-09-05-bounded-conversation-context.md","implemented/architecture/2026-09-20-testable-turn-runner.md","implemented/architecture/2026-09-22-runtime-resilience.md","proposed/architecture/2026-09-20-practical-mini-agent-v1.md"]},{"id":"implemented/feature/2026-09-21-safe-incremental-editing.md","sourcePath":"implemented/feature/2026-09-21-safe-incremental-editing.md","slug":"2026-09-21-safe-incremental-editing","lifecycle":"implemented","cls":"feature","date":"2026-09-21","title":"文件候选绑定批准，提交前复查基准版本","status":"implemented","rawBody":"# Agent Note: 文件候选绑定批准，提交前复查基准版本\n\nStatus: implemented\n\n## Problem\n\n完整覆盖会丢掉未读到的内容；等待批准期间，编辑器或另一进程可能改变文件。只用工具名和参数记住批准，不能证明用户看到的修改仍适用于当前文件。旧 write_file 还能绕开新的增量编辑保护。\n\n## Decision\n\nread_file 返回整文件字节的 SHA-256，包括分页和空文件。edit_file 接受 path、expected_sha256、old_text、new_text，只允许旧文本精确且唯一匹配；重复匹配包含重叠出现，零匹配、过期指纹和无变化在批准前拒绝。支持无 NUL 的 UTF-8，编辑及新建上限 1 MiB，不自动转换换行；未修改内容、BOM、CRLF 和末尾换行保留原状。\n\n工具的异步 prepare 生成不可变 PreparedAction，闭包捕获目标、基准、候选和执行函数。主轮把同一个 action 的完整变化 diff 交给批准，再调用其 execute；不在批准后依据可变模型参数重新生成内容。批准键绑定绝对路径、基准指纹与候选指纹，文件工具禁用 a 缓存，逐次使用 y/n。预览显示全部增删行、三行上下文、末尾换行及 CR 标记；终端控制字符转为可见转义。\n\n提交先复查路径及指纹，再在同目录创建排他临时文件、写入并 sync，提交前再次复查文件指纹、身份与模式。已有文件通过 rename 原子替换；新文件通过 link 排他发布完整临时文件，再删除临时名字，避免覆盖批准后出现的同名文件。新建可以创建父目录。失败清理本次临时文件，已创建的空父目录可保留。Windows／POSIX 支持硬链接的本地文件系统是新建的使用范围；不支持时明确失败，不回退覆盖。\n\nwrite_file 只新建，已有文件必须 edit_file。两个工具都拒绝项目外、敏感路径、符号链接／junction 组件、目标硬链接和非普通文件；不存在的后缀检查已有父目录。读取和搜索沿用[共同路径边界](../bug-fix/2026-09-06-shared-read-guards.md)，shell 仍依赖批准，不是文件沙箱。\n\n准备失败记录 not_executed；批准拒绝或取消不进入执行。提交前发现通常的外部变化返回明确拒写结果，模型必须重新读取、生成 diff 和申请批准，不能退回覆盖。动作检查点及结果不确定语义沿用[会话状态](../architecture/2026-09-21-atomic-session-storage.md)。\n\n## Alternatives considered\n\n- 完整内容覆盖并展示完整 diff：生成任意重写简单，但可能把未读内容和外部修改一并覆盖，且保留了绕过精确匹配的入口。\n- 通用 unified patch 或模糊匹配：适合多处修改且能容忍上下文偏移，但会扩大解析、歧义和部分应用协议；目前单次唯一替换更容易验证，多处改动顺序读取和提交。\n- 新建直接 wx 写目标：能排他拒绝覆盖，但写入失败可能留下不完整目标；临时文件加排他 link 先生成完整内容，接受文件系统支持限制。\n- 保存批准到基于参数的通用缓存：重复操作方便，但外部环境变化会改变效果；文件变更逐次审阅，接受额外交互。\n\n## Consequences\n\n用户批准的候选与执行内容一致，常见外部编辑会被指纹检查发现；代价是额外读取、哈希、IO 和逐次批准。多文件不构成事务，原子替换不承诺断电持久性，检查到 rename 之间仍存在竞态，不能抵御恶意并发文件系统替换。需要敌对进程隔离时应使用操作系统级沙箱，而不是继续叠加字符串检查。\n\n原子替换保留普通模式位，但不承诺保留扩展属性、ACL 或文件身份。新建失败可能遗留空父目录。内容变化后又完全恢复无法由纯内容指纹识别为历史事件；这不是协作编辑版本管理器。\n\n## Verification\n\n实现入口：[edit.ts](../../../../src/tools/edit.ts)、[turn.ts](../../../../src/turn.ts)、[approval.ts](../../../../src/approval.ts)。[编辑测试](../../../../src/tools/edit.test.ts)在真实工作区临时目录覆盖分页指纹、CRLF、零／多匹配、冲突、不可变候选、排他新建、敏感路径与实际 junction、取消及主轮批准接线。\n\n[命令测试](../../../../src/command.test.ts)复用固定运费任务副本，先确认原始缺陷，再经读取、diff、受控批准、增量提交和实际 Git Bash 独立验收，要求三项业务测试及非目标文件完整性通过。模型流与批准使用确定性替身，真实模型和用户终端人工验收单独记录在学习进度中，不由这些测试推断。\n","sections":[{"heading":"Problem","body":"完整覆盖会丢掉未读到的内容；等待批准期间，编辑器或另一进程可能改变文件。只用工具名和参数记住批准，不能证明用户看到的修改仍适用于当前文件。旧 write_file 还能绕开新的增量编辑保护。","anchor":"section-0"},{"heading":"Decision","body":"read_file 返回整文件字节的 SHA-256，包括分页和空文件。edit_file 接受 path、expected_sha256、old_text、new_text，只允许旧文本精确且唯一匹配；重复匹配包含重叠出现，零匹配、过期指纹和无变化在批准前拒绝。支持无 NUL 的 UTF-8，编辑及新建上限 1 MiB，不自动转换换行；未修改内容、BOM、CRLF 和末尾换行保留原状。\n\n工具的异步 prepare 生成不可变 PreparedAction，闭包捕获目标、基准、候选和执行函数。主轮把同一个 action 的完整变化 diff 交给批准，再调用其 execute；不在批准后依据可变模型参数重新生成内容。批准键绑定绝对路径、基准指纹与候选指纹，文件工具禁用 a 缓存，逐次使用 y/n。预览显示全部增删行、三行上下文、末尾换行及 CR 标记；终端控制字符转为可见转义。\n\n提交先复查路径及指纹，再在同目录创建排他临时文件、写入并 sync，提交前再次复查文件指纹、身份与模式。已有文件通过 rename 原子替换；新文件通过 link 排他发布完整临时文件，再删除临时名字，避免覆盖批准后出现的同名文件。新建可以创建父目录。失败清理本次临时文件，已创建的空父目录可保留。Windows／POSIX 支持硬链接的本地文件系统是新建的使用范围；不支持时明确失败，不回退覆盖。\n\nwrite_file 只新建，已有文件必须 edit_file。两个工具都拒绝项目外、敏感路径、符号链接／junction 组件、目标硬链接和非普通文件；不存在的后缀检查已有父目录。读取和搜索沿用[共同路径边界](../bug-fix/2026-09-06-shared-read-guards.md)，shell 仍依赖批准，不是文件沙箱。\n\n准备失败记录 not_executed；批准拒绝或取消不进入执行。提交前发现通常的外部变化返回明确拒写结果，模型必须重新读取、生成 diff 和申请批准，不能退回覆盖。动作检查点及结果不确定语义沿用[会话状态](../architecture/2026-09-21-atomic-session-storage.md)。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 完整内容覆盖并展示完整 diff：生成任意重写简单，但可能把未读内容和外部修改一并覆盖，且保留了绕过精确匹配的入口。\n- 通用 unified patch 或模糊匹配：适合多处修改且能容忍上下文偏移，但会扩大解析、歧义和部分应用协议；目前单次唯一替换更容易验证，多处改动顺序读取和提交。\n- 新建直接 wx 写目标：能排他拒绝覆盖，但写入失败可能留下不完整目标；临时文件加排他 link 先生成完整内容，接受文件系统支持限制。\n- 保存批准到基于参数的通用缓存：重复操作方便，但外部环境变化会改变效果；文件变更逐次审阅，接受额外交互。","anchor":"section-2"},{"heading":"Consequences","body":"用户批准的候选与执行内容一致，常见外部编辑会被指纹检查发现；代价是额外读取、哈希、IO 和逐次批准。多文件不构成事务，原子替换不承诺断电持久性，检查到 rename 之间仍存在竞态，不能抵御恶意并发文件系统替换。需要敌对进程隔离时应使用操作系统级沙箱，而不是继续叠加字符串检查。\n\n原子替换保留普通模式位，但不承诺保留扩展属性、ACL 或文件身份。新建失败可能遗留空父目录。内容变化后又完全恢复无法由纯内容指纹识别为历史事件；这不是协作编辑版本管理器。","anchor":"section-3"},{"heading":"Verification","body":"实现入口：[edit.ts](../../../../src/tools/edit.ts)、[turn.ts](../../../../src/turn.ts)、[approval.ts](../../../../src/approval.ts)。[编辑测试](../../../../src/tools/ ]},{"id":"implemented/testing/2026-09-21-repeatable-fixture-and-ci.md","sourcePath":"implemented/testing/2026-09-21-repeatable-fixture-and-ci.md","slug":"2026-09-21-repeatable-fixture-and-ci","lifecycle":"implemented","cls":"testing","date":"2026-09-21","title":"用固定缺陷任务与无密钥 CI 验证交付基础","status":"implemented","rawBody":"# Agent Note: 用固定缺陷任务与无密钥 CI 验证交付基础\n\nStatus: implemented\n\n## Problem\n\n模型回复和 finish_task 只能说明 Agent 声称完成，不能证明文件正确变化或测试通过。每次临时挑一个任务也难以比较恢复、编辑与预算能力。配置接入后，已有确定性测试需要在干净环境持续运行，不应依赖维护者的密钥和兼容 API。\n\n## Decision\n\n[运费边界模板](../../../../fixtures/shipping-boundary/README.md)提供一个 TypeScript 修复任务：满 100 元免运费，原始实现错误地使用严格大于，三项业务测试中有两项通过、一项失败。任务只允许修改 `src/shipping.ts`，测试、说明和 package.json 保持原样。模板自身是预期失败基线，不加入根目录 `npm test`。\n\n[夹具脚本](../../../../scripts/eval-fixture.mjs)的 `new` 在被 Git 忽略的 `.mini-agent-eval/` 下创建全新副本，不覆盖旧任务；`check` 先比较非目标文件的 SHA-256 与文件集合，再启动真实测试进程。目标文件缺失、其他文件变化或测试失败均不能验收通过。调用 finish_task、修改测试或只输出成功文字不能改变验收结果。\n\n`selftest` 在专用临时副本核对原始缺陷、已知修复和无关文件变更三个场景；清理前核对真实路径，且仅删除该次自检创建的目录。自检证明夹具和判定机制工作，不证明模型已自主修复任务。每次重新评测都新建副本，原有结果留存。\n\n[CI 工作流](../../../../.github/workflows/ci.yml)在 Windows 与 Ubuntu、Node 22 下定义安装依赖、类型检查、核心测试、笔记校验、看板测试、夹具自检及交付安装检查，不配置密钥、不运行在线 doctor。远程 GitHub Actions 结果需实际运行后确认。\n\n[交付脚本](../../../../scripts/verify-delivery.mjs)在含空格的临时路径从源码及 lockfile 安装，编译打包，检查文件白名单后在另一目录只安装生产依赖。它实际运行 npm 可执行 shim、帮助与错误码、离线 shell 诊断、新建／EOF／恢复；不复用开发目录的 node_modules 或 .env。清理前核对真实绝对路径仅为本次临时目录。构建契约归[CLI 交付决定](../process/2026-09-22-cli-delivery.md)。\n\n`npm run verify` 顺序组合检查，任一失败停止；[内部评测记录](../../../learning/evaluation.md)汇总证据、预先固定的小样本次数及人工记录项。模型评测保留失败和额外尝试，既有证据缺失的用量与干预数不推测补齐。\n\n本夹具服务于[完善版 v1 路线](../../proposed/architecture/2026-09-20-practical-mini-agent-v1.md)的贯穿任务。恢复故障窗口、编辑冲突和总预算用例随对应阶段补充，不能把当前三个业务断言视为完整 Agent 评测。\n\n## Alternatives considered\n\n- 每次使用真实项目的新问题：任务更贴近使用，但难以保持相同起点和成功判据；先用固定小任务验证机制，再加真实仓库任务。\n- 在原始模板上直接修复再恢复 Git 文件：操作少，但容易误删或覆盖已有运行成果；全新副本略占磁盘空间，换取各次任务互不覆盖。\n- 只根据测试退出码判定：成本低，但修改测试也可能制造成功；额外核对非目标文件，约束该夹具允许的变化范围。这仍不是抵御恶意代码的沙箱。\n- CI 调用真实模型：覆盖兼容服务，但引入密钥、费用、网络和模型波动；确定性检查进 CI，真实模型保留人工验收证据。\n- 仅在工作区运行编译后的入口：反馈快，但会被现存开发依赖或配置掩盖打包漏项；隔离安装增加包源访问和运行耗时，换取可复查的生产依赖边界。\n\n## Consequences\n\n每次任务有固定起点与可复查结果，失败输出和不允许的文件变化可直接定位。代价是维护模板、运行脚本和 CI 配置，并保留人工记录模型／配置、请求数、token、耗时与干预次数的责任。\n\n模板故意保留一个缺陷；新增根目录测试发现规则时必须避免将其误当作普通通过用例。任务副本复用根目录安装的 tsx，夹具不是可脱离本仓库独立安装的项目；Agent 本身的生产包则独立安装验证。检查只核对副本内文件，不宣称能检测或限制 Agent 在副本外的所有副作用。\n\n## Verification\n\n2026-09-21，本地运行 `npm run test:fixture` 通过：原始任务两项通过、一项失败；已知修复三项通过；改动 README 时在运行测试前被拒绝。`npm run typecheck`、六十八项核心测试及二十六项看板测试通过。远程 CI 与真实模型修复夹具尚未运行，不将本地自检写成远程或真实模型评测通过。\n\n2026-09-22 的阶段 15 当前验证及阶段 13 后续真实模型证据见 [内部评测记录](../../../learning/evaluation.md)，上段保留当日历史边界。\n","sections":[{"heading":"Problem","body":"模型回复和 finish_task 只能说明 Agent 声称完成，不能证明文件正确变化或测试通过。每次临时挑一个任务也难以比较恢复、编辑与预算能力。配置接入后，已有确定性测试需要在干净环境持续运行，不应依赖维护者的密钥和兼容 API。","anchor":"section-0"},{"heading":"Decision","body":"[运费边界模板](../../../../fixtures/shipping-boundary/README.md)提供一个 TypeScript 修复任务：满 100 元免运费，原始实现错误地使用严格大于，三项业务测试中有两项通过、一项失败。任务只允许修改 `src/shipping.ts`，测试、说明和 package.json 保持原样。模板自身是预期失败基线，不加入根目录 `npm test`。\n\n[夹具脚本](../../../../scripts/eval-fixture.mjs)的 `new` 在被 Git 忽略的 `.mini-agent-eval/` 下创建全新副本，不覆盖旧任务；`check` 先比较非目标文件的 SHA-256 与文件集合，再启动真实测试进程。目标文件缺失、其他文件变化或测试失败均不能验收通过。调用 finish_task、修改测试或只输出成功文字不能改变验收结果。\n\n`selftest` 在专用临时副本核对原始缺陷、已知修复和无关文件变更三个场景；清理前核对真实路径，且仅删除该次自检创建的目录。自检证明夹具和判定机制工作，不证明模型已自主修复任务。每次重新评测都新建副本，原有结果留存。\n\n[CI 工作流](../../../../.github/workflows/ci.yml)在 Windows 与 Ubuntu、Node 22 下定义安装依赖、类型检查、核心测试、笔记校验、看板测试、夹具自检及交付安装检查，不配置密钥、不运行在线 doctor。远程 GitHub Actions 结果需实际运行后确认。\n\n[交付脚本](../../../../scripts/verify-delivery.mjs)在含空格的临时路径从源码及 lockfile 安装，编译打包，检查文件白名单后在另一目录只安装生产依赖。它实际运行 npm 可执行 shim、帮助与错误码、离线 shell 诊断、新建／EOF／恢复；不复用开发目录的 node_modules 或 .env。清理前核对真实绝对路径仅为本次临时目录。构建契约归[CLI 交付决定](../process/2026-09-22-cli-delivery.md)。\n\n`npm run verify` 顺序组合检查，任一失败停止；[内部评测记录](../../../learning/evaluation.md)汇总证据、预先固定的小样本次数及人工记录项。模型评测保留失败和额外尝试，既有证据缺失的用量与干预数不推测补齐。\n\n本夹具服务于[完善版 v1 路线](../../proposed/architecture/2026-09-20-pra ockfile 安装，编译打包，检查文件白名单后在另一目录只安装生产依赖。它实际运行 npm 可执行 shim、帮助与错误码、离线 shell 诊断、新建／EOF／恢复；不复用开发目录的 node_modules 或 .env。清理前核对真实绝对路径仅为本次临时目录。构建契约归[CLI 交付决定](../process/2026-09-22-cli-delivery.md)。\n\n`npm run verify` 顺序组合检查，任一失败停止；[内部评测记录](../../../learning/evaluation.md)汇总证据、预先固定的小样本次数及人工记录项。模型评测保留失败和额外尝试，既有证据缺失的用量与干预数不推测补齐。\n\n本夹具服务于[完善版 v1 路线](../../proposed/architecture/2026-09-20-practical-mini-agent-v1.md)的贯穿任务。恢复故障窗口、编辑冲突和总预算用例随对应阶段补充，不能把当前三个业务断言视为完整 Agent 评测。","alternatives":"- 每次使用真实项目的新问题：任务更贴近使用，但难以保持相同起点和成功判据；先用固定小任务验证机制，再加真实仓库任务。\n- 在原始模板上直接修复再恢复 Git 文件：操作少，但容易误删或覆盖已有运行成果；全新副本略占磁盘空间，换取各次任务互不覆盖。\n- 只根据测试退出码判定：成本低，但修改测试也可能制造成功；额外核对非目标文件，约束该夹具允许的变化范围。这仍不是抵御恶意代码的沙箱。\n- CI 调用真实模型：覆盖兼容服务，但引入密钥、费用、网络和模型波动；确定性检查进 CI，真实模型保留人工验收证据。\n- 仅在工作区运行编译后的入口：反馈快，但会被现存开发依赖或配置掩盖打包漏项；隔离安装增加包源访问和运行耗时，换取可复查的生产依赖边界。","consequences":"每次任务有固定起点与可复查结果，失败输出和不允许的文件变化可直接定位。代价是维护模板、运行脚本和 CI 配置，并保留人工记录模型／配置、请求数、token、耗时与干预次数的责任。\n\n模板故意保留一个缺陷；新增根目录测试发现规则时必须避免将其误当作普通通过用例。任务副本复用根目录安装的 tsx，夹具不是可脱离本仓库独立安装的项目；Agent 本身的生产包则独立安装验证。检查只核对副本内文件，不宣称能检测或限制 Agent 在副本外的所有副作用。","outLinks":["implemented/process/2026-09-22-cli-delivery.md","proposed/architecture/2026-09-20-practical-mini-agent-v1.md"]},{"id":"implemented/architecture/2026-09-20-testable-turn-runner.md","sourcePath":"implemented/architecture/2026-09-20-testable-turn-runner.md","slug":"2026-09-20-testable-turn-runner","lifecycle":"implemented","cls":"architecture","date":"2026-09-20","title":"抽取可注入模型流的主轮执行器","status":"implemented","rawBody":"# Agent Note: 抽取可注入模型流的主轮执行器\n\nStatus: implemented\n\n## Problem\n\n`runTurn()`、工具准备与执行、模型请求和终端输出原本都在 `agent.ts` 中。导入该文件会直接启动 REPL，模型流又来自真实 API，因此同批结束工具补结果、循环守卫累计中止、纯文本请求预算和多个工具调用配对只能依赖人工或真实模型观察。\n\n这些分支承担消息协议完整性和本轮退出条件。只测试 `detectRepeatedCall()`、`collectResponse()` 等局部函数不能证明主循环把它们正确组合；继续依赖真实模型又会受到模型选择、网络和中转服务差异影响。\n\n## Decision\n\n[turn.ts](../../../../src/turn.ts) 持有 `SYSTEM_PROMPT`、`runTurn()`、工具处理和本轮控制常量；[agent.ts](../../../../src/agent.ts) 负责启动初始化、终端用户输入、跨轮历史裁剪、结果展示和 UI 释放。阶段 11 接入后，`runTurn(messages, options)` 直接维护传入历史并返回结构化结果，入口不再回滚本轮消息。\n\n`RunTurnOptions` 接收模型入口、工具集合与请求次数，并允许替换输出：\n\n- `createStream`：由启动工厂注入真实模型流，测试注入模拟流；导入 `turn.ts` 不要求 API 环境变量，也不会启动 REPL。\n- `registry`：由启动工厂组装的主能力集合，模型 schema 与准备调用使用同一实例。\n- `maxIterations`：入口传入已校验配置，默认配置仍为十，测试可以使用更小预算稳定构造耗尽分支。\n- `write` 与 `log`：生产默认写终端，测试使用无输出或收集函数检查控制信息。\n\n工具 schema 与准备使用注入的注册表。阶段 11 增加 approve 与等待完成的 checkpoint 窄注入；主轮直接调用已准备工具的 execute，避免吞掉未知执行异常。工具抛错后停止，检查点失败向外传播，原始工具结果保留，模型视图单独截断。未建立通用执行框架；十项故障测试见 [turn-lifecycle.test.ts](../../../../src/turn-lifecycle.test.ts)。配置组装见[阶段 10 接线](../../implemented/architecture/2026-09-21-validated-runtime-config.md)。\n\n[turn.test.ts](../../../../src/turn.test.ts) 固化四类组合边界：`finish_task` 后同批剩余调用补“未执行”结果；连续相同调用累计两次命中守卫后补齐当前及剩余调用；持续纯文本达到请求上限且内部提示不产生真实用户轮；同一响应中的多个普通工具结果按各自 ID 回填并进入下一次请求。\n\n## Alternatives considered\n\n- 继续只做真实模型端到端验收：最贴近运行环境，但模型输出不稳定、速度慢且依赖 API，难以稳定构造罕见退出分支。\n- 直接从 `agent.ts` 导出 `runTurn()`：改动较小，但导入模块仍会执行 `main()`，同时静态加载 API 与终端依赖；增加入口判断后，职责依旧混在同一文件。\n- 在测试中复制一份简化循环：无需改生产结构，但只能证明复制品，最容易在后续修改时与真实主循环漂移。\n- 为模型、注册表、批准、控制台和所有工具建立完整接口层：隔离最彻底，但会把学习项目推向通用框架；只注入配置组装与确定性回归实际需要的模型、注册表、次数和输出，批准及工具执行仍复用现有函数。\n\n## Consequences\n\n主轮组合逻辑可以在不启动 REPL、不读取 API 配置和不请求真实模型的情况下稳定回放，结束工具、循环守卫、请求预算和多工具配对成为常驻回归。CLI 入口缩小后，本轮编排与跨轮历史、异常回滚的职责边界也更清楚。\n\n代价是 `runTurn()` 新增了少量依赖注入接口，测试仍执行真实的无副作用工具实现；若工具注册表或控制工具产生全局状态，测试需要继续选择隔离良好的用例。批准流程仍依赖终端人工输入，模拟流测试不能代替兼容服务协议、模型选择和交互批准的真实验收。\n\n## Verification\n\n2026-09-20，学习者运行 `npm run typecheck` 通过，`npm test` 五十二条通过、零失败；AI 随后在当前工作区重新运行相同命令，结果一致。新增四条测试检查完整历史和调用 ID，而不只检查控制台输出。\n\n真实模型普通请求调用 `calculate` 得到 `391`，输出结果后调用 `finish_task`。真实委派请求中，主模型先维护 todo，再调用 `delegate_task`；子 Agent 使用搜索和分段读取检查 `src/turn.ts`，在最终总结请求返回 `runTurn()` 的职责，主模型移除临时 todo、总结并调用 `finish_task`。两条路径均收到 usage，证明动态默认模型入口、工具结果回填和显式出口仍可工作。\n","sections":[{"heading":"Problem","body":"`runTurn()`、工具准备与执行、模型请求和终端输出原本都在 `agent.ts` 中。导入该文件会直接启动 REPL，模型流又来自真实 API，因此同批结束工具补结果、循环守卫累计中止、纯文本请求预算和多个工具调用配对只能依赖人工或真实模型观察。\n\n这些分支承担消息协议完整性和本轮退出条件。只测试 `detectRepeatedCall()`、`collectResponse()` 等
