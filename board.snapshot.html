/../../learning/project.md)、[学习进度](../../../learning/progress.md)。本决定不属于早期已实现的 Agent 运行时能力，不能倒填为早期功能。\n","sections":[{"heading":"Problem","body":"学习项目同时需要工程理由、教学分工和理解证据。若把背景与阶段记录塞进第三方笔记工具，升级工具和迁移新项目都会携带无关事实；全部保存在本地交接中又难随仓库交接。","anchor":"section-0"},{"heading":"Decision","body":"项目入口组合原版决策笔记 Skill 与独立 learning-coach。前者负责工程决定的记录，后者负责讲解、练习、review 和学习交接；项目学习配置保存编辑分工，简短进度保存代码状态、验证结果和理解证据。\n\n学习者默认维护核心源码，AI 在授权范围内维护管理文件；卡住时可以给完整参考、逐块讲解并留小改造。用户明确代改的要求可覆盖默认分工，已有授权不重复确认。\n\n这一分工服务于[手写 CLI 的学习目标](../architecture/2026-08-30-local-cli-and-sdk.md)，采用[验证范围约定](../testing/2026-09-05-verification-scope.md)区分实现通过与理解掌握。教学不新增工程笔记的状态或分类。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 只使用既有 HANDOFF：信息集中且已有内容，但过程、约定和决策混合，docs 目录又不随当前 Git 保存。\n- 直接修改第三方 Skill：入口少，但升级需合并个性化补丁，新项目会继承旧背景。\n- 把全部教学方法放在 AGENTS.md：加载直接，但入口变长，通用方法无法独立复用。","anchor":"section-2"},{"heading":"Consequences","body":"通用方法、上游工具和项目资料可分别迁移，代价是需要沿入口读取相关文件并保持职责清楚。源码补录笔记采用可检索路径与笔记到源码的链接，不为了管理文档直接改动学习者的 src。\n\n工程笔记描述理由与代价，进度文件记录练习与证据；“待观察”不表示已经或尚未掌握。上游工具缺陷通过项目适配处理，不把教学逻辑混入其目录。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：2026-09-11 建立的项目管理文件。当前依据：[AGENTS.md](../../../../AGENTS.md)、[教练 Skill](../../../skills/learning-coach/SKILL.md)、[学习配置](../../../learning/project.md)、[学习进度](../../../learning/progress.md)。本决定不属于早期已实现的 Agent 运行时能力，不能倒填为早期功能。","anchor":"section-4"}],"problem":"学习项目同时需要工程理由、教学分工和理解证据。若把背景与阶段记录塞进第三方笔记工具，升级工具和迁移新项目都会携带无关事实；全部保存在本地交接中又难随仓库交接。","decision":"项目入口组合原版决策笔记 Skill 与独立 learning-coach。前者负责工程决定的记录，后者负责讲解、练习、review 和学习交接；项目学习配置保存编辑分工，简短进度保存代码状态、验证结果和理解证据。\n\n学习者默认维护核心源码，AI 在授权范围内维护管理文件；卡住时可以给完整参考、逐块讲解并留小改造。用户明确代改的要求可覆盖默认分工，已有授权不重复确认。\n\n这一分工服务于[手写 CLI 的学习目标](../architecture/2026-08-30-local-cli-and-sdk.md)，采用[验证范围约定](../testing/2026-09-05-verification-scope.md)区分实现通过与理解掌握。教学不新增工程笔记的状态或分类。","alternatives":"- 只使用既有 HANDOFF：信息集中且已有内容，但过程、约定和决策混合，docs 目录又不随当前 Git 保存。\n- 直接修改第三方 Skill：入口少，但升级需合并个性化补丁，新项目会继承旧背景。\n- 把全部教学方法放在 AGENTS.md：加载直接，但入口变长，通用方法无法独立复用。","consequences":"通用方法、上游工具和项目资料可分别迁移，代价是需要沿入口读取相关文件并保持职责清楚。源码补录笔记采用可检索路径与笔记到源码的链接，不为了管理文档直接改动学习者的 src。\n\n工程笔记描述理由与代价，进度文件记录练习与证据；“待观察”不表示已经或尚未掌握。上游工具缺陷通过项目适配处理，不把教学逻辑混入其目录。","outLinks":["implemented/architecture/2026-08-30-local-cli-and-sdk.md","implemented/testing/2026-09-05-verification-scope.md"]},{"id":"implemented/architecture/2026-09-10-todo-state-ownership.md","sourcePath":"implemented/architecture/2026-09-10-todo-state-ownership.md","slug":"2026-09-10-todo-state-ownership","lifecycle":"implemented","cls":"architecture","date":"2026-09-10","title":"todo 状态由模块持有，启动恢复通过注册表完成","status":"implemented","rawBody":"# Agent Note: todo 状态由模块持有，启动恢复通过注册表完成\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n有状态工具需要明确谁持有当前状态、何时读取磁盘，以及写入失败后模型能看到什么。若主循环直接管理 todo，工具细节会破坏统一接口；每次读盘又会改变状态权威和 IO 行为。\n\n## Decision\n\ntodo.ts 持有私有的模块级 state。启动时 main 等待 initTools，注册表再调用 loadTodoFromDisk；主循环不直接 import todo。list_todos 读取内存，增删先计算 next，磁盘写入成功后才发布 state = next。\n\n这保证写入抛错时内存仍保留旧状态；它不保证磁盘完整，也不保证崩溃时两个状态始终一致。底层格式与恢复策略归[JSON 持久化决定](2026-09-06-todo-json-persistence.md)，入口职责归[工具注册表](2026-08-31-tool-registry-boundary.md)。\n\n## Alternatives considered\n\n- 每次操作重新读盘：可以及时看见外部手工改动，是早期持久化版本的做法，但会增加重复 IO，并使运行状态更受外部写入影响。\n- 让 agent.ts 保存并传递 todo 状态：数据流显式，但主循环需要知道具体工具业务，新增状态工具继续扩大耦合。\n- 先更新内存再写盘：代码容易安排，但写入失败后内存会表现为已经成功，返回结果与持久化状态分离。\n\n## Consequences\n\n状态归属和启动顺序清晰，代价是运行中手工修改 JSON 不会刷新内存，需重启加载。两个进程各持一份快照，后写者可能覆盖先写者。\n\n多进程或外部编辑成为需求时，需要重新选择同步、锁或存储机制；不能把单进程的发布顺序推广为原子提交。\n\n## Verification\n\n日期依据：[6c93279](https://github.com/xilele777/mini-agent/commit/6c93279) 于 2026-09-10 引入常驻缓存和启动钩子。当前依据：[todo.ts](../../../../src/tools/todo.ts)、[tools/index.ts](../../../../src/tools/index.ts)。该历史提交关于“任意崩溃点一致”的表述超出实现保证，本笔记以当前代码为准。已有手动记录覆盖外部改盘后本进程不刷新、重启生效。\n","sections":[{"heading":"Problem","body":"有状态工具需要明确谁持有当前状态、何时读取磁盘，以及写入失败后模型能看到什么。若主循环直接管理 todo，工具细节会破坏统一接口；每次读盘又会改变状态权威和 IO 行为。","anchor":"section-0"},{"heading":"Decision","body":"todo.ts 持有私有的模块级 state。启动时 main 等待 initTools，注册表再调用 loadTodoFromDisk；主循环不直接 import todo。list_todos 读取内存，增删先计算 next，磁盘写入成功后才发布 state = next。\n\n这保证写入抛错时内存仍保留旧状态；它不保证磁盘完整，也不保证崩溃时两个状态始终一致。底层格式与恢复策略归[JSON 持久化决定](2026-09-06-todo-json-persistence.md)，入口职责归[工具注册表](2026-08-31-tool-registry-boundary.md)。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 每次操作重新读盘：可以及时看见外部手工改动，是早期持久化版本的做法，但会增加重复 IO，并使运行状态更受外部写入影响。\n- 让 agent.ts 保存并传递 todo 状态：数据流显式，但主循环需要知道具体工具业务，新增状态工具继续扩大耦合。\n- 先更新内存再写盘：代码容易安排，但写入失败后内存会表现为已经成功，返回结果与持久化状态分离。","anchor":"section-2"},{"heading":"Consequences","body":"状态归属和启动顺序清晰，代价是运行中手工修改 JSON 不会刷新内存，需重启加载。两个进程各持一份快照，后写者可能覆盖先写者。\n\n多进程或外部编辑成为需求时，需要重新选择同步、锁或存储机制；不能把单进程的发布顺序推广为原子提交。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[6c93279](https://github.com/xilele777/mini-agent/commit/6c93279) 于 2026-09-10 引入常驻缓存和启动钩子。当前依据：[todo.ts](../../../../src/tools/todo.ts)、[tools/index.ts](../../../../src/tools/index.ts)。该历史提交关于“任意崩溃点一致”的表述超出实现保证，本笔记以当前代码为准。已有手动记录覆盖外部改盘后本进程不刷新、重启生效。","anchor":"section-4"}],"problem":"有状态工具需要明确谁持有当前状态、何时读取磁盘，以及写入失败后模型能看到什么。若主循环直接管理 todo，工具细节会破坏统一接口；每次读盘又会改变状态权威和 IO 行为。","decision":"todo.ts 持有私有的模块级 state。启动时 main 等待 initTools，注册表再调用 loadTodoFromDisk；主循环不直接 import todo。list_todos 读取内存，增删先计算 next，磁盘写入成功后才发布 state = next。\n\n这保证写入抛错时内存仍保留旧状态；它不保证磁盘完整，也不保证崩溃时两个状态始终一致。底层格式与恢复策略归[JSON 持久化决定](2026-09-06-todo-json-persistence.md)，入口职责归[工具注册表](2026-08-31-tool-registry-boundary.md)。","alternatives":"- 每次操作重新读盘：可以及时看见外部手工改动，是早期持久化版本的做法，但会增加重复 IO，并使运行状态更受外部写入影响。\n- 让 agent.ts 保存并传递 todo 状态：数据流显式，但主循环需要知道具体工具业务，新增状态工具继续扩大耦合。\n- 先更新内存再写盘：代码容易安排，但写入失败后内存会表现为已经成功，返回结果与持久化状态分离。","consequences":"状态归属和启动顺序清晰，代价是运行中手工修改 JSON 不会刷新内存，需重启加载。两个进程各持一份快照，后写者可能覆盖先写者。\n\n多进程或外部编辑成为需求时，需要重新选择同步、锁或存储机制；不能把单进程的发布顺序推广为原子提交。","outLinks":["implemented/architecture/2026-08-31-tool-registry-boundary.md","implemented/architecture/2026-09-06-todo-json-persistence.md"]},{"id":"implemented/architecture/2026-09-06-todo-json-persistence.md","sourcePath":"implemented/architecture/2026-09-06-todo-json-persistence.md","slug":"2026-09-06-todo-json-persistence","lifecycle":"implemented","cls":"architecture","date":"2026-09-06","title":"todo 以项目内 JSON 保存计划，不保存完整会话","status":"implemented","rawBody":"# Agent Note: todo 以项目内 JSON 保存计划，不保存完整会话\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n仅靠对话历史表达多步计划，会受到历史裁剪和重启影响。工具需要一份可以明确列出、添加和移除的状态，但本阶段不需要数据库服务或完整任务调度系统。\n\n## Decision\n\ntodo 在项目根目录的 .mini-agent-todo.json 保存 tasks 与 nextId；条目只有 id 和 title。新增分配编号，完成后移除，list_todos 返回当前清单。文件路径固定并被 Git 忽略，属于 Agent 自身的项目草稿状态。\n\n读入 JSON 后使用 Zod 检查结构；文件缺失、读取错误、解析失败或结构不符按当前策略回退空清单。写入采用整份覆盖。当前运行中的权威状态与发布顺序由[常驻内存约定](2026-09-10-todo-state-ownership.md)说明。\n\n固定路径状态写入沿用[批准范围的判断](../feature/2026-09-02-action-approval-scope.md)，不要求每次增删待办都人工确认。\n\n## Alternatives considered\n\n- 继续只用消息历史：无需新存储，但旧轮裁剪或进程退出后无法恢复可靠的清单。\n- 只使用进程内列表：实现简单，适合初期状态练习，但重启会丢失计划。\n- 引入 SQLite 或外部数据库：查询、事务或并发能力更强，但当前只有小型项目草稿列表，引入额外存储机制的成本尚无对应需求。\n\n## Consequences\n\n待办可跨轮和跨进程重启恢复，代价是没有完成历史、任务归属、暂停状态或并发协调。暂停工作不等于删除计划，执行范围仍由当前用户请求决定。\n\n整份 writeFile 不是原子替换；损坏时回空清单也不是数据修复。不可读文件与格式错误未完整区分，后续写入可能覆盖原文件，恢复策略需要另行设计。\n\n## Verification\n\n日期依据：[d66e2d8](https://github.com/xilele777/mini-agent/commit/d66e2d8) 于 2026-09-06 引入 JSON 持久化。当前依据：[todo.ts](../../../../src/tools/todo.ts)、[.gitignore](../../../../.gitignore)。已有手动记录包括重启恢复、跨轮移除和删除文件后的空清单；没有崩溃恢复或并发写正确性的测试证据。\n","sections":[{"heading":"Problem","body":"仅靠对话历史表达多步计划，会受到历史裁剪和重启影响。工具需要一份可以明确列出、添加和移除的状态，但本阶段不需要数据库服务或完整任务调度系统。","anchor":"section-0"},{"heading":"Decision","body":"todo 在项目根目录的 .mini-agent-todo.json 保存 tasks 与 nextId；条目只有 id 和 title。新增分配编号，完成后移除，list_todos 返回当前清单。文件路径固定并被 Git 忽略，属于 Agent 自身的项目草稿状态。\n\n读入 JSON 后使用 Zod 检查结构；文件缺失、读取错误、解析失败或结构不符按当前策略回退空清单。写入采用整份覆盖。当前运行中的权威状态与发布顺序由[常驻内存约定](2026-09-10-todo-state-ownership.md)说明。\n\n固定路径状态写入沿用[批准范围的判断](../feature/2026-09-02-action-approval-scope.md)，不要求每次增删待办都人工确认。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 继续只用消息历史：无需新存储，但旧轮裁剪或进程退出后无法恢复可靠的清单。\n- 只使用进程内列表：实现简单，适合初期状态练习，但重启会丢失计划。\n- 引入 SQLite 或外部数据库：查询、事务或并发能力更强，但当前只有小型项目草稿列表，引入额外存储机制的成本尚无对应需求。","anchor":"section-2"},{"heading":"Consequences","body":"待办可跨轮和跨进程重启恢复，代价是没有完成历史、任务归属、暂停状态或并发协调。暂停工作不等于删除计划，执行范围仍由当前用户请求决定。\n\n整份 writeFile 不是原子替换；损坏时回空清单也不是数据修复。不可读文件与格式错误未完整区分，后续写入可能覆盖原文件，恢复策略需要另行设计。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[d66e2d8](https://github.com/xilele777/mini-agent/commit/d66e2d8) 于 2026-09-06 引入 JSON 持久化。当前依据：[todo.ts](../../../../src/tools/todo.ts)、[.gitignore](../../../../.gitignore)。已有手动记录包括重启恢复、跨轮移除和删除文件后的空清单；没有崩溃恢复或并发写正确性的测试证据。","anchor":"section-4"}],"problem":"仅靠对话历史表达多步计划，会受到历史裁剪和重启影响。工具需要一份可以明确列出、添加和移除的状态，但本阶段不需要数据库服务或完整任务调度系统。","decision":"todo 在项目根目录的 .mini-agent-todo.json 保存 tasks 与 nextId；条目只有 id 和 title。新增分配编号，完成后移除，list_todos 返回当前清单。文件路径固定并被 Git 忽略，属于 Agent 自身的项目草稿状态。\n\n读入 JSON 后使用 Zod 检查结构；文件缺失、读取错误、解析失败或结构不符按当前策略回退空清单。写入采用整份覆盖。当前运行中的权威状态与发布顺序由[常驻内存约定](2026-09-10-todo-state-ownership.md)说明。\n\n固定路径状态写入沿用[批准范围的判断](../feature/2026-09-02-action-approval-scope.md)，不要求每次增删待办都人工确认。","alternatives":"- 继续只用消息历史：无需新存储，但旧轮裁剪或进程退出后无法恢复可靠的清单。\n- 只使用进程内列表：实现简单，适合初期状态练习，但重启会丢失计划。\n- 引入 SQLite 或外部数据库：查询、事务或并发能力更强，但当前只有小型项目草稿列表，引入额外存储机制的成本尚无对应需求。","consequences":"待办可跨轮和跨进程重启恢复，代价是没有完成历史、任务归属、暂停状态或并发协调。暂停工作不等于删除计划，执行范围仍由当前用户请求决定。\n\n整份 writeFile 不是原子替换；损坏时回空清单也不是数据修复。不可读文件与格式错误未完整区分，后续写入可能覆盖原文件，恢复策略需要另行设计。","outLinks":["implemented/architecture/2026-09-10-todo-state-ownership.md","implemented/feature/2026-09-02-action-approval-scope.md"]},{"id":"implemented/bug-fix/2026-09-06-shared-read-guards.md","sourcePath":"implemented/bug-fix/2026-09-06-shared-read-guards.md","slug":"2026-09-06-shared-read-guards","lifecycle":"implemented","cls":"bug-fix","date":"2026-09-06","title":"读取与搜索共用敏感名单，并检查真实路径","status":"implemented","rawBody":"# Agent Note: 读取与搜索共用敏感名单，并检查真实路径\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n读取和搜索都会把本地文件内容送入模型上下文。若只有 read_file 检查敏感路径，搜索可以成为另一条读取通道；只检查表面路径也无法识别指向项目外的链接。\n\n## Decision\n\nguard.ts 提供共同的项目范围判断与敏感名单，覆盖环境文件、Git 内部对象、依赖目录及部分私钥路径。单文件读取在词法路径校验后，对可解析的 realpath 再检查项目范围与敏感项。\n\n搜索入口校验目录范围，遍历时过滤敏感文件并跳过递归遇到的符号链接条目；读取和搜索另有文件大小限制。免批准读取必须在工具代码里守边界，[动作批准](../feature/2026-09-02-action-approval-scope.md)不代替这条约束。\n\n这些检查服务于[文件检索流程](../feature/2026-09-05-bounded-file-retrieval.md)，不约束用户批准后的任意 shell 行为。\n\n## Alternatives considered\n\n- 仅在提示词中禁止读取敏感内容：规则可见，但无法约束程序实际执行。\n- 每个工具维护自己的封锁名单：实现就近，但规则容易分叉，新增读取通道可能漏项。\n- 只用字符串前缀判断项目范围：容易实现，但同名前缀目录和符号链接会使表面路径与实际目标不同。\n\n## Consequences\n\n常见直接越界和敏感路径可在读取前拒绝，代价是文件系统检查增加了 IO，并可能拒绝合理的特殊路径。\n\n当前仍有明确限制：ROOT 自身也被判为不在允许子路径内；realpath 失败时回退词法检查；检查与读取不是原子操作。目录入口的敏感目标检查也不等同于单文件入口，不能声称覆盖同项目敏感目录的所有链接别名。\n\n## Verification\n\n日期依据：[ad92001](https://github.com/xilele777/mini-agent/commit/ad92001) 于 2026-09-06 加固读取与搜索。当前依据：[guard.ts](../../../../src/guard.ts)、[grep.ts](../../../../src/tools/grep.ts)、[fs.ts](../../../../src/tools/fs.ts)。[guard.test.ts](../../../../src/guard.test.ts) 的链接夹具位于 ROOT 外，可能在词法检查就被拒绝；其通过不能证明项目内链接逃逸分支已被独立覆盖。\n","sections":[{"heading":"Problem","body":"读取和搜索都会把本地文件内容送入模型上下文。若只有 read_file 检查敏感路径，搜索可以成为另一条读取通道；只检查表面路径也无法识别指向项目外的链接。","anchor":"section-0"},{"heading":"Decision","body":"guard.ts 提供共同的项目范围判断与敏感名单，覆盖环境文件、Git 内部对象、依赖目录及部分私钥路径。单文件读取在词法路径校验后，对可解析的 realpath 再检查项目范围与敏感项。\n\n搜索入口校验目录范围，遍历时过滤敏感文件并跳过递归遇到的符号链接条目；读取和搜索另有文件大小限制。免批准读取必须在工具代码里守边界，[动作批准](../feature/2026-09-02-action-approval-scope.md)不代替这条约束。\n\n这些检查服务于[文件检索流程](../feature/2026-09-05-bounded-file-retrieval.md)，不约束用户批准后的任意 shell 行为。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 仅在提示词中禁止读取敏感内容：规则可见，但无法约束程序实际执行。\n- 每个工具维护自己的封锁名单：实现就近，但规则容易分叉，新增读取通道可能漏项。\n- 只用字符串前缀判断项目范围：容易实现，但同名前缀目录和符号链接会使表面路径与实际目标不同。","anchor":"section-2"},{"heading":"Consequences","body":"常见直接越界和敏感路径可在读取前拒绝，代价是文件系统检查增加了 IO，并可能拒绝合理的特殊路径。\n\n当前仍有明确限制：ROOT 自身也被判为不在允许子路径内；realpath 失败时回退词法检查；检查与读取不是原子操作。目录入口的敏感目标检查也不等同于单文件入口，不能声称覆盖同项目敏感目录的所有链接别名。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[ad92001](https://github.com/xilele777/mini-agent/commit/ad92001) 于 2026-09-06 加固读取与搜索。当前依据：[guard.ts](../../../../src/guard.ts)、[grep.ts](../../../../src/tools/grep.ts)、[fs.ts](../../../../src/tools/fs.ts)。[guard.test.ts](../../../../src/guard.test.ts) 的链接夹具位于 ROOT 外，可能在词法检查就被拒绝；其通过不能证明项目内链接逃逸分支已被独立覆盖。","anchor":"section-4"}],"problem":"读取和搜索都会把本地文件内容送入模型上下文。若只有 read_file 检查敏感路径，搜索可以成为另一条读取通道；只检查表面路径也无法识别指向项目外的链接。","decision":"guard.ts 提供共同的项目范围判断与敏感名单，覆盖环境文件、Git 内部对象、依赖目录及部分私钥路径。单文件读取在词法路径校验后，对可解析的 realpath 再检查项目范围与敏感项。\n\n搜索入口校验目录范围，遍历时过滤敏感文件并跳过递归遇到的符号链接条目；读取和搜索另有文件大小限制。免批准读取必须在工具代码里守边界，[动作批准](../feature/2026-09-02-action-approval-scope.md)不代替这条约束。\n\n这些检查服务于[文件检索流程](../feature/2026-09-05-bounded-file-retrieval.md)，不约束用户批准后的任意 shell 行为。","alternatives":"- 仅在提示词中禁止读取敏感内容：规则可见，但无法约束程序实际执行。\n- 每个工具维护自己的封锁名单：实现就近，但规则容易分叉，新增读取通道可能漏项。\n- 只用字符串前缀判断项目范围：容易实现，但同名前缀目录和符号链接会使表面路径与实际目标不同。","consequences":"常见直接越界和敏感路径可在读取前拒绝，代价是文件系统检查增加了 IO，并可能拒绝合理的特殊路径。\n\n当前仍有明确限制：ROOT 自身也被判为不在允许子路径内；realpath 失败时回退词法检查；检查与读取不是原子操作。目录入口的敏感目标检查也不等同于单文件入口，不能声称覆盖同项目敏感目录的所有链接别名。","outLinks":["implemented/feature/2026-09-02-action-approval-scope.md","implemented/feature/2026-09-05-bounded-file-retrieval.md"]},{"id":"implemented/bug-fix/2026-09-06-shell-interruption-reporting.md","sourcePath":"implemented/bug-fix/2026-09-06-shell-interruption-reporting.md","slug":"2026-09-06-shell-interruption-reporting","lifecycle":"implemented","cls":"bug-fix","date":"2026-09-06","title":"区分命令失败、输出超限和中断后的部分副作用","status":"implemented","rawBody":"# Agent Note: 区分命令失败、输出超限和中断后的部分副作用\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\nshell 可能在返回非零状态、超时或输出超限之前已经修改文件。若把缓冲超限当作普通退出码或正常完成，模型可能错误判断结果并继续执行依赖步骤。\n\n## Decision\n\nrun_bash 使用批准后的完整命令，设定 30 秒超时和 stdout/stderr 各自 1 MiB 的缓冲上限。输出展示另截取每个流的前 4000 字符，并附带原始长度。\n\nERR_CHILD_PROCESS_STDIO_MAXBUFFER 先于数字退出码分支识别，返回中断说明、已捕获输出以及可能已有部分副作用的提示。普通非零退出尽量保留退出码与两路输出。\n\n危险正则仅用于批准预览的提醒，不解析或过滤 shell；这是[具体动作批准](../feature/2026-09-02-action-approval-scope.md)的辅助，而非命令白名单。结果之后还会经过[公共上下文截断](../architecture/2026-09-05-bounded-conversation-context.md)。\n\n## Alternatives considered\n\n- 只根据退出码报告失败：能覆盖常见命令，但缓冲超限使用字符串错误码，无法准确表达中断。\n- 无限缓冲输出：最易保留全部信息，但大输出会扩大进程内存与模型上下文。\n- 按命令名称做白名单：规则直观，但重定向、管道、解释器和脚本能组合出其他效果，当前范围不实现完整 shell 解析。\n\n## Consequences\n\n模型能区分多类结果并看到部分输出，代价是输出可能不完整、进程终止也不保证撤销副作用或终止所有后代进程。\n\n当前超时分支依据 killed 报告并未附带已捕获输出；缓冲超限说明中的“已超时”标签也不构成实际超时证据。Windows shell 路径固定为本机 Git Bash，换机须核对。\n\n## Verification\n\n日期依据：[ad92001](https://github.com/xilele777/mini-agent/commit/ad92001) 于 2026-09-06 单独处理缓冲错误；基础 shell 工具来自 2026-09-02。当前依据：[bash.ts](../../../../src/tools/bash.ts)。已有记录包含 pwd、文件不存在和拒绝执行；没有缓冲超限、超时或完整进程树清理的自动化运行证据。\n","sections":[{"heading":"Problem","body":"shell 可能在返回非零状态、超时或输出超限之前已经修改文件。若把缓冲超限当作普通退出码或正常完成，模型可能错误判断结果并继续执行依赖步骤。","anchor":"section-0"},{"heading":"Decision","body":"run_bash 使用批准后的完整命令，设定 30 秒超时和 stdout/stderr 各自 1 MiB 的缓冲上限。输出展示另截取每个流的前 4000 字符，并附带原始长度。\n\nERR_CHILD_PROCESS_STDIO_MAXBUFFER 先于数字退出码分支识别，返回中断说明、已捕获输出以及可能已有部分副作用的提示。普通非零退出尽量保留退出码与两路输出。\n\n危险正则仅用于批准预览的提醒，不解析或过滤 shell；这是[具体动作批准](../feature/2026-09-02-action-approval-scope.md)的辅助，而非命令白名单。结果之后还会经过[公共上下文截断](../architecture/2026-09-05-bounded-conversation-context.md)。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 只根据退出码报告失败：能覆盖常见命令，但缓冲超限使用字符串错误码，无法准确表达中断。\n- 无限缓冲输出：最易保留全部信息，但大输出会扩大进程内存与模型上下文。\n- 按命令名称做白名单：规则直观，但重定向、管道、解释器和脚本能组合出其他效果，当前范围不实现完整 shell 解析。","anchor":"section-2"},{"heading":"Consequences","body":"模型能区分多类结果并看到部分输出，代价是输出可能不完整、进程终止也不保证撤销副作用或终止所有后代进程。\n\n当前超时分支依据 killed 报告并未附带已捕获输出；缓冲超限说明中的“已超时”标签也不构成实际超时证据。Windows shell 路径固定为本机 Git Bash，换机须核对。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[ad92001](https://github.com/xilele777/mini-agent/commit/ad92001) 于 2026-09-06 单独处理缓冲错误；基础 shell 工具来自 2026-09-02。当前依据：[bash.ts](../../../../src/tools/bash.ts)。已有记录包含 pwd、文件不存在和拒绝执行；没有缓冲超限、超时或完整进程树清理的自动化运行证据。","anchor":"section-4"}],"problem":"shell 可能在返回非零状态、超时或输出超限之前已经修改文件。若把缓冲超限当作普通退出码或正常完成，模型可能错误判断结果并继续执行依赖步骤。","decision":"run_bash 使用批准后的完整命令，设定 30 秒超时和 stdout/stderr 各自 1 MiB 的缓冲上限。输出展示另截取每个流的前 4000 字符，并附带原始长度。\n\nERR_CHILD_PROCESS_STDIO_MAXBUFFER 先于数字退出码分支识别，返回中断说明、已捕获输出以及可能已有部分副作用的提示。普通非零退出尽量保留退出码与两路输出。\n\n危险正则仅用于批准预览的提醒，不解析或过滤 shell；这是[具体动作批准](../feature/2026-09-02-action-approval-scope.md)的辅助，而非命令白名单。结果之后还会经过[公共上下文截断](../architecture/2026-09-05-bounded-conversation-context.md)。","alternatives":"- 只根据退出码报告失败：能覆盖常见命令，但缓冲超限使用字符串错误码，无法准确表达中断。\n- 无限缓冲输出：最易保留全部信息，但大输出会扩大进程内存与模型上下文。\n- 按命令名称做白名单：规则直观，但重定向、管道、解释器和脚本能组合出其他效果，当前范围不实现完整 shell 解析。","consequences":"模型能区分多类结果并看到部分输出，代价是输出可能不完整、进程终止也不保证撤销副作用或终止所有后代进程。\n\n当前超时分支依据 killed 报告并未附带已捕获输出；缓冲超限说明中的“已超时”标签也不构成实际超时证据。Windows shell 路径固定为本机 Git Bash，换机须核对。","outLinks":["implemented/architecture/2026-09-05-bounded-conversation-context.md","implemented/feature/2026-09-02-action-approval-scope.md"]},{"id":"implemented/bug-fix/2026-09-06-tool-result-history-recovery.md","sourcePath":"implemented/bug-fix/2026-09-06-tool-result-history-recovery.md","slug":"2026-09-06-tool-result-history-recovery","lifecycle":"implemented","cls":"bug-fix","date":"2026-09-06","title":"提前结束也补齐工具结果，异常只回退本轮消息","status":"implemented","rawBody":"# Agent Note: 提前结束也补齐工具结果，异常只回退本轮消息\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\nassistant 一次可能提出多个工具调用。中途拒绝、守卫终止或结束工具返回时，若遗留未配对 ID，下一次请求会复用不完整历史；请求异常还可能留下半轮消息。\n\n## Decision\n\n正常停止路径为已收到的每个调用保留对应 tool 结果：拒绝操作返回拒绝说明，不支持的调用类型返回错误；循环守卫或 endsTurn 终止本轮时，同批剩余调用补“未执行”结果并保持不执行。\n\n普通本轮异常回到加入用户输入前的 checkpoint，丢弃本轮对话消息，使 REPL 可接收下一条输入。AbortError 单独向外传播并关闭输入资源。\n\n这一规则落实[原生调用协议](../architecture/2026-08-31-native-function-calling.md)，同时约束[循环守卫](../feature/2026-09-05-loop-guard-and-request-budget.md)和[动作拒绝](../feature/2026-09-02-action-approval-scope.md)的停止路径。\n\n## Alternatives considered\n\n- 遇到拒绝或结束信号直接 return：控制流短，但当前响应中其余调用可能没有结果。\n- 提前结束仍把剩余调用执行完：消息容易配齐，但会在工作已暂停或结束后继续产生副作用。\n- 异常时仅弹出最后一条消息：保留信息更多，但无法确定半轮中有多少调用未配对，容易留下结构错误。\n\n## Consequences\n\n下一次请求可以获得结构完整的历史，代价是异常回退会丢失本轮已观察的信息。正常终止不会走异常回退，而是保留补齐后的历史。\n\n消息回退不是事务回滚：已写入的文件、执行过的命令和 todo 变更都不会撤销。模型重新收到任务时，需要检查外部状态，不能假定本轮从未发生。\n\n## Verification\n\n日期依据：[ad92001](https://github.com/xilele777/mini-agent/commit/ad92001) 于 2026-09-06 补齐循环终止路径；[cd3fa0c](https://github.com/xilele777/mini-agent/commit/cd3fa0c) 包含显式出口路径。当前依据：[agent.ts](../../../../src/agent.ts)。现有测试覆盖历史裁剪，不包含“同批结束工具后还有其他调用”的运行用例；该分支只有静态 review 证据。\n","sections":[{"heading":"Problem","body":"assistant 一次可能提出多个工具调用。中途拒绝、守卫终止或结束工具返回时，若遗留未配对 ID，下一次请求会复用不完整历史；请求异常还可能留下半轮消息。","anchor":"section-0"},{"heading":"Decision","body":"正常停止路径为已收到的每个调用保留对应 tool 结果：拒绝操作返回拒绝说明，不支持的调用类型返回错误；循环守卫或 endsTurn 终止本轮时，同批剩余调用补“未执行”结果并保持不执行。\n\n普通本轮异常回到加入用户输入前的 checkpoint，丢弃本轮对话消息，使 REPL 可接收下一条输入。AbortError 单独向外传播并关闭输入资源。\n\n这一规则落实[原生调用协议](../architecture/2026-08-31-native-function-calling.md)，同时约束[循环守卫](../feature/2026-09-05-loop-guard-and-request-budget.md)和[动作拒绝](../feature/2026-09-02-action-approval-scope.md)的停止路径。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 遇到拒绝或结束信号直接 return：控制流短，但当前响应中其余调用可能没有结果。\n- 提前结束仍把剩余调用执行完：消息容易配齐，但会在工作已暂停或结束后继续产生副作用。\n- 异常时仅弹出最后一条消息：保留信息更多，但无法确定半轮中有多少调用未配对，容易留下结构错误。","anchor":"section-2"},{"heading":"Consequences","body":"下一次请求可以获得结构完整的历史，代价是异常回退会丢失本轮已观察的信息。正常终止不会走异常回退，而是保留补齐后的历史。\n\n消息回退不是事务回滚：已写入的文件、执行过的命令和 todo 变更都不会撤销。模型重新收到任务时，需要检查外部状态，不能假定本轮从未发生。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[ad92001](https://github.com/xilele777/mini-agent/commit/ad92001) 于 2026-09-06 补齐循环终止路径；[cd3fa0c](https://github.com/xilele777/mini-agent/commit/cd3fa0c) 包含显式出口路径。当前依据：[agent.ts](../../../../src/agent.ts)。现有测试覆盖历史裁剪，不包含“同批结束工具后还有其他调用”的运行用例；该分支只有静态 review 证据。","anchor":"section-4"}],"problem":"assistant 一次可能提出多个工具调用。中途拒绝、守卫终止或结束工具返回时，若遗留未配对 ID，下一次请求会复用不完整历史；请求异常还可能留下半轮消息。","decision":"正常停止路径为已收到的每个调用保留对应 tool 结果：拒绝操作返回拒绝说明，不支持的调用类型返回错误；循环守卫或 endsTurn 终止本轮时，同批剩余调用补“未执行”结果并保持不执行。\n\n普通本轮异常回到加入用户输入前的 checkpoint，丢弃本轮对话消息，使 REPL 可接收下一条输入。AbortError 单独向外传播并关闭输入资源。\n\n这一规则落实[原生调用协议](../architecture/2026-08-31-native-function-calling.md)，同时约束[循环守卫](../feature/2026-09-05-loop-guard-and-request-budget.md)和[动作拒绝](../feature/2026-09-02-action-approval-scope.md)的停止路径。","alternatives":"- 遇到拒绝或结束信号直接 return：控制流短，但当前响应中其余调用可能没有结果。\n- 提前结束仍把剩余调用执行完：消息容易配齐，但会在工作已暂停或结束后继续产生副作用。\n- 异常时仅弹出最后一条消息：保留信息更多，但无法确定半轮中有多少调用未配对，容易留下结构错误。","consequences":"下一次请求可以获得结构完整的历史，代价是异常回退会丢失本轮已观察的信息。正常终止不会走异常回退，而是保留补齐后的历史。\n\n消息回退不是事务回滚：已写入的文件、执行过的命令和 todo 变更都不会撤销。模型重新收到任务时，需要检查外部状态，不能假定本轮从未发生。","outLinks":["implemented/architecture/2026-08-31-native-function-calling.md","implemented/feature/2026-09-02-action-approval-scope.md","implemented/feature/2026-09-05-loop-guard-and-request-budget.md"]},{"id":"implemented/architecture/2026-09-05-bounded-conversation-context.md","sourcePath":"implemented/architecture/2026-09-05-bounded-conversation-context.md","slug":"2026-09-05-bounded-conversation-context","lifecycle":"implemented","cls":"architecture","date":"2026-09-05","title":"用结果截断与整轮裁剪控制发送给模型的历史","status":"implemented","rawBody":"# Agent Note: 用结果截断与整轮裁剪控制发送给模型的历史\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n工具输出和跨轮消息会持续积累。如果每次都发送全部内容，成本与上下文压力不断增加；随意切掉若干消息又可能丢失当前目标或拆开调用与结果。\n\n## Decision\n\n工具结果超过 4000 字符时，公共上下文层保留开头 3000 和结尾 1000 字符，并明确指出中间省略。历史在加入新用户输入前裁剪，保留 system 和最近六个已结束的完整用户轮。\n\n真实轮次由[startsTurn 标记](2026-09-11-user-turn-boundaries.md)确定，不能靠消息数量或角色猜测。单次返回不完整时，模型应使用[定位和分页工具](../feature/2026-09-05-bounded-file-retrieval.md)继续取证。\n\n每次模型响应有 usage 时打印 prompt、completion 和 total，供观察请求规模；工具调用结构遵循[原生协议](2026-08-31-native-function-calling.md)。\n\n## Alternatives considered\n\n- 完整保留全部消息：信息最充分，但无法控制长会话的上下文增长。\n- 按固定条数切消息：实现简单，但可能保留孤立的 tool 结果或截掉用户目标。\n- 立即引入模型摘要和长期记忆：能保留更多跨轮信息，但会增加额外请求、摘要失真与维护逻辑，当前先使用可检查的固定策略。\n\n## Consequences\n\n上下文策略集中在一处，代价是省略内容和早期轮次不可由模型凭记忆恢复。附加截断说明会让结果略超过 4000 字符，六轮也不等于 token 硬上限。\n\nshell 工具自身还有输出截断，公共层看到的结果可能已丢失一部分内容。usage 日志是观察值，不能单凭单次回落证明所有任务的费用已封顶。\n\n## Verification\n\n日期依据：[7b29af1](https://github.com/xilele777/mini-agent/commit/7b29af1) 于 2026-09-05 引入上下文管理。当前依据：[context.ts](../../../../src/context.ts)、[context.test.ts](../../../../src/context.test.ts)、[agent.ts](../../../../src/agent.ts)。测试覆盖头尾截断及整轮保留，无法证明任意输入均不超服务端上下文限额。\n","sections":[{"heading":"Problem","body":"工具输出和跨轮消息会持续积累。如果每次都发送全部内容，成本与上下文压力不断增加；随意切掉若干消息又可能丢失当前目标或拆开调用与结果。","anchor":"section-0"},{"heading":"Decision","body":"工具结果超过 4000 字符时，公共上下文层保留开头 3000 和结尾 1000 字符，并明确指出中间省略。历史在加入新用户输入前裁剪，保留 system 和最近六个已结束的完整用户轮。\n\n真实轮次由[startsTurn 标记](2026-09-11-user-turn-boundaries.md)确定，不能靠消息数量或角色猜测。单次返回不完整时，模型应使用[定位和分页工具](../feature/2026-09-05-bounded-file-retrieval.md)继续取证。\n\n每次模型响应有 usage 时打印 prompt、completion 和 total，供观察请求规模；工具调用结构遵循[原生协议](2026-08-31-native-function-calling.md)。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 完整保留全部消息：信息最充分，但无法控制长会话的上下文增长。\n- 按固定条数切消息：实现简单，但可能保留孤立的 tool 结果或截掉用户目标。\n- 立即引入模型摘要和长期记忆：能保留更多跨轮信息，但会增加额外请求、摘要失真与维护逻辑，当前先使用可检查的固定策略。","anchor":"section-2"},{"heading":"Consequences","body":"上下文策略集中在一处，代价是省略内容和早期轮次不可由模型凭记忆恢复。附加截断说明会让结果略超过 4000 字符，六轮也不等于 token 硬上限。\n\nshell 工具自身还有输出截断，公共层看到的结果可能已丢失一部分内容。usage 日志是观察值，不能单凭单次回落证明所有任务的费用已封顶。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[7b29af1](https://github.com/xilele777/mini-agent/commit/7b29af1) 于 2026-09-05 引入上下文管理。当前依据：[context.ts](../../../../src/context.ts)、[context.test.ts](../../../../src/context.test.ts)、[agent.ts](../../../../src/agent.ts)。测试覆盖头尾截断及整轮保留，无法证明任意输入均不超服务端上下文限额。","anchor":"section-4"}],"problem":"工具输出和跨轮消息会持续积累。如果每次都发送全部内容，成本与上下文压力不断增加；随意切掉若干消息又可能丢失当前目标或拆开调用与结果。","decision":"工具结果超过 4000 字符时，公共上下文层保留开头 3000 和结尾 1000 字符，并明确指出中间省略。历史在加入新用户输入前裁剪，保留 system 和最近六个已结束的完整用户轮。\n\n真实轮次由[startsTurn 标记](2026-09-11-user-turn-boundaries.md)确定，不能靠消息数量或角色猜测。单次返回不完整时，模型应使用[定位和分页工具](../feature/2026-09-05-bounded-file-retrieval.md)继续取证。\n\n每次模型响应有 usage 时打印 prompt、completion 和 total，供观察请求规模；工具调用结构遵循[原生协议](2026-08-31-native-function-calling.md)。","alternatives":"- 完整保留全部消息：信息最充分，但无法控制长会话的上下文增长。\n- 按固定条数切消息：实现简单，但可能保留孤立的 tool 结果或截掉用户目标。\n- 立即引入模型摘要和长期记忆：能保留更多跨轮信息，但会增加额外请求、摘要失真与维护逻辑，当前先使用可检查的固定策略。","consequences":"上下文策略集中在一处，代价是省略内容和早期轮次不可由模型凭记忆恢复。附加截断说明会让结果略超过 4000 字符，六轮也不等于 token 硬上限。\n\nshell 工具自身还有输出截断，公共层看到的结果可能已丢失一部分内容。usage 日志是观察值，不能单凭单次回落证明所有任务的费用已封顶。","outLinks":["implemented/architecture/2026-08-31-native-function-calling.md","implemented/architecture/2026-09-11-user-turn-boundaries.md","implemented/feature/2026-09-05-bounded-file-retrieval.md"]},{"id":"implemented/feature/2026-09-05-bounded-file-retrieval.md","sourcePath":"implemented/feature/2026-09-05-bounded-file-retrieval.md","slug":"2026-09-05-bounded-file-retrieval","lifecycle":"implemented","cls":"feature","date":"2026-09-05","title":"先搜索定位，再分页读取文件，写入采用完整覆盖","status":"implemented","rawBody":"# Agent Note: 先搜索定位，再分页读取文件，写入采用完整覆盖\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n连续整文件读取会把大量无关文本带入上下文。文件变长后，模型既难以定位目标，也可能把截断后的片段误当成完整文件去改写。\n\n## Decision\n\nsearch_files 返回路径、行号和有限的命中行；read_file 接受从 1 开始的 offset/limit，并说明总行数、读取范围和是否到达末尾。工具说明引导先定位再精读，修改已有文件前读取原内容。\n\nread_file 默认最多返回 500 行，单次 limit 不超过 2000；底层仍整文件读取，默认大小上限为 5 MiB。搜索跳过大于 2 MiB 的文件、限制结果数，并将单条命中截至 160 字符。\n\nwrite_file 接受完整新内容、创建父目录并整体覆盖，不提供 patch 或追加协议。工具接入遵循[注册表](../architecture/2026-08-31-tool-registry-boundary.md)，读取权限见[共享路径检查](../bug-fix/2026-09-06-shared-read-guards.md)。\n\n## Alternatives considered\n\n- 继续整文件返回：小文件时最直接，但定位和传输成本随文件长度增长。\n- 只靠搜索片段修改文件：消耗少，但单行命中缺少周围约束，不能替代修改前读取。\n- 先实现通用增量 patch 工具：能减少整文件覆盖，但需要定义上下文匹配、冲突和失败行为，当前学习范围采用完整内容写回。\n\n## Consequences\n\n模型可以围绕行号补读；代价是分页不等于流式 IO，工具结果仍可能被[上下文截断](../architecture/2026-09-05-bounded-conversation-context.md)再次压缩。\n\n当前搜索不检测二进制内容，也不提供完整 glob 语法；其默认起点“.”被目录守卫拒绝，实际应指定项目子目录。这是现有实现限制，不能写成已经修复。\n\n## Verification\n\n日期依据：[1834e56](https://github.com/xilele777/mini-agent/commit/1834e56) 和 [fa29ece](https://github.com/xilele777/mini-agent/commit/fa29ece) 于 2026-09-05 引入分页与搜索，大小限制后续加入。当前依据：[fs.ts](../../../../src/tools/fs.ts)、[grep.ts](../../../../src/tools/grep.ts)。现有 fs 测试仅检查部分拒绝输入，不覆盖所有分页或搜索行为。\n","sections":[{"heading":"Problem","body":"连续整文件读取会把大量无关文本带入上下文。文件变长后，模型既难以定位目标，也可能把截断后的片段误当成完整文件去改写。","anchor":"section-0"},{"heading":"Decision","body":"search_files 返回路径、行号和有限的命中行；read_file 接受从 1 开始的 offset/limit，并说明总行数、读取范围和是否到达末尾。工具说明引导先定位再精读，修改已有文件前读取原内容。\n\nread_file 默认最多返回 500 行，单次 limit 不超过 2000；底层仍整文件读取，默认大小上限为 5 MiB。搜索跳过大于 2 MiB 的文件、限制结果数，并将单条命中截至 160 字符。\n\nwrite_file 接受完整新内容、创建父目录并整体覆盖，不提供 patch 或追加协议。工具接入遵循[注册表](../architecture/2026-08-31-tool-registry-boundary.md)，读取权限见[共享路径检查](../bug-fix/2026-09-06-shared-read-guards.md)。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 继续整文件返回：小文件时最直接，但定位和传输成本随文件长度增长。\n- 只靠搜索片段修改文件：消耗少，但单行命中缺少周围约束，不能替代修改前读取。\n- 先实现通用增量 patch 工具：能减少整文件覆盖，但需要定义上下文匹配、冲突和失败行为，当前学习范围采用完整内容写回。","anchor":"section-2"},{"heading":"Consequences","body":"模型可以围绕行号补读；代价是分页不等于流式 IO，工具结果仍可能被[上下文截断](../architecture/2026-09-05-bounded-conversation-context.md)再次压缩。\n\n当前搜索不检测二进制内容，也不提供完整 glob 语法；其默认起点“.”被目录守卫拒绝，实际应指定项目子目录。这是现有实现限制，不能写成已经修复。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[1834e56](https://github.com/xilele777/mini-agent/commit/1834e56) 和 [fa29ece](https://github.com/xilele777/mini-agent/commit/fa29ece) 于 2026-09-05 引入分页与搜索，大小限制后续加入。当前依据：[fs.ts](../../../../src/tools/fs.ts)、[grep.ts](../../../../src/tools/grep.ts)。现有 fs 测试仅检查部分拒绝输入，不覆盖所有分页或搜索行为。","anchor":"section-4"}],"problem":"连续整文件读取会把大量无关文本带入上下文。文件变长后，模型既难以定位目标，也可能把截断后的片段误当成完整文件去改写。","decision":"search_files 返回路径、行号和有限的命中行；read_file 接受从 1 开始的 offset/limit，并说明总行数、读取范围和是否到达末尾。工具说明引导先定位再精读，修改已有文件前读取原内容。\n\nread_file 默认最多返回 500 行，单次 limit 不超过 2000；底层仍整文件读取，默认大小上限为 5 MiB。搜索跳过大于 2 MiB 的文件、限制结果数，并将单条命中截至 160 字符。\n\nwrite_file 接受完整新内容、创建父目录并整体覆盖，不提供 patch 或追加协议。工具接入遵循[注册表](../architecture/2026-08-31-tool-registry-boundary.md)，读取权限见[共享路径检查](../bug-fix/2026-09-06-shared-read-guards.md)。","alternatives":"- 继续整文件返回：小文件时最直接，但定位和传输成本随文件长度增长。\n- 只靠搜索片段修改文件：消耗少，但单行命中缺少周围约束，不能替代修改前读取。\n- 先实现通用增量 patch 工具：能减少整文件覆盖，但需要定义上下文匹配、冲突和失败行为，当前学习范围采用完整内容写回。","consequences":"模型可以围绕行号补读；代价是分页不等于流式 IO，工具结果仍可能被[上下文截断](../architecture/2026-09-05-bounded-conversation-context.md)再次压缩。\n\n当前搜索不检测二进制内容，也不提供完整 glob 语法；其默认起点“.”被目录守卫拒绝，实际应指定项目子目录。这是现有实现限制，不能写成已经修复。","outLinks":["implemented/architecture/2026-08-31-tool-registry-boundary.md","implemented/architecture/2026-09-05-bounded-conversation-context.md","implemented/bug-fix/2026-09-06-shared-read-guards.md"]},{"id":"implemented/feature/2026-09-05-loop-guard-and-request-budget.md","sourcePath":"implemented/feature/2026-09-05-loop-guard-and-request-budget.md","slug":"2026-09-05-loop-guard-and-request-budget","lifecycle":"implemented","cls":"feature","date":"2026-09-05","title":"用请求上限和连续重复检测限制失控循环","status":"implemented","rawBody":"# Agent Note: 用请求上限和连续重复检测限制失控循环\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n模型可能重复发起没有新信息的调用，或在纯文本说明与内部继续提示之间反复切换。只依靠模型自己判断何时结束，无法为一次用户输入限定工作量。\n\n## Decision\n\n每次真实用户输入最多发起十次模型请求，内部继续提示后的请求也计入。另记录本轮函数调用请求，连续三次工具名和原始参数字符串完全相同时，拦截当前调用并回填守卫说明；累计触发两次后结束本轮。\n\n记录的是请求，不只已成功执行的动作，因此参数错误、拒绝和守卫拦截的请求也会参与检测。守卫早于参数准备和批准执行；它不能替代[明确的完成与暂停出口](2026-09-11-explicit-turn-exits.md)。\n\n## Alternatives considered\n\n- 只设固定请求上限：能够最终停止，但同样动作可能在停止前重复执行很多次。\n- 只检测重复调用：能识别局部循环，但参数变化或纯文本复读仍可能无限继续。\n- 按语义相似度判重：可以捕捉更多重复，但也可能误伤合法探索，并需要定义额外的不确定阈值；当前采用可解释的逐字比较。\n\n## Consequences\n\n失控循环有明确的本轮停止条件，代价是阈值固定，合法重试也可能被拦。改变 JSON 空白、键顺序或穿插其他工具会绕开连续相同判据，不能称为完整循环证明。\n\n结束前仍需遵守[工具结果配对与历史恢复](../bug-fix/2026-09-06-tool-result-history-recovery.md)；提示模型换思路不能覆盖用户此前的拒绝。\n\n## Verification\n\n日期依据：[7b29af1](https://github.com/xilele777/mini-agent/commit/7b29af1) 于 2026-09-05 引入守卫，后续调整终止配对及请求出口。当前依据：[context.ts](../../../../src/context.ts)、[agent.ts](../../../../src/agent.ts)。已有五条判重测试覆盖阈值与参数变化；累计命中、中断剩余调用及纯文本预算仍需主循环用例。\n","sections":[{"heading":"Problem","body":"模型可能重复发起没有新信息的调用，或在纯文本说明与内部继续提示之间反复切换。只依靠模型自己判断何时结束，无法为一次用户输入限定工作量。","anchor":"section-0"},{"heading":"Decision","body":"每次真实用户输入最多发起十次模型请求，内部继续提示后的请求也计入。另记录本轮函数调用请求，连续三次工具名和原始参数字符串完全相同时，拦截当前调用并回填守卫说明；累计触发两次后结束本轮。\n\n记录的是请求，不只已成功执行的动作，因此参数错误、拒绝和守卫拦截的请求也会参与检测。守卫早于参数准备和批准执行；它不能替代[明确的完成与暂停出口](2026-09-11-explicit-turn-exits.md)。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 只设固定请求上限：能够最终停止，但同样动作可能在停止前重复执行很多次。\n- 只检测重复调用：能识别局部循环，但参数变化或纯文本复读仍可能无限继续。\n- 按语义相似度判重：可以捕捉更多重复，但也可能误伤合法探索，并需要定义额外的不确定阈值；当前采用可解释的逐字比较。","anchor":"section-2"},{"heading":"Consequences","body":"失控循环有明确的本轮停止条件，代价是阈值固定，合法重试也可能被拦。改变 JSON 空白、键顺序或穿插其他工具会绕开连续相同判据，不能称为完整循环证明。\n\n结束前仍需遵守[工具结果配对与历史恢复](../bug-fix/2026-09-06-tool-result-history-recovery.md)；提示模型换思路不能覆盖用户此前的拒绝。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[7b29af1](https://github.com/xilele777/mini-agent/commit/7b29af1) 于 2026-09-05 引入守卫，后续调整终止配对及请求出口。当前依据：[context.ts](../../../../src/context.ts)、[agent.ts](../../../../src/agent.ts)。已有五条判重测试覆盖阈值与参数变化；累计命中、中断剩余调用及纯文本预算仍需主循环用例。","anchor":"section-4"}],"problem":"模型可能重复发起没有新信息的调用，或在纯文本说明与内部继续提示之间反复切换。只依靠模型自己判断何时结束，无法为一次用户输入限定工作量。","decision":"每次真实用户输入最多发起十次模型请求，内部继续提示后的请求也计入。另记录本轮函数调用请求，连续三次工具名和原始参数字符串完全相同时，拦截当前调用并回填守卫说明；累计触发两次后结束本轮。\n\n记录的是请求，不只已成功执行的动作，因此参数错误、拒绝和守卫拦截的请求也会参与检测。守卫早于参数准备和批准执行；它不能替代[明确的完成与暂停出口](2026-09-11-explicit-turn-exits.md)。","alternatives":"- 只设固定请求上限：能够最终停止，但同样动作可能在停止前重复执行很多次。\n- 只检测重复调用：能识别局部循环，但参数变化或纯文本复读仍可能无限继续。\n- 按语义相似度判重：可以捕捉更多重复，但也可能误伤合法探索，并需要定义额外的不确定阈值；当前采用可解释的逐字比较。","consequences":"失控循环有明确的本轮停止条件，代价是阈值固定，合法重试也可能被拦。改变 JSON 空白、键顺序或穿插其他工具会绕开连续相同判据，不能称为完整循环证明。\n\n结束前仍需遵守[工具结果配对与历史恢复](../bug-fix/2026-09-06-tool-result-history-recovery.md)；提示模型换思路不能覆盖用户此前的拒绝。","outLinks":["implemented/bug-fix/2026-09-06-tool-result-history-recovery.md","implemented/feature/2026-09-11-explicit-turn-exits.md"]},{"id":"implemented/testing/2026-09-05-verification-scope.md","sourcePath":"implemented/testing/2026-09-05-verification-scope.md","slug":"2026-09-05-verification-scope","lifecycle":"implemented","cls":"testing","date":"2026-09-05","title":"用确定性回归和交互验收分别验证程序与模型行为","status":"implemented","rawBody":"# Agent Note: 用确定性回归和交互验收分别验证程序与模型行为\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n类型检查不能证明工具协议、文件边界和模型选择正确；真实模型用例又有成本和变化。学习项目需要能快速复查的确定性验证，并明确哪些结论只能由实际交互支持。\n\n## Decision\n\n项目使用 node:test、assert 和现有 tsx 执行最小回归。纯函数测试检查截断、重复调用和历史转换；路径及文件工具测试检查部分拒绝与放行情形。npm test 当前运行三个测试文件，共二十一条。\n\n真实终端批准、todo 跨进程恢复、模型如何选择完成与暂停，通过具体手动用例记录。测试报告说明覆盖面，不把“全绿”扩写成全系统正确，也不以代码通过推断学习者已经掌握。\n\n优先保护[上下文边界](../architecture/2026-09-05-bounded-conversation-context.md)、[读取检查](../bug-fix/2026-09-06-shared-read-guards.md)和[真实用户轮](../architecture/2026-09-11-user-turn-boundaries.md)等可重复观察的行为。\n\n## Alternatives considered\n\n- 只靠手动运行：接近真实使用，但对每次小改动重做全部步骤成本较高，边界回归难以保持一致。\n- 只运行类型检查：反馈快，但类型正确的代码仍可错误裁剪历史、过早执行或拒绝错误路径。\n- 立即引入大型测试框架和全部端到端模拟：功能丰富，但当前已有依赖可验证关键纯逻辑；复杂设施应由具体测试需求驱动。\n\n## Consequences\n\n回归可在本地快速重复，代价是覆盖有限。当前缺少批准缓存、todo 崩溃与并发、shell 中断、主循环同批结束配对等专门自动化用例。\n\n现有链接测试的夹具位于项目外，不能独立证明项目内 realpath 逃逸分支。请求中明确指示模型暂停的手动用例，也不能证明任意自然表述都有效。\n\n## Verification\n\n日期依据：[7b29af1](https://github.com/xilele777/mini-agent/commit/7b29af1) 于 2026-09-05 引入纯函数测试，后续提交扩展至二十一条。当前依据：[context.test.ts](../../../../src/context.test.ts)、[guard.test.ts](../../../../src/guard.test.ts)、[fs.test.ts](../../../../src/tools/fs.test.ts)。最近实际运行结果与学习证据见[进度](../../../learning/progress.md)。\n","sections":[{"heading":"Problem","body":"类型检查不能证明工具协议、文件边界和模型选择正确；真实模型用例又有成本和变化。学习项目需要能快速复查的确定性验证，并明确哪些结论只能由实际交互支持。","anchor":"section-0"},{"heading":"Decision","body":"项目使用 node:test、assert 和现有 tsx 执行最小回归。纯函数测试检查截断、重复调用和历史转换；路径及文件工具测试检查部分拒绝与放行情形。npm test 当前运行三个测试文件，共二十一条。\n\n真实终端批准、todo 跨进程恢复、模型如何选择完成与暂停，通过具体手动用例记录。测试报告说明覆盖面，不把“全绿”扩写成全系统正确，也不以代码通过推断学习者已经掌握。\n\n优先保护[上下文边界](../architecture/2026-09-05-bounded-conversation-context.md)、[读取检查](../bug-fix/2026-09-06-shared-read-guards.md)和[真实用户轮](../architecture/2026-09-11-user-turn-boundaries.md)等可重复观察的行为。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 只靠手动运行：接近真实使用，但对每次小改动重做全部步骤成本较高，边界回归难以保持一致。\n- 只运行类型检查：反馈快，但类型正确的代码仍可错误裁剪历史、过早执行或拒绝错误路径。\n- 立即引入大型测试框架和全部端到端模拟：功能丰富，但当前已有依赖可验证关键纯逻辑；复杂设施应由具体测试需求驱动。","anchor":"section-2"},{"heading":"Consequences","body":"回归可在本地快速重复，代价是覆盖有限。当前缺少批准缓存、todo 崩溃与并发、shell 中断、主循环同批结束配对等专门自动化用例。\n\n现有链接测试的夹具位于项目外，不能独立证明项目内 realpath 逃逸分支。请求中明确指示模型暂停的手动用例，也不能证明任意自然表述都有效。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[7b29af1](https://github.com/xilele777/mini-agent/commit/7b29af1) 于 2026-09-05 引入纯函数测试，后续提交扩展至二十一条。当前依据：[context.test.ts](../../../../src/context.test.ts)、[guard.test.ts](../../../../src/guard.test.ts)、[fs.test.ts](../../../../src/tools/fs.test.ts)。最近实际运行结果与学习证据见[进度](../../../learning/progress.md)。","anchor":"section-4"}],"problem":"类型检查不能证明工具协议、文件边界和模型选择正确；真实模型用例又有成本和变化。学习项目需要能快速复查的确定性验证，并明确哪些结论只能由实际交互支持。","decision":"项目使用 node:test、assert 和现有 tsx 执行最小回归。纯函数测试检查截断、重复调用和历史转换；路径及文件工具测试检查部分拒绝与放行情形。npm test 当前运行三个测试文件，共二十一条。\n\n真实终端批准、todo 跨进程恢复、模型如何选择完成与暂停，通过具体手动用例记录。测试报告说明覆盖面，不把“全绿”扩写成全系统正确，也不以代码通过推断学习者已经掌握。\n\n优先保护[上下文边界](../architecture/2026-09-05-bounded-conversation-context.md)、[读取检查](../bug-fix/2026-09-06-shared-read-guards.md)和[真实用户轮](../architecture/2026-09-11-user-turn-boundaries.md)等可重复观察的行为。","alternatives":"- 只靠手动运行：接近真实使用，但对每次小改动重做全部步骤成本较高，边界回归难以保持一致。\n- 只运行类型检查：反馈快，但类型正确的代码仍可错误裁剪历史、过早执行或拒绝错误路径。\n- 立即引入大型测试框架和全部端到端模拟：功能丰富，但当前已有依赖可验证关键纯逻辑；复杂设施应由具体测试需求驱动。","consequences":"回归可在本地快速重复，代价是覆盖有限。当前缺少批准缓存、todo 崩溃与并发、shell 中断、主循环同批结束配对等专门自动化用例。\n\n现有链接测试的夹具位于项目外，不能独立证明项目内 realpath 逃逸分支。请求中明确指示模型暂停的手动用例，也不能证明任意自然表述都有效。","outLinks":["implemented/architecture/2026-09-05-bounded-conversation-context.md","implemented/architecture/2026-09-11-user-turn-boundaries.md","implemented/bug-fix/2026-09-06-shared-read-guards.md"]},{"id":"implemented/architecture/2026-09-02-shared-terminal-input.md","sourcePath":"implemented/architecture/2026-09-02-shared-terminal-input.md","slug":"2026-09-02-shared-terminal-input","lifecycle":"implemented","cls":"architecture","date":"2026-09-02","title":"REPL、批准和提问共享一个终端输入实例","status":"implemented","rawBody":"# Agent Note: REPL、批准和提问共享一个终端输入实例\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\nREPL、操作批准和执行中提问都读取同一个 stdin。若每个模块各建一个 readline，输入可能被不同实例竞争消费，退出时也难以确定由谁释放资源。\n\n## Decision\n\nui.ts 懒初始化唯一的 readline 实例，并通过 ask 与 closeUI 暴露输入和关闭能力。导入模块本身不打开输入流；main 在 finally 统一关闭。\n\nCtrl+C 的 AbortError 向外层传播并转为取消退出，普通本轮错误由内层恢复历史。批准框和 ask_user 都复用这个输入入口；[动作批准](../feature/2026-09-02-action-approval-scope.md)与[显式出口](../feature/2026-09-11-explicit-turn-exits.md)使用各自的控制语义。\n\n## Alternatives considered\n\n- 每个模块各建 readline：模块看似独立，但多个实例会共同监听同一输入流。\n- 把所有询问代码放在主循环：资源归属集中，但会把批准细节和提问工具的业务耦合到循环。\n- 只在正常 exit 路径 close：实现最少，但异常或 Ctrl+C 路径可能保留输入资源。\n\n## Consequences\n\n输入资源由统一模块管理，状态控制仍属于调用方。代价是当前交互按顺序等待，不能把共享 readline 当成多请求并发输入机制。\n\n关闭 UI 只释放终端资源，不撤销此前的工具副作用。需要并发交互或多个会话时必须重新设计输入归属。\n\n## Verification\n\n日期依据：[f8e6831](https://github.com/xilele777/mini-agent/commit/f8e6831) 于 2026-09-02 引入 ui.ts 和批准流程；ask_user 后续复用。当前依据：[ui.ts](../../../../src/ui.ts)、[agent.ts](../../../../src/agent.ts)、[control.ts](../../../../src/tools/control.ts)。已有交接包含 exit、quit 和 Ctrl+C 的手动记录；自动化测试不覆盖终端竞争。\n","sections":[{"heading":"Problem","body":"REPL、操作批准和执行中提问都读取同一个 stdin。若每个模块各建一个 readline，输入可能被不同实例竞争消费，退出时也难以确定由谁释放资源。","anchor":"section-0"},{"heading":"Decision","body":"ui.ts 懒初始化唯一的 readline 实例，并通过 ask 与 closeUI 暴露输入和关闭能力。导入模块本身不打开输入流；main 在 finally 统一关闭。\n\nCtrl+C 的 AbortError 向外层传播并转为取消退出，普通本轮错误由内层恢复历史。批准框和 ask_user 都复用这个输入入口；[动作批准](../feature/2026-09-02-action-approval-scope.md)与[显式出口](../feature/2026-09-11-explicit-turn-exits.md)使用各自的控制语义。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 每个模块各建 readline：模块看似独立，但多个实例会共同监听同一输入流。\n- 把所有询问代码放在主循环：资源归属集中，但会把批准细节和提问工具的业务耦合到循环。\n- 只在正常 exit 路径 close：实现最少，但异常或 Ctrl+C 路径可能保留输入资源。","anchor":"section-2"},{"heading":"Consequences","body":"输入资源由统一模块管理，状态控制仍属于调用方。代价是当前交互按顺序等待，不能把共享 readline 当成多请求并发输入机制。\n\n关闭 UI 只释放终端资源，不撤销此前的工具副作用。需要并发交互或多个会话时必须重新设计输入归属。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[f8e6831](https://github.com/xilele777/mini-agent/commit/f8e6831) 于 2026-09-02 引入 ui.ts 和批准流程；ask_user 后续复用。当前依据：[ui.ts](../../../../s 具体动作，代价是不同 JSON 属性顺序仍可能触发重复确认。即使参数相同，外部文件变化也可能改变操作结果，缓存不是效果保证。\n\n预览能力存在差异：shell 显示完整命令，write_file 当前只预览前 20 行；不能笼统宣称所有写入内容都被完整展示。拒绝后的停止要求也不是程序强制的跨轮黑名单。\n\n## Verification\n\n日期依据：[f8e6831](https://github.com/xilele777/mini-agent/commit/f8e6831) 于 2026-09-02 引入批准。当前依据：[approval.ts](../../../../src/approval.ts)、[fs.ts](../../../../src/tools/fs.ts)、[bash.ts](../../../../src/tools/bash.ts)。验证需覆盖相同动作缓存、参数变化、重启与拒绝回填；现有自动化测试不替代这些交互用例。\n","sections":[{"heading":"Problem","body":"允许某工具的一次操作，不足以允许它未来的任意参数。任意路径写入和 shell 可以影响用户文件，过宽或长期缓存会扩大一次有限批准的范围。","anchor":"section-0"},{"heading":"Decision","body":"批准缓存键由工具名、分隔符和校验后完整参数的 JSON 字符串组成。y 只允许本次，n 拒绝本次，a 在当前进程内记住相同键，重启后失效。\n\n主循环依据 Tool.needsApproval 进入批准流程，先经[注册表](../architecture/2026-08-31-tool-registry-boundary.md)准备参数，再通过[共享终端](../architecture/2026-09-02-shared-terminal-input.md)取得决定，最后执行。拒绝也要回填调用结果，并告知模型不重试、不换工具绕过。\n\n批准看操作范围，不单看是否写盘：任意文件和 shell 需批准，路径固定且只维护自身草稿的 todo 不要求每次询问。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 按工具名记住允许：交互少，但允许 pwd 会连带覆盖其他 shell 命令。\n- 完全不缓存：权限语义直接，但重复相同动作会增加人工操作；当前采用有限的会话内复用。\n- 将批准写入磁盘：重启后方便，但项目环境和任务意图可能变化，旧批准不能证明新情境下仍合适。","anchor":"section-2"},{"heading":"Consequences","body":"用户可检查具体动作，代价是不同 JSON 属性顺序仍可能触发重复确认。即使参数相同，外部文件变化也可能改变操作结果，缓存不是效果保证。\n\n预览能力存在差异：shell 显示完整命令，write_file 当前只预览前 20 行；不能笼统宣称所有写入内容都被完整展示。拒绝后的停止要求也不是程序强制的跨轮黑名单。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[f8e6831](https://github.com/xilele777/mini-agent/commit/f8e6831) 于 2026-09-02 引入批准。当前依据：[approval.ts](../../../../src/approval.ts)、[fs.ts](../../../../src/tools/fs.ts)、[bash.ts](../../../../src/tools/bash.ts)。验证需覆盖相同动作缓存、参数变化、重启与拒绝回填；现有自动化测试不替代这些交互用例。","anchor":"section-4"}],"problem":"允许某工具的一次操作，不足以允许它未来的任意参数。任意路径写入和 shell 可以影响用户文件，过宽或长期缓存会扩大一次有限批准的范围。","decision":"批准缓存键由工具名、分隔符和校验后完整参数的 JSON 字符串组成。y 只允许本次，n 拒绝本次，a 在当前进程内记住相同键，重启后失效。\n\n主循环依据 Tool.needsApproval 进入批准流程，先经[注册表](../architecture/2026-08-31-tool-registry-boundary.md)准备参数，再通过[共享终端](../architecture/2026-09-02-shared-terminal-input.md)取得决定，最后执行。拒绝也要回填调用结果，并告知模型不重试、不换工具绕过。\n\n批准看操作范围，不单看是否写盘：任意文件和 shell 需批准，路径固定且只维护自身草稿的 todo 不要求每次询问。","alternatives":"- 按工具名记住允许：交互少，但允许 pwd 会连带覆盖其他 shell 命令。\n- 完全不缓存：权限语义直接，但重复相同动作会增加人工操作；当前采用有限的会话内复用。\n- 将批准写入磁盘：重启后方便，但项目环境和任务意图可能变化，旧批准不能证明新情境下仍合适。","consequences":"用户可检查具体动作，代价是不同 JSON 属性顺序仍可能触发重复确认。即使参数相同，外部文件变化也可能改变操作结果，缓存不是效果保证。\n\n预览能力存在差异：shell 显示完整命令，write_file 当前只预览前 20 行；不能笼统宣称所有写入内容都被完整展示。拒绝后的停止要求也不是程序强制的跨轮黑名单。","outLinks":["implemented/architecture/2026-08-31-tool-registry-boundary.md","implemented/architecture/2026-09-02-shared-terminal-input.md"]},{"id":"implemented/architecture/2026-08-31-native-function-calling.md","sourcePath":"implemented/architecture/2026-08-31-native-function-calling.md","slug":"2026-08-31-native-function-calling","lifecycle":"implemented","cls":"architecture","date":"2026-08-31","title":"用原生 Function Calling 承载动作协议","status":"implemented","rawBody":"# Agent Note: 用原生 Function Calling 承载动作协议\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n模型的自然语言回复可能夹带解释、改变格式或同时提出多个动作。把 Action 和参数藏在普通文本中，会让业务执行依赖文本正则是否恰好匹配。\n\n## Decision\n\n当前循环从响应的 tool_calls 读取函数名、参数字符串和调用 ID，并通过 tools 提供参数说明。assistant 响应先加入历史，每个调用随后获得带匹配 tool_call_id 的 tool 结果，再进入下一次请求。\n\n服务端返回结构不替代本地校验：参数仍需 JSON.parse 和 Zod 校验，未知工具也必须反馈错误。[工具注册表](2026-08-31-tool-registry-boundary.md)维护具体定义；调用失败或提前停止的配对要求由[历史恢复规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)落实。\n\n## Alternatives considered\n\n- 继续解析 Thought/Action 文本：能直观看到手写协议的工作过程，适合作为初始练习，但格式漂移会影响实际工具调用。\n- 相信原生参数无需校验：减少本地代码，但兼容服务、模型输出和工具业务约束仍可能不一致，非法参数不能直接进入执行。\n- 只把执行结果作为普通 assistant 文本追加：消息结构简单，但失去调用 ID 对应关系，不能满足当前工具调用协议。\n\n## Consequences\n\n动作协议与普通讲解分开，程序可以处理同一响应中的多个调用。代价是必须维护完整消息配对，并处理不支持的调用类型。\n\n当前工具调用按 for 循环逐个执行。同一响应提出多个动作，不等于程序已实现并行执行或事务。\n\n## Verification\n\n日期依据：[8f4f148](https://github.com/xilele777/mini-agent/commit/8f4f148) 于 2026-08-31 接入 tool_calls。当前实现见 [agent.ts](../../../../src/agent.ts) 与 [tools/index.ts](../../../../src/tools/index.ts)。本次依据代码和 Git 记录整理，不新增真实模型运行证据。\n","sections":[{"heading":"Problem","body":"模型的自然语言回复可能夹带解释、改变格式或同时提出多个动作。把 Action 和参数藏在普通文本中，会让业务执行依赖文本正则是否恰好匹配。","anchor":"section-0"},{"heading":"Decision","body":"当前循环从响应的 tool_calls 读取函数名、参数字符串和调用 ID，并通过 tools 提供参数说明。assistant 响应先加入历史，每个调用随后获得带匹配 tool_call_id 的 tool 结果，再进入下一次请求。\n\n服务端返回结构不替代本地校验：参数仍需 JSON.parse 和 Zod 校验，未知工具也必须反馈错误。[工具注册表](2026-08-31-tool-registry-boundary.md)维护具体定义；调用失败或提前停止的配对要求由[历史恢复规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)落实。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 继续解析 Thought/Action 文本：能直观看到手写协议的工作过程，适合作为初始练习，但格式漂移会影响实际工具调用。\n- 相信原生参数无需校验：减少本地代码，但兼容服务、模型输出和工具业务约束仍可能不一致，非法参数不能直接进入执行。\n- 只把执行结果作为普通 assistant 文本追加：消息结构简单，但失去调用 ID 对应关系，不能满足当前工具调用协议。","anchor":"section-2"},{"heading":"Consequences","body":"动作协议与普通讲解分开，程序可以处理同一响应中的多个调用。代价是必须维护完整消息配对，并处理不支持的调用类型。\n\n当前工具调用按 for 循环逐个执行。同一响应提出多个动作，不等于程序已实现并行执行或事务。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[8f4f148](https://github.com/xilele777/mini-agent/commit/8f4f148) 于 2026-08-31 接入 tool_calls。当前实现见 [agent.ts](../../../../src/agent.ts) 与 [tools/index.ts](../../../../src/tools/index.ts)。本次依据代码和 Git 记录整理，不新增真实模型运行证据。","anchor":"section-4"}],"problem":"模型的自然语言回复可能夹带解释、改变格式或同时提出多个动作。把 Action 和参数藏在普通文本中，会让业务执行依赖文本正则是否恰好匹配。","decision":"当前循环从响应的 tool_calls 读取函数名、参数字符串和调用 ID，并通过 tools 提供参数说明。assistant 响应先加入历史，每个调用随后获得带匹配 tool_call_id 的 tool 结果，再进入下一次请求。\n\n服务端返回结构不替代本地校验：参数仍需 JSON.parse 和 Zod 校验，未知工具也必须反馈错误。[工具注册表](2026-08-31-tool-registry-boundary.md)维护具体定义；调用失败或提前停止的配对要求由[历史恢复规则](../bug-fix/2026-09-06-tool-result-history-recovery.md)落实。","alternatives":"- 继续解析 Thought/Action 文本：能直观看到手写协议的工作过程，适合作为初始练习，但格式漂移会影响实际工具调用。\n- 相信原生参数无需校验：减少本地代码，但兼容服务、模型输出和工具业务约束仍可能不一致，非法参数不能直接进入执行。\n- 只把执行结果作为普通 assistant 文本追加：消息结构简单，但失去调用 ID 对应关系，不能满足当前工具调用协议。","consequences":"动作协议与普通讲解分开，程序可以处理同一响应中的多个调用。代价是必须维护完整消息配对，并处理不支持的调用类型。\n\n当前工具调用按 for 循环逐个执行。同一响应提出多个动作，不等于程序已实现并行执行或事务。","outLinks":["implemented/architecture/2026-08-31-tool-registry-boundary.md","implemented/bug-fix/2026-09-06-tool-result-history-recovery.md"]},{"id":"implemented/architecture/2026-08-31-tool-registry-boundary.md","sourcePath":"implemented/architecture/2026-08-31-tool-registry-boundary.md","slug":"2026-08-31-tool-registry-boundary","lifecycle":"implemented","cls":"architecture","date":"2026-08-31","title":"统一工具注册表，让主循环只处理公共流程","status":"implemented","rawBody":"# Agent Note: 统一工具注册表，让主循环只处理公共流程\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n工具增多时，若主循环分别识别计算、文件、shell 和 todo，参数说明、批准和初始化逻辑会散布在各处分支中，新增工具容易改坏共同流程。\n\n## Decision\n\n主循环仅通过注册表取得工具 schema、准备调用、执行调用和恢复状态，不导入具体工具。Tool 统一描述 name、description、schema、execute，以及可选的 needsApproval、preview、endsTurn。\n\n同一份 Zod schema 同时生成模型参数说明和执行前的运行时校验。prepareCall 同步完成查表、JSON 解析和 safeParse，确认通过后才进入 executeCall；可预期的错误转换为结果文本，返回模型修正。\n\n这套结构建立在[原生调用协议](2026-08-31-native-function-calling.md)之上。initTools 汇集有状态工具的启动入口，但具体状态仍归工具模块所有。\n\n## Alternatives considered\n\n- 主循环直接 import 并分支调用：少量工具时直观，但每增加工具都会影响公共控制流程。\n- 仅维护名称到函数的 Map：映射更小，但 schema、批准预览和结束信号还需要其他分散约定。\n- 分别手写 JSON Schema 与校验代码：两边都能自由调整，但参数约束容易漂移；当前已有 Zod 4，可以复用其 toJSONSchema。\n\n## Consequences\n\n新增普通工具集中在工具模块和注册表。代价是公共接口变化需要审视所有工具，不能把单个工具的特殊业务不断提升为通用字段。\n\n工具定义的类型检查不等于任意工具配对都具有静态证明；注册表保留通用 Tool 类型，运行时 schema 仍是执行边界。executeCall 的错误转换也不涵盖全部启动或主循环异常。\n\n## Verification\n\n日期依据：[1c9e090](https://github.com/xilele777/mini-agent/commit/1c9e090) 于 2026-08-31 抽取接口与注册表；批准拆分和 initTools 属于后续维护。当前依据：[types.ts](../../../../src/tools/types.ts)、[index.ts](../../../../src/tools/index.ts)、[agent.ts](../../../../src/agent.ts)。npm run typecheck 检查类型接入，完整批准链路仍需交互验收。\n","sections":[{"heading":"Problem","body":"工具增多时，若主循环分别识别计算、文件、shell 和 todo，参数说明、批准和初始化逻辑会散布在各处分支中，新增工具容易改坏共同流程。","anchor":"section-0"},{"heading":"Decision","body":"主循环仅通过注册表取得工具 schema、准备调用、执行调用和恢复状态，不导入具体工具。Tool 统一描述 name、description、schema、execute，以及可选的 needsApproval、preview、endsTurn。\n\n同一份 Zod schema 同时生成模型参数说明和执行前的运行时校验。prepareCall 同步完成查表、JSON 解析和 safeParse，确认通过后才进入 executeCall；可预期的错误转换为结果文本，返回模型修正。\n\n这套结构建立在[原生调用协议](2026-08-31-native-function-calling.md)之上。initTools 汇集有状态工具的启动入口，但具体状态仍归工具模块所有。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 主循环直接 import 并分支调用：少量工具时直观，但每增加工具都会影响公共控制流程。\n- 仅维护名称到函数的 Map：映射更小，但 schema、批准预览和结束信号还需要其他分散约定。\n- 分别手写 JSON Schema 与校验代码：两边都能自由调整，但参数约束容易漂移；当前已有 Zod 4，可以复用其 toJSONSchema。","anchor":"section-2"},{"heading":"Consequences","body":"新增普通工具集中在工具模块和注册表。代价是公共接口变化需要审视所有工具，不能把单个工具的特殊业务不断提升为通用字段。\n\n工具定义的类型检查不等于任意工具配对都具有静态证明；注册表保留通用 Tool 类型，运行时 schema 仍是执行边界。executeCall 的错误转换也不涵盖全部启动或主循环异常。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[1c9e090](https://github.com/xilele777/mini-agent/commit/1c9e090) 于 2026-08-31 抽取接口与注册表；批准拆分和 initTools 属于后续维护。当前依据：[types.ts](../../../../src/tools/types.ts)、[index.ts](../../../../src/tools/index.ts)、[agent.ts](../../../../src/agent.ts)。npm run typecheck 检查类型接入，完整批准链路仍需交互验收。","anchor":"section-4"}],"problem":"工具增多时，若主循环分别识别计算、文件、shell 和 todo，参数说明、批准和初始化逻辑会散布在各处分支中，新增工具容易改坏共同流程。","decision":"主循环仅通过注册表取得工具 schema、准备调用、执行调用和恢复状态，不导入具体工具。Tool 统一描述 name、description、schema、execute，以及可选的 needsApproval、preview、endsTurn。\n\n同一份 Zod schema 同时生成模型参数说明和执行前的运行时校验。prepareCall 同步完成查表、JSON 解析和 safeParse，确认通过后才进入 executeCall；可预期的错误转换为结果文本，返回模型修正。\n\n这套结构建立在[原生调用协议](2026-08-31-native-function-calling.md)之上。initTools 汇集有状态工具的启动入口，但具体状态仍归工具模块所有。","alternatives":"- 主循环直接 import 并分支调用：少量工具时直观，但每增加工具都会影响公共控制流程。\n- 仅维护名称到函数的 Map：映射更小，但 schema、批准预览和结束信号还需要其他分散约定。\n- 分别手写 JSON Schema 与校验代码：两边都能自由调整，但参数约束容易漂移；当前已有 Zod 4，可以复用其 toJSONSchema。","consequences":"新增普通工具集中在工具模块和注册表。代价是公共接口变化需要审视所有工具，不能把单个工具的特殊业务不断提升为通用字段。\n\n工具定义的类型检查不等于任意工具配对都具有静态证明；注册表保留通用 Tool 类型，运行时 schema 仍是执行边界。executeCall 的错误转换也不涵盖全部启动或主循环异常。","outLinks":["implemented/architecture/2026-08-31-native-function-calling.md"]},{"id":"implemented/simplification/2026-08-31-remove-handwritten-react-parser.md","sourcePath":"implemented/simplification/2026-08-31-remove-handwritten-react-parser.md","slug":"2026-08-31-remove-handwritten-react-parser","lifecycle":"implemented","cls":"simplification","date":"2026-08-31","title":"删除手写 ReAct 解析器，实验保留在 Git 历史","status":"implemented","rawBody":"# Agent Note: 删除手写 ReAct 解析器，实验保留在 Git 历史\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n手写 Action 解析器完成了初始教学目标后，当前入口使用另一套调用协议。继续保留无人引用的协议文件，会让接手者误以为仍需维护两套有效机制。\n\n## Decision\n\n当前源码只保留正在使用的原生工具调用路径。阶段 1 的 protocol.ts、parse 和 ParseResult 从工作树删除，早期实验可以通过 Git 取回。\n\n工具使用说明放在各工具 description 中；system prompt 承担工作目录、批准语义和本轮目标等跨工具要求。这个取舍依赖[原生 Function Calling](../architecture/2026-08-31-native-function-calling.md)和[注册表](../architecture/2026-08-31-tool-registry-boundary.md)已经成为当前执行路径。\n\n## Alternatives considered\n\n- 原样保留旧文件作参考：离线阅读方便，但无人调用的实现容易被误当成当前约束。\n- 同时维护文本协议与原生协议：能兼容没有工具调用能力的模型，但会增加测试和行为分歧，当前没有这一支持目标。\n- 在 system prompt 中重复所有工具纪律：集中可见，但会形成两份需同步的说明；跨工具约束仍有必要保留。\n\n## Consequences\n\n运行时协议与当前代码保持一致，代价是阅读阶段 1 需要访问 Git 历史。此次删除不能推广成“所有演示文件都应删除”：index.ts 仍是可独立运行的 API 演示。\n\n若未来确实需要文本协议兼容，应作为新能力说明支持范围和验证方式，不直接恢复旧解析器。\n\n## Verification\n\n日期依据：[2b048d0](https://github.com/xilele777/mini-agent/commit/2b048d0) 于 2026-08-31 删除 protocol.ts；原实验见 [eeee5c5](https://github.com/xilele777/mini-agent/commit/eeee5c5)。提交记录中的单次输出一致只证明该实验，不代表所有提示词删减都保持模型行为不变。\n","sections":[{"heading":"Problem","body":"手写 Action 解析器完成了初始教学目标后，当前入口使用另一套调用协议。继续保留无人引用的协议文件，会让接手者误以为仍需维护两套有效机制。","anchor":"section-0"},{"heading":"Decision","body":"当前源码只保留正在使用的原生工具调用路径。阶段 1 的 protocol.ts、parse 和 ParseResult 从工作树删除，早期实验可以通过 Git 取回。\n\n工具使用说明放在各工具 description 中；system prompt 承担工作目录、批准语义和本轮目标等跨工具要求。这个取舍依赖[原生 Function Calling](../architecture/2026-08-31-native-function-calling.md)和[注册表](../architecture/2026-08-31-tool-registry-boundary.md)已经成为当前执行路径。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 原样保留旧文件作参考：离线阅读方便，但无人调用的实现容易被误当成当前约束。\n- 同时维护文本协议与原生协议：能兼容没有工具调用能力的模型，但会增加测试和行为分歧，当前没有这一支持目标。\n- 在 system prompt 中重复所有工具纪律：集中可见，但会形成两份需同步的说明；跨工具约束仍有必要保留。","anchor":"section-2"},{"heading":"Consequences","body":"运行时协议与当前代码保持一致，代价是阅读阶段 1 需要访问 Git 历史。此次删除不能推广成“所有演示文件都应删除”：index.ts 仍是可独立运行的 API 演示。\n\n若未来确实需要文本协议兼容，应作为新能力说明支持范围和验证方式，不直接恢复旧解析器。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[2b048d0](https://github.com/xilele777/mini-agent/commit/2b048d0) 于 2026-08-31 删除 protocol.ts；原实验见 [eeee5c5](https://github.com/xilele777/mini-agent/commit/eeee5c5)。提交记录中的单次输出一致只证明该实验，不代表所有提示词删减都保持模型行为不变。","anchor":"section-4"}],"problem":"手写 Action 解析器完成了初始教学目标后，当前入口使用另一套调用协议。继续保留无人引用的协议文件，会让接手者误以为仍需维护两套有效机制。","decision":"当前源码只保留正在使用的原生工具调用路径。阶段 1 的 protocol.ts、parse 和 ParseResult 从工作树删除，早期实验可以通过 Git 取回。\n\n工具使用说明放在各工具 description 中；system prompt 承担工作目录、批准语义和本轮目标等跨工具要求。这个取舍依赖[原生 Function Calling](../architecture/2026-08-31-native-function-calling.md)和[注册表](../architecture/2026-08-31-tool-registry-boundary.md)已经成为当前执行路径。","alternatives":"- 原样保留旧文件作参考：离线阅读方便，但无人调用的实现容易被误当成当前约束。\n- 同时维护文本协议与原生协议：能兼容没有工具调用能力的模型，但会增加测试和行为分歧，当前没有这一支持目标。\n- 在 system prompt 中重复所有工具纪律：集中可见，但会形成两份需同步的说明；跨工具约束仍有必要保留。","consequences":"运行时协议与当前代码保持一致，代价是阅读阶段 1 需要访问 Git 历史。此次删除不能推广成“所有演示文件都应删除”：index.ts 仍是可独立运行的 API 演示。\n\n若未来确实需要文本协议兼容，应作为新能力说明支持范围和验证方式，不直接恢复旧解析器。","outLinks":["implemented/architecture/2026-08-31-native-function-calling.md","implemented/architecture/2026-08-31-tool-registry-boundary.md"]},{"id":"implemented/architecture/2026-08-30-local-cli-and-sdk.md","sourcePath":"implemented/architecture/2026-08-30-local-cli-and-sdk.md","slug":"2026-08-30-local-cli-and-sdk","lifecycle":"implemented","cls":"architecture","date":"2026-08-30","title":"用本地 CLI 与直接模型调用学习 Agent 内核","status":"implemented","rawBody":"# Agent Note: 用本地 CLI 与直接模型调用学习 Agent 内核\n\nStatus: implemented\n\n整理日期：2026-09-11。文件名日期的依据见 Verification。\n\n## Problem\n\n学习目标是亲自理解“发送上下文、接收动作、执行工具、回填结果”的过程。若入口同时承担网页、服务部署和框架配置，排错时很难区分模型协议、程序逻辑与周边设施的问题。\n\n## Decision\n\n项目使用 TypeScript、OpenAI-compatible 客户端和本地终端，直接实现 Agent 主循环。模型负责提出调用，本地程序负责校验与执行；运行入口是 agent.ts，index.ts 保留为独立 API 演示。\n\n模型连接配置集中在 llm.ts，密钥和地址来自环境变量。当前主循环使用完整响应；流式输出、向量检索和子 Agent 都不是已实现能力。功能逐阶段进入，具体协作方法由[独立教练工作流](../process/2026-09-11-learning-workflow-and-notes.md)管理。\n\n## Alternatives considered\n\n- 直接采用 Agent 框架：能复用编排和集成能力，但会隐藏本项目要学习的消息、工具和循环机制；有明确复用需求后再评估。\n- 先做网页应用：能提供更丰富的交互，但会增加前后端和部署问题，本阶段终端已能承载输入、批准与结果。\n- 停留在单次 API 演示：验证连接最简单，但不能观察工具结果如何驱动后续动作，因此保留演示并以 CLI 承载后续练习。\n\n## Consequences\n\n当前依赖规模小，主循环与协议细节可直接阅读；代价是错误处理、上下文管理和终端生命周期都需要自行实现。模型名和本机 shell 配置仍有固定值，不能把“兼容接口”理解成所有服务无需适配。\n\n后续能力是否加入，以学习目标和可验证的问题为依据；目录中没有对应实现的方向不标为已完成。\n\n## Verification\n\n日期依据：[3db813f](https://github.com/xilele777/mini-agent/commit/3db813f) 于 2026-08-30 建立最小客户端，CLI 与工具链由后续提交演进。当前依据：[package.json](../../../../package.json)、[llm.ts](../../../../src/llm.ts)、[agent.ts](../../../../src/agent.ts)。历史学习设计只提供背景，技术版本以当前文件为准。\n","sections":[{"heading":"Problem","body":"学习目标是亲自理解“发送上下文、接收动作、执行工具、回填结果”的过程。若入口同时承担网页、服务部署和框架配置，排错时很难区分模型协议、程序逻辑与周边设施的问题。","anchor":"section-0"},{"heading":"Decision","body":"项目使用 TypeScript、OpenAI-compatible 客户端和本地终端，直接实现 Agent 主循环。模型负责提出调用，本地程序负责校验与执行；运行入口是 agent.ts，index.ts 保留为独立 API 演示。\n\n模型连接配置集中在 llm.ts，密钥和地址来自环境变量。当前主循环使用完整响应；流式输出、向量检索和子 Agent 都不是已实现能力。功能逐阶段进入，具体协作方法由[独立教练工作流](../process/2026-09-11-learning-workflow-and-notes.md)管理。","anchor":"section-1"},{"heading":"Alternatives considered","body":"- 直接采用 Agent 框架：能复用编排和集成能力，但会隐藏本项目要学习的消息、工具和循环机制；有明确复用需求后再评估。\n- 先做网页应用：能提供更丰富的交互，但会增加前后端和部署问题，本阶段终端已能承载输入、批准与结果。\n- 停留在单次 API 演示：验证连接最简单，但不能观察工具结果如何驱动后续动作，因此保留演示并以 CLI 承载后续练习。","anchor":"section-2"},{"heading":"Consequences","body":"当前依赖规模小，主循环与协议细节可直接阅读；代价是错误处理、上下文管理和终端生命周期都需要自行实现。模型名和本机 shell 配置仍有固定值，不能把“兼容接口”理解成所有服务无需适配。\n\n后续能力是否加入，以学习目标和可验证的问题为依据；目录中没有对应实现的方向不标为已完成。","anchor":"section-3"},{"heading":"Verification","body":"日期依据：[3db813f](https://github.com/xilele777/mini-agent/commit/3db813f) 于 2026-08-30 建立最小客户端，CLI 与工具链由后续提交演进。当前依据：[package.json](../../../../package.json)、[llm.ts](../../../../src/llm.ts)、[agent.ts](../../../../src/agent.ts)。历史学习设计只提供背景，技术版本以当前文件 window.__PROJECT_DOCUMENTS__ = {"learning/progress.md":"# mini-agent 学习进度\n\n状态核对日期：2026-09-12。源码基线：`cd3fa0c`。本文件保存当前摘要，详细历史可在本地 `docs/HANDOFF.md` 查阅；缺少历史文件不影响使用本摘要。\n\n## 当前阶段\n\n阶段 7“执行循环与显式出口”已完成学习版实现及已有用例验收。\n\n| 范围 | 当前代码状态 |\n| --- | --- |\n| 阶段 0–3 | API 调用、Function Calling、Tool 接口与注册表已接入 |\n| 阶段 4–5 | 文件及 shell 工具、人工批准、上下文裁剪与循环守卫已接入 |\n| 阶段 6 | todo 使用模块内状态和项目内 JSON 文件，启动时经注册表恢复 |\n| 阶段 7 | `finish_task`、`ask_user`、`pause_task`、继续提示及 `startsTurn` 已接入 |\n\n实现详情以 [agent.ts](../../src/agent.ts)、[context.ts](../../src/context.ts)、[todo.ts](../../src/tools/todo.ts) 和 [control.ts](../../src/tools/control.ts) 为准。\n\n## 已有验证证据\n\n以下为已有交接中的运行记录，保留其覆盖范围，不当作本次重新执行：\n\n- 学习者完成读文件、写文件、回读核对、移除已完成待办、调用 `finish_task` 的任务链。\n- 在 `ask_user` 回答“不”，以及在 shell 批准框输入 `n`，均有随后调用 `pause_task` 的用例记录。这些用例明确要求拒绝后暂停。\n- “只记录待办，暂不执行”的用例保留待办，并在经过一次继续提示后正常结束。\n- 十条上下文测试覆盖循环检测、工具结果截断、真实轮边界与 API 消息去除本地标记；完整测试记录为二十一条通过。\n\n## 待验证项\n\n- 同批结束工具之后，其余调用补“未执行”结果的分支已有静态 review，仍缺专门的运行用例。\n- 循环守卫累计命中后中断剩余调用、纯文本回复耗尽请求预算，仍需主循环用例；范围见[循环预算决定](../notes/implemented/feature/2026-09-05-loop-guard-and-request-budget.md)。\n\n## 初次建立配置时的检查（2026-09-11）\n\n建立开发协作配置后，在当前 PowerShell 环境实际运行：\n\n- `npm run verify-notes`：五篇笔记的目录、链接与格式检查通过。\n- `npm run typecheck`：通过。\n- `npm test`：二十一条通过，零失败。\n- 两个 Skill 的 frontmatter 与结构检查通过；上游四十三个文件逐一与固定提交的 Git blob 匹配。\n\n这些检查验证配置及现有自动化用例，不增加真实模型交互或学习掌握程度的证据。人工交互用例仍按上一节的既有记录理解。\n\n## 笔记重整与看板验证（2026-09-11 至 2026-09-12）\n\n对照当前源码、Git 提交和已有交接，将首批五篇笔记重整为十九篇，补足阶段 0–7 的主要工程取舍、代价与已知限制。历史日期使用最早可核实的记录，并注明实际整理日期；备选理由不冒充当时做过的实验。\n\n本次实际完成：\n\n- `npm run verify-notes`：十九篇笔记的目录、链接与格式检查通过。\n- `npm run board` 和 `npm run board:bundle`：分别生成本地目录看板与离线快照。项目适配脚本修复每节只提取首行的问题，上游 Skill 保持原样。\n- `node --check scripts/fix-notes-board.mjs`：通过。对照 Markdown 核对本地解析与离线数据，七十六个展示字段完整、五十七条备选齐全、四十二条笔记关联有效；多段正文、不同换行和文件末尾边界检查通过。\n- 浏览器实际打开离线快照：十九篇笔记与全部详情文字一致；时间线日期、月份筛选、备选卡片与关联跳转正常，控制台无错误。本地目录模式的章节解析另与源文核对。\n\n本次新增验证范围为决策文档和看板；源码检查与模型交互证据仍按前两节记录。学习阶段及理解证据没有因此增加。\n\n## 看板重设计与同步验证（2026-09-12）\n\n用户选择浅色文档工作台。项目看板改为侧栏导航、决策列表和完整阅读页，新增一篇管理决策后共二十篇。项目生成器与原版 Skill 分开维护，旧正则补丁已由两种页面共用的解析器替代。\n\n- `npm run test:board`：十六条回归通过，覆盖固定排序、内容比较、完整解析、串行检查及收尾、目录切换与失败恢复。\n- `npm run typecheck`：本轮通过；Agent 核心源码没有改动。\n- 两种生成命令通过；浏览器核对二十篇笔记的一百个章节、六十条备选，完整包含 Verification。\n- 在浏览器隔离的 OPFS 目录中使用真实文件读写，并注入可改变顺序的目录入口，重复检查后列表节点、顺序、搜索焦点、筛选及滚动位置保持不变；等长编辑更新当前正文，自动轮询检测到新增文件，删除当前笔记显示明确提示，模拟权限错误后保留内容并能恢复。\n- 使用真实浏览器目录句柄验证页面重载后连接与筛选偏好恢复；桌面和 390px 窄屏阅读、菜单和溢出检查通过。此验证未代替用户在 Windows 原生目录选择框中的授权操作。\n\n2026-09-12 随后按用户确认的“项目全貌”调整首页，当时按六个项目模块展示关键决定、状态和笔记关联，摘要可展开，阅读时保留模块笔记目录；项目分组由独立的 `.agents/board.json` 提供，原版 Skill 保持原样。\n\n- 本次 `npm run test:board` 十九条通过，新增模块分组顺序、重复路径去重、缺失与无配置时的回退覆盖。\n- 本次浏览器核对六个模块与二十篇笔记的全部章节和备选，摘要开关、模块筛选、关联跳转及 390px 阅读布局通过。\n- 在隔离 OPFS 目录中重新检查：不变的扫描保留模块节点、焦点及正文和目录的滚动位置；等长修改更新正文并保留折叠目录；新增的未配置笔记由自动检查显示在分类分组。失败恢复、当前笔记删除提示、真实句柄重载及模块、搜索、目录偏好恢复通过。移除展示配置后仍按标准类别展示全部笔记。\n\n这些属于开发管理工具验证，Agent 核心源码与阶段 7 的理解证据仍按已有记录，不据此推进阶段 8。\n\n## 当前看板与验证（2026-09-13）\n\n看板已采用统一顶部导航、全宽流程画布和节点就地展开，移除了常驻左右侧栏。完整笔记及进度原文在居中阅读层打开，关闭后恢复原视图、筛选、节点、焦点与滚动位置。当前实现、下一步候选、待验证项和可选学习区域读取本文件的对应章节；阶段与理解证据不在展示配置中另存一份。重复标题、介绍、节点职责导语和页脚统计已移除。\n\n- `npm run test:board`：二十六条通过，包含地图引用、实际依据路径和进度章节、资料读取范围、单独修改配置或进度、来源缺失与无配置回退。\n- `npm run verify-notes`：二十篇笔记通过；`npm run typecheck`、浏览器脚本和生成器语法检查通过。两种看板生成命令通过。\n- 全宽布局的一百零一项浏览器检查通过：九个节点的展开和收起、依据切换、二十篇笔记的一百个完整章节、搜索与月份筛选、关联资料返回、关闭后恢复焦点和位置、阅读中重载及浏览器前进／后退。\n- 1536、1280、1024、800、700、390 和 360px 下，四个主视图的顶部导航可用且无横向溢出。窄屏详情紧接所选节点，展开备选后回路线随高度更新，调整窗口后详情回到对应行。\n- 隔离 OPFS 目录中的十七项同步检查通过：不变轮询保留 DOM，修改地图和正在阅读的笔记保留阅读层；无效配置保留内容并恢复；关闭后恢复节点、依据和学习偏好；真实句柄重载后继续阅读；当前笔记删除、进度更新、移除配置和只连接 notes 正常回退。浏览器未出现页面脚本错误。\n- 上述目录检查使用浏览器的真实文件句柄，Windows 原生目录选择授权仍由用户浏览器完成。历史的遍历顺序、等长修改和新增未分组笔记检查保留在[看板决定](../notes/implemented/process/2026-09-12-readable-board-and-stable-sync.md)中。\n\n本次只变更展示、资料适配、管理文档和相应检查。Agent 核心源码没有修改，阶段 8 仍未开始，学习者的理解证据保持原状。\n\n## 理解证据\n\n已有记录显示学习者亲自接入了代码并运行上述验收。对注册表职责、真实轮边界和暂停语义的独立解释或迁移改造，尚未在本摘要中建立具体证据。\n\n这些内容标为“待观察”；继续教学时结合当次表现补充，不要求从头重学，也不将阶段完成等同于全部掌握。\n\n## 当前限制\n\n- 完成与暂停的选择依赖模型、提示词和工具描述；已有用例不代表所有自然表述都已验证。\n- todo 只有 `id/title`，没有任务归属或持久化暂停状态；多个进程的写入未协调。\n- 历史只保留最近六个完整用户轮，消息本身不跨进程恢复；固定轮数不保证固定 token 上限。\n- 文件读取工具有项目范围、敏感路径与 realpath 检查；shell 依赖批准，不构成完整沙箱。\n- 决策笔记已建立对应设计理由。后续变更优先更新所属笔记，避免将这些摘要扩展成第二套设计文档。\n\n## 下一次学习入口\n\n阶段 8 的候选方向是流式输出，尚未开始实现。\n\n若用户选择流式输出，先解释“即时显示文本”和“保存完整消息”的差别，再练习工具参数片段的组装。工具调用必须在参数收齐、校验及必要批准之后执行。\n\n这个方向只是建议；开始前以用户当次请求为准。\n\n## 开发管理配置\n\n通用笔记 Skill、独立教练 Skill、项目配置及历史决策笔记均已建立。工程理由保存在笔记中，教学方法与个人学习状态分别保留在教练 Skill 和项目学习文件中；项目地图在独立脚本与配置中维护，学习区域可关闭。使用与迁移方法见[开发协作说明](../README.md)。这些属于开发协作配置，不计作新的代码学习阶段。\n"};</script>

const SECTION_LABELS = { Problem: '问题背景', Decision: '决定', Proposal: '提案', 'Alternatives considered': '方案取舍', Consequences: '影响与代价', Verification: '验证与依据', 'Acceptance criteria': '验收标准', Risks: '风险' };

function compareText(a, b) {
  return a < b ? -1 : a > b ? 1 : 0;
}

function compareNotes(a, b, mode = 'new', incoming = new Map()) {
  if (mode === 'references') {
    const difference = (incoming.get(b.id) || 0) - (incoming.get(a.id) || 0);
    if (difference) return difference;
  }
  const date = mode === 'old' ? compareText(a.date, b.date) : compareText(b.date, a.date);
  return date || compareText(a.id, b.id);
}

function splitSections(raw) {
  const sections = [];
  let section = null;
  let fence = null;
  for (const line of raw.replace(/\r\n?/g, '\n').split('\n')) {
    const marker = /^\s*(`{3,}|~{3,})/.exec(line);
    if (marker) {
      if (!fence) fence = marker[1];
      else if (marker[1][0] === fence[0] && marker[1].length >= fence.length) fence = null;
    }
    const heading = !fence && /^##\s+(.+?)\s*$/.exec(line);
    if (heading) {
      section = { heading: heading[1], lines: [] };
      sections.push(section);
    } else if (section) section.lines.push(line);
  }
  return sections.map(({ heading, lines }, index) => ({ heading, body: lines.join('\n').trim(), anchor: 'section-' + index }));
}

function resolveNoteLink(id, href) {
  const clean = href.split(/[?#]/)[0].replace(/\\/g, '/').replace(/\.zh\.md$/, '.md');
  if (!clean || /^[a-z][a-z\d+.-]*:/i.test(clean) || clean.startsWith('/')) return null;
  const segments = id.split('/').slice(0, -1);
  for (const part of clean.split('/')) {
    if (!part || part === '.') continue;
    if (part === '..') {
      if (!segments.length) return null;
      segments.pop();
    } else segments.push(part);
  }
  return segments.join('/');
}

function buildDataset(files) {
  const selected = new Map();
  for (const file of [...files].sort((a, b) => compareText(a.path, b.path))) {
    const path = file.path.replace(/\\/g, '/');
    const parts = path.split('/');
    if (parts.length !== 3 || !LIFECYCLES.includes(parts[0]) || !CLASSES.includes(parts[1]) || !/^\d{4}-\d{2}-\d{2}-.+\.md$/.test(parts[2])) continue;
    const id = path.replace(/\.zh\.md$/, '.md');
    if (!selected.has(id) || path.endsWith('.zh.md')) selected.set(id, { ...file, path });
  }
  const notes = [];
  for (const [id, file] of selected) {
    const rawBody = file.content;
    const title = /^\uFEFF?# Agent Note[^:：]*[:：]\s*(.+)$/m.exec(rawBody)?.[1].trim();
    const status = /^Status:\s*(.+)$/m.exec(rawBody)?.[1].trim();
    if (!title || !status) throw new Error('笔记暂时无法解析：' + file.path);
    const [lifecycle, cls, filename] = id.split('/');
    if (lifecycle !== 'archived' && !new RegExp('^' + lifecycle + '(?:$|\\s)').test(status)) throw new Error('笔记状态与目录不一致：' + file.path);
    const sections = splitSections(rawBody);
    const section = (...headings) => sections.find(item => headings.includes(item.heading))?.body || '';
    notes.push({
      id, sourcePath: file.path, slug: filename.replace(/\.md$/, ''), lifecycle, cls,
      date: filename.slice(0, 10), title, status, rawBody, sections,
      problem: section('Problem', '问题'),
      decision: section('Decision', 'Proposal', '决策', '提案'),
      alternatives: section('Alternatives considered', '曾考虑的替代方案', '曾考虑的备选'),
      consequences: section('Consequences', '后果'),
      outLinks: [],
    });
  }
  const ids = new Set(notes.map(note => note.id));
  for (const note of notes) {
    const links = new Set();
    for (const match of note.rawBody.matchAll(/\[[^\]\n]*\]\(([^)]+)\)/g)) {
      const target = resolveNoteLink(note.id, match[1].trim());
      if (target && target !== note.id && ids.has(target)) links.add(target);
    }
    note.outLinks = [...links].sort(compareText);
  }
  return notes.sort(compareNotes);
}

function datasetSignature(notes) {
  // Compare the actual text, not mtime/size; equal-length edits must still refresh.
  return JSON.stringify([...notes].sort((a, b) => compareText(a.id, b.id)).map(note => [note.id, note.sourcePath, note.rawBody]));
}

function alternativeItems(note) {
  return note.alternatives.split(/\n(?=###?\s|\s*[-*+]\s)/).map(text => text.replace(/^\s*(?:#{2,3}\s+|[-*+]\s+)/, '').trim()).filter(Boolean);
}

function countReferences(notes) {
  const result = new Map(notes.map(note => [note.id, 0]));
  for (const note of notes) for (const id of note.outLinks) if (result.has(id)) result.set(id, result.get(id) + 1);
  return result;
}

function groupNotes(notes, presentation = {}) {
  const byId = new Map(notes.map(note => [note.id, note]));
  const used = new Set();
  const groups = [];
  if (Array.isArray(presentation.groups)) {
    for (const group of presentation.groups) {
      const entries = [];
      for (const entry of group.notes || []) {
        if (!byId.has(entry.id) || used.has(entry.id)) continue;
        used.add(entry.id);
        entries.push({ note: byId.get(entry.id), label: entry.label || byId.get(entry.id).title });
      }
      if (entries.length) groups.push({ id: group.id, title: group.title, entries });
    }
  }
  // New or renamed notes stay visible even when the optional project grouping is stale.
  for (const cls of CLASSES) {
    const entries = notes.filter(note => !used.has(note.id) && note.cls === cls).sort(compareNotes).map(note => ({ note, label: note.title }));
    if (entries.length) groups.push({ id: 'class-' + cls, title: CLASS_LABELS[cls], entries });
  }
  return groups;
}

async function resolveNotesDirectory(root) {
  try {
    const agents = await root.getDirectoryHandle('.agents');
    return await agents.getDirectoryHandle('notes');
  } catch (error) { if (error.name !== 'NotFoundError' && error.name !== 'TypeMismatchError') throw error; }
  if (root.name === '.agents') return root.getDirectoryHandle('notes');
  if (root.name === 'notes') return root;
  for await (const entry of root.values()) if (entry.kind === 'directory' && LIFECYCLES.includes(entry.name)) return root;
  throw new Error('请选择项目根目录或 .agents/notes 文件夹。');
}

async function readNoteDirectory(root) {
  const files = [];
  async function walk(directory, parts = []) {
    const entries = [];
    for await (const entry of directory.values()) entries.push(entry);
    entries.sort((a, b) => compareText(a.name, b.name));
    for (const entry of entries) {
      if (entry.kind === 'directory' && (parts.length === 0 ? LIFECYCLES.includes(entry.name) : parts.length === 1 && CLASSES.includes(entry.name))) {
        await walk(entry, [...parts, entry.name]);
      } else if (parts.length === 2 && entry.kind === 'file' && entry.name.endsWith('.md')) {
        // A failed read rejects the entire scan; never publish a partial directory.
        const file = await entry.getFile();
        files.push({ path: [...parts, entry.name].join('/'), content: await file.text() });
      }
    }
  }
  await walk(root);
  return buildDataset(files);
}

function createLiveSync({ read = readNoteDirectory, signatureOf = datasetSignature, countOf = value => value.length, commit, report = () => {} }) {
  let source = null;
  let generation = 0;
  let signature = null;
  let queued = false;
  let active = null;
  async function drain() {
    while (queued && source) {
      queued = false;
      const reading = source;
      const version = generation;
      try {
        const notes = await read(reading);
        if (version !== generation) continue;
        const next = signatureOf(notes);
        const changed = signature !== next;
        if (changed) {
          commit(notes);
          signature = next;
        }
        report({ ok: true, changed, count: countOf(notes), checkedAt: Date.now() });
      } catch (error) {
        if (version === generation) report({ ok: false, error });
      }
    }
  }
  function request() {
    if (!source) return Promise.resolve();
    queued = true;
    if (!active) active = Promise.resolve().then(drain).finally(() => {
      active = null;
      // A microtask can enqueue a check after drain exits but before this cleanup.
      if (queued && source) return request();
    });
    return active;
  }
  return {
    setSource(handle) {
      source = handle;
      generation++;
      signature = null;
      // A source change during a read invalidates that result and schedules the new source.
      queued = !!handle && !!active;
    },
    request,
  };
}


// Note: 展示配置、进度来源与稳定同步见 .agents/notes/implemented/process/2026-09-12-readable-board-and-stable-sync.md
const missingEntry = error => ['NotFoundError', 'TypeMismatchError', 'ENOENT', 'ENOTDIR'].includes(error?.name) || ['ENOENT', 'ENOTDIR'].includes(error?.code);
const slug = value => typeof value === 'string' && /^[a-z][a-z0-9-]*$/.test(value);
const string = value => typeof value === 'string' && value.trim().length > 0;
const object = value => value && typeof value === 'object' && !Array.isArray(value);
const documentPath = value => string(value) && !value.includes('\\') && !value.includes(':') && value.split('/').every(part => part && part !== '.' && part !== '..') && value.endsWith('.md');
const relativeReference = value => string(value) && !/^(?:[/\\]|[a-z][a-z\d+.-]*:)/i.test(value) && !/[\r\n\0]/.test(value);

function validatePresentation(value) {
  const fail = message => { throw new Error('board.json：' + message); };
  if (!object(value)) fail('需要一个配置对象。');
  if (value.name !== undefined && typeof value.name !== 'string') fail('name 需要是文字。');
  if (value.groups !== undefined && !Array.isArray(value.groups)) fail('groups 需要是数组。');
  const groupIds = new Set();
  for (const group of value.groups || []) {
    if (!object(group) || !slug(group.id) || group.id.startsWith('class-') || groupIds.has(group.id)) fail('模块 ID 需要唯一，且不能使用 class- 前缀。');
    if (!string(group.title) || !Array.isArray(group.notes)) fail('模块需要标题和笔记清单。');
    for (const note of group.notes) if (!object(note) || !string(note.id) || (note.label !== undefined && typeof note.label !== 'string')) fail('笔记入口需要路径和可选的短标题。');
    groupIds.add(group.id);
  }
  if (value.map !== undefined) {
    const map = value.map;
    if (!object(map) || !string(map.title) || !Array.isArray(map.nodes) || !Array.isArray(map.flow) || map.flow.length < 2 || map.flow.length > 6) fail('项目地图需要标题、节点和 2–6 步主流程。');
    const ids = new Set();
    for (const node of map.nodes) {
      if (!object(node) || !slug(node.id) || ids.has(node.id)) fail('地图节点 ID 需要唯一。');
      for (const key of ['title', 'caption', 'boundary']) if (!string(node[key])) fail('地图节点需要 ' + key + '。');
      if (!Array.isArray(node.behavior) || !node.behavior.length || node.behavior.some(item => !string(item))) fail('节点需要当前做法。');
      if (!Array.isArray(node.notes) || node.notes.some(item => !string(item))) fail('节点的依据需要笔记路径。');
      if (node.sources !== undefined && (!Array.isArray(node.sources) || node.sources.some(item => !object(item) || !string(item.label) || !relativeReference(item.path)))) fail('源码入口需要 label 和相对路径。');
      ids.add(node.id);
    }
    const placed = new Set();
    const place = id => { if (!ids.has(id) || placed.has(id)) fail('地图位置引用了缺失或重复的节点：' + id); placed.add(id); };
    map.flow.forEach(place);
    if (map.supports !== undefined && !Array.isArray(map.supports)) fail('supports 需要是数组。');
    for (const item of map.supports || []) {
      if (!object(item) || !map.flow.includes(item.target) || !string(item.label)) fail('辅助模块需要指向主流程并说明关系。');
      place(item.id);
    }
    if (map.branches !== undefined) {
      if (!object(map.branches) || !map.flow.includes(map.branches.from) || !string(map.branches.title) || !Array.isArray(map.branches.items)) fail('分支需要起点、标题和节点清单。');
      for (const item of map.branches.items) {
        if (!object(item) || !map.flow.includes(item.returnsTo) || !string(item.label)) fail('分支需要返回位置和说明。');
        place(item.id);
      }
    }
    if (placed.size !== ids.size) fail('每个节点都需要在地图中有位置。');
    if (map.loop !== undefined && (!object(map.loop) || !map.flow.includes(map.loop.from) || !map.flow.includes(map.loop.to) || map.flow.indexOf(map.loop.from) <= map.flow.indexOf(map.loop.to) || !string(map.loop.label))) fail('回路需要从后续步骤返回前面的步骤。');
    if (map.defaultNode !== undefined && !ids.has(map.defaultNode)) fail('默认节点不存在。');
  }
  for (const key of ['brief', 'learning']) {
    const block = value[key];
    if (block === undefined) continue;
    if (!object(block) || !documentPath(block.source)) fail(key + ' 的来源需要是配置目录内的 Markdown 相对路径。');
    if (key === 'brief') {
      for (const field of ['current', 'next', 'attention']) if (!string(block[field])) fail('brief 需要 ' + field + ' 章节名称。');
    } else {
      if (block.enabled !== undefined && typeof block.enabled !== 'boolean') fail('learning.enabled 需要是布尔值。');
      if (!string(block.title) || !Array.isArray(block.sections) || block.sections.some(section => !object(section) || !string(section.title) || !string(section.heading))) fail('学习区域需要标题和来源章节。');
    }
  }
  return value;
}

async function readRelativeFile(root, path) {
  const parts = path.split('/');
  let directory = root;
  for (const part of parts.slice(0, -1)) directory = await directory.getDirectoryHandle(part);
  return (await (await directory.getFileHandle(parts.at(-1))).getFile()).text();
}

async function readPresentationDirectory(root) {
  let presentation = {};
  try { presentation = validatePresentation(JSON.parse(await readRelativeFile(root, 'board.json'))); }
  catch (error) { if (!missingEntry(error)) throw error; }
  const paths = [...new Set([presentation.brief?.source, presentation.learning?.enabled !== false && presentation.learning?.source].filter(Boolean))].sort();
  const entries = await Promise.all(paths.map(async path => {
    try { return [path, await readRelativeFile(root, path)]; }
    catch (error) { if (missingEntry(error)) return [path, null]; throw error; }
  }));
  return { presentation, documents: Object.fromEntries(entries) };
}

async function readProjectDirectory(root) {
  let workspace = null;
  try { workspace = await root.getDirectoryHandle('.agents'); }
  catch (error) { if (!missingEntry(error)) throw error; }
  if (!workspace) {
    try { await root.getDirectoryHandle('notes'); workspace = root; }
    catch (error) { if (!missingEntry(error)) throw error; }
  }
  if (workspace) {
    const notesRoot = await workspace.getDirectoryHandle('notes');
    const [notes, assets] = await Promise.all([readNoteDirectory(notesRoot), readPresentationDirectory(workspace)]);
    return { notes, ...assets, scope: 'project', label: assets.presentation.name || (workspace === root ? '项目' : root.name) };
  }
  // A notes-only handle cannot read a sibling board.json or learning folder.
  // Do not carry the previously selected project's map into another directory.
  return { notes: await readNoteDirectory(await resolveNotesDirectory(root)), presentation: {}, documents: {}, scope: 'notes', label: '决策笔记' };
}

function projectSignature(project) {
  return JSON.stringify([datasetSignature(project.notes), project.presentation, Object.entries(project.documents).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0), project.scope, project.label]);
}

function documentSection(documents, source, heading) {
  const content = documents[source];
  if (typeof content !== 'string') return null;
  return splitSections(content).find(section => section.heading === heading)?.body ?? null;
}

function firstParagraph(text) {
  if (!text) return '';
  return text.split(/\n\s*\n/).find(block => block.trim() && !/^(?:\s*[-*+|]|#{1,6}\s)/.test(block))?.trim() || '';
}

function sectionItems(text) {
  return (text || '').split('\n').filter(line => /^\s*[-*+]\s+/.test(line)).map(line => line.replace(/^\s*[-*+]\s+/, ''));
}

const htmlCache = new Map();
let readerOrigin = null;
let readerTrail = [];
let lastRouteHash = null;

const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
const icon = name => '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"/></svg>';

const plain = text => text.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/[`*#]/g, '').replace(/\s+/g, ' ').trim();
const noteButton = (note, className, content) => '<button class="' + className + '" data-note-id="' + escapeHtml(note.id) + '">' + content + '</button>';
const labelFor = note => state.labels.get(note.id) || note.title;

function decisionExcerpt(note) {

  // Excerpt the note's own first sentence; do not maintain a second project summary.

}
function setHtml(id, html) {
