<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="查看项目运行流程、当前开发重点与设计依据。">
  <title>mini-agent · 项目地图</title>
  <style>:root {
  --canvas: #f7f8f6;
  --paper: #ffffff;
  --text: #222b3a;
  --muted: #596577;
  --quiet: #687386;
  --line: #e0e4eb;
  --accent: #26745f;
  --accent-soft: #eaf4ef;
  --hover: #f2f7f4;
  --architecture: #557cba;
  --feature: #42856b;
  --bug-fix: #b87448;
  --simplification: #97803d;
  --process: #8770ab;
  --testing: #4e8794;
  --radius: 12px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.65;
  color: var(--text);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); }
button, input, select { font: inherit; color: inherit; }
button, a, input, select { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; opacity: .45; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { font-weight: 650; }
button, input, select { border-radius: 6px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid #7295e8;
  outline-offset: 3px;
}
[hidden] { display: none !important; }
.icon {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: middle;
  flex-shrink: 0;
}
.icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: fixed;
  left: 20px;
  top: -80px;
  background: var(--accent);
  color: white;
  padding: 10px 18px;
  z-index: 100;
}
.skip-link:focus { top: 12px; }

.brand-mark {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.brand-mark .icon { width: 23px; height: 23px; }
.status-dot { height: 7px; width: 7px; flex-shrink: 0; border-radius: 50%; background: #909cad; }
.status-dot.live { background: #328263; }
.status-dot.error { background: #bd8139; }
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 13px;
  border: 1px solid #ced6e3;
  background: white;
  min-height: 39px;
  font-size: 14px;
  font-weight: 500;
}
.button:hover { background: var(--hover); border-color: #97aed7; }
.button-primary { background: var(--accent); border-color: var(--accent); color: white; padding: 11px 20px; }
.button-primary:hover { background: #205f4e; border-color: #205f4e; }
.icon-button { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.icon-button:hover { background: var(--hover); }
.text-button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 0; color: var(--accent); font-size: 14px; white-space: nowrap; }
.text-button:hover { text-decoration: underline; text-underline-offset: 4px; }

/* One shared horizontal navigation for every view. */
.workspace { height: 100dvh; display: flex; flex-direction: column; min-width: 0; }
.topbar { min-height: 70px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 max(28px, calc((100vw - 1500px) / 2)); border-bottom: 1px solid var(--line); background: var(--paper); }
.topbar-brand { display: flex; align-items: center; gap: 10px; font-size: 17px; white-space: nowrap; min-width: 0; }
.topbar-brand strong { overflow: hidden; text-overflow: ellipsis; }
.topbar-brand .brand-mark { width: 33px; height: 33px; border-radius: 9px; }
.topbar-brand .brand-mark .icon { width: 22px; height: 22px; }
.workspace-tabs { display: flex; align-items: stretch; align-self: stretch; gap: 26px; margin-right: auto; }
.workspace-tabs a { display: flex; align-items: center; border-bottom: 2px solid transparent; color: var(--muted); font-size: 14px; white-space: nowrap; min-height: 44px; }
.workspace-tabs a:hover { color: var(--accent); }
.workspace-tabs a.active { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.search-box { display: flex; align-items: center; gap: 9px; min-width: 150px; flex: 0 1 245px; margin-left: auto; border: 1px solid var(--line); border-radius: 7px; background: #fafbf9; padding: 8px 11px; color: var(--quiet); }
.search-box:focus-within { border-color: #6ba58b; box-shadow: 0 0 0 3px #eaf4ef; }
.search-box input { min-width: 0; width: 100%; outline: none; border: 0; background: transparent; font-size: 14px; padding: 0; }
.search-box input::placeholder { color: var(--quiet); }
.search-box kbd { font-family: inherit; font-size: 12px; border: 1px solid #dce2ec; border-radius: 3px; width: 20px; line-height: 22px; text-align: center; background: white; }
.connection-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.connection-status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--quiet); white-space: nowrap; }
#connect-button { font-size: 13px; min-height: 36px; }
.main-scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; scrollbar-gutter: stable; outline: none; overscroll-behavior: contain; }
.page-content { max-width: 1500px; margin: auto; padding: 27px 28px 32px; }
#page-title:focus, #map-detail-title:focus, #reader-title:focus { outline: none; }

/* Overview: decisions grouped by the actual parts of the project. */
.overview-summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 20px; padding: 0 0 13px; border-bottom: 1px solid var(--line); }
.overview-summary > p { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
.overview-summary > p strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.overview-summary > p > span { color: #a3adbd; margin: 0 7px; }
.overview-statuses { display: flex; gap: 8px; flex-wrap: wrap; }
.overview-controls { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
.excerpt-toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--accent); background: var(--paper); border: 1px solid #d5dfee; padding: 6px 10px; }
.excerpt-toggle .icon { width: 15px; height: 15px; }
.excerpt-toggle:hover { background: var(--accent-soft); }
.status-filter-button { display: flex; align-items: center; gap: 7px; font-size: 13px; padding: 3px 5px; color: var(--muted); }
.status-filter-button:hover { background: #e8edf6; }
.module-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
.module-grid.show-excerpts { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.module-card { display: flex; flex-direction: column; min-width: 0; background: var(--paper); border: 1px solid #dbe1eb; border-radius: var(--radius); overflow: hidden; box-shadow: 0 2px 3px #29354b03; }
.module-card-heading { display: flex; gap: 10px; align-items: flex-start; padding: 20px 18px 17px; border-bottom: 1px solid var(--line); background: #fcfdff; }
.module-number { display: grid; place-items: center; flex-shrink: 0; width: 34px; height: 34px; margin-top: 1px; background: #edf2fc; color: var(--accent); border: 1px solid #e0e8f8; border-radius: 8px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.module-card-heading > div { flex: 1; min-width: 0; }
.module-card-heading h2 { font-size: 18px; line-height: 1.5; }
.module-card-heading h2 button { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; font-weight: inherit; padding: 0; }
.module-card-heading h2 button:hover { color: var(--accent); }
.module-card-heading h2 .icon { width: 17px; height: 17px; color: var(--quiet); margin-left: 12px; }
.module-decisions { flex: 1; }
.module-decision { display: block; width: 100%; text-align: left; padding: 13px 18px; border-bottom: 1px solid #e9edf3; border-radius: 0; }
.module-decision:last-child { border-bottom: 0; }
.module-decision:hover { background: var(--hover); }
.module-decision:hover h3 { color: var(--accent); }
.module-decision-title { display: flex; align-items: flex-start; gap: 8px; justify-content: space-between; }
.module-decision-title h3 { font-size: 14px; font-weight: 500; line-height: 1.7; }
.module-decision-title .status-badge { margin-top: 1px; }
.module-decision > p { display: none; color: var(--muted); font-size: 14px; line-height: 1.8; margin-top: 7px; overflow-wrap: anywhere; }
.show-excerpts .module-decision { padding: 17px 22px; }
.show-excerpts .module-decision > p { display: block; }
.show-excerpts .module-decision-title h3 { font-size: 15px; font-weight: 600; }
.module-links { padding: 11px 18px 14px; border-top: 1px solid var(--line); background: #fcfdff; font-size: 12px; }
.module-links > span { display: flex; align-items: center; gap: 5px; color: var(--quiet); margin-bottom: 7px; }
.module-links .icon { width: 13px; height: 13px; }
.module-links > div { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 9px; }
.module-links button { padding: 2px 7px; background: #f0f3f9; color: #4f6489; font-size: 12px; }
.module-links button:hover { background: var(--accent-soft); color: var(--accent); }

/* Note metadata, full collections and filters. */
.row-meta { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--quiet); margin-bottom: 9px; flex-wrap: wrap; }
.class-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.category-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--category); flex-shrink: 0; }
.group-tag { color: #586c91; }
.status-badge { font-size: 11px; font-weight: 500; border-radius: 4px; padding: 2px 6px; line-height: 1.65; background: #edf5f0; color: #367154; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
.status-badge::before { content: ""; width: 4px; height: 4px; background: currentColor; border-radius: 50%; }
.status-badge.proposed { background: #fbf2dc; color: #886513; }
.status-badge.rejected { background: #faeeeb; color: #9c5044; }
.status-badge.archived { background: #eef0f3; color: #5f6978; }
.collection-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 0 17px; margin-bottom: 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.collection-options { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.filter-controls { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
select { background: white; border: 1px solid #d8dfeb; color: var(--muted); padding: 8px 26px 8px 11px; font-size: 13px; cursor: pointer; max-width: 100%; min-height: 38px; }
.sort-control select { background: transparent; border-color: transparent; }
.results-summary { color: var(--muted); font-size: 12px; white-space: nowrap; }
.decision-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.decision-row { display: flex; flex-direction: column; gap: 18px; min-width: 0; text-align: left; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.decision-row:hover { background: var(--hover); border-color: #9dbcaa; }
.decision-row:hover h2 { color: var(--accent); }
.decision-row h2 { font-size: 17px; line-height: 1.65; font-weight: 600; margin-bottom: 9px; }
.decision-row p { font-size: 14px; color: var(--muted); line-height: 1.8; margin-bottom: 16px; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.decision-row .row-meta { margin: 0; gap: 6px 9px; }
.decision-side { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: auto; padding-top: 12px; border-top: 1px solid #edf0ed; font-size: 12px; color: var(--quiet); }
.decision-side .icon { width: 16px; height: 16px; }
.month-filters { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }
.month-filters button { border: 1px solid var(--line); padding: 5px 12px; font-size: 13px; color: var(--muted); background: var(--paper); }
.month-filters button.active { background: var(--accent-soft); border-color: #c4d3f3; color: var(--accent); }
.timeline-group { display: grid; grid-template-columns: 100px minmax(0,1fr); gap: 24px; margin-top: 26px; }
.timeline-label { font-size: 15px; font-weight: 600; padding-top: 16px; }
.timeline-label small { display: block; font-size: 12px; color: var(--quiet); font-weight: 400; margin-top: 5px; }
.timeline-items { padding-left: 24px; border-left: 1px solid #cfd9eb; }
.timeline-card { display: block; width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 21px 24px; text-align: left; margin: 0 0 16px; position: relative; }
.timeline-card::before { content: ""; position: absolute; left: -29px; top: 25px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--canvas); background: #7898d3; }
.timeline-card:hover { border-color: #a9bde1; }
.timeline-card h3 { font-size: 17px; font-weight: 600; line-height: 1.6; }
.timeline-card p { color: var(--muted); font-size: 14px; margin-top: 8px; line-height: 1.8; overflow-wrap: anywhere; }
.alternatives-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 22px; align-items: start; }
.alternative-group { border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); padding: 24px; min-width: 0; }
.alternative-group .alternative-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 0; font-size: 17px; line-height: 1.7; font-weight: 600; margin: 9px 0 19px; }
.alternative-heading .icon { margin-top: 5px; width: 16px; height: 16px; }
.alternative-heading:hover { color: var(--accent); }
.alternative-option { border-top: 1px solid #e8edf4; padding: 16px 0; overflow-wrap: anywhere; }
.alternative-option:last-child { padding-bottom: 0; }
.alternative-option h3 { font-size: 14px; line-height: 1.8; font-weight: 600; display: flex; gap: 8px; }
.option-number { color: var(--quiet); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; flex-shrink: 0; }
.alternative-option p { color: var(--muted); font-size: 14px; line-height: 1.9; margin-top: 6px; padding-left: 24px; }
.alternative-option a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* A centered, modal reading surface with its own scroll position. */
.reader-dialog { width: min(960px, calc(100vw - 64px)); height: min(940px, calc(100dvh - 72px)); max-width: none; max-height: none; padding: 0; border: 1px solid #dce3dc; border-radius: 16px; background: var(--paper); color: var(--text); box-shadow: 0 24px 90px #172a2440; overflow: hidden; }
.reader-dialog[open] { display: flex; flex-direction: column; }
.reader-dialog::backdrop { background: #23352d66; backdrop-filter: blur(3px); }
.reader-toolbar { display: flex; align-items: center; gap: 16px; flex-shrink: 0; min-height: 56px; padding: 8px 20px; border-bottom: 1px solid var(--line); background: #fbfcfa; }
#reader-close { margin-left: auto; width: 38px; height: 38px; }
.reader-scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; overscroll-behavior: contain; padding: 32px 48px 44px; outline: none; }
.reader-content { min-width: 0; }
.reader-header { border-bottom: 1px solid var(--line); padding-bottom: 25px; margin-bottom: 30px; }
.reader-header .row-meta { margin-bottom: 14px; font-size: 13px; }
.reader-header h1 { font-size: 29px; line-height: 1.5; letter-spacing: -.4px; margin: 0; font-weight: 650; text-wrap: pretty; overflow-wrap: anywhere; }
.reader-source { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); margin-top: 15px; line-height: 1.8; }
.reader-source .icon { width: 15px; height: 15px; }
.reader-source:hover { text-decoration: underline; text-underline-offset: 4px; }
.reader-preamble { margin-top: 14px; font-size: 13px; color: var(--muted); line-height: 1.8; overflow-wrap: anywhere; }
.reader-quick-nav { display: flex; flex-wrap: wrap; gap: 6px 18px; border-bottom: 1px solid var(--line); padding-bottom: 17px; margin: -8px 0 27px; }
.reader-quick-nav a { color: var(--accent); font-size: 13px; padding: 3px 0; }
.reader-quick-nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
.reader-section { margin: 0 0 34px; scroll-margin-top: 25px; }
.reader-section > h2 { font-size: 20px; line-height: 1.6; margin-bottom: 15px; font-weight: 650; }
.markdown { font-size: 16px; line-height: 1.95; color: #334155; overflow-wrap: anywhere; }
.markdown p { margin-bottom: 16px; }
.markdown p:last-child { margin-bottom: 0; }
.markdown a { color: var(--accent); text-decoration: underline; text-decoration-color: #a7bce6; text-underline-offset: 3px; }
.markdown a:hover { text-decoration-color: var(--accent); }
.markdown code { font-family: "Cascadia Code", Consolas, monospace; font-size: .89em; background: #edf0f6; color: #3c5176; border: 1px solid #dfe5ef; padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
.markdown pre { overflow-x: auto; padding: 17px 19px; border: 1px solid var(--line); border-radius: 8px; background: #f0f3f8; line-height: 1.75; margin: 16px 0; }
.markdown pre code { border: 0; padding: 0; background: none; overflow-wrap: normal; }
.markdown ul, .markdown ol { padding-left: 24px; margin: 12px 0 18px; }
.markdown li { padding-left: 3px; margin: 11px 0; }
.markdown li::marker { color: #6781ad; }
.markdown h3, .markdown h4 { font-size: 17px; margin: 25px 0 12px; color: var(--text); }
.markdown blockquote { margin: 16px 0; padding: 11px 17px; border-left: 3px solid #a7bbdf; background: #edf2fb; color: var(--muted); }
.markdown .table-wrap { overflow: auto; margin: 16px 0; }
.markdown table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.markdown th, .markdown td { padding: 9px 12px; border: 1px solid var(--line); text-align: left; }
.markdown th { background: #eef2f9; font-weight: 600; }
.reader-related { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; margin-top: 28px; }
.reader-related:empty { display: none; }
.related-group { border-top: 1px solid var(--line); padding-top: 18px; min-width: 0; }
.related-group h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.related-group h2 > span { font-size: 12px; color: var(--quiet); font-weight: 400; }
.related-link { display: block; text-align: left; width: 100%; font-size: 14px; line-height: 1.75; padding: 8px; margin: 0 0 4px -8px; overflow-wrap: anywhere; }
.related-link small { display: block; font-size: 12px; color: var(--quiet); margin-top: 3px; }
.related-link:hover { background: var(--accent-soft); color: var(--accent); }
.reader-tools { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; }
.related-empty { font-size: 13px; color: var(--quiet); }

/* Empty and connection states. */
.empty-state { text-align: center; padding: 64px 24px; background: var(--paper); border: 1px dashed #cad5e8; border-radius: var(--radius); }
.empty-state > .icon { width: 30px; height: 30px; color: #8299bc; margin-bottom: 15px; }
.empty-state h2, .empty-state h1 { font-size: 20px; font-weight: 600; }
.empty-state p { font-size: 15px; color: var(--muted); margin: 12px 0 22px; }
.onboarding { max-width: 750px; margin: 36px auto 70px; text-align: center; padding: 46px 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.onboarding-art { width: 145px; margin: 0 auto 20px; }
.onboarding h2 { font-size: 24px; letter-spacing: -.4px; font-weight: 600; }
.onboarding p { font-size: 15px; color: var(--muted); line-height: 1.9; margin: 17px auto 25px; }
.text-link { color: var(--accent); font-size: 14px; }
.text-link:hover { text-decoration: underline; }
.snapshot-link { display: block; margin-top: 19px; }
.notice { font-size: 14px; line-height: 1.8; padding: 12px 16px; background: #fff8e9; border: 1px solid #e9d9b0; border-radius: 8px; margin-bottom: 22px; color: #806129; overflow-wrap: anywhere; }
.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #293a59; color: white; border-radius: 8px; padding: 11px 19px; font-size: 14px; box-shadow: 0 6px 25px #17274b20; z-index: 60; max-width: calc(100vw - 30px); text-align: center; }

/* A full-width flow canvas; node details are inserted below the selected row. */
.project-brief { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; align-items: center; gap: 20px; background: #edf3ed; border: 1px solid #dce7dc; border-radius: 10px; padding: 14px 18px; margin-bottom: 22px; }
.brief-item { min-width: 0; }
.brief-next { border-left: 1px solid #d4e1d2; padding-left: 20px; }
.current-marker { display: flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 12px; font-weight: 600; color: #37604b; }
.current-marker .icon { width: 16px; height: 16px; }
.current-description { font-size: 13px; color: #344b3d; margin-top: 5px; }
.source-button { font-size: 12px; white-space: nowrap; gap: 6px; }
.source-button .icon { width: 14px; height: 14px; }
.source-missing { color: #936326; font-size: 13px; }
.map-surface { min-width: 0; background: white; border: 1px solid #dce3dc; border-radius: 14px; overflow: hidden; scroll-margin-top: 20px; }
.map-heading { padding: 18px 24px; }

责，主模型清理临时 todo、转述结果并调用 `finish_task`。\n\n## 初次建立配置时的检查（2026-09-11）\n\n建立开发协作配置后，在当前 PowerShell 环境实际运行：\n\n- `npm run verify-notes`：五篇笔记的目录、链接与格式检查通过。\n- `npm run typecheck`：通过。\n- `npm test`：二十一条通过，零失败。\n- 两个 Skill 的 frontmatter 与结构检查通过；上游四十三个文件逐一与固定提交的 Git blob 匹配。\n\n这些检查验证配置及现有自动化用例，不增加真实模型交互或学习掌握程度的证据。人工交互用例仍按上一节的既有记录理解。\n\n## 笔记重整与看板验证（2026-09-11 至 2026-09-12）\n\n对照当前源码、Git 提交和已有交接，将首批五篇笔记重整为十九篇，补足阶段 0–7 的主要工程取舍、代价与已知限制。历史日期使用最早可核实的记录，并注明实际整理日期；备选理由不冒充当时做过的实验。\n\n本次实际完成：\n\n- `npm run verify-notes`：十九篇笔记的目录、链接与格式检查通过。\n- `npm run board` 和 `npm run board:bundle`：分别生成本地目录看板与离线快照。项目适配脚本修复每节只提取首行的问题，上游 Skill 保持原样。\n- `node --check scripts/fix-notes-board.mjs`：通过。对照 Markdown 核对本地解析与离线数据，七十六个展示字段完整、五十七条备选齐全、四十二条笔记关联有效；多段正文、不同换行和文件末尾边界检查通过。\n- 浏览器实际打开离线快照：十九篇笔记与全部详情文字一致；时间线日期、月份筛选、备选卡片与关联跳转正常，控制台无错误。本地目录模式的章节解析另与源文核对。\n\n本次新增验证范围为决策文档和看板；源码检查与模型交互证据仍按前两节记录。学习阶段及理解证据没有因此增加。\n\n## 看板重设计与同步验证（2026-09-12）\n\n用户选择浅色文档工作台。项目看板改为侧栏导航、决策列表和完整阅读页，新增一篇管理决策后共二十篇。项目生成器与原版 Skill 分开维护，旧正则补丁已由两种页面共用的解析器替代。\n\n- `npm run test:board`：十六条回归通过，覆盖固定排序、内容比较、完整解析、串行检查及收尾、目录切换与失败恢复。\n- `npm run typecheck`：本轮通过；Agent 核心源码没有改动。\n- 两种生成命令通过；浏览器核对二十篇笔记的一百个章节、六十条备选，完整包含 Verification。\n- 在浏览器隔离的 OPFS 目录中使用真实文件读写，并注入可改变顺序的目录入口，重复检查后列表节点、顺序、搜索焦点、筛选及滚动位置保持不变；等长编辑更新当前正文，自动轮询检测到新增文件，删除当前笔记显示明确提示，模拟权限错误后保留内容并能恢复。\n- 使用真实浏览器目录句柄验证页面重载后连接与筛选偏好恢复；桌面和 390px 窄屏阅读、菜单和溢出检查通过。此验证未代替用户在 Windows 原生目录选择框中的授权操作。\n\n2026-09-12 随后按用户确认的“项目全貌”调整首页，当时按六个项目模块展示关键决定、状态和笔记关联，摘要可展开，阅读时保留模块笔记目录；项目分组由独立的 `.agents/board.json` 提供，原版 Skill 保持原样。\n\n- 本次 `npm run test:board` 十九条通过，新增模块分组顺序、重复路径去重、缺失与无配置时的回退覆盖。\n- 本次浏览器核对六个模块与二十篇笔记的全部章节和备选，摘要开关、模块筛选、关联跳转及 390px 阅读布局通过。\n- 在隔离 OPFS 目录中重新检查：不变的扫描保留模块节点、焦点及正文和目录的滚动位置；等长修改更新正文并保留折叠目录；新增的未配置笔记由自动检查显示在分类分组。失败恢复、当前笔记删除提示、真实句柄重载及模块、搜索、目录偏好恢复通过。移除展示配置后仍按标准类别展示全部笔记。\n\n这些属于开发管理工具验证，Agent 核心源码与阶段 7 的理解证据仍按已有记录，不据此推进阶段 8。\n\n## 当前看板与验证（2026-09-13）\n\n看板已采用统一顶部导航、全宽流程画布和节点就地展开，移除了常驻左右侧栏。完整笔记及进度原文在居中阅读层打开，关闭后恢复原视图、筛选、节点、焦点与滚动位置。当前实现、下一步候选、待验证项和可选学习区域读取本文件的对应章节；阶段与理解证据不在展示配置中另存一份。重复标题、介绍、节点职责导语和页脚统计已移除。\n\n- `npm run test:board`：二十六条通过，包含地图引用、实际依据路径和进度章节、资料读取范围、单独修改配置或进度、来源缺失与无配置回退。\n- `npm run verify-notes`：二十篇笔记通过；`npm run typecheck`、浏览器脚本和生成器语法检查通过。两种看板生成命令通过。\n- 全宽布局的一百零一项浏览器检查通过：九个节点的展开和收起、依据切换、二十篇笔记的一百个完整章节、搜索与月份筛选、关联资料返回、关闭后恢复焦点和位置、阅读中重载及浏览器前进／后退。\n- 1536、1280、1024、800、700、390 和 360px 下，四个主视图的顶部导航可用且无横向溢出。窄屏详情紧接所选节点，展开备选后回路线随高度更新，调整窗口后详情回到对应行。\n- 隔离 OPFS 目录中的十七项同步检查通过：不变轮询保留 DOM，修改地图和正在阅读的笔记保留阅读层；无效配置保留内容并恢复；关闭后恢复节点、依据和学习偏好；真实句柄重载后继续阅读；当前笔记删除、进度更新、移除配置和只连接 notes 正常回退。浏览器未出现页面脚本错误。\n- 上述目录检查使用浏览器的真实文件句柄，Windows 原生目录选择授权仍由用户浏览器完成。历史的遍历顺序、等长修改和新增未分组笔记检查保留在[看板决定](../notes/implemented/process/2026-09-12-readable-board-and-stable-sync.md)中。\n\n上述看板工作只变更展示、资料适配、管理文档和相应检查。当时 Agent 核心源码没有修改，阶段 8 尚未开始，学习者的理解证据保持原状。\n\n## 理解证据\n\n已有记录显示学习者亲自接入了代码并运行上述验收。对注册表职责、真实轮边界和暂停语义的独立解释或迁移改造，尚未在本摘要中建立具体证据。\n\n这些内容标为“待观察”；继续教学时结合当次表现补充，不要求从头重学，也不将阶段完成等同于全部掌握。\n\n阶段 8 已观察到学习者按指导完成文本输出开关对照、模拟参数拼接、真实工具流观察、单调用组装、多调用参数分组，以及完整组装器与主循环接入；学习者能按统一参考落地代码并完成真实多工具和拒绝路径验收。这是有提示的实现与纠错证据。学习者随后独立说明：`collectResponse()` 负责确认流正常结束并完整收集调用，`prepareCall()` 负责验证完整调用是否符合工具契约，因此缺少 `finish_reason` 属于协议错误，而完整但非法的参数应留给工具准备层反馈。按 index 分组而不是按名称分组的理由仍待独立观察。\n\n阶段 9 已观察到学习者按完整参考接入可实例化注册表、独立子 Agent 循环、委派工具、最终总结预算和十四条测试，并完成真实只读委派。这是有指导的实现和运行验收证据；学习者尚未独立解释“schema 隐藏与准备阶段必须共用同一能力集合”以及“为何最后一次请求必须撤下工具”，后续结合改造或提问观察，不因阶段完成自动推断掌握。\n\n稳定性课已观察到学习者按完整模块参考完成主轮抽取、四条组合测试和两条真实模型验收。测试结果证明实现存在并按预期运行；“为何只注入模型流与输出，而不建立完整工具 mock 层”尚未由学习者独立解释，保留为后续架构理解观察点。\n\n## 当前限制\n\n- 完成与暂停的选择依赖模型、提示词和工具描述；已有用例不代表所有自然表述都已验证。\n- todo 只有 `id/title`，没有任务归属或持久化暂停状态；多个进程的写入未协调。\n- 历史只保留最近六个完整用户轮，消息本身不跨进程恢复；固定轮数不保证固定 token 上限。\n- 文件读取工具有项目范围、敏感路径与 realpath 检查；shell 依赖批准，不构成完整沙箱。\n- 子 Agent 当前同步且只读，固定六次请求并保留最后一次总结；不并行、不持久化、不共享 todo，也不支持嵌套批准或递归委派。\n- 决策笔记已建立对应设计理由。后续变更优先更新所属笔记，避免将这些摘要扩展成第二套设计文档。\n\n## 完善版 v1 目标与路线（2026-09-20）\n\n目标不是复制大型商业 Agent，而是把当前内核补成一个微型、功能闭环、能长期作为个人本地编码助手使用，并能展示 Agent 实习工程能力的作品。v1 继续采用直接 SDK、原生 Function Calling、显式工具注册表、单进程 CLI 和同步只读子 Agent；不引入框架、数据库、Web UI、并行多 Agent、RAG 或插件平台。\n\n| 阶段 | 完整模块 | 主要验收面 |\n| --- | --- | --- |   // Note: 完整章节与稳定同步的依据见 .agents/notes/implemented/process/2026-09-12-readable-board-and-stable-sync.md
const LIFECYCLES = ['implemented', 'proposed', 'rejected', 'archived'];
const CLASSES = ['architecture', 'feature', 'bug-fix', 'simplification', 'process', 'testing'];
const STATUS_LABELS = { implemented: '已落地', proposed: '待评审', rejected: '已否决', archived: '已归档' };
const CLASS_LABELS = { architecture: '架构设计', feature: '功能特性', 'bug-fix': '缺陷修复', simplification: '简化设计', process: '开发流程', testing: '测试验证' };
const SECTION_LABELS = { Problem: '问题背景', Decision: '决定', Proposal: '提案', 'Alternatives considered': '方案取舍', Consequences: '影响与代价', Verification: '验证与依据', 'Acceptance criteria': '验收标准', Risks: '风险' };

function compareText(a, b) {
  return a < b ? -1 : a > b ? 1 : 0;
}

function compareNotes(a, b, mode = 'new', incoming = new Map()) {
  if (mode === 'references') {
    const difference = (incoming.get(b.id) || 0) - (incoming.get(a.id) || 0);
    if (difference) return difference;
  }
  const date = mode === 'old' ? compareText(a.date, b.date) : compareText(b.date, a.date);
  return date || compareText(a.id, b.id);
}

function splitSections(raw) {
  const sections = [];
  let section = null;
  let fence = null;
  for (const line of raw.replace(/\r\n?/g, '\n').split('\n')) {
    const marker = /^\s*(`{3,}|~{3,})/.exec(line);
    if (marker) {
      if (!fence) fence = marker[1];
      else if (marker[1][0] === fence[0] && marker[1].length >= fence.length) fence = null;
    }
    const heading = !fence && /^##\s+(.+?)\s*$/.exec(line);
    if (heading) {
      section = { heading: heading[1], lines: [] };
      sections.push(section);
    } else if (section) section.lines.push(line);
  }
  return sections.map(({ heading, lines }, index) => ({ heading, body: lines.join('\n').trim(), anchor: 'section-' + index }));
}

function resolveNoteLink(id, href) {
  const clean = href.split(/[?#]/)[0].replace(/\\/g, '/').replace(/\.zh\.md$/, '.md');
  if (!clean || /^[a-z][a-z\d+.-]*:/i.test(clean) || clean.startsWith('/')) return null;
  const segments = id.split('/').slice(0, -1);
  for (const part of clean.split('/')) {
    if (!part || part === '.') continue;
    if (part === '..') {
      if (!segments.length) return null;
      segments.pop();
    } else segments.push(part);
  }
  return segments.join('/');
}

function buildDataset(files) {
  const selected = new Map();
  for (const file of [...files].sort((a, b) => compareText(a.path, b.path))) {
    const path = file.path.replace(/\\/g, '/');
    const parts = path.split('/');
    if (parts.length !== 3 || !LIFECYCLES.includes(parts[0]) || !CLASSES.includes(parts[1]) || !/^\d{4}-\d{2}-\d{2}-.+\.md$/.test(parts[2])) continue;
    const id = path.replace(/\.zh\.md$/, '.md');
    if (!selected.has(id) || path.endsWith('.zh.md')) selected.set(id, { ...file, path });
  }
  const notes = [];
  for (const [id, file] of selected) {
    const rawBody = file.content;
    const title = /^\uFEFF?# Agent Note[^:：]*[:：]\s*(.+)$/m.exec(rawBody)?.[1].trim();
    const status = /^Status:\s*(.+)$/m.exec(rawBody)?.[1].trim();
    if (!title || !status) throw new Error('笔记暂时无法解析：' + file.path);
    const [lifecycle, cls, filename] = id.split('/');
    if (lifecycle !== 'archived' && !new RegExp('^' + lifecycle + '(?:$|\\s)').test(status)) throw new Error('笔记状态与目录不一致：' + file.path);
    const sections = splitSections(rawBody);
    const section = (...headings) => sections.find(item => headings.includes(item.heading))?.body || '';
    notes.push({
      id, sourcePath: file.path, slug: filename.replace(/\.md$/, ''), lifecycle, cls,
      date: filename.slice(0, 10), title, status, rawBody, sections,
      problem: section('Problem', '问题'),
      decision: section('Decision', 'Proposal', '决策', '提案'),
      alternatives: section('Alternatives considered', '曾考虑的替代方案', '曾考虑的备选'),
      consequences: section('Consequences', '后果'),
      outLinks: [],
    });
  }
  const ids = new Set(notes.map(note => note.id));
  for (const note of notes) {
    const links = new Set();
    for (const match of note.rawBody.matchAll(/\[[^\]\n]*\]\(([^)]+)\)/g)) {
      const target = resolveNoteLink(note.id, match[1].trim());
      if (target && target !== note.id && ids.has(target)) links.add(target);
    }
    note.outLinks = [...links].sort(compareText);
  }
  return notes.sort(compareNotes);
}

function datasetSignature(notes) {
  // Compare the actual text, not mtime/size; equal-length edits must still refresh.
  return JSON.stringify([...notes].sort((a, b) => compareText(a.id, b.id)).map(note => [note.id, note.sourcePath, note.rawBody]));
}

function alternativeItems(note) {
  return note.alternatives.split(/\n(?=###?\s|\s*[-*+]\s)/).map(text => text.replace(/^\s*(?:#{2,3}\s+|[-*+]\s+)/, '').trim()).filter(Boolean);
}

function countReferences(notes) {
  const result = new Map(notes.map(note => [note.id, 0]));
  for (const note of notes) for (const id of note.outLinks) if (result.has(id)) result.set(id, result.get(id) + 1);
  return result;
}

function groupNotes(notes, presentation = {}) {
  const byId = new Map(notes.map(note => [note.id, note]));
  const used = new Set();
  const groups = [];
  if (Array.isArray(presentation.groups)) {
    for (const group of presentation.groups) {
      const entries = [];
      for (const entry of group.notes || []) {
        if (!byId.has(entry.id) || used.has(entry.id)) continue;
        used.add(entry.id);
        entries.push({ note: byId.get(entry.id), label: entry.label || byId.get(entry.id).title });
      }
      if (entries.length) groups.push({ id: group.id, title: group.title, entries });
    }
  }
  // New or renamed notes stay visible even when the optional project grouping is stale.
  for (const cls of CLASSES) {
    const entries = notes.filter(note => !used.has(note.id) && note.cls === cls).sort(compareNotes).map(note => ({ note, label: note.title }));
    if (entries.length) groups.push({ id: 'class-' + cls, title: CLASS_LABELS[cls], entries });
  }
  return groups;
}

async function resolveNotesDirectory(root) {
  try {
    const agents = await root.getDirectoryHandle('.agents');
    return await agents.getDirectoryHandle('notes');
  } catch (error) { if (error.name !== 'NotFoundError' && error.name !== 'TypeMismatchError') throw error; }
  if (root.name === '.agents') return root.getDirectoryHandle('notes');
  if (root.name === 'notes') return root;
  for await (const entry of root.values()) if (entry.kind === 'directory' && LIFECYCLES.includes(entry.name)) return root;
  throw new Error('请选择项目根目录或 .agents/notes 文件夹。');
}

async function readNoteDirectory(root) {
  const files = [];
  async function walk(directory, parts = []) {
    const entries = [];
    for await (const entry of directory.values()) entries.push(entry);
    entries.sort((a, b) => compareText(a.name, b.name));
    for (const entry of entries) {
      if (entry.kind === 'directory' && (parts.length === 0 ? LIFECYCLES.includes(entry.name) : parts.length === 1 && CLASSES.includes(entry.name))) {
        await walk(entry, [...parts, entry.name]);
      } else if (parts.length === 2 && entry.kind === 'file' && entry.name.endsWith('.md')) {
        // A failed read rejects the entire scan; never publish a partial directory.
        const file = await entry.getFile();
        files.push({ path: [...parts, entry.name].join('/'), content: await file.text() });
      }
    }
  }
  await walk(root);
  return buildDataset(files);
}

function createLiveSync({ read = readNoteDirectory, signatureOf = datasetSignature, countOf = value => value.length, commit, report = () => {} }) {
  let source = null;
  let generation = 0;
  let signature = null;
  let queued = false;
  let active = null;
  async function drain() {
    while (queued && source) {
      queued = false;
      const reading = source;
      const version = generation;
      try {
        const notes = await read(reading);
        if (version !== generation) continue;
        const next = signatureOf(notes);
        const changed = signature !== next;
        if (changed) {
          commit(notes);
          signature = next;
        }
        report({ ok: true, changed, count: countOf(notes), checkedAt: Date.now() });
      } catch (error) {
        if (version === generation) report({ ok: false, error });
      }
    }
  }
  function request() {
    if (!source) return Promise.resolve();
    queued = true;
    if (!active) active = Promise.resolve().then(drain).finally(() => {
      active = null;
      // A microtask can enqueue a check after drain exits but before this cleanup.
      if (queued && source) return request();
    });
    return active;
  }
  return {
    setSource(handle) {
      source = handle;
      generation++;
      signature = null;
      // A source change during a read invalidates that result and schedules the new source.
      queued = !!handle && !!active;
    },
    request,
  };
}

const missingEntry = error => ['NotFoundError', 'TypeMismatchError', 'ENOENT', 'ENOTDIR'].includes(error?.name) || ['ENOENT', 'ENOTDIR'].includes(error?.code);

const documentPath = value => string(value) && !value.includes('\\') && !value.includes(':') && value.split('/').every(part => part && part !== '.' && part !== '..') && value.endsWith('.md');

function validatePresentation(value) {
  const fail = message => { throw new Error('board.json：' + message); };
  if (!object(value)) fail('需要一个配置对象。');
  if (value.name !== undefined && typeof value.name !== 'string') fail('name 需要是文字。');
  if (value.groups !== undefined && !Array.isArray(value.groups)) fail('groups 需要是数组。');
  const groupIds = new Set();
  for (const group of value.groups || []) {
    if (!object(group) || !slug(group.id) || group.id.startsWith('class-') || groupIds.has(group.id)) fail('模块 ID 需要唯一，且不能使用 class- 前缀。');
    if (!string(group.title) || !Array.isArray(group.notes)) fail('模块需要标题和笔记清单。');
    for (const note of group.notes) if (!object(note) || !string(note.id) || (note.label !== undefined && typeof note.label !== 'string')) fail('笔记入口需要路径和可选的短标题。');
    groupIds.add(group.id);
  }
  if (value.map !== undefined) {
    const map = value.map;
    if (!object(map) || !string(map.title) || !Array.isArray(map.nodes) || !Array.isArray(map.flow) || map.flow.length < 2 || map.flow.length > 6) fail('项目地图需要标题、节点和 2–6 步主流程。');
    const ids = new Set();
    for (const node of map.nodes) {
      if (!object(node) || !slug(node.id) || ids.has(node.id)) fail('地图节点 ID 需要唯一。');
      for (const key of ['title', 'caption', 'boundary']) if (!string(node[key])) fail('地图节点需要 ' + key + '。');
      if (!Array.isArray(node.behavior) || !node.behavior.length || node.behavior.some(item => !string(item))) fail('节点需要当前做法。');
      if (!Array.isArray(node.notes) || node.notes.some(item => !string(item))) fail('节点的依据需要笔记路径。');
      if (node.sources !== undefined && (!Array.isArray(node.sources) || node.sources.some(item => !object(item) || !string(item.label) || !relativeReference(item.path)))) fail('源码入口需要 label 和相对路径。');
      ids.add(node.id);
    }
    const placed = new Set();
    const place = id => { if (!ids.has(id) || placed.has(id)) fail('地图位置引用了缺失或重复的节点：' + id); placed.add(id); };
    map.flow.forEach(place);
    if (map.supports !== undefined && !Array.isArray(map.supports)) fail('supports 需要是数组。');
    for (const item of map.supports || []) {
      if (!object(item) || !map.flow.includes(item.target) || !string(item.label)) fail('辅助模块需要指向主流程并说明关系。');
      place(item.id);
    }
    if (map.branches !== undefined) {
      if (!object(map.branches) || !map.flow.includes(map.branches.from) || !string(map.branches.title) || !Array.isArray(map.branches.items)) fail('分支需要起点、标题和节点清单。');
      for (const item of map.branches.items) {
        if (!object(item) || !map.flow.includes(item.returnsTo) || !string(item.label)) fail('分支需要返回位置和说明。');
        place(item.id);
      }
    }
    if (placed.size !== ids.size) fail('每个节点都需要在地图中有位置。');
    if (map.loop !== undefined && (!object(map.loop) || !map.flow.includes(map.loop.from) || !map.flow.includes(map.loop.to) || map.flow.indexOf(map.loop.from) <= map.flow.indexOf(map.loop.to) || !string(map.loop.label))) fail('回路需要从后续步骤返回前面的步骤。');
    if (map.defaultNode !== undefined && !ids.has(map.defaultNode)) fail('默认节点不存在。');
  }
  for (const key of ['brief', 'learning']) {
    const block = value[key];
    if (block === undefined) continue;
    if (!object(block) || !documentPath(block.source)) fail(key + ' 的来源需要是配置目录内的 Markdown 相对路径。');
    if (key === 'brief') {
      for (const field of ['current', 'next', 'attention']) if (!string(block[field])) fail('brief 需要 ' + field + ' 章节名称。');
    } else {
      if (block.enabled !== undefined && typeof block.enabled !== 'boolean') fail('learning.enabled 需要是布尔值。');
      if (!string(block.title) || !Array.isArray(block.sections) || block.sections.some(section => !object(section) || !string(section.title) || !string(section.heading))) fail('学习区域需要标题和来源章节。');
    }
  }
  return value;
}

async function readRelativeFile(root, path) {
  const parts = path.split('/');
  let directory = root;
  for (const part of parts.slice(0, -1)) directory = await directory.getDirectoryHandle(part);
  return (await (await directory.getFileHandle(parts.at(-1))).getFile()).text();
}

async function readPresentationDirectory(root) {
  let presentation = {};
  try { presentation = validatePresentation(JSON.parse(await readRelativeFile(root, 'board.json'))); }
  catch (error) { if (!missingEntry(error)) throw error; }
  const paths = [...new Set([presentation.brief?.source, presentation.learning?.enabled !== false && presentation.learning?.source].filter(Boolean))].sort();
  const entries = await Promise.all(paths.map(async path => {
    try { return [path, await readRelativeFile(root, path)]; }
    catch (error) { if (missingEntry(error)) return [path, null]; throw error; }
  }));
  return { presentation, documents: Object.fromEntries(entries) };
}

async function readProjectDirectory(root) {
  let workspace = null;
  try { workspace = await root.getDirectoryHandle('.agents'); }
  catch (error) { if (!missingEntry(error)) throw error; }
  if (!workspace) {
    try { await root.getDirectoryHandle('notes'); workspace = root; }
    catch (error) { if (!missingEntry(error)) throw error; }
  }
  if (workspace) {
    const notesRoot = await workspace.getDirectoryHandle('notes');
    const [notes, assets] = await Promise.all([readNoteDirectory(notesRoot), readPresentationDirectory(workspace)]);
    return { notes, ...assets, scope: 'project', label: assets.presentation.name || (workspace === root ? '项目' : root.name) };
  }
  // A notes-only handle cannot read a sibling board.json or learning folder.
  // Do not carry the previously selected project's map into another directory.
  return { notes: await readNoteDirectory(await resolveNotesDirectory(root)), presentation: {}, documents: {}, scope: 'notes', label: '决策笔记' };
}

function projectSignature(project) {
  return JSON.stringify([datasetSignature(project.notes), project.presentation, Object.entries(project.documents).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0), project.scope, project.label]);
}

function documentSection(documents, source, heading) {
  const content = documents[source];
  if (typeof content !== 'string') return null;
  return splitSections(content).find(section => section.heading === heading)?.body ?? null;
}

function firstParagraph(text) {
  if (!text) return '';
  return text.split(/\n\s*\n/).find(block => block.trim() && !/^(?:\s*[-*+|]|#{1,6}\s)/.test(block))?.trim() || '';
}

function sectionItems(text) {
  return (text || '').split('\n').filter(line => /^\s*[-*+]\s+/.test(line)).map(line => line.replace(/^\s*[-*+]\s+/, ''));
}

function inlineMarkdown(text, note, links = true) {

    if (match[1] !== undefined) html += '<code>' + escapeHtml(match[1]) + '</code>';
    else if (match[2] !== undefined) html += '<strong>' + escapeHtml(match[2]) + '</strong>';

    start = match.index + match[0].length;

    const line = lines[index];
    if (!line.trim()) { index++; continue; }
    const fence = /^\s*(`{3,}|~{3,})/.exec(line);
    if (fence) {
      const code = []; index++;
      const end = new RegExp('^\\s*' + fence[1][0] + '{' + fence[1].length + ',}\\s*$');
      while (index < lines.length && !end.test(lines[index])) code.push(lines[index++]);
      if (index < lines.length) index++;
      output.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>'); continue;
    }
    const heading = /^(#{3,6})\s+(.+)$/.exec(line);
    if (heading) { output.push('<h3>' + inlineMarkdown(heading[2], note) + '</h3>'); index++; continue; }
    if (/^\s*[-*+]\s/.test(line) || /^\s*\d+\.\s/.test(line)) {
      const ordered = /^\s*\d+\.\s/.test(line);
      const rule = ordered ? /^\s*\d+\.\s+(.*)$/ : /^\s*[-*+]\s+(.*)$/;
      const items = [];
      while (index < lines.length) {
        const item = rule.exec(lines[index]);
        if (!item) break;
        const content = [item[1]]; index++;
        while (index < lines.length && lines[index].trim() && !special(lines[index])) content.push(lines[index++].trim());
        items.push('<li>' + inlineMarkdown(content.join(' '), note) + '</li>');
      }
      output.push('<' + (ordered ? 'ol' : 'ul') + '>' + items.join('') + '</' + (ordered ? 'ol' : 'ul') + '>'); continue;
    }
    if (/^>/.test(line)) {
      const quote = [];
      while (index < lines.length && /^>/.test(lines[index])) quote.push(lines[index++].replace(/^>\s?/, ''));
      output.push('<blockquote>' + inlineMarkdown(quote.join(' '), note) + '</blockquote>'); continue;
    }
    if (line.trim().startsWith('|') && /^\s*\|?[\s:|-]+\|\s*$/.test(lines[index + 1] || '')) {
      const cells = row => row.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());
      const head = cells(line); index += 2;
      const rows = [];
      while (index < lines.length && lines[index].trim().startsWith('|')) rows.push(cells(lines[index++]));
      output.push('<div class="table-wrap"><table><thead><tr>' + head.map(cell => '<th>' + inlineMarkdown(cell, note) + '</th>').join('') + '</tr></thead><tbody>' + rows.map(row => '<tr>' + row.map(cell => '<td>' + inlineMarkdown(cell, note) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>'); continue;
    }
    const paragraph = [line]; index++;
    while (index < lines.length && !special(lines[index])) paragraph.push(lines[index++]);
    output.push('<p>' + inlineMarkdown(paragraph.join('\n'), note).replace(/\n/g, '<br>') + '</p>');
  }
  return output.join('');
}

function renderNavigation() {
  document.querySelectorAll('.workspace-tabs [data-view]').forEach(element => {

    element.classList.toggle('active', active);

  });
}

function relatedModules(group) {
  const links = new Map();
  for (const note of state.notes) for (const target of note.outLinks) {
    const from = state.noteGroups.get(note.id)?.id;
    const to = state.noteGroups.get(target)?.id;
    const other = from === group.id && to !== from ? to : to === group.id && from !== to ? from : null;
    if (other) links.set(other, (links.get(other) || 0) + 1);
  }
  return state.groups.filter(item => links.has(item.id)).map(item => ({ group: item, count: links.get(item.id) }));
}

function renderOverview() {
  const mapped = !!presentation.map;

  $('overview-summary').hidden = mapped;
  $('module-grid').hidden = mapped;

  setHtml('overview-summary', '<p><strong>' + state.groups.length + '</strong> 个' + (presentation.groups?.length ? '模块' : '类别') + '<span>·</span><strong>' + state.notes.length + '</strong> 项决定</p><div class="overview-controls"><div class="overview-statuses">' + statuses.map(item => '<button class="status-filter-button" data-status="' + item.key + '" aria-label="查看' + item.count + '篇' + STATUS_LABELS[item.key] + '决策">' + statusBadge({ lifecycle: item.key }) + '<span>' + item.count + '</span></button>').join('') + '</div><button id="toggle-excerpts" class="excerpt-toggle" aria-pressed="' + state.showExcerpts + '">' + icon('book') + '<span>' + (state.showExcerpts ? '收起决定摘要' : '显示决定摘要') + '</span></button></div>');
  $('module-grid').classList.toggle('show-excerpts', state.showExcerpts);
  setHtml('module-grid', state.groups.map((group, index) => {
    const related = relatedModules(group);
    return '<section class="module-card" aria-labelledby="module-title-' + escapeHtml(group.id) + '"><header class="module-card-heading"><span class="module-number">' + String(index + 1).padStart(2, '0') + '</span><div><h2 id="module-title-' + escapeHtml(group.id) + '"><button data-group-id="' + escapeHtml(group.id) + '">' + escapeHtml(group.title) + icon('arrow') + '</button></h2></div></header><div class="module-decisions">' + group.entries.map(({ note, label }) => noteButton(note, 'module-decision', '<div class="module-decision-title"><h3>' + escapeHtml(label) + '</h3>' + statusBadge(note) + '</div><p>' + escapeHtml(decisionExcerpt(note)) + '</p>')).join('') + '</div>' + (related.length ? '<footer class="module-links"><span>' + icon('link') + '笔记关联</span><div>' + related.map(({ group: other, count }) => '<button data-group-id="' + escapeHtml(other.id) + '" title="' + count + ' 条跨模块笔记引用">' + escapeHtml(other.title) + '</button>').join('') + '</div></footer>' : '') + '</section>';
  }).join(''));

function workspaceHref(path) { return (config.workspaceBase || '.agents') + '/' + path; }
function documentContext(path) { return { id: '../' + path, sourcePath: '../' + path }; }
function sourceButton(path, label = '学习进度') { return '<button class="text-button source-button" data-source-id="' + escapeHtml(path) + '">' + icon('file') + escapeHtml(label) + icon('arrow') + '</button>'; }
function missingSection() { return '<p class="source-missing">来源文件或章节暂不可用，请核对项目资料。</p>'; }

function renderProjectOverview() {
  const map = presentation.map;
  if (!map.nodes.some(node => node.id === state.nodeId)) state.nodeId = map.defaultNode || map.flow[0];
  const nodes = new Map(map.nodes.map(node => [node.id, node]));
  const button = (id, kind, extra = '') => {
    const node = nodes.get(id);
    const index = map.flow.indexOf(id);
    return '<button class="map-node ' + kind + '" data-map-node="' + id + '" aria-expanded="false" aria-controls="map-detail"><span class="map-node-mark">' + (index >= 0 ? String(index + 1).padStart(2, '0') : icon(kind === 'support-node' ? 'layers' : 'branch')) + '</span><strong>' + escapeHtml(node.title) + '</strong><span class="map-node-caption">' + escapeHtml(node.caption) + '</span>' + extra + '<span class="node-chevron">' + icon('chevron') + '</span></button>';
  };
  $('map-title').textContent = map.title;
  const supports = (map.supports || []).map(item => '<div class="flow-support" style="--column:' + (map.flow.indexOf(item.target) + 1) + '">' + button(item.id, 'support-node') + '<span class="support-relation">' + escapeHtml(item.label) + '<span aria-hidden="true"> ↕</span><span class="sr-only">：' + escapeHtml(nodes.get(item.target).title) + '</span></span></div>').join('');
  const loop = map.loop ? '<div class="flow-loop-row" style="--flow-count:' + map.flow.length + '"><div class="flow-loop" style="--loop-start:' + (map.flow.indexOf(map.loop.to) + 1) + ';--loop-end:' + (map.flow.indexOf(map.loop.from) + 2) + ';--loop-span:' + (map.flow.indexOf(map.loop.from) - map.flow.indexOf(map.loop.to) + 1) + '"><span>' + escapeHtml(map.loop.label) + '<span aria-hidden="true"> ↺</span></span></div></div>' : '';
  const branches = map.branches ? '<section class="flow-branches"><div class="branch-caption">' + icon('branch') + '<span>' + escapeHtml(nodes.get(map.branches.from).title) + ' → ' + escapeHtml(map.branches.title) + '</span></div><div class="branch-nodes" style="--branch-count:' + map.branches.items.length + '">' + map.branches.items.map(item => button(item.id, 'branch-node', '<span class="branch-return">' + icon(item.returnsTo === map.flow[0] ? 'back' : 'refresh') + escapeHtml(item.label) + '</span>')).join('') + '</div><div id="branch-detail-slot" class="map-detail-slot" hidden></div></section>' : '';
  const diagram = '<div class="flow-diagram" style="--flow-count:' + map.flow.length + '"><div class="flow-supports">' + supports + '</div><div id="support-detail-slot" class="map-detail-slot" hidden></div><div class="flow-main" id="flow-main">' + map.flow.map((id, index) => '<div class="flow-step' + (index < map.flow.length - 1 ? ' has-next' : '') + '">' + button(id, 'main-node') + '</div>').join('') + (map.loop ? '<div class="mobile-flow-loop" id="mobile-flow-loop" aria-hidden="true"><span>' + escapeHtml(map.loop.label) + '</span></div>' : '') + '</div>' + loop + '<div id="flow-detail-slot" class="map-detail-slot" hidden></div></div>' + branches;
  // Keep the expanded panel alive when only the diagram configuration changes.
  if (htmlCache.get('project-map') !== diagram) {
    $('map-surface').append($('map-detail'));
    setHtml('project-map', diagram);
  }
  const related = new Set();
  if (state.nodeExpanded) {
    for (const item of map.supports || []) if (item.id === state.nodeId) related.add(item.target);
    for (const item of map.branches?.items || []) if (item.id === state.nodeId) { related.add(map.branches.from); related.add(item.returnsTo); }
  }
  document.querySelectorAll('#project-map [data-map-node]').forEach(element => {
    const expanded = state.nodeExpanded && element.dataset.mapNode === state.nodeId;
    element.classList.toggle('selected', expanded);
    element.classList.toggle('map-related', related.has(element.dataset.mapNode));
    element.setAttribute('aria-expanded', String(expanded));
  });
  renderMapDetail(nodes.get(state.nodeId));
  placeMapDetail();
  requestAnimationFrame(updateMapLayout);
  renderProjectBrief();
  renderLearning();
}

function renderMapDetail(selected) {
  const notes = selected.notes.map(id => state.byId.get(id)).filter(Boolean);
  if (!notes.some(note => note.id === state.evidenceId)) state.evidenceId = notes[0]?.id || '';
  const note = state.byId.get(state.evidenceId);
  let evidence = '<p class="source-missing">' + (!state.connected && !state.notes.length ? '连接目录后可读取取舍与验证记录。' : '相关决策暂不可用。') + '</p>';
  if (note) {
    const verification = note.sections.find(section => section.heading === 'Verification');
    const excerpt = verification && (firstParagraph(verification.body) || verification.body);
    evidence = '<div class="node-evidence-toolbar"><label><span class="sr-only">决策依据</span><select id="map-note-select">' + notes.map(item => '<option value="' + escapeHtml(item.id) + '"' + (item.id === note.id ? ' selected' : '') + '>' + escapeHtml(labelFor(item)) + '</option>').join('') + '</select></label>' + noteButton(note, 'text-button', '阅读全文' + icon('arrow')) + '</div>'
      + '<div class="node-evidence-columns"><section><h4>取舍</h4><p>' + escapeHtml(decisionExcerpt(note)) + '</p><details id="node-alternatives" class="node-alternatives"><summary>备选方案' + icon('chevron') + '</summary><ul>' + alternativeItems(note).map(item => '<li>' + inlineMarkdown(item, note) + '</li>').join('') + '</ul></details></section>'
      + '<section><h4>验证记录</h4><div class="markdown">' + (excerpt ? markdown(excerpt, note) : '<p>暂无验证记录。</p>') + '</div></section></div>';
  }
  setHtml('map-detail', '<div class="node-detail-heading"><h3 id="map-detail-title" tabindex="-1">' + escapeHtml(selected.title) + '</h3><button class="icon-button" data-map-close aria-label="收起' + escapeHtml(selected.title) + '" title="收起（Esc）">' + icon('close') + '</button></div>'
    + '<div class="node-detail-grid"><section class="node-implementation"><h4>实现</h4><ul>' + selected.behavior.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul><div class="detail-boundary"><h4>限制</h4><p>' + escapeHtml(selected.boundary) + '</p></div>'
    + (selected.sources?.length ? '<div class="detail-sources">' + selected.sources.map(source => '<a href="' + escapeHtml(workspaceHref(source.path)) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(source.label) + icon('external') + '</a>').join('') + '</div>' : '')
    + '</section><section class="node-evidence">' + evidence + '</section></div>');
}

function placeMapDetail() {
  if (!presentation.map || !$('flow-main')) return;
  const detail = $('map-detail');
  const button = $('project-map').querySelector('[data-map-node="' + state.nodeId + '"]');
  if (!button) return;
  for (const slot of document.querySelectorAll('.map-detail-slot')) slot.hidden = true;
  let slot;
  if (button.classList.contains('support-node')) slot = $('support-detail-slot');
  else if (mobileLayout.matches) slot = button.parentElement;
  else slot = $(button.classList.contains('main-node') ? 'flow-detail-slot' : 'branch-detail-slot');
  if (mobileLayout.matches && button.classList.contains('branch-node')) {
    if (button.nextElementSibling !== detail) button.after(detail);
  } else if (detail.parentElement !== slot) slot.append(detail);
  if (slot.classList.contains('map-detail-slot')) slot.hidden = !state.nodeExpanded;
  detail.hidden = !state.nodeExpanded;
  if (state.nodeExpanded) {
    const source = button.getBoundingClientRect(), target = detail.getBoundingClientRect();
    detail.style.setProperty('--detail-anchor', Math.max(18, Math.min(target.width - 18, source.left + source.width / 2 - target.left)) + 'px');
  }
}

function renderProjectBrief() {
  const brief = presentation.brief;
  $('project-brief').hidden = !brief;
  $('project-focus').hidden = !brief;
  if (!brief) return;
  const current = documentSection(state.documents, brief.source, brief.current);
  const next = documentSection(state.documents, brief.source, brief.next);
  const attention = documentSection(state.documents, brief.source, brief.attention);
  const doc = documentContext(brief.source);
  setHtml('project-brief', '<div class="brief-item"><div class="current-marker">' + icon('check') + '<span>当前实现</span></div><div class="current-description">' + (current === null ? missingSection() : '<p>' + inlineMarkdown(firstParagraph(current), doc) + '</p>') + '</div></div><div class="brief-item brief-next"><div class="current-marker">' + icon('arrow') + '<span>下一步候选</span></div><div class="current-description">' + (next === null ? missingSection() : '<p>' + inlineMarkdown(firstParagraph(next), doc) + '</p>') + '</div></div>' + sourceButton(brief.source));
  const nextDetail = next && firstParagraph(next.split(/\n\s*\n/).slice(1).join('\n\n'));
  setHtml('project-focus', '<section class="focus-card next-focus"><h2>下一步</h2>' + (next === null ? missingSection() : '<p>' + inlineMarkdown(nextDetail || firstParagraph(next), doc) + '</p>') + '</section><section class="focus-card attention-focus"><h2>待验证</h2>' + (attention === null ? missingSection() : '<ul>' + sectionItems(attention).map(item => '<li>' + inlineMarkdown(item, doc) + '</li>').join('') + '</ul>') + '</section>');
}

function updateMapLayout() {
  if ($('overview-view').hidden) return;
  placeMapDetail();
  const loop = presentation.map?.loop;
  const element = $('mobile-flow-loop');
  if (!loop || !element || !mobileLayout.matches) return;
  const main = $('flow-main');
  const from = main.querySelector('[data-map-node="' + loop.from + '"]').getBoundingClientRect();
  const to = main.querySelector('[data-map-node="' + loop.to + '"]').getBoundingClientRect();
  const top = main.getBoundingClientRect().top;
  element.style.top = to.top + to.height / 2 - top + 'px';
  element.style.height = from.top + from.height / 2 - to.top - to.height / 2 + 'px';
}
window.addEventListener('resize', updateMapLayout);
new ResizeObserver(updateMapLayout).observe($('project-map'));

function renderLearning() {
  const learning = presentation.learning;
  const enabled = !!learning && learning.enabled !== false;
  $('learning-panel').hidden = !enabled;
  if (!enabled) { setHtml('learning-content', ''); return; }
  $('learning-title').textContent = learning.title;
  $('learning-toggle').setAttribute('aria-expanded', String(state.showLearning));
  $('learning-content').hidden = !state.showLearning;
  setHtml('learning-content', '<div class="learning-columns">' + learning.sections.map(section => {
    const body = documentSection(state.documents, learning.source, section.heading);
    return '<section><h3>' + escapeHtml(section.title) + '</h3><div class="markdown">' + (body === null ? missingSection() : markdown(body, documentContext(learning.source))) + '</div></section>';
  }).join('') + '</div><div class="learning-source">' + sourceButton(learning.source, '进度原文') + '</div>');
}

function openMapNode(id) {
  if (!presentation.map?.nodes.some(node => node.id === id)) return;
  if (state.nodeExpanded && state.nodeId === id) { collapseMapNode(); return; }
  checkpoint();
  const button = $('project-map').querySelector('[data-map-node="' + id + '"]');
  const top = button.getBoundingClientRect().top;
  state.nodeId = id; state.nodeExpanded = true; state.evidenceId = '';
  state.view = 'overview'; state.selectedId = null; state.sourceId = null;
  clearFilters(); setHash('#map=' + encodeURIComponent(id)); render();
  $('main-scroll').scrollTop += button.getBoundingClientRect().top - top;
  button.focus({ preventScroll: true });
  const panelTop = $('map-detail').getBoundingClientRect().top;
  const bottom = $('main-scroll').getBoundingClientRect().bottom;
  if (panelTop > bottom - 100) $('main-scroll').scrollTop += panelTop - bottom + 140;
}

function collapseMapNode() {
  checkpoint();
  const button = $('project-map').querySelector('[data-map-node="' + state.nodeId + '"]');
  const top = button?.getBoundingClientRect().top;
  state.nodeExpanded = false;
  setHash('#overview'); render();
  if (button && top !== undefined) {
    $('main-scroll').scrollTop += button.getBoundingClientRect().top - top;
    button.focus({ preventScroll: true });
    button.scrollIntoView({ block: 'nearest' });
  }
}

function filteredNotes() {
  const query = state.query.trim().toLowerCase();
  return state.notes.filter(note => (!state.group || state.noteGroups.get(note.id)?.id === state.group) && (!state.cls || note.cls === state.cls) && (!state.status || note.lifecycle === state.status) && (!query || (labelFor(note) + '\n' + note.title + '\n' + note.id + '\n' + note.rawBody).toLowerCase().includes(query))).sort((a, b) => compareNotes(a, b, state.sort, state.incoming));
}

function emptyResults() {
  return '<div class="empty-state">' + icon('search') + '<h2>无匹配记录</h2><button class="button" data-reset>清除筛选</button></div>';
}

function renderCollection() {
  let notes = filteredNotes();
  setHtml('group-filter', '<option value="">全部模块</option>' + state.groups.map(group => '<option value="' + escapeHtml(group.id) + '">' + escapeHtml(group.title) + '</option>').join(''));
  $('group-filter').value = state.group;
  $('status-filter').value = state.status;
  $('class-filter').value = state.cls;
  $('sort-select').value = state.sort;
  $('reset-filters').hidden = !state.group && !state.cls && !state.status && !state.query && !state.month;
  $('month-filters').hidden = state.view !== 'timeline';
  const months = [...new Set(notes.map(note => note.date.slice(0, 7)))].sort((a, b) => compareText(b, a));
  if (state.view === 'timeline') {
    setHtml('month-filters', [{ key: '', label: '全部月份' }, ...months.map(key => ({ key, label: key }))].map(month => '<button data-month="' + month.key + '" class="' + (state.month === month.key ? 'active' : '') + '" aria-pressed="' + (state.month === month.key) + '">' + month.label + '</button>').join(''));
    if (state.month) notes = notes.filter(note => note.date.startsWith(state.month));
  }

  if (!notes.length) { setHtml('collection-content', emptyResults()); return; }
  if (state.view === 'library') {
    setHtml('collection-content', '<div class="decision-list">' + notes.map(note => noteButton(note, 'decision-row', '<div><h2>' + escapeHtml(labelFor(note)) + '</h2><p>' + escapeHtml(decisionExcerpt(note)) + '</p><div class="row-meta">' + groupTag(note) + '<span>·</span>' + categoryTag(note) + statusBadge(note) + (state.incoming.get(note.id) ? '<span>·</span><span>' + state.incoming.get(note.id) + ' 篇引用</span>' : '') + '</div></div><div class="decision-side"><time>' + note.date + '</time>' + icon('arrow') + '</div>')).join('') + '</div>');
  } else if (state.view === 'timeline') {
    const groups = new Map();
    for (const note of notes) {
      const month = note.date.slice(0, 7);
      if (!groups.has(month)) groups.set(month, []);
      groups.get(month).push(note);
    }
    const ordered = [...groups].sort(([a], [b]) => state.sort === 'old' ? compareText(a, b) : compareText(b, a));
    setHtml('collection-content', ordered.map(([month, items]) => '<section class="timeline-group"><h2 class="timeline-label">' + month + '<small>' + items.length + ' 篇记录</small></h2><div class="timeline-items">' + items.map(note => noteButton(note, 'timeline-card', '<div class="row-meta"><time>' + note.date + '</time><span>·</span>' + groupTag(note) + statusBadge(note) + '</div><h3>' + escapeHtml(labelFor(note)) + '</h3><p>' + escapeHtml(decisionExcerpt(note)) + '</p>')).join('') + '</div></section>').join(''));

      const colon = text.search(/[：:]/);

    }).join('') + (note.lifecycle === 'rejected' ? '<p class="markdown">' + escapeHtml(note.status) + '</p>' : '') + '</article>').join('') + '</div>');
  }
}

function renderReader() {
  if (state.sourceId) { renderDocumentReader(); return; }
  const note = state.byId.get(state.selectedId);
  if (!note) {
    setHtml('reader-content', '<div class="empty-state">' + icon('file') + '<h1 id="reader-title" tabindex="-1">这篇笔记已移走或删除</h1><p>可以返回列表查看当前记录；目录暂未连接时，请先连接笔记目录。</p></div>');
    setHtml('reader-related', ''); return;
  }
  const source = (config.noteBase || '.agents/notes') + '/' + note.sourcePath;

async function savedDirectory(handle) {
  let database;
  try {
    database = await new Promise((resolve, reject) => {
      const request = indexedDB.open('AgentNotesBoardDB', 1);
      request.onupgradeneeded = () => { if (!request.result.objectStoreNames.contains('handles')) request.result.createObjectStore('handles'); };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    return await new Promise((resolve, reject) => {
      const transaction = database.transaction('handles', handle ? 'readwrite' : 'readonly');
      const store = transaction.objectStore('handles');
      const request = handle ? store.put(handle, preferenceKey) : store.get(preferenceKey);
      transaction.oncomplete = () => resolve(handle || request.result || null);
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error);
    });
  } catch { return null; }
  finally { database?.close(); }
}

async function connectDirectory() {

  }

  $('source-status').title = '当前显示生成时的内容';
  if (config.mode === 'snapshot') {
    applyDataset(window.__INLINE_DATA__ || []);
  } else {
    render();
    const attempt = connectAttempt;
    const saved = await savedDirectory();
    if (saved && attempt === connectAttempt) {
      try {
        const permission = await saved.queryPermission({ mode: 'read' });
        if (attempt !== connectAttempt) return;
        if (permission === 'granted') {
          directory = saved; $('refresh-button').disabled = false; $('refresh-button').hidden = false;
          liveSync.setSource(saved); await liveSync.request();
        } else $('source-status').textContent = '需重新连接';
      } catch { $('source-status').textContent = '需重新连接'; }
    }
  }
  if (location.hash === initialHash) restoreHistoryPosition();
}
void start();

  })();
  </script>
</body>
